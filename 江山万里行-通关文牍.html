<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>江山万里行 · 通关文牍</title>
<style>
:root{
  --paper:#f6f2e8; --paper2:#fffdf7; --paper3:#f1ece0;
  --ink:#2c2823; --ink2:#6d6558; --ink3:#9a9184;
  --line:#e2dbc9; --line2:#efe9da;
  --red:#b8412f; --red2:#d2603f; --gold:#c08a2e;
  --amber:#e59a3c; --cyan:#2f6f6f; --gray:#dedacd; --gray2:#c9c4b5;
  --shadow:0 1px 2px rgba(44,40,35,.05), 0 8px 28px -12px rgba(44,40,35,.18);
  --shadow-lg:0 2px 6px rgba(44,40,35,.06), 0 28px 60px -24px rgba(44,40,35,.35);
  --blue:#1f6feb;
  --v-light:#c8e6c9; --v-dark:#2e8b57; --u-gold:#e3b23c;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 12% -10%, #fffdf8 0%, rgba(255,253,248,0) 60%),
    radial-gradient(900px 500px at 100% 0%, #fdf6e8 0%, rgba(253,246,232,0) 55%),
    var(--paper);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
.serif{font-family:"STKaiti","KaiTi","Kaiti SC","Songti SC","SimSun",serif;}
.wrap{max-width:1360px;margin:0 auto;padding:28px 22px 60px;}

/* ---------- 抬头 ---------- */
.doc-head{
  position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center;
  padding:26px 30px;border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(180deg,#fffdf7 0%, #fbf6ea 100%);
  box-shadow:var(--shadow);
}
.doc-head::before,.doc-head::after{
  content:"";position:absolute;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--red) 0 10px,transparent 10px 20px);
  opacity:.35;
}
.doc-head::before{top:0;} .doc-head::after{bottom:0;}
.crest{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#d2603f,#a8382a);
  color:#fff5e6;font-family:"STKaiti","KaiTi",serif;font-size:26px;letter-spacing:1px;
  box-shadow:0 6px 16px -6px rgba(168,56,42,.7), inset 0 0 0 2px rgba(255,255,255,.35);
  animation:breathe 5.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
h1{
  margin:0;font-family:"STKaiti","KaiTi","Kaiti SC",serif;font-weight:700;
  font-size:clamp(26px,3.6vw,40px);letter-spacing:4px;line-height:1.25;
}
.sub{margin:6px 0 0;color:var(--ink2);font-size:14px;letter-spacing:2px;}
.doc-meta{
  text-align:right;font-size:12px;color:var(--ink3);letter-spacing:1px;line-height:1.9;
  border-left:1px solid var(--line);padding-left:20px;
}
.doc-meta b{color:var(--ink2);font-weight:600;}
.doc-meta .meta-edit{display:flex;align-items:center;gap:6px;justify-content:flex-end;}
.doc-meta .meta-edit label{color:var(--ink3);letter-spacing:1px;}
.meta-in{
  font:inherit;font-size:12px;color:var(--ink);text-align:right;
  border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 6px;
  width:120px;outline:none;transition:border-color .16s,background .16s;
}
.meta-in:hover{border-color:var(--line);}
.meta-in:focus{border-color:#e6c98a;background:#fff;box-shadow:0 0 0 3px rgba(229,154,60,.14);}

/* ---------- 主栅格 ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px;}
.below{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px;align-items:start;}
.card{
  background:var(--paper2);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);
}
.card-hd{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap;
}
.card-hd h2{margin:0;font-size:15px;letter-spacing:2px;font-weight:700;}
.card-hd .hint{font-size:12px;color:var(--ink3);letter-spacing:1px;}
.tools{display:flex;gap:8px;flex-wrap:wrap;}
.tgl{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;
  transition:transform .16s cubic-bezier(.16,1,.3,1),background .16s,border-color .16s,color .16s;
  user-select:none;
}
.tgl:hover{border-color:var(--gray2);}
.tgl:active{transform:scale(.97);}
.tgl .dot{width:8px;height:8px;border-radius:50%;background:var(--gray2);transition:background .2s;}
.tgl[aria-pressed="true"]{background:#fdf4e6;border-color:#e6d0a4;color:#8a5a1b;}
.tgl[aria-pressed="true"] .dot{background:var(--amber);box-shadow:0 0 0 3px rgba(229,154,60,.18);}
.search{display:flex;align-items:center;gap:10px;margin-left:auto;}
.search input{font:inherit;font-size:13px;padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:#fff;min-width:210px;outline:none;transition:border-color .16s,box-shadow .16s;}
.search input:focus{border-color:#e6c98a;box-shadow:0 0 0 3px rgba(229,154,60,.14);}
.search .clear{font-size:12px;color:var(--ink3);cursor:pointer;padding:4px 6px;display:none;}
.search .clear.show{display:inline;}

.map-wrap{position:relative;padding:8px 12px 4px;}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation;}
.pref{cursor:pointer;transition:filter .18s ease,opacity .3s ease;}
.pref{
  stroke:#fffdf7;stroke-width:1;vector-effect:non-scaling-stroke;
  transition:stroke-width .18s ease, filter .18s ease;
}
.pref:hover{stroke-width:1.7;filter:brightness(1.08) saturate(1.05);}
.pref.v{fill:var(--v-light);}
.pref.u{fill:var(--gray);}
.pref.v:hover{fill:var(--v-dark);filter:drop-shadow(0 2px 7px rgba(46,138,87,.5));}
.pref.u:hover{fill:var(--u-gold);filter:drop-shadow(0 2px 7px rgba(224,169,46,.55));}
.pref.hl{stroke:var(--blue)!important;stroke-width:2.8!important;filter:drop-shadow(0 0 5px rgba(31,111,235,.7));}
svg.searching .pref:not(.hl){opacity:.16;transition:opacity .25s;}
.prov-outline{pointer-events:none;}
.prov-outline path{fill:none;stroke:#c9a24b;stroke-width:1.5;vector-effect:non-scaling-stroke;}
.fstar{fill:#e8a93c;stroke:#fffdf7;stroke-width:.7;cursor:pointer;
  filter:drop-shadow(0 0 3px rgba(232,169,60,.95));transition:transform .16s;}
.fstar:hover{transform:scale(1.4);}
svg.only .pref:not(.v){opacity:.1;pointer-events:none;}
svg.only .plabel:not(.v){opacity:.3;}
svg.only .cdot:not(.v){opacity:.22;}
.plabel{
  font-size:12px;font-weight:600;letter-spacing:1px;pointer-events:none;
  paint-order:stroke;stroke:#fffdf7;stroke-width:3px;stroke-linejoin:round;
}
.plabel.v{fill:#8e3524;} .plabel.u{fill:#9a9184;}
.clabel{font-size:9px;pointer-events:none;paint-order:stroke;stroke:#fffdf7;stroke-width:2.6px;stroke-linejoin:round;}
.clabel.v{fill:#9a5a35;} .clabel.u{fill:#a8a294;}
.cdot{stroke:#fffdf7;stroke-width:.8;}
.cdot.v{fill:#c1503a;} .cdot.u{fill:#b3ada0;}
.grid-line{stroke:#cdc6b4;stroke-width:.6;stroke-dasharray:3 5;opacity:.5;}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px 14px;font-size:12px;color:var(--ink2);}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}
.sw-visit{background:var(--v-light);border:1px solid rgba(46,138,87,.4);}
.sw-todo{background:var(--gray);}
.sw-city{width:8px;height:8px;border-radius:50%;background:#c1503a;}
.sw-hl{background:var(--blue);}

/* 检索结果 */
.results{display:none;max-height:190px;overflow:auto;border-top:1px solid var(--line2);padding:6px 14px 10px;}
.results.show{display:block;}
.results .rhead{font-size:11px;color:var(--ink3);letter-spacing:1px;padding:4px 8px;}
.results .ritem{display:flex;justify-content:space-between;gap:12px;padding:6px 8px;border-radius:4px;cursor:pointer;border-bottom:1px solid var(--line2);}
.results .ritem:last-child{border-bottom:0;}
.results .ritem:hover{background:#f7f2e6;}
.results .ritem b{font-weight:600;color:var(--ink);}
.results .ritem span{color:var(--ink3);font-size:11.5px;white-space:nowrap;}
.results .ritem .rg{color:#8a5a1b;}
.results .rempty{padding:10px 8px;color:var(--ink3);font-size:12px;}

/* 南海诸岛插图 */
.nanhai-box{fill:#fffdf7;stroke:#c9c4b5;stroke-width:1;}
.nanhai-t{fill:#9a9184;font-size:9px;letter-spacing:1px;}

/* 悬浮提示 */
.tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translate(-50%,-140%);
  background:rgba(44,40,35,.94);color:#fff8ec;font-size:12px;letter-spacing:1px;
  padding:6px 10px;border-radius:4px;white-space:nowrap;transition:opacity .14s;
  box-shadow:0 8px 20px -8px rgba(0,0,0,.5);max-width:280px;
}
.tip b{font-weight:600;} .tip s{opacity:.62;text-decoration:none;margin-left:6px;}

/* ---------- 统计面板 ---------- */
.panel{display:flex;flex-direction:column;gap:20px;}
.stat{padding:20px 20px 22px;position:relative;overflow:hidden;}
.stat::after{
  content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(229,154,60,.16),rgba(229,154,60,0) 70%);
}
.big{display:flex;align-items:flex-end;gap:10px;}
.big .num{
  font-family:"STKaiti","KaiTi",serif;font-size:62px;line-height:.9;font-weight:700;
  background:linear-gradient(120deg,#b8412f,#e59a3c);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.big .den{font-size:20px;color:var(--ink3);line-height:1.6;}
.big .pct{margin-left:auto;font-size:22px;font-weight:700;color:#8e5a1b;font-family:"STKaiti","KaiTi",serif;}
.stat-cap{font-size:12px;color:var(--ink3);letter-spacing:2px;margin-bottom:8px;}
.bar{
  height:12px;border-radius:99px;background:#ece7da;overflow:hidden;margin-top:14px;
  box-shadow:inset 0 1px 2px rgba(44,40,35,.08);
}
.bar > i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#b8412f 0%,#d2603f 45%,#e59a3c 100%);
  background-size:200% 100%;
  animation:slide 2.4s linear infinite;
  transition:width 1.2s cubic-bezier(.16,1,.3,1);
}
@keyframes slide{0%{background-position:0 0;}100%{background-position:200% 0;}}
.segs{display:grid;grid-template-columns:repeat(34,1fr);gap:3px;margin-top:12px;}
.segs i{height:16px;border-radius:2px;background:#ece7da;transition:background .5s,transform .3s;}
.segs i.on{background:linear-gradient(180deg,#d2603f,#e8a44a);}
.segs i.on:hover{transform:translateY(-2px);}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border-radius:4px;overflow:hidden;}
.mini div{background:var(--paper2);padding:12px 14px;}
.mini .k{font-size:11px;color:var(--ink3);letter-spacing:1px;}
.mini .v{font-size:20px;font-weight:700;color:var(--ink);font-family:"STKaiti","KaiTi",serif;}
.mini .v small{font-size:12px;color:var(--ink3);font-family:inherit;margin-left:2px;}

/* 印章墙 */
.wall{padding:16px 18px 18px;}
.wall-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;letter-spacing:1px;
  padding:6px 11px 6px 7px;border-radius:4px;cursor:pointer;border:1px solid transparent;
  transition:transform .16s cubic-bezier(.16,1,.3,1),box-shadow .18s,background .18s;
}
.chip:active{transform:scale(.96);}
.chip.on{background:#fdf1e2;border-color:#e8d3ae;color:#8a4a20;}
.chip.on:hover{box-shadow:0 6px 14px -8px rgba(184,65,47,.6);transform:translateY(-1px);}
.chip.off{background:#f4f1e8;border-color:var(--line);color:var(--ink3);cursor:default;}
.chip .s{
  width:22px;height:22px;border-radius:3px;display:grid;place-items:center;
  font-family:"隶书","LiSu","STLiti",serif;font-size:14px;color:#fff;background:#c9c4b5;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.chip.on .s{background:linear-gradient(140deg,#c8452f,#e08b3a);}
.chip.cur{outline:2px solid var(--blue);outline-offset:1px;}

/* ---------- 诗词通关录（已移除以精简页面） ---------- */
@keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;
  background:rgba(38,33,27,.42);backdrop-filter:blur(3px);
}
.mask.show{display:grid;animation:fade .22s ease both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.pass{
  width:min(560px,100%);max-height:88vh;overflow:auto;position:relative;
  background:linear-gradient(180deg,#fffdf7,#fbf5e9);
  border:1px solid #ddd2b8;border-radius:6px;box-shadow:var(--shadow-lg);
  padding:26px 28px 24px;animation:pop .3s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96);}to{opacity:1;transform:none;}}
.pass::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;border-radius:6px 6px 0 0;
  background:repeating-linear-gradient(90deg,#b8412f 0 12px,#e59a3c 12px 24px);opacity:.8;
}
.pass-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.pass-no{font-size:11px;letter-spacing:2px;color:var(--ink3);}
.pass h3{margin:2px 0 0;font-family:"STKaiti","KaiTi",serif;font-size:30px;letter-spacing:4px;}
.pass .tag{
  font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:99px;border:1px solid #e0cfae;
  background:#fdf1e2;color:#8a4a20;margin-right:34px;
}
.pass .tag.todo{background:#f4f1e8;color:var(--ink3);border-color:var(--line);}
.close{
  position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:#fff;cursor:pointer;font-size:15px;color:var(--ink2);line-height:1;
  display:grid;place-items:center;transition:transform .16s,background .16s;
}
.close:hover{background:#f4efe3;transform:rotate(90deg);}
.kv{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;margin:18px 0 0;font-size:13.5px;}
.kv .k{color:var(--ink3);letter-spacing:2px;}
.kv .v{color:var(--ink);}
.kv .v small{color:var(--ink3);font-size:11.5px;margin-left:4px;}
.poem{
  margin-top:16px;padding:16px 18px;border:1px solid var(--line);border-radius:4px;
  background:repeating-linear-gradient(180deg,#fffdf7 0 27px,#faf4e7 27px 28px);
  position:relative;
}
.poem .pt{font-family:"STKaiti","KaiTi",serif;font-size:18px;letter-spacing:1px;color:#8e3524;}
.poem .pa{font-size:12px;color:var(--ink3);margin-left:8px;letter-spacing:1px;}
.poem .pm{margin-top:10px;font-size:12.5px;color:var(--ink2);line-height:1.85;border-left:2px solid #e5cf9f;padding-left:10px;}
.poem .pb{
  display:inline-block;margin-top:10px;font-size:11px;letter-spacing:1px;color:#8a5a1b;
  background:#fdf4e6;border:1px solid #ecdcb8;border-radius:3px;padding:2px 8px;
}
.poem .pn{margin-top:8px;font-size:12px;color:var(--ink3);}
/* 古文全文（文征明小楷，回退楷体） */
.poem .pf{
  margin-top:14px;white-space:pre-wrap;word-break:break-word;
  font-family:"文征明小楷","文徵明小楷","文征明小楷体","华文行楷","STXingkai","KaiTi","楷体","STKaiti",serif;
  font-size:17px;line-height:2.0;letter-spacing:1.5px;color:#3a2e22;
  text-align:justify;text-justify:inter-character;
}
.poem .pf::first-line{letter-spacing:2px;}
.pf-ttl{margin-top:14px;font-size:11px;letter-spacing:2px;color:var(--ink3);}
.pass-seal{
  position:absolute;right:26px;bottom:62px;width:88px;height:88px;opacity:.9;
  animation:stamp .55s cubic-bezier(.2,1.5,.4,1) both;transform-origin:center;
}
@keyframes stamp{
  0%{opacity:0;transform:scale(1.9) rotate(-16deg);}
  60%{opacity:.95;transform:scale(.94) rotate(-7deg);}
  100%{opacity:.9;transform:scale(1) rotate(-8deg);}
}
.pass-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;}
.pass-nav .pg{font-size:11px;color:var(--ink3);letter-spacing:1px;}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 14px;font-size:12.5px;
  color:var(--ink2);cursor:pointer;letter-spacing:1px;transition:transform .16s,background .16s,border-color .16s;
}
.btn:hover{background:#f7f2e6;border-color:#ddd2b8;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.primary{border-color:#e6c98a;color:#8a5a1b;background:#fdf4e6;}
.todo-box{text-align:center;padding:26px 10px 10px;}
.todo-box .big2{font-family:"STKaiti","KaiTi",serif;font-size:26px;letter-spacing:3px;color:var(--ink3);}
.todo-box p{font-size:13px;color:var(--ink3);margin:8px 0 0;}

/* ---------- 编辑面板 ---------- */
.pass-tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.btn.editbtn{border-color:#cbb98e;color:#8a5a1b;background:#fdf4e6;}
.edit-zone{margin-top:16px;border:1px dashed #d8c9a6;border-radius:6px;padding:14px 16px;background:#fffaf0;display:none;animation:rise .3s ease both;}
.edit-zone.show{display:block;}
.edit-zone .ez-h{font-size:13px;letter-spacing:2px;color:#8a5a1b;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.edit-row{display:grid;grid-template-columns:64px 1fr;gap:8px 12px;align-items:center;margin-bottom:10px;font-size:13px;}
.edit-row label{color:var(--ink3);letter-spacing:2px;text-align:right;}
.edit-row input,.edit-row textarea{
  font:inherit;font-size:13px;color:var(--ink);width:100%;border:1px solid var(--line);
  border-radius:4px;padding:7px 10px;outline:none;background:#fff;transition:border-color .16s,box-shadow .16s;resize:vertical;
}
.edit-row input:focus,.edit-row textarea:focus{border-color:#e6c98a;box-shadow:0 0 0 3px rgba(229,154,60,.14);}
.edit-zone .ebtn{margin-top:4px;}
.ez-list{margin:12px 0 4px;border-top:1px solid var(--line2);padding-top:10px;}
.ez-list .ez-li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px;border-bottom:1px solid var(--line2);font-size:13px;}
.ez-list .ez-li b{font-weight:600;color:var(--ink);}
.ez-list .ez-li span{color:var(--ink3);font-size:11.5px;}
.ez-del{color:#b8412f;border-color:rgba(184,65,47,.3);background:#fbf2ee;padding:4px 9px;font-size:11.5px;}
.ez-del:hover{background:#f6e3de;}
.ez-add{margin-top:10px;display:grid;gap:8px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:12px;}
.ez-add .ez-ah{font-size:12px;letter-spacing:1px;color:#8a5a1b;font-weight:700;}
.ez-add input,.ez-add textarea{font:inherit;font-size:13px;width:100%;border:1px solid var(--line);border-radius:4px;padding:6px 9px;outline:none;background:#fff;}
.ez-add input:focus,.ez-add textarea:focus{border-color:#e6c98a;box-shadow:0 0 0 3px rgba(229,154,60,.14);}
.ez-add .ez-grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ez-msg{font-size:11.5px;color:#8a5a1b;margin-top:6px;min-height:14px;}

footer{margin-top:40px;text-align:center;font-size:12px;color:var(--ink3);letter-spacing:2px;}

@media (max-width:1080px){
  .grid{grid-template-columns:1fr;}
  .below{grid-template-columns:1fr;}
  .doc-head{grid-template-columns:auto 1fr;}
  .doc-meta{display:none;}
  .search{margin-left:0;width:100%;}
  .search input{min-width:0;flex:1;}
}
@media (max-width:640px){
  .wrap{padding:16px 12px 40px;}
  h1{letter-spacing:2px;}
  .big .num{font-size:48px;}
  .segs{grid-template-columns:repeat(17,1fr);}
}

。念天地之悠悠，独怆然而涕下！"},{"t":"己亥杂诗（其五）","a":"龚自珍","d":"清","g":"初中七年级下","place":"离愁辞官","lt":"write","basis":"写作地北京南归途中（龚自珍辞官出京），从写作地匹配（直辖市）","type":"古诗","full":"浩荡离愁白日斜，吟鞭东指即天涯。落红不是无情物，化作春泥更护花。"},{"t":"满江红（小住京华）","a":"秋瑾","d":"清","g":"初中九年级下","place":"京华离情","lt":"write","basis":"写作地北京（秋瑾寓居北京），从写作地匹配（直辖市）","type":"词","full":"小住京华，早又是中秋佳节。为篱下黄花开遍，秋容如拭。四面歌残终破楚，八年风味徒思浙。苦将侬强派作蛾眉，殊未屑！身不得，男儿列，心却比，男儿烈。算平生肝胆，因人常热。俗子胸襟谁识我？英雄末路当磨折。莽红尘何处觅知音？青衫湿！"},{"t":"报刘一丈书","a":"宗臣","d":"—","g":"课外/补充-明清古文","place":"无具体地点（书信）","lt":"famous","basis":"作者在京为官时作此书，叙官场丑态","type":"书信议论文","full":"数千里外，得长者时赐一书，以慰长想，即亦甚幸矣；何至更辱馈遗，则不才益将何以报焉？书中情意甚殷，即长者之不忘老父，知老父之念长者深也。\n至以上下相孚、才德称位语不才，则不才有深感焉。夫才德不称，固自知之矣；至于不孚之病，则尤不才为甚。且今之所谓孚者，何哉？日夕策马候权者之门，门者故不入，则甘言媚词，作妇人状，袖金以私之。即门者持刺入，而主人又不即出见；立厩中仆马之间，恶气袭衣袖，即饥寒毒热不可忍，不去也。抵暮，则前所受赠金者出，报客曰：相公倦，谢客矣，客请明日来。即明日又不敢不来。夜披衣坐，闻鸡鸣，即起盥栉，走马抵门。门者怒曰：为谁？则曰：昨日之客来。则又怒曰：何客之勤也！岂有相公此时出见客乎？客心耻之，强忍而与言曰：亡奈何矣，姑容我入。门者又得所赠金，则起而入之；又立向所立厩中。幸主者出，南面召见，则惊走匍匐阶下。主者曰：进！则再拜，故迟不起，起则上所上寿金。主者故不受，则固请；主者故固不受，则又固请；然后命吏纳之。则又再拜，又故迟不起；起则五六揖始出。出揖门者曰：官人幸顾我，他日来，幸无阻我也！门者答揖。大喜奔出，马上遇所交识，即扬鞭语曰：适自相公家来，相公厚我，厚我！且虚言状。即所交识，亦心畏相公厚之矣。相公又稍稍语人曰：某也贤，某也贤。闻者亦心计交赞之。此世所谓上下相孚也，长者谓仆能之乎？\n前所谓权门者，自岁时伏腊一刺之外，即经年不往也。闲道经其门，则亦掩耳闭目，跃马疾走过之，若有所追逐者，斯则仆之褊衷，以此长不见悦于长吏，仆则愈益不顾也。每大言曰：人生有命，吾惟守分而已。长者闻之，得无厌其为迂乎？\n乡园多故，不能不动客子之愁。至于长者之抱才而困，则又令我怆然有感。天之与先生者甚厚，亡论长者不欲轻弃之，即天意亦不欲长者之轻弃之也，幸宁心哉！"},{"t":"满井游记","a":"袁宏道","d":"—","g":"课外/补充-明清古文","place":"今北京市东北郊（满井）","lt":"famous","basis":"万历二十七年作者官顺天府教授，记北京郊外满井春色","type":"游记小品","full":"燕地寒，花朝节后，余寒犹厉。冻风时作，作则飞沙走砾。局促一室之内，欲出不得。每冒风驰行，未百步辄返。廿二日天稍和，偕数友出东直，至满井。高柳夹堤，土膏微润，一望空阔，若脱笼之鹄。于时冰皮始解，波色乍明，鳞浪层层，清澈见底，晶晶然如镜之新开而冷光之乍出于匣也。山峦为晴雪所洗，娟然如拭，鲜妍明媚，如倩女之靧面而髻鬟之始掠也。柳条将舒未舒，柔梢披风，麦田浅鬣寸许。游人虽未盛，泉而茗者，罍而歌者，红装而蹇者，亦时时有。风力虽尚劲，然徒步则汗出浃背。凡曝沙之鸟，呷浪之鳞，悠然自得，毛羽鳞鬣之间皆有喜气。始知郊田之外未始无春，而城居者未之知也。夫不能以游堕事，潇然于山石草木之间者，惟此官也。而此地适与余近，余之游将自此始，恶能无纪？己亥之二月也。"},{"t":"狱中杂记","a":"方苞","d":"—","g":"课外/补充-明清古文","place":"今北京市刑部监狱","lt":"famous","basis":"康熙五十年作者因《南山集》案系刑部狱时作","type":"杂记散文","full":"康熙五十一年三月，余在刑部狱，见死而由窦出者，日四三人。有洪洞令杜君者，作而言曰：“此疫作也。今天时顺正，死者尚稀，往岁多至日数十人。”余叩所以。杜君曰：“是疾易传染，遘者虽戚属不敢同卧起。而狱中为老监者四，监五室，禁卒居中央，牖其前以通明，屋极有窗以达气。旁四室则无之，而系囚常二百余。每薄暮下管键，矢溺皆闭其中，与饮食之气相薄，又隆冬，贫者席地而卧，春气动，鲜不疫矣。狱中成法，质明启钥，方夜中，生人与死者并踵顶而卧，无可旋避，此所以染者众也。又可怪者，大盗积贼，杀人重囚，气杰旺，染此者十不一二，或随有瘳，其骈死，皆轻系及牵连佐证法所不及者。”余曰：“京师有京兆狱，有五城御史司坊，何故刑部系囚之多至此？”杜君曰：“迩年狱讼，情稍重，京兆、五城即不敢专决；又九门提督所访缉纠诘，皆归刑部；而十四司正副郎好事者及书吏、狱官、禁卒，皆利系者之多，少有连，必多方钩致。苟入狱，不问罪之有无，必械手足，置老监，俾困苦不可忍，然后导以取保，出居于外，量其家之所有以为剂，而官与吏剖分焉。中家以上，皆竭资取保；其次‘求脱械居监外板屋，费亦数十金；惟极贫无依，则械系不稍宽，为标准以警其余。或同系，情罪重者，反出在外，而轻者、无罪者罹其毒。积忧愤，寝食违节，及病，又无医药，故往往至死。”余伏见圣上好生之德，同于往圣。每质狱词，必于死中求其生，而无辜者乃至此。傥仁人君子为上昌言：除死刑及发塞外重犯，其轻系及牵连未结正者，别置一所以羁之，手足毋械。所全活可数计哉？或曰：“狱旧有室五，名曰现监，讼而未结正者居之。傥举旧典，可小补也。杜君曰：“上推恩，凡职官居板屋。今贫者转系老监，而大盗有居板屋者。此中可细诘哉！不若别置一所，为拔本塞源之道也。”余同系朱翁、余生及在狱同官僧某，遘疫死，皆不应重罚。又某氏以不孝讼其子，左右邻械系入老监，号呼达旦。余感焉，以杜君言泛讯之，众言同，于是乎书。\n凡死刑狱上，行刑者先俟于门外，使其党入索财物，名曰“斯罗”。富者就其戚属，贫则面语之。其极刑，曰：“顺我，即先刺心；否则，四肢解尽，心犹不死。”其绞缢，曰：“顺我，始缢即气绝；否则，三缢加别械，然后得死。”唯大辟无可要，然犹质其首。用此，富者赂数十百金，贫亦罄衣装；绝无有者，则治之如所言。主缚者亦然，不如所欲，缚时即先折筋骨。每岁大决，勾者十四三，留者十六七，皆缚至西市待命。其伤于缚者，即幸留，病数月乃瘳，或竟成痼疾。余尝就老胥而问焉：“彼于刑者、缚者，非相仇也，期有得耳；果无有，终亦稍宽之，非仁术乎？”曰：“是立法以警其余，且惩后也；不如此，则人有幸心。”主梏扑者亦然。余同逮以木讯者三人：一人予三十金，骨微伤，病间月；一人倍之，伤肤，兼旬愈；一人六倍，即夕行步如平常。或叩之曰：“罪人有无不均，既各有得，何必更以多寡为差？”曰：“无差，谁为多与者？”孟子曰：“术不可不慎。”信夫！\n部中老胥，家藏伪章，文书下行直省，多潜易之，增减要语，奉行者莫辨也。其上闻及移关诸部，犹未敢然。功令：大盗未杀人及他犯同谋多人者，止主谋一二人立决；余经秋审皆减等发配。狱词上，中有立决者，行刑人先俟于门外。命下，遂缚以出，不羁晷刻。有某姓兄弟以把持公仓，法应立决，狱具矣，胥某谓曰：“予我千金，吾生若。”叩其术，曰：“是无难，别具本章，狱词无易，取案末独身无亲戚者二人易汝名，俟封奏时潜易之而已。”其同事者曰：“是可欺死者，而不能欺主谳者，倘复请之，吾辈无生理矣。”胥某笑曰：“复请之，吾辈无生理，而主谳者亦各罢去。彼不能以二人之命易其官，则吾辈终无死道也。”竟行之，案末二人立决。主者口呿舌挢，终不敢诘。余在狱，犹见某姓，狱中人群指曰：“是以某某易其首者。”胥某一夕暴卒，众皆以为冥谪云。\n凡杀人，狱词无谋、故者，经秋审入矜疑，即免死。吏因以巧法。有郭四者，凡四杀人，复以矜疑减等，随遇赦。将出，日与其徒置酒酣歌达曙。或叩以往事，一一详述之，意色扬扬，若自矜诩。噫！渫恶吏忍于鬻狱，无责也；而道之不明，良吏亦多以脱人于死为功，而不求其情，其枉民也亦甚矣哉！\n奸民久于狱，与胥卒表里，颇有奇羡。山阴李姓以杀人系狱，每岁致数百金。康熙四十八年，以赦出。居数月，漠然无所事。其乡人有杀人者，因代承之。盖以律非故杀，必久系，终无死法也。五十一年，复援赦减等谪戍，叹曰：“吾不得复入此矣！”故例：谪戍者移顺天府羁候。时方冬停遣，李具状求在狱候春发遣，至再三，不得所请，怅然而出。"},{"t":"病梅馆记","a":"龚自珍","d":"—","g":"课外/补充-明清古文","place":"无具体地点（杂记）","lt":"famous","basis":"作者官京时作于北京，托梅议政","type":"议论散文","full":"江宁之龙蟠，苏州之邓尉，杭州之西溪，皆产梅。或曰：“梅以曲为美，直则无姿；以欹为美，正则无景；以疏为美，密则无态。”固也。此文人画士，心知其意，未可明诏大号以绳天下之梅也；又不可以使天下之民斫直，删密，锄正，以夭梅病梅为业以求钱也。梅之欹之疏之曲，又非蠢蠢求钱之民能以其智力为也。有以文人画士孤癖之隐明告鬻梅者，斫其正，养其旁条，删其密，夭其稚枝，锄其直，遏其生气，以求重价，而江浙之梅皆病。文人画士之祸之烈至此哉！\n予购三百盆，皆病者，无一完者。既泣之三日，乃誓疗之：纵之顺之，毁其盆，悉埋于地，解其棕缚；以五年为期，必复之全之。予本非文人画士，甘受诟厉，辟病梅之馆以贮之。\n呜呼！安得使予多暇日，又多闲田，以广贮江宁、杭州、苏州之病梅，穷予生之光阴以疗梅也哉！"},{"t":"七律·人民解放军占领南京","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"南京、长江千帆","lt":"famous","basis":"1949年4月作于北平香山，咏解放军占领南京","type":"七律","full":"钟山风雨起苍黄，百万雄师过大江。虎踞龙盘今胜昔，天翻地覆慨而慷。宜将剩勇追穷寇，不可沽名学霸王。天若有情天亦老，人间正道是沧桑。"},{"t":"七律·和柳亚子先生","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"颐和园昆明湖","lt":"famous","basis":"1949年4月29日作于北平香山，和柳亚子《感事呈毛主席》","type":"七律","full":"饮茶粤海未能忘，索句渝州叶正黄。三十一年还旧国，落花时节读华章。牢骚太盛防肠断，风物长宜放眼量。莫道昆明池水浅，观鱼胜过富春江。"},{"t":"浣溪沙·和柳亚子先生","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"国庆观剧、各族舞娘","lt":"famous","basis":"1950年10月国庆观少数民族歌舞后作于北京","type":"词","full":"长夜难明赤县天，百年魔怪舞翩跹，人民五亿不团圆。一唱雄鸡天下白，万方乐奏有于阗，诗人兴会更无前。"},{"t":"蝶恋花·答李淑一","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"杨开慧、柳直荀忠魂","lt":"famous","basis":"1957年5月11日作于北京，追怀念杨开慧、柳直荀","type":"词","full":"我失骄杨君失柳，杨柳轻飏直上重霄九。问讯吴刚何所有，吴刚捧出桂花酒。寂寞嫦娥舒广袖，万里长空且为忠魂舞。忽报人间曾伏虎，泪飞顿作倾盆雨。"},{"t":"七律二首·送瘟神","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"江西余江县消灭血吸虫","lt":"famous","basis":"读余江县血防报告后作于北京，咏余江（今属鹰潭）","type":"七律","full":"其一：绿水青山枉自多，华佗无奈小虫何！千村薜荔人遗矢，万户萧疏鬼唱歌。坐地日行八万里，巡天遥看一千河。牛郎欲问瘟神事，一样悲欢逐逝波。其二：春风杨柳万千条，六亿神州尽舜尧。红雨随心翻作浪，青山着意化为桥。天连五岭银锄落，地动三河铁臂摇。借问瘟君欲何往，纸船明烛照天烧。"},{"t":"七律·答友人","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"湖南九嶷山（斑竹）","lt":"famous","basis":"1961年作于北京，咏湖南九嶷山（今永州宁远）","type":"七律","full":"九嶷山上白云飞，帝子乘风下翠微。斑竹一枝千滴泪，红霞万朵百重衣。洞庭波涌连天雪，长岛人歌动地诗。我欲因之梦寥廓，芙蓉国里尽朝晖。"},{"t":"七律·冬云","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"寒冬雪云、万花纷谢","lt":"famous","basis":"1962年12月26日（69岁生日）作于北京","type":"七律","full":"雪压冬云白絮飞，万花纷谢一时稀。高天滚滚寒流急，大地微微暖气吹。独有英雄驱虎豹，更无豪杰怕熊罴。梅花欢喜漫天雪，冻死苍蝇未足奇。"},{"t":"七律·吊罗荣桓同志","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"罗荣桓、国有疑难","lt":"famous","basis":"1963年12月罗荣桓逝世后作于北京，为其悼亡之作","type":"七律","full":"记得当年草上飞，红军队里每相违。长征不是难堪日，战锦方为大问题。斥鷃每闻欺大鸟，昆鸡长笑老鹰非。君今不幸离人世，国有疑难可问谁？"},{"t":"窦娥冤（节选）","a":"关汉卿","d":"元","g":"高中必修下","place":"楚州山阳县（今江苏淮安）","lt":"famous","basis":"关汉卿作于大都（今北京）；剧中故事发生地楚州（今江苏淮安）","type":"曲","full":"〔滚绣球〕有日月朝暮悬，有鬼神掌着生死权。天地也！只合把清浊分辨，可怎生糊突了盗跖、颜渊？为善的受贫穷更命短，造恶的享富贵又寿延。天地也！做得个怕硬欺软，却原来也这般顺水推船！地也，你不分好歹何为地！天也，你错勘贤愚枉做天！"}]},{"prov":"天津","name":"天津市","d":"M705.5 317.6 L709.4 319.2 L710.3 315.7 L705.9 314.3 L705.5 317.6 Z M703.3 316.2 L700.7 315.7 L699.5 318.1 L706.5 322.5 L703.3 316.2 Z M700.5 315.9 L704.4 312.4 L707.7 313.7 L700.5 315.9 Z M706.4 312.8 L705.6 308.8 L700.5 305.5 L698.9 306.2 L697.9 310.1 L699.3 310.7 L699.2 316.2 L700.1 316.8 L701.5 313.6 L706.4 312.8 Z M705.3 303.1 L703.7 303.3 L703.6 307.2 L706.3 312.4 L708.1 312.4 L712.5 308.0 L710.7 304.7 L705.3 303.1 Z M709.6 319.0 L708.2 321.9 L704.4 322.8 L703.7 326.5 L706.1 327.7 L711.4 326.4 L713.0 324.9 L711.5 322.4 L714.7 321.9 L714.7 317.4 L718.1 314.2 L715.3 312.7 L712.7 313.5 L712.6 315.8 L709.4 316.2 L709.6 319.0 Z M714.0 311.9 L714.8 313.4 L712.5 313.7 L712.6 315.8 L707.7 314.8 L706.4 312.8 L713.4 307.5 L716.1 308.0 L714.0 311.9 Z M705.4 322.1 L699.3 317.7 L697.4 318.2 L696.6 320.5 L697.2 323.9 L702.0 324.8 L703.0 327.2 L705.4 322.1 Z M709.8 304.4 L709.8 299.8 L713.9 299.6 L708.2 294.9 L704.6 297.9 L703.4 301.3 L709.8 304.4 Z","v":0,"fd":"","texts":[{"t":"译天演论自序","a":"严复","d":"—","g":"课外/补充-明清古文","place":"无具体地点（译序）","lt":"famous","basis":"作者在天津水师学堂任职时译《天演论》作序","type":"序跋议论文","full":"英国名学家穆勒约翰有言：“欲考一国之文字语言，而能见其理极，非谙晓数国之言语文字者不能也。”斯言也，吾始疑之，乃今深喻笃信，而叹其说之无以易也。岂徒言语文字之散者而已，即至大义微言，古之人殚毕生之精力，以从事于一学。当其有得，藏之一心则为理，动之口舌、着之简策则为词。固皆有其所以得此理之由，亦有其所以载焉以传之故。呜呼！岂偶然哉！\n自后人读古人之书，而未尝为古人之学，则于古人所得以为理者，已有切肤精怃之异矣，又况历时久远，简牍沿讹，声音代变，则通段难明；风俗殊尚，则事意参差。夫如是，则虽有故训疏义之勤，而于古人诏示来学之旨，愈益晦矣。故曰：读古书难。\n虽然，彼所以托焉而传之理，固自若也，使其理诚精，其事诚信，则年代国俗，无以隔之。是故不传于兹，或见于彼，事不相谋而各有合。考道之上，以其所得于彼者，反以证诸吾古人之所传，乃澄湛精莹，如寐初觉。其亲切有味，较之觇毕为学者，万万有加焉。此真治异国语言文字者之至乐也。\n今夫六艺之于中国也，所谓日月经天，江河行地者尔。而仲尼之于六艺也，《易》《春秋》最严。司马迁曰：“《易》本隐而之显，《春秋》推见至隐。”此天下至精之言也。始吾以谓本隐之显者，观〈象〉〈系辞〉以定吉凶而已；推见至隐者，诛意褒贬而已。及观两人名学，则见其于格物致知之事，有内籀之术焉，有外籀之术焉。内籀云者，察其曲而知其全者也，执其微以会其通者也；外籀云者，据公理以断众事者也，设定数以逆未然者也。乃推卷起曰：有是哉，是固吾《易》《春秋》之学也。迁所谓本隐之显者，外籀也；所谓推见至隐者，内籀也。其言若诏之矣。二者即物穷理之最要涂术也。而后人不知广而用之者，未尝事其事，则亦未尝咨其术而已矣。\n近二百年，欧洲学术之盛，远迈古初。其所得以为名理公例者，在在见极，不可复摇。顾吾古人之所得，往往先之，此非傅会扬己之言也。吾将试举其灼然不诬者，以质天下。夫西学之最为切实而执其例可以御蕃变者，名、数、质、力四者之学是已。而吾《易》则名、数以为经，质、力以为纬，而合而名之曰《易》。大宇之内，质力相推，非质无以见力，非力无以呈质。凡力皆乾也，凡质皆坤也。奈端动之例三，其一曰：“静者不自动，动者不自止；动路必直，速率必均。”此所谓旷古之虑。自其例出，而后天学明，人事利者也。而《易》则曰：“乾其静也专，其动也直。”后二百年，有斯宾塞尔者，以天演自然言化，著書造论，贯大地人而一理之。此亦晚近之绝作也。其为天演界说曰：“翕以合质，辟以出力，始简易而终杂糅。”而《易》则曰：“坤其静也翕，其动也辟。”至于全力不增减之说，则有自强不息为之先；凡动必复之说，则有消息之义居其始。而“易不可见，乾坤或几乎息”之旨，尤与“热力平均，天地乃毁”之言相发明也。此岂可悉谓之偶合也耶？\n虽然，由斯之说，必谓彼之所明，皆吾中土所前有，甚者或谓其学皆得于东来，则又不关事实，适用自蔽之说也。夫古人发其端，而后人莫能竟其绪；古人拟其大，而后人未能议其精，则犹之不学无术未化之民而已。祖父虽圣，何救子孙之童婚也哉！\n大抵古书难读，中国为尤。二千年来，士徇利禄，守阙残，无独辟之虑。是以生今日者，乃转于西学，得识古之用焉。此可为知者道，难与不知者言也。风气渐通，士知弇陋为耻，西学之事，问涂日多。然亦有一二巨子，訑然谓彼之所精，不外象数形下之末；彼之所务，不越功利之间，逞肊为谈，不咨其实。讨论国闻，审敌自镜之道，又断断乎不如是也。\n赫胥黎氏此书之旨，本以救斯宾塞任天为治之末流，其中所论，与吾古人有甚合者，且于自强保种之事，反覆三致意焉。\n夏日如年，聊为迻译。有以多符空言，无裨实政相稽者，则固不佞所不恤也。\n光绪丙申重九　严复序"}]},{"prov":"上海","name":"上海市","d":"M767.1 468.5 L770.6 469.2 L769.5 464.3 L767.0 465.3 L767.1 468.5 Z M773.7 473.9 L779.6 478.2 L780.4 475.1 L776.2 468.1 L772.9 466.2 L773.7 468.5 L771.9 471.1 L773.7 473.9 Z M764.6 474.8 L764.5 477.3 L766.6 476.8 L769.0 480.1 L772.2 478.6 L770.2 475.6 L764.6 474.8 Z M769.8 470.7 L766.4 471.7 L765.0 475.6 L770.2 475.6 L769.8 470.7 Z M767.1 468.5 L765.6 468.7 L765.7 471.0 L762.4 471.8 L764.9 475.1 L766.4 471.7 L769.8 470.7 L767.1 468.5 Z M773.7 473.9 L770.3 474.3 L770.8 477.2 L772.2 478.6 L777.2 477.4 L776.7 474.9 L773.7 473.9 Z M780.1 461.9 L769.6 457.0 L766.5 459.2 L770.5 463.2 L778.0 465.5 L780.4 464.7 L780.1 461.9 Z","v":1,"fd":"2023.05","texts":[{"t":"别云间","a":"夏完淳","d":"明末清初","g":"初中九年级下","place":"被俘诀别故乡","lt":"write","basis":"写作地松江（今上海松江区），夏完淳故里松江华亭，从写作地匹配（直辖市）","type":"古诗","full":"三年羁旅客，今日又南冠。无限山河泪，谁言天地宽。已知泉路近，欲别故乡难。毅魄归来日，灵旗空际看。"},{"t":"弈喻","a":"钱大昕","d":"—","g":"课外/补充-明清古文","place":"无具体地点（杂说）","lt":"famous","basis":"作者嘉定人（今上海），观弈有感而作","type":"议论小品","full":"予观弈于友人所。一客数败。嗤其失算,辄欲易置之,以为不逮己也。顷之,客请与予对局,予颇易之。甫下数子,客已得先手。局将半,予思益苦,而客之智尚有余。竟局数之,客胜予十三子。予赧甚,不能出一言。后有招予观弈者,终日默坐而已。\n今之学者,读古人书,多訾古人之失;与今人居,亦乐称人失。人固不能无失,然试易地以处,平心而度之,吾果无一失乎?吾能知人之失,而不能见吾之失;吾能指人之小失,而不能见吾之大失。吾求吾失且不暇,何暇论人哉!\n弈之优劣,有定也,一着之失,人皆见之,虽护前者不能讳也。理之所在,各是其所是,各非其所非,世无孔子,谁能定是非之真?然则人之失者,未必非得也;吾之无失者,未必非大失也。而彼此相嗤,无有已时,曾观弈者之不若已。"},{"t":"宝山记游","a":"管同","d":"—","g":"课外/补充-明清古文","place":"今上海市宝山区（海塘）","lt":"famous","basis":"道光间作者赴宝山访周济，记海塘观日出","type":"游记散文","full":"宝山县城临大海,潮汐万态,称为奇观。而予初至县时,顾未尝一出,独夜卧人静,风涛汹汹,直逼枕簟,鱼龙舞啸,其声形时入梦寐间,意洒然快也。\n夏四月,荆溪周保绪自吴中来。保绪故好奇,与予善。是月既望,遂相携观月于海塘。海涛山崩,月影银碎,寥阔清寒,相对疑非人世境,予大乐之。不数日,又相携观日出。至则昏暗,咫尺不辨,第闻涛声若风雷之骤至。须臾天明,日乃出,然不遽出也。一线之光,低昂隐见,久之而后升。《楚词》曰:\"长太息兮将上。\"不至此,乌知其体物之工哉?及其大上,则斑驳激射,大低与月同。而其光侵眸,可略观而不可注视焉。\n后月五日,保绪复邀子置酒吴淞台上。午晴风休,远波若镜。南望大洋,若有落叶十数浮泛波间者,不食顷,已皆抵台下,视之皆莫大舟也。苏子瞻记登州之境,今乃信之。于是保绪为予言京都及海内事,相对慷慨悲歌,至日暮乃反。\n宝山者,嘉定分县,其对岸县曰崇明,水之出乎两县间者,实大海之支流,而非即大海也。然对岸东西八十里,其所见已极为奇观。由是而迤南,乡所见落叶浮泛处,乃为大海。而海与天连,不可复辨矣。"}]},{"prov":"重庆","name":"重庆市","d":"M559.2 482.1 L560.7 481.9 L562.8 485.7 L565.1 482.6 L567.6 484.2 L569.0 481.9 L571.4 483.7 L573.1 482.0 L568.5 475.1 L565.6 473.8 L561.5 477.3 L558.7 475.6 L557.0 477.1 L558.0 479.3 L560.0 479.4 L559.2 482.1 Z M553.9 500.7 L552.7 495.7 L550.0 493.2 L542.8 498.8 L541.9 503.0 L543.9 505.6 L545.3 504.4 L546.6 505.5 L549.0 502.3 L551.2 504.4 L553.9 500.7 Z M531.0 502.3 L531.9 507.6 L533.3 504.1 L535.7 503.1 L531.0 502.3 Z M537.2 491.6 L534.3 495.7 L534.2 494.6 L531.9 495.5 L531.8 498.3 L534.0 498.2 L533.7 499.9 L537.7 495.2 L537.2 491.6 Z M543.7 514.6 L539.8 509.1 L536.1 510.1 L536.3 512.5 L534.7 511.0 L533.1 512.0 L533.5 515.0 L537.3 519.4 L536.0 522.6 L538.8 522.9 L539.0 520.1 L540.7 519.8 L540.0 517.3 L542.6 516.9 L543.7 514.6 Z M518.8 499.4 L523.0 505.4 L527.5 498.5 L522.4 497.3 L522.7 495.9 L518.8 499.4 Z M541.1 499.9 L542.6 494.5 L537.6 490.9 L537.7 495.2 L534.1 500.6 L541.1 499.9 Z M535.7 503.1 L533.9 505.7 L535.8 510.0 L537.8 508.9 L541.1 510.0 L542.6 497.7 L538.7 503.2 L535.7 503.1 Z M567.5 509.9 L568.5 511.2 L572.1 510.5 L573.8 507.3 L573.1 501.1 L569.5 499.2 L568.5 495.8 L566.4 500.5 L568.0 504.0 L567.5 509.9 Z M542.4 497.8 L542.9 498.8 L547.8 496.2 L550.0 493.2 L547.5 493.3 L546 L651.0 335.2 L654.4 342.8 L653.6 344.1 L655.8 344.3 L654.1 349.4 L656.4 347.6 L664.5 346.9 L671.1 342.2 L673.7 345.4 L675.8 344.0 L675.4 340.3 L677.2 336.9 L675.6 336.8 L674.7 333.7 L667.8 333.3 L668.4 331.0 L666.6 329.0 L664.4 329.3 L660.9 324.9 L655.1 325.7 L651.2 323.8 Z","v":1,"fd":"待定","texts":[{"t":"风","a":"李峤","d":"唐","g":"小学一年级上","place":"自然风物","lt":"birth","basis":"作者李峤故里赵州赞皇（今河北赞皇县，属石家庄市），写作地不可考，从作者故乡匹配","type":"古诗","full":"解落三秋叶，能开二月花。过江千尺浪，入竹万竿斜。"},{"t":"谏太宗十思疏","a":"魏征","d":"唐","g":"高中必修下","place":"长安宫廷","lt":"birth","basis":"魏征故乡巨鹿下曲阳（今河北晋州，由石家庄市代管），据作者故乡匹配河北石家庄市","type":"文言文","full":"臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之安，臣虽下愚，知其不可，而况于明哲乎！人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。\n凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡，岂其取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下；既得志，则纵情以傲物。竭诚则胡越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。怨不在大，可畏惟人；载舟覆舟，所宜深慎；奔车朽索，其可忽乎！\n君人者，诚能见可欲则思知足以自戒，将有所作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑壅蔽则思虚心以纳下，想谗邪则思正身以黜恶，恩所加则思无因喜以谬赏，罚所及则思无因怒而滥刑。总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。\n文武争驰，君臣无事，可以尽豫游之乐，可以养松乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！"},{"t":"吊古战场文","a":"李华","d":"—","g":"课外/补充-古文观止","place":"古战场（北方塞外阴山一带）","lt":"famous","basis":"李华为赵郡赞皇人，文中\"古战场\"泛指秦汉以来北方边塞","type":"赋文","full":"浩浩乎平沙无垠,夐不见人。河水萦带,群山纠纷。黯兮惨悴,风悲日曛。蓬断草枯,凛若霜晨。鸟飞不下,兽铤亡群。亭长告余曰:\"此古战场也。常覆三军。往往鬼哭,天阴则闻。\"伤心哉!秦欤?汉欤?将近代欤?\n吾闻夫齐魏徭戍,荆韩召募。万里奔走,连年暴露。沙草晨牧,河冰夜渡。地阔天长,不知归路。寄身锋刃,腷臆谁诉?秦汉而还,多事四夷。中州耗斁,无世无之。古称戎夏,不抗王师。文教失宣,武臣用奇。奇兵有异于仁义,王道迂阔而莫为。呜呼噫嘻!\n吾想夫北风振漠,胡兵伺便。主将骄敌,期门受战。野竖旌旗,川回组练。法重心骇,威尊命贱。利镞穿骨,惊沙入面。主客相搏,山川震眩。声析江河,势崩雷电。至若穷阴凝闭,凛冽海隅。积雪没胫,坚冰在须。鸷鸟休巢,征马踟蹰。缯纩无温,堕指裂肤。当此苦寒,天假强胡。凭陵杀气,以相剪屠。径截辎重,横攻士卒。都尉新降,将军覆没。尸填巨港之岸,血满长城之窟。无贵无贱,同为枯骨。可胜言哉!鼓衰兮力竭,矢尽兮弦绝。白刃交兮宝刀折,两军蹙兮生死决。降矣哉,终身夷狄;战矣哉,暴骨沙砾。鸟无声兮山寂寂,夜正长兮风淅淅。魂魄结兮天沉沉,鬼神聚兮云幂幂。日光寒兮草短,月色苦兮霜白。伤心惨目,有如是耶?\n吾闻之:牧用赵卒,大破林胡。开地千里,遁逃匈奴。汉倾天下,财殚力痡。任人而已,其在多乎?周逐猃狁,北至太原。既城朔方,全师而还。饮至策勋,和乐且闲。穆穆棣棣,君臣之间。秦起长城,竟海为关。荼毒生灵,万里朱殷。汉击匈奴,虽得阴山,枕骸遍野,功不补患。\n苍苍蒸民,谁无父母?提携捧负,畏其不寿。谁无兄弟,如足如手?谁无夫妇,如宾如友?生也何恩,杀之何咎?其存其没,家莫闻知。人或有言,将信将疑。悁悁心目,寝寐见之。布奠倾觞,哭望天涯。天地为愁,草木凄悲。吊祭不至,精魂何依?必有凶年,人其流离。呜呼噫嘻!时耶命耶?从古如斯。为之奈何?守在四夷。"}]},{"prov":"河北","name":"唐山市","d":"M738.0 310.8 L733.0 310.1 L730.8 308.0 L729.4 304.3 L731.8 296.9 L726.2 294.6 L726.2 291.8 L720.9 290.8 L717.6 293.9 L710.4 296.1 L713.9 299.6 L709.4 300.8 L711.8 306.2 L711.1 307.7 L712.6 308.9 L713.4 307.5 L716.1 308.0 L714.0 312.1 L717.5 313.5 L720.7 318.5 L724.9 320.9 L726.7 319.7 L726.5 316.4 L732.2 315.7 L731.8 316.7 L738.0 310.8 Z","v":1,"fd":"待定","texts":[{"t":"“救人一命，胜造七级浮屠”","a":"佚名","d":"明清蒙学","g":"课外/补充-增广贤文","place":"【无实景，说理格言】","lt":"famous","basis":"蒙学格言无地理属性，作者不可考，作为蒙学通识素材按覆盖缺口分配至河北省唐山市","type":"蒙学格言","full":"“救人一命，胜造七级浮屠”"}]},{"prov":"河北","name":"秦皇岛市","d":"M738.0 310.8 L738.9 304.8 L741.8 301.7 L746.8 300.5 L744.8 295.8 L742.9 295.5 L742.0 289.3 L734.0 288.1 L728.2 290.3 L726.2 294.6 L731.8 296.9 L729.4 304.3 L730.8 308.0 L733.0 310.1 L738.0 310.8 Z","v":1,"fd":"待定","texts":[{"t":"观沧海","a":"曹操","d":"东汉末","g":"初中七年级上","place":"碣石观沧海","lt":"write","basis":"写作地碣石山（今河北昌黎县，属秦皇岛市），曹操东临碣石，从写作地匹配","type":"古诗","full":"东临碣石，以观沧海。水何澹澹，山岛竦峙。树木丛生，百草丰茂。\n秋风萧瑟，洪波涌起。日月之行，若出其中；星汉灿烂，若出其里。\n幸甚至哉，歌以咏志。"},{"t":"浪淘沙·北戴河","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"北戴河海滨、魏武挥鞭","lt":"famous","basis":"1954年夏在北戴河海滨游泳、眺望沧海时作","type":"词","full":"大雨落幽燕，白浪滔天，秦皇岛外打鱼船。一片汪洋都不见，知向谁边？\n往事越千年，魏武挥鞭，东临碣石有遗篇。萧瑟秋风今又是，换了人间。"},{"t":"两京锁钥无双地；万里长城第一关。","a":"【不可考】","d":"—","g":"课外/补充-楹联","place":"河北秦皇岛山海关","lt":"famous","basis":"悬于山海关古城历史博物馆门前","type":"楹联","full":"两京锁钥无双地；万里长城第一关。"}]},{"prov":"河北","name":"邯郸市","d":"M677.1 362.6 L674.9 362.2 L674.7 360.3 L672.1 360.7 L671.1 358.5 L665.4 358.9 L661.8 361.1 L655.3 360.9 L651.5 357.5 L650.3 360.3 L645.2 363.5 L649.5 370.2 L654.1 370.3 L654.7 371.8 L659.2 372.2 L663.0 374.8 L668.2 374.4 L668.3 376.2 L671.8 373.1 L674.5 375.5 L677.2 374.3 L673.9 367.5 L677.1 362.6 Z","v":1,"fd":"2023.03","texts":[{"t":"短歌行","a":"曹操","d":"三国魏","g":"高中必修上","place":"宴饮抒怀","lt":"write","basis":"写作地邺城（今河北临漳县，属邯郸市），曹操写于邺，从写作地匹配","type":"古诗","full":"对酒当歌，人生几何！\n譬如朝露，去日苦多。\n慨当以慷，忧思难忘。\n何以解忧？唯有杜康。\n青青子衿，悠悠我心。\n但为君故，沉吟至今。\n呦呦鹿鸣，食野之苹。\n我有嘉宾，鼓瑟吹笙。\n明明如月，何时可掇？\n忧从中来，不可断绝。\n越陌度阡，枉用相存。\n契阔谈宴（讌），心念旧恩。\n月明星稀，乌鹊南飞。\n绕树三匝，何枝可依？\n山不厌高，海不厌深。\n周公吐哺，天下归心。"},{"t":"龟虽寿","a":"曹操","d":"东汉末","g":"初中八年级上","place":"暮年抒怀","lt":"write","basis":"写作地邺城（今河北临漳县，属邯郸市），曹操在邺作，从写作地匹配","type":"古诗","full":"神龟虽寿，犹有竟时。螣蛇乘雾，终为土灰。老骥伏枥，志在千里。\n烈士暮年，壮心不已。盈缩之期，不但在天；养怡之福，可得永年。\n幸甚至哉，歌以咏志。"},{"t":"赠从弟（其二）","a":"刘桢","d":"汉末","g":"初中八年级上","place":"亭亭山上松","lt":"write","basis":"写作地邺城（今河北临漳县，属邯郸市），刘桢仕建安于邺，从写作地匹配","type":"古诗","full":"亭亭山上松，瑟瑟谷中风。风声一何盛，松枝一何劲！冰霜正惨凄，终岁常端正。岂不罹凝寒？松柏有本性。"},{"t":"梁甫行","a":"曹植","d":"三国魏","g":"初中八年级上","place":"海边边民困苦","lt":"write","basis":"写作地邺城（今河北临漳县，属邯郸市），曹植在邺作，从写作地匹配","type":"古诗","full":"八方各异气，千里殊风雨。剧哉边海民，寄身于草墅。妻子象禽兽，行止依林阻。柴门何萧条，狐兔翔我宇。"},{"t":"触龙说赵太后","a":"战国游士","d":"刘向辑","g":"课外/补充-古文观止","place":"赵邯郸（今河北邯郸）","lt":"famous","basis":"左师触龙说赵太后于邯郸宫，赵邯郸故城在今邯郸","type":"史传（战国策）","full":"赵太后新用事，秦急攻之。赵氏求救于齐，齐曰：“必以长安君为质，兵乃出。”太后不肯，大臣强谏。太后明谓左右：“有复言令长安君为质者，老妇必唾其面！”\n左师触龙言愿见太后，太后盛气而揖之。入而徐趋，至而自谢，曰：“老臣病足，曾不能疾走，不得见久矣，窃自恕，而恐太后玉体之有所郄也，故愿望见太后。”太后曰：“老妇恃辇而行。”曰：“日食饮得无衰乎？”曰：“恃粥耳。”曰：“老臣今者殊不欲食，乃自强步，日三四里，少益嗜食，和于身也。”曰：“老妇不能。”太后之色稍解。\n左师公曰：“老臣贱息舒祺，最少，不肖；而臣衰，窃爱怜之。愿令得补黑衣之数，以卫王宫。没死以闻。”太后曰：“敬诺。年几何矣？”对曰：“十五岁矣。虽少，愿及未填沟壑而托之。”太后曰：“丈夫亦爱怜其少子乎？”对曰：“甚于妇人。”太后笑曰：“妇人异甚。”对曰：“老臣窃以为媪之爱燕后，贤于长安君。”曰：“君过矣！不若长安君之甚。”左师公曰：“父母之爱子，则为之计深远。媪之送燕后也，持其踵为之泣，念悲其远也，亦哀之矣。已行，非弗思也，祭祀必祝之，祝曰：‘必勿使反。’岂非计久长，有子孙相继为王也哉？”太后曰：“然。”\n左师公曰：“今三世以前，至于赵之为赵，赵王之子孙侯者，其继有在者乎？”曰：“无有。”曰：“微独赵，诸侯有在者乎？”曰：“老妇不闻也。”“此其近者祸及身，远者及其子孙。岂人主之子孙则必不善哉？位尊而无功，奉厚而无劳，而挟重器多也。今媪尊长安君之位，而封之以膏腴之地，多予之重器，而不及今令有功于国，一旦山陵崩，长安君何以自托于赵？老臣以媪为长安君计短也，故以为其爱不若燕后。”太后曰：“诺，恣君之所使之。”\n于是为长安君约车百乘，质于齐，齐兵乃出。子义闻之，曰：“人主之子也，骨肉之亲也，犹不能恃无功之尊，无劳之奉，以守金玉之重也，而况人臣乎？”"},{"t":"曹冲称象","a":"陈寿《三国志》","d":"西晋","g":"小学六年级上","place":"邺城（今河北临漳）","lt":"famous","basis":"《三国志·魏书》记曹冲称象事，称象地在邺城（今河北临漳，属邯郸市）","type":"文言文","full":"曹冲生五六岁，智意所及，有若成人之智。时孙权曾致巨象，太祖欲知其斤重，访之群下，咸莫能出其理。冲曰：\"置象大船之上，而刻其水痕所至，称物以载之，则校可知矣。\"太祖悦，即施行焉。"}]},{"prov":"河北","name":"邢台市","d":"M673.6 345.3 L671.5 342.1 L664.5 346.9 L656. 也。臣以所学者观之，先王之举错，有高世之心，故假节于魏王，而以身得察于燕。先王过举，擢之乎宾客之中，而立之乎群臣之上，不谋于父兄，而使臣为亚卿。臣自以为奉令承教，可以幸无罪矣，故受命而不辞。\n“先王命之曰：‘我有积怨深怒于齐，不量轻弱，而欲以齐为事。’臣对曰：‘夫齐，霸国之余教而骤胜之遗事也，闲于甲兵，习于战攻。王若欲伐之，则必举天下而图之。举天下而图之，莫径于结赵矣。且又淮北、宋地，楚、魏之所同愿也。赵若许约，楚、赵、宋尽力，四国攻之，齐可大破也。’先王曰：‘善。’臣乃口受令，具符节，南使臣于赵。顾反命，起兵随而攻齐，以天之道，先王之灵，河北之地，随先王举而有之于济上。济上之军奉令击齐，大胜之。轻卒锐兵，长驱至国。齐王逃遁走莒，仅以身免。珠玉财宝，车甲珍器，尽收入燕。大吕陈于元英，故鼎反乎历室，齐器设于宁台。蓟丘之植，植于汶篁。自五伯以来，功未有及先王者也。先王以为顺于其志，以臣为不顿命，故裂地而封之，使之得比乎小国诸侯。臣不佞，自以为奉令承教，可以幸无罪矣，故受命而弗辞。”\n“臣闻贤明之君，功立而不废，故著于《春秋》，蚤知之士，名成而不毁，故称于后世。若先王之报怨雪耻，夷万乘之强国，收八百岁之蓄积，及至弃群臣之日，遗令诏后嗣之余义，执政任事之臣，所以能循法令，顺庶孽者，施及萌隶，皆可以教于后世。”\n“臣闻善作者不必善成，善始者不必善终。昔者伍子胥说听乎阖闾，故吴王远迹至于郢；夫差弗是也，赐之鸱夷而浮之江。故吴王夫差不悟先论之可以立功，故沉子胥而弗悔；子胥不蚤见主之不同量，故入江而不改。”“夫免身全功，以明先王之迹者，臣之上计也。离毁辱之非，堕先王之名者，臣之所大恐也。临不测之罪，以幸为利者，义之所不敢出也。”\n“臣闻古之君子，交绝不出恶声；忠臣之去也，不洁其名。臣虽不佞，数奉教于君子矣。恐侍御者之亲左右之说，而不察疏远之行也。故敢以书报，唯君之留意焉。"}]},{"prov":"河北","name":"张家口市","d":"M691.2 281.5 L688.6 274.1 L684.2 269.4 L686.7 265.3 L684.1 262.2 L675.1 266.7 L675.4 268.9 L667.6 269.0 L668.6 264.1 L667.4 259.1 L662.6 258.5 L661.8 261.6 L659.2 262.1 L656.9 265.1 L657.4 270.5 L654.2 270.2 L651.9 272.0 L654.0 276.0 L650.9 278.5 L654.6 281.9 L658.7 292.6 L662.1 293.5 L654.8 296.3 L655.2 298.3 L653.6 297.6 L652.4 299.7 L657.3 302.7 L660.0 302.4 L660.2 306.5 L661.9 308.2 L667.0 307.7 L670.4 305.4 L672.2 306.1 L676.8 299.2 L684.9 294.7 L681.5 289.3 L687.3 287.6 L689.3 284.5 L692.8 284.8 L691.2 281.5 Z","v":1,"fd":"待定","texts":[{"t":"\"不尽人情，举足尽是危机；不体物情，一生俱成梦境\"","a":"陈继儒","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）。明·陈继儒《小窗幽记》名句，无地理属性，按覆盖补缺分配","type":"清言格言","full":"不尽人情，举足尽是危机；不体物情，一生俱成梦境"}]},{"prov":"河北","name":"承德市","d":"M735.5 287.9 L735.7 286.4 L733.8 286.9 L730.5 283.9 L733.3 280.5 L731.9 279.4 L734.1 278.8 L736.7 274.4 L731.2 274.6 L730.5 273.2 L723.1 274.4 L722.1 269.6 L719.2 266.1 L722.4 264.2 L721.8 260.2 L719.0 260.4 L718.8 257.8 L716.6 256.3 L718.1 255.3 L717.4 253.5 L714.0 249.2 L708.8 249.4 L707.4 252.2 L701.5 252.3 L699.5 254.0 L699.7 257.4 L697.9 2 .2 L686.2 335.7 L683.8 335.4 L682.9 331.8 L677.4 331.5 L674.7 333.7 L675.6 336.8 L677.2 336.9 L675.4 340.3 L675.8 344.0 L672.3 346.2 L676.8 348.1 L675.0 349.2 L680.6 352.8 L683.1 356.7 Z","v":1,"fd":"待定","texts":[{"t":"燕歌行","a":"高适","d":"唐","g":"高中选择性必修上","place":"东北边塞","lt":"birth","basis":"作者高适故里渤海蓨县（今河北景县，属衡水市），'边塞'为泛称，从作者故乡匹配","type":"古诗","full":"汉家烟尘在东北，汉将辞家破残贼。男儿本自重横行，天子非常赐颜色。摐金伐鼓下榆关，旌旆逶迤碣石间。校尉羽书飞瀚海，单于猎火照狼山。山川萧条极边土，胡骑凭陵杂风雨。战士军前半死生，美人帐下犹歌舞。大漠穷秋塞草腓，孤城落日斗兵稀。身当恩遇常轻敌，力尽关山未解围。铁衣远戍辛勤久，玉箸应啼别离后。少妇城南欲断肠，征人蓟北空回首。边庭飘飖那可度，绝域苍茫更何有！杀气三时作阵云，寒声一夜传刁斗。相看白刃血纷纷，死节从来岂顾勋？君不见沙场征战苦，至今犹忆李将军。"},{"t":"中山狼传","a":"马中锡","d":"—","g":"课外/补充-明清古文","place":"古中山国一带（今河北石家庄、定州间）","lt":"famous","basis":"作者马中锡为河北故城人（作者归属一说存疑，主流归马氏，见《东田集》）","type":"寓言小说","full":"赵简子大猎于中山，虞人道前，鹰犬罗后。捷禽鸷兽，应弦而倒者不可胜数。有狼当道，人立而啼。简子垂手登车，援乌号之弓，挟肃慎之矢，一发饮羽，狼失声而逋。简子怒，驱车逐之。惊尘蔽天，足音鸣雷，十步之外，不辨人马。\n时墨者东郭先生将北适中山以干仕，策蹇驴，囊图书，夙行失道，望尘惊悸。狼奄至，引首顾曰：“先生岂有志于济物哉？昔毛宝放龟而得渡，隋侯救蛇而获珠，龟蛇固弗灵于狼也。今日之事，何不使我得早处囊中以苟延残喘乎？异时倘得脱颖而出，先生之恩，生死而肉骨也，敢不努力以效龟蛇之诚！”\n先生曰：“嘻！私汝狼以犯世卿、忤权贵，祸且不测，敢望报乎？然墨之道，‘兼爱’为本，吾终当有以活汝。脱有祸，固所不辞也。”乃出图书，空囊橐，徐徐焉实狼其中。前虞跋胡，后恐疐尾，三纳之而未克。徘徊容与，追者益近。狼请曰：“事急矣！先生果将揖逊救焚溺，而鸣鸾避寇盗耶？惟先生速图！”乃跼蹐四足，引绳而束缚之，下首至尾，曲脊掩胡，猬缩蠖屈，蛇盘龟息，以听命先生。先生如其指，纳狼于囊，遂括囊口，肩举驴上，引避道左，以待赵人之过。\n已而简子至，求狼弗得，盛怒，拔剑斩辕端示先生，骂曰：“敢讳狼方向者，有如此辕！”先生伏质就地，匍匐以进，跽而言曰：“鄙人不慧，将有志于世，奔走遐方，自迷正途，又安能发狼踪以指示夫子之鹰犬也？然尝闻之，‘大道以多歧亡羊’。夫羊，一童子可制之，如是其驯也，尚以多歧而亡；狼非羊比，而中山之歧可以亡羊者何限？乃区区循大道以求之，不几于守株缘木乎？况田猎，虞人之所事也，君请问诸皮冠。行道之人何罪哉？且鄙人虽愚，独不知夫狼乎？性贪而狠，党豺为虐，君能除之，固当跬左足以效微劳，又肯讳之而不言哉！”简子默然，回车就道。先生亦驱驴兼程而进。\n良久，羽旄之影渐没，车马之音不闻。狼度简子之去远，而作声囊中曰：“先生可留意矣。出我囊，解我缚，拔矢我臂，我将逝矣！”先生举手出狼。狼咆哮谓先生曰：“适为虞人逐，其来甚速，幸先生生我。我馁甚，馁不得食，亦终必亡而已。与其饥死道路，为群兽食，毋宁毙于虞人，以俎豆于贵家。先生既墨者，摩顶放踵，思一利天下，又何吝一躯啖我而全微命乎？”遂鼓吻奋爪，以向先生。\n先生仓卒以手搏之，且搏且却，引蔽驴后，便旋而走，狼终不得有加于先生，先生亦竭力拒，彼此俱倦，隔驴喘息。先生曰：“狼负我！狼负我！”狼曰：“吾非固欲负汝，天生汝辈，固需吾辈食也。”相持既久，日晷渐移。先生窃念：“天色向晚，狼复群至，吾死矣夫！”因绐狼曰：“民俗，事疑必询三老。第行矣，求三老而问之，苟谓我可食即食，不可即已。”狼大喜，即与偕行。\n逾时，道无行人，狼馋甚，望老木僵立路侧，谓先生曰：“可问是老。”先生曰：“草木无知，叩焉何益？”狼曰：“第问之，彼当有言矣。”先生不得已，揖老木，具述始末，问曰：“若然，狼当食我耶！”木中轰轰有声，谓先生曰：“我杏也。往年老圃种我时，费一核耳。逾年华，再逾年实，三年拱把，十年合抱，至于今二十年矣。老圃食我，老圃之妻子食我，外至宾客，下至于仆，皆食我。又复鬻实于市以规利。我其有功于老圃甚巨。今老矣，不得敛华就实，贾老圃怒，伐我条枚，芟我枝叶，且将售我工师之肆取直焉。噫！樗朽之材，桑榆之景，求免于斧钺之诛而不可得。汝何德于狼，乃觊免乎？是固当食汝。”言下，狼复鼓吻奋爪，以向先生。先生曰：“狼爽盟矣！矢询三老，今值一杏，何遽见迫耶？”复与偕行。\n狼愈急，望见老牸，曝日败垣中，谓先生曰：“可问老牛。”先生曰：“向者草木无知，谬言害事。今牛，禽兽耳，更何问为？”狼曰：“第问之，不问将咥汝。”先生不得已，揖老牸，再述始末以问。牛皱眉瞪目，舐鼻张口，向先生曰：“老杏之言不谬矣。老牸茧栗，少年时筋力颇健，老农卖一刀以易我，使我贰群牛，事南亩，既壮，群牛日益老惫，凡事我都任之。彼将驰驱，我伏田车，择便途以急奔趋；彼将躬耕，我脱辐衡，走郊垧以辟榛荆。老农亲我犹左右手。衣食仰我而给，婚姻仰我而毕，赋税仰我而输，仓庾仰我而实。我亦自谅，可得帷席之蔽，如马、狗也。往年家储无担石，今麦收多十斛矣；往年穷居无顾借，今掉臂行村社矣；往年尘卮罂，涸唇吻，盛酒瓦盆，半生未接；今酝黍稷，据樽罍，骄妻妾矣；往年衣短褐，侣木石，手不知揖，心不知学，今持兔园册，戴笠子，腰韦带，衣宽博矣。一丝一粟，皆我力也。顾欺我老弱，逐我荒野；酸风射眸，寒日吊影；瘦骨如山，老泪如雨；涎垂而不可收，足挛而不可举；皮毛具亡，疮痍未瘥。老农之妻妒且悍，朝夕进说曰：‘牛之一身无废物也；肉可脯，皮可鞟，骨角且切磋为器。’指大儿曰：‘汝受业庖丁之门有年矣，胡不砺刃于硎以待？’迹是观之，是将不利于我，我不知死所矣。夫我有功，彼无情乃若是，行将蒙祸。汝何德于狼，觊幸免乎？”言下，狼又鼓吻奋爪，以向先生，先生曰：“毋欲速！”\n遥望老子杖藜而来，须眉皓然，衣冠闲雅，盖有道者也。先生且喜且愕，舍狼而前，拜跪啼泣，致辞曰：“乞丈人一言而生！”丈人问故，先生曰：“是狼为虞人所窘，求救于我，我实生之。今反欲咥我，力求不免，我又当死之。欲少延于片时，暂定于是三老。初逢老杏，强我问之，草木无知，几杀我；次逢老牸，强我问之，禽兽无知，又将杀我；今逢丈人，岂天之未丧斯文也！敢乞一言而生。”因顿首杖下，俯伏听命。\n丈人闻之，欷歔再三，以杖叩狼曰：“汝误矣！夫人有恩而背之，不祥莫大焉。儒谓，受人恩而不忍背者，其为子必孝，又谓虎狼知父子。今汝背恩如是，则并父子亦无矣！”乃厉声曰：“狼速去！不然，将杖杀汝！”\n狼曰：“丈人知其一，未知其二，请诉之，愿丈人垂听！初，先生救我时，束缚我足，闭我囊中，压以诗书，我鞠躬不敢息，又蔓词以说简子，其意盖将死我于囊，而独窃其利也。是安可不咥？”丈人顾先生曰：“果如是，是羿亦有罪焉。”先生不平，具状其囊狼怜惜之意。狼亦巧辩不已以求胜。丈人曰：“是皆不足以执信也。试再囊之，吾观其状，果困苦否。”狼欣然从之，信足先生。先生复缚置囊中，肩举驴上，而狼未知之也。丈人附耳谓先生曰：“有匕首否？”先生曰：“有。”于是出匕。丈人目先生使引匕刺狼。先生曰：“不害狼乎？”丈人笑曰：“禽兽负恩如是，而犹不忍杀。子固仁者，然愚亦甚矣。从井以救人，解衣以活友，于彼计则得，其如就死地何！先生其此类乎？仁陷于愚，固君子之所不与也。”言已大笑，先生亦笑，遂举手助先生操刃，共殪狼，弃道上而去。"}]},{"prov":"山西","name":"太原市","d":"M638.9 337.4 L636.6 335.4 L640.3 332.1 L639.8 330.3 L631.9 334.5 L626.4 332.4 L625.4 335.9 L619.6 334.0 L614.4 337.5 L615.2 341.3 L618.0 341.0 L623.7 344.0 L626.6 348.4 L628.9 348.9 L631.9 347.6 L631.2 345.6 L635.1 338.4 L638.9 337.4 Z","v":1,"fd":"2026.08","texts":[{"t":"“忍得一时之气，免得百日之忧”","a":"佚名","d":"明清蒙学","g":"课外/补充-增广贤文","place":"【无实景，说理格言】","lt":"famous","basis":"蒙学格言无地理属性，作者不可考，作为蒙学通识素材按覆盖缺口分配至山西省太原市","type":"蒙学格言","full":"“忍得一时之气，免得百日之忧”"}]},{"prov":"山西","name":"大同市","d":"M647.0 310.7 L652.1 311.9 L653.1 317.2 L654.5 316.5 L655.4 318.1 L659.3 317.6 L661.1 315.5 L662.7 308.0 L660.2 306.5 L660.0 302.4 L652.4 299.7 L "晋侯赏从亡者，介之推不言禄，禄亦弗及。\n推曰：“献公之子九人，唯君在矣。惠怀无亲，外内弃之。天未绝晋，必将有主。主晋祀者，非君而谁？天实置之，而二三子以为己力，不亦诬乎？窃人之财，犹谓之盗。况贪天之功，以为己力乎？下义其罪，上赏其奸。上下相蒙，难与处矣。”\n其母曰：“盍亦求之？以死谁怼？”\n对曰：“尤而效之，罪又甚焉！且出怨言，不食其食。”\n其母曰：“亦使知之，若何？”\n对曰：“言，身之文也。身将隐，焉用文之？是求显也。”\n其母曰：“能如是乎？与汝偕隐。”遂隐而死。\n晋侯求之，不获，以绵上为之田。曰：“以志吾过，且旌善人。”"}]},{"prov":"山西","name":"运城市","d":"M599.5 382.3 L600.0 384.3 L594.0 398.8 L595.0 404.0 L603.4 403.9 L608.7 400.1 L615.2 399.5 L619.2 395.2 L623.0 395.4 L622.5 389.0 L619.1 388.2 L619.8 384.9 L615.9 383.9 L615.5 385.7 L610.9 386.1 L611.5 382.8 L610.2 383.3 L608.2 380.7 L606.2 382.3 L605.8 380.9 L604.8 383.2 L600.7 381.3 L599.5 382.3 Z","v":1,"fd":"待定","texts":[{"t":"登鹳雀楼","a":"王之涣","d":"唐","g":"小学二年级上","place":"鹳雀楼黄河远山","lt":"write","basis":"写作地蒲州（今山西永济市，由运城市代管），登鹳雀楼处，从写作地匹配","type":"古诗","full":"白日依山尽，黄河入海流。欲穷千里目，更上一层楼。"},{"t":"塞下曲","a":"卢纶","d":"唐","g":"小学四年级下","place":"边塞军营","lt":"birth","basis":"卢纶故乡河中蒲（今山西永济，由运城市代管），据作者故乡匹配山西运城市","type":"古诗","full":"月黑雁飞高，单于夜遁逃。欲将轻骑逐，大雪满弓刀。"},{"t":"送杜少府之任蜀州","a":"王勃","d":"唐","g":"小学六年级下","place":"蜀地长安","lt":"birth","basis":"王勃故乡绛州龙门（今山西河津，由运城市代管），据作者故乡匹配山西运城市","type":"古诗","full":"城阙辅三秦，风烟望五津。与君离别意，同是宦游人。海内存知己，天涯若比邻。无为在歧路，儿女共沾巾。"},{"t":"孙权劝学","a":"司马光《资治通鉴》","d":"北宋","g":"初中七年级下","place":"东吴建业（江苏南京）","lt":"birth","basis":"司马光陕州夏县人（今山西夏县，由运城市管辖），据作者故乡匹配山西运城市","type":"文言文","full":"初，权谓吕蒙曰：\"卿今当涂掌事，不可不学！\"蒙辞以军中多务。权曰：\"孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。\"蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰：\"卿今者才略，非复吴下阿蒙！\"蒙曰：\"士别三日，即更刮目相待，大兄何见事之晚乎！\"肃遂拜蒙母，结友而别。"},{"t":"九月九日忆山东兄弟","a":"王维","d":"唐","g":"小学三年级下","place":"重阳节思亲","lt":"birth","basis":"王维故乡蒲州祁（今山西永济，由运城市代管），据作者故乡匹配山西运城市","type":"古诗","full":"独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。"},{"t":"野望","a":"王绩","d":"唐","g":"初中八年级上","place":"东皋秋晚","lt":"write","basis":"写作地东皋（今山西河津市，由运城市代管），王绩故里东皋，从写作地匹配","type":"古诗","full":"东皋薄暮望，徙倚欲何依。树树皆秋色，山山唯落晖。牧人驱犊返，猎马带禽归。相顾无相识，长歌怀采薇。"},{"t":"使至塞上","a":"王维","d":"唐","g":"初中八年级上","place":"大漠边塞","lt":"birth","basis":"作者王维故里蒲州（今山西永济市，由运城市代管），'奉使河西途中'不可考具体城，从作者故乡匹配","type":"古诗","full":"单车欲问边，属国过居延。征蓬出汉塞，归雁入胡天。大漠孤烟直，长河落日圆。萧关逢候骑，都护在燕然。"},{"t":"宫之奇谏假道","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"虞（今山西运城平陆）；下阳/上阳（今河南三门峡）","lt":"famous","basis":"假道伐虢事发于虞国，虞叔庙与虢国墓地在今山西平陆、三门峡一带","type":"史传（左传）","full":"晋侯复假道于虞以伐虢。宫之奇谏曰:\"虢,虞之表也。虢亡,虞必从之。晋不可启,寇不可翫。一之谓甚,其可再乎?谚所谓辅车相依,唇亡齿寒者,其虞、虢之谓也。\"公曰:\"晋,吾宗也,岂害我哉?\"对曰:\"大伯、虞仲,大王之昭也。大伯不从,是以不嗣。虢仲、虢叔,王季之穆也,为文王卿士,勋在王室,藏于盟府。将虢是灭,何爱于虞!且虞能亲于桓、庄乎?其爱之也,桓、庄之族何罪?而以为戮,不唯逼乎?亲以宠逼,犹尚害之,况以国乎?\"公曰:\"吾享祀丰絜,神必据我。\"对曰:\"臣闻之,鬼神非人实亲,惟德是依。故《周书》曰:皇天无亲,惟德是辅。又曰:黍稷非馨,明德惟馨。又曰:民不易物,惟德繄物。如是,则非德,民不和,神不享矣。神所冯依,将在德矣。若晋取虞,而明德以荐馨香,神其吐之乎?\"弗听,许晋使。宫之奇以其族行,曰:\"虞不腊矣。在此行也,晋不更举矣。\"\n八月甲午,晋侯围上阳,问于卜偃曰:\"吾其济乎?\"对曰:\"克之。\"公曰:\"何时?\"对曰:\"童谣曰:丙之晨,龙尾伏辰,均服振振,取虢之旂。鹑之贲贲,天策焞焞,火中成军,虢公其奔。其九月、十月之交乎!丙子旦,日在尾,月在策,鹑火中,必是时也。\"冬,十二月丙子朔,晋灭虢,虢公丑奔京师。师还,馆于虞,遂袭虞,灭之,执虞公。及其大夫井伯,以媵秦穆姬。而修虞祀,且归其职贡于王,故书曰:\"晋人执虞公。\"罪虞公,言易也。"}]},{"prov":"山西","name":"忻州市","d":"M620.9 307.3 L614.1 306.3 L611.8 310.9 L608.5 311.2 L610.1 313.3 L608.4 317.9 L605.9 319.5 L605.3 324.4 L606.6 325.7 L609.4 324.4 L614.2 329.1 L617.6 326.8 L619.1 334.3 L625.4 335.9 L626.4 332.4 L631.0 334.4 L634.6 333.6 L639.2 330.4 L646.7 328.4 L651.2 323.8 L650.0 319.9 L653.1 317.2 L652.1 311.9 L647.2 310.6 L643.9 313.3 L639.3 312.1 L632.1 317.5 L626.7 317.2 L620.7 310.2 L622.1 308.7 L620.9 307.3 Z","v":1,"fd":"待定","texts":[{"t":"论诗三十首","a":"元好问","d":"金","g":"课外/补充-覆盖平衡新增","place":"诗论","lt":"famous","basis":"金·元好问太原秀容（今忻州）人，《论诗三十首》为其诗论代表作，据《遗山先生文集》","type":"古文","full":"一 汉谣魏什久纷纭，正体无人与细论。谁是诗中疏凿手？暂教泾渭各清浑。\n二 曹刘坐啸虎生风，四海无人角两雄。可惜并州刘越石，不教横槊建安中。\n三 邺下风流在晋多，壮怀犹见缺壶歌。风云若恨张华少，温李新声奈若何。\n四 一语天然万古新，豪华落尽见真淳。南窗白日羲皇上，未害渊明是晋人。\n五 纵横诗笔见高情，何物能浇块垒平？老阮不狂谁会得？出门一笑大江横。\n六 心画心声总失真，文章宁复见为人。高情千古闲居赋，争信安仁拜路尘！\n七 慷慨歌谣绝不传，穹庐一曲本天然。中州万古英雄气，也到阴山敕勒川。\n八 沈宋横驰翰墨场，风流初不废齐梁。论功若准平吴例，合着黄金铸子昂。\n九 斗靡夸多费览观，陆文犹恨冗于潘。心声只要传心了，布谷澜翻可是难。\n十 排比铺张特一途，藩篱如此亦区区。少陵自有连城璧，争奈微之识碔砆。\n十一 眼处心声句自神，暗中摸索总非真。画图临出秦川景，亲到长安有几人？\n十二 望帝春心托杜鹃，佳人锦瑟怨华年。诗家总爱西昆好，独恨无人作郑笺。\n十三 万古文章有坦途，纵横谁似玉川卢？真书不入今人眼，儿辈从教鬼画符。\n十四 出处殊涂听所安，山林何得贱衣冠。华歆一掷金随重，大是渠侬被眼谩。\n十五 笔底银河落九天，何曾憔悴饭山前。世间东抹西涂手，枉着书生待鲁连。\n十六 切切秋虫万古情，灯前山鬼泪纵横。鉴湖春好无人赋，岸夹桃花锦浪生。\n十七 切响浮声发巧深，研摩虽苦果何心？浪翁水乐无宫徵，自是云山韶濩音。\n十八 东野穷愁死不休，高天厚地一诗囚。江山万古潮阳笔，合在元龙百尺楼。\n十九 万古幽人在涧阿，百年孤愤竟如何？无人说与天随子，春草输赢较几多？\n二十 谢客风容映古今，发源谁似柳州深？朱弦一拂遗音在，却是当年寂寞心。\n二十一 窘步相仍死不前，唱醻无复见前贤。纵横正有凌云笔，俯仰随人亦可怜。\n二十二 奇外无奇更出奇，一波才动万波随。只知诗到苏黄尽，沧海横流却是谁？\n二十三 曲学虚荒小说欺，俳谐怒骂岂诗宜？今人合笑古人拙，除却雅言都不知。\n二十四 有情芍药含春泪，无力蔷薇卧晚枝。拈出退之山石句，始知渠是女郎诗。\n二十五 乱后玄都失故基，看花诗在只堪悲。刘郎也是人间客，枉向春风怨兔葵。\n二十六 金入洪炉不厌频，精真那计受纤尘。苏门果有忠臣在，肯放坡诗百态新？\n二十七 百年才觉古风回，元祐诸人次第来。讳学金陵犹有说，竟将何罪废欧梅？\n二十八 古雅难将子美亲，精纯全失义山真。论诗宁下涪翁拜，未作江西社里人。\n二十九 池塘春草谢家春，万古千秋五字新。传语闭门陈正字，“可怜无补费精神”。\n三十 撼树蜉蝣自觉狂，书生技痒爱论量。老来留得诗千首，却被何人校短长？"}]},{"prov":"山西","name":"临汾市","d":"M596.8 359.8 L596.6 364.1 L598.3 366.8 L597.5 374.6 L599.5 382.3 L600.7 381.3 L604.8 383.2 L605.8 380.9 L606.2 382.3 L608.2 380.7 L610.2 383.3 L611.5 382.8 L610.9 386.1 L615.5 385.7 L616.9 383.8 L619.8 384.9 L619.1 388.2 L621.2 388.9 L622.6 380.0 L625.0 380.7 L624.3 378.9 L628.1 379.2 L630.5 377.5 L631.1 372.1 L625.4 369.2 L622.3 364.0 L618.2 363.3 L616.9 364.6 L614.1 361.6 L609.8 362.8 L607.5 359.2 L603.6 360.5 L601.7 359.1 L599.4 360.5 L596.8 359.8 Z","v":1,"fd":"待定","texts":[{"t":"叔向贺贫","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"晋新田（今山西临汾侯马）","lt":"famous","basis":"叔向见韩宣子贺其贫于晋都新田，新田遗址在今山西侯马","type":"史传（国语）","full":"叔向见韩宣子,宣子忧贫,叔向贺之。宣子曰:\"吾有卿之名,而无其实,无以从二三子,吾是以忧,子贺我何故?\"对曰:\"昔栾武子无一卒之田,其宫不备其宗器,宣其德行,顺其宪则,使越于诸侯。诸侯亲之,戎狄怀之,以正晋国。行刑不疚,以免于难。及桓子,骄泰奢侈,贪欲无艺,略则行志,假货居贿,宜及于难,而赖武之德以没其身。及怀子,改桓之行,而修武之德,可以免于难,而离桓之罪,以亡于楚。夫郤昭子,其富半公室,其家半三军,恃其富宠,以泰于国,其身尸于朝,其宗灭于绛。不然,夫八郤,五大夫三卿,其宠大矣,一朝而灭,莫之哀也,唯无德也。今吾子有栾武子之贫,吾以为能其德矣,是以贺。若不忧德之不建,而患货之不足,将吊不暇,何贺之有?\"宣子拜,稽首焉,曰:\"起也将亡,赖子存之,非起也敢专承之,其自桓叔以下,嘉吾子之赐。\""}]},{"prov":"山西","name":"吕梁市","d":"M627.3 348.9 L623.7 344.0 L614.9 340.7 L614.5 337.2 L619.1 334.3 L618.1 327.2 L614.2 329.1 L609.4 324.4 L606.6 325.7 L605.3 324.4 L604.2 329.7 L598.4 334.9 L598.6 339.3 L602.3 343.2 L602.9 346.9 L600.6 349.3 L601.3 352.3 L596.4 357.4 L596.8 359.8 L599.4 360.5 L601.7 359.1 L603.6 360.5 L607.5 359.2 L607.3 360.6 L611.3 362.9 L615.4 359.4 L614.1 358.0 L616.3 358.9 L619.6 357.2 L621.1 352.9 L623.1 351.7 L624.2 352.7 L627.3 348.9 Z","v":1,"fd" 授以书而告之曰：“书非借不能读也。子不闻藏书者乎？《七略》《四库》，天子之书，然天子读书者有几？汗牛塞屋，富贵家之书，然富贵人读书者有几？其他祖父积、子孙弃者无论焉。非独书为然，天下物皆然。非夫人之物而强假焉，必虑人逼取，而惴惴焉摩玩之不已，曰：‘今日存，明日去，吾不得而见之矣。’若业为吾所有，心高束焉，庋藏焉，曰：‘姑俟异日观云尔。’”\n余幼好书，家贫难致。有张氏藏书甚富，往借不与，归而形诸梦，其切如是。故有所览，辄省记。通籍后，俸去书来，落落大满，素蟫灰丝，时蒙卷轴。然后叹借者之用心专，而少时之岁月为可惜也。\n今黄生贫类予，其借书亦类予，惟予之公书，与张氏之吝书，若不相类。然则予固不幸而遇张乎？生固幸而遇予乎？知幸与不幸，则其读书也必专，而其归书也必速。为一说，使与书惧。"}]},{"prov":"黑龙江","name":"佳木斯市","d":"M978.5 155.7 L983.0 150.5 L979.4 145.4 L981.4 140.1 L988.0 136.5 L973.9 137.6 L963.4 142.7 L956.4 142.5 L951.9 146.3 L949.9 145.7 L945.5 153.9 L939.7 157.3 L939.0 159.5 L924.6 160.6 L922.6 160.1 L922.8 158.2 L917.2 157.8 L916.1 158.3 L918.2 160.4 L912.9 163.2 L905.7 158.5 L899.9 164.7 L902.6 169.4 L899.4 171.7 L903.5 173.4 L906.0 171.5 L908.6 172.0 L907.9 173.5 L909.5 174.0 L910.3 171.6 L909.5 175.8 L906.0 176.4 L911.1 181.4 L917.6 184.7 L924.1 182.4 L927.4 182.8 L927.6 184.3 L929.6 178.9 L924.1 176.0 L922.2 172.5 L918.7 171.6 L917.8 167.6 L920.4 167.2 L920.5 165.5 L931.6 162.9 L931.5 166.5 L936.8 166.6 L936.4 165.2 L939.9 164.6 L943.2 165.5 L942.7 168.2 L950.4 167.9 L951.8 169.1 L957.2 166.3 L959.4 158.5 L962.0 155.4 L971.5 154.2 L975.8 151.4 L978.0 147.2 L979.4 149.2 L978.5 155.7 Z","v":1,"fd":"待定","texts":[{"t":"西湖七月半","a":"张岱","d":"—","g":"课外/补充-明清古文","place":"今浙江省杭州市（西湖）","lt":"famous","basis":"原作写于杭州市，作者与次选锚点俱不可确考，按覆盖补缺分配至黑龙江省佳木斯市","type":"小品文","full":"西湖七月半，一无可看，止可看看七月半之人。看七月半之人，以五类看之。\n其一，楼船箫鼓，峨冠盛筵，灯火优傒，声光相乱，名为看月而实不见月者，看之。\n其一，亦船亦楼，名娃闺秀，携及童孌，笑啼杂之，环坐露台，左右盼望，身在月下而实不看月者，看之。\n其一，亦船亦声歌，名妓闲僧，浅斟低唱，弱管轻丝，竹肉相发，亦在月下，亦看月而欲人看其看月者，看之。\n其一，不舟不车，不衫不帻，酒醉饭饱，呼群三五，跻入人丛，昭庆、断桥，嚣呼嘈杂，装假醉，唱无腔曲，月亦看，看月者亦看，不看月者亦看，而实无一看者，看之。\n其一，小船轻幌，净几暖炉，茶铛旋煮，素瓷静递，好友佳人，邀月同坐，或匿影树下，或逃嚣里湖，看月而人不见其看月之态，亦不作意看月者，看之。\n杭人游湖，巳出酉归，避月如仇。是夕好名，逐队争出，多犒门军酒钱。轿夫擎燎，列俟岸上。一入舟，速舟子急放断桥，赶入胜会。以故二鼓以前，人声鼓吹，如沸如撼，如魇如呓，如聋如哑。大船小船，一齐凑岸，一无所见，止见篙击篙，舟触舟，肩摩肩，面看面而已。少刻兴尽，官府席散，皂隶喝道去。轿夫叫，船上人怖以关门，灯笼火把如列星，一一簇拥而去。岸上人亦逐队赶门，渐稀渐薄，顷刻散尽矣。\n吾辈始舣舟近岸，断桥石磴始凉，席其上，呼客纵饮。此时月如镜新磨，山复整妆，湖复頮面，向之浅斟低唱者出，匿影树下者亦出，吾辈往通声气，拉与同坐。韵友来，名妓至，杯箸安，竹肉发。月色苍凉，东方将白，客方散去。吾辈纵舟，酣睡于十里荷花之中，香气拍人，清梦甚惬。"}]},{"pro 曰：“此朕德绥威服，覃及内外之所及也。”四陲之远，益思有以柔之。见两岸之间、四郊之上，耕人有炙肤皲足之烦，农女有捋桑行饁之勤，必曰：“此朕拔诸水火，而登于衽席者也。”万方之民，益思有以安之。触类而思，不一而足。\n臣知斯楼之建，皇上所以发舒精神，因物兴感，无不寓其致治之思，悉止阅夫长江而已哉！彼临春、结绮，非不华矣；齐云、落星，非不高矣。不过乐管弦之淫响，藏燕、赵之艳姬，一旋踵间而感慨系之，臣不知其为何说也。\n虽然，长江发源岷山，委蛇七千余里而入海，白涌碧翻，六朝之时，往往倚之为天堑。今则南北一家，视为安流，无所事乎战争矣。然则果谁之力欤？逢掖之士，有登斯楼而阅斯江者，当思圣德如天，荡荡难名，与神禹疏凿之功，同一罔极，忠君报上之心，其有不油然而兴耶？\n臣不敏，奉旨撰记，故上推宵旰图治之切者，勒诸贞珉。他若留连光景之辞，皆略而不陈，惧亵也。"},{"t":"游小盘谷记","a":"梅曾亮","d":"—","g":"课外/补充-明清古文","place":"今江苏省南京市（卢龙山，今狮子山一带）","lt":"famous","basis":"作者记南京卢龙山小盘谷之游","type":"游记散文","full":"江宁府城，其西北包卢龙山而止。余尝求小盘谷，至其地，土人或曰无有。唯大竹蔽天，多歧路，曲折广狭如一，探之不可穷。闻犬声，乃急赴之，卒不见人。逾五斗米顷，行抵寺，曰归云堂。土田宽舒，居民以桂为业。寺傍有草径甚微，南出之，乃坠大谷。四山皆大桂树，随山陂陀。其状若仰大盂，空响内贮，謦欬不得他逸；寂寥无声，而耳听常满。渊水积焉，尽山麓而止。\n由寺北行，至卢龙山，其中阬谷洼隆，若井灶龈腭之状。或曰：遗老所避兵者，三十六茅庵，七十二团瓢，皆当其地。\n日且暮，乃登山循城而归。瞑色下积，月光布其上。俯视万影摩荡，若鱼龙起伏波浪中。诸人皆曰：此万竹蔽天处也。所谓小盘谷，殆近之矣。\n同游者，侯振廷舅氏，管君异之、马君湘帆、欧生岳庵、弟念勤，凡六人。"},{"t":"芙蕖（《闲情偶寄》）","a":"李渔","d":"—","g":"课外/补充-明清古文","place":"无具体地点（杂说）","lt":"famous","basis":"作者居南京芥子园著《闲情偶寄》","type":"小品文论","full":"芙蕖与草本诸花似觉稍异，然有根无树，一岁一生，其性同也。谱云：“产于水者曰草芙蓉，产于陆者曰旱莲。”则谓非草本不得矣。予夏季倚此为命者，非故效颦于茂叔，而袭成说于前人也，以芙蕖之可人，其事不一而足，请备述之。\n群葩当令时，只在花开之数日，前此后此皆属过而不问之秋矣。芙蕖则不然：自荷钱出水之日，便为点缀绿波；及其茎叶既生，则又日高日上，日上日妍。有风既作飘飖之态，无风亦呈袅娜之姿，是我于花之未开，先享无穷逸致矣。迨至菡萏成花，娇姿欲滴，后先相继，自夏徂秋，此则在花为分内之事，在人为应得之资者也。及花之既谢，亦可告无罪于主人矣；乃复蒂下生蓬，蓬中结实，亭亭独立，犹似未开之花，与翠叶并擎，不至白露为霜而能事不已。此皆言其可目者也。\n可鼻，则有荷叶之清香，荷花之异馥；避暑而暑为之退，纳凉而凉逐之生。\n至其可人之口者，则莲实与藕皆并列盘餐而互芬齿颊者也。\n只有霜中败叶，零落难堪，似成弃物矣；乃摘而藏之，又备经年裹物之用。\n是芙蕖者也，无一时一刻不适耳目之观，无一物一丝不备家常之用者也。有五谷之实而不有其名，兼百花之长而各去其短，种植之利有大于此者乎？\n予四命之中，此命为最。无如酷好一生。竟不得半亩方塘，为安身立命之地，仅凿斗大一池，植数茎以塞责，又时病其漏，望天乞水以救之，殆所谓不善养生而草菅其命者哉。"},{"t":"与陈伯之书","a":"丘迟","d":"—","g":"课外/补充-古文观止","place":"建康","lt":"famous","basis":"丘迟在梁都建康为中军临川王记室时作书招降陈伯之","type":"书信（梁书）","full":"迟顿首陈将军足下：无恙，幸甚，幸甚！将军勇冠三军，才为世出，弃燕雀之小志，慕鸿鹄以高翔！昔因机变化，遭遇明主，立功立事，开国称孤。朱轮华毂，拥旄万里，何其壮也！如何一旦为奔亡之虏，闻鸣镝而股战，对穹庐以屈膝，又何劣邪！\n寻君去就之际，非有他故，直以不能内审诸己，外受流言，沈迷猖蹶，以至于此。圣朝赦罪责功，弃瑕录用，推赤心于天下，安反侧于万物。将军之所知，不假仆一二谈也。朱鲔涉血于友于，张绣剚刃於爱子，汉主不以为疑，魏君待之若旧。况将军无昔人之罪，而勋重於当世！夫迷途知返，往哲是与，不远而复，先典攸高。主上屈法申恩，吞舟是漏；将军松柏不剪，亲戚安居，高台未倾，爱妾尚在；悠悠尔心，亦何可言！今功臣名将，雁行有序，佩紫怀黄，赞帷幄之谋，乘轺建节，奉疆埸之任，并刑马作誓，传之子孙。将军独靦颜借命，驱驰毡裘之长，宁不哀哉！\n夫以慕容超之强，身送东市；姚泓之盛，面缚西都。故知霜露所均，不育异类；姬汉旧邦，无取杂种。北虏僭盗中原，多历年所，恶积祸盈，理至燋烂。况伪孽昏狡，自相夷戮，部落携离，酋豪猜贰。方当系颈蛮邸，悬首藁街，而将军鱼游於沸鼎之中，燕巢於飞幕之上，不亦惑乎？\n暮春三月，江南草长，杂花生树，群莺乱飞。见故国之旗鼓，感平生于畴日，抚弦登陴，岂不怆悢！\n所以廉公之思赵将，吴子之泣西河，人之情也，将军独无情哉？想早励良规，自求多福。\n当今皇帝盛明，天下安乐。白环西献，楛矢东来；夜郎滇池，解辫请职；朝鲜昌海，蹶角受化。唯北狄野心，掘强沙塞之间，欲延岁月之命耳！中军临川殿下，明德茂亲，揔兹戎重，吊民洛汭，伐罪秦中，若遂不改，方思仆言。聊布往怀，君其详之。丘迟顿首。"},{"t":"都是主人，且领略六朝烟水；暂留过客，莫辜负九曲风光。","a":"薛时雨","d":"—","g":"课外/补充-楹联","place":"江苏南京秦淮河","lt":"famous","basis":"清代薛时雨撰，悬于南京贡院街西牌坊","type":"楹联","full":"都是主人，且领略六朝烟水；暂留过客，莫辜负九曲风光。"}]},{"prov":"江苏","name":"无锡市","d":"M741.4 470.8 L747.5 470.6 L758.4 463.7 L758.1 458.8 L754.7 454.7 L748.9 455.5 L748.8 457.9 L751.6 457.1 L752.1 459.3 L749.7 462.7 L750.4 467.4 L749.4 464.3 L743.4 462.1 L741.4 470.8 Z","v":1,"fd":"待定","texts":[{"t":"悯农（其二）","a":"李绅","d":"唐","g":"小学一年级上","place":"田间农作场景","lt":"birth","basis":"作者李绅故里润州无锡（今江苏无锡），写作地不可考，从作者故乡匹配","type":"古诗","full":"锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。"},{"t":"悯农（其一）","a":"李绅","d":"唐","g":"小学二年级下","place":"农田","lt":"birth","basis":"作者李绅故里润州无锡（今江苏无锡），写作地不可考，从作者故乡匹配","type":"古诗","full":"春种一粒粟，秋收万颗子。四海无闲田，农夫犹饿死。"},{"t":"观巴黎油画记","a":"薛福成","d":"—","g":"课外/补充-明清古文","place":"法国巴黎油画院","lt":"birth","basis":"作者无锡人，光绪间出使英法时作于巴黎（写作地在海外，依作者故乡匹配）","type":"游记散文","full":"光绪十六年春闰二月甲子，余游巴黎蜡人馆。见所制蜡人，悉仿生人，形体态度，发肤颜色，长短丰瘠，无不毕肖。自王公卿相以至工艺杂流，凡有名者，往往留像于馆。或立或卧，或坐或俯，或笑或哭，或饮或博，骤视之，无不惊为生人者。余亟叹其技之奇妙。译者称西人绝技，尤莫逾油画，盍驰往油画院，一观普法交战图乎？\n其法为一大圜室，以巨幅悬之四壁，由屋顶放光明入室。人在室中，极目四望，则见城堡、冈峦、溪涧、树林，森然布列；两军人马杂遝：驰者、伏者、奔者、追者、开枪者、燃炮者、搴大旗者、挽炮车者，络绎相属。每一巨弹堕地，则火光迸裂，烟焰迷漫；其被轰击者，则断壁危楼，或黔其庐，或赭其垣；而军士之折臂断足、血流殷地、偃仰僵仆者，令人目不忍睹。仰视天，则明月斜挂，云霞掩映；俯视地，则绿草如茵，川原无际。几自疑身外即战场，而忘其在一室中者。迨以手扪之，始知其为壁也，画也，皆幻也。\n余闻法人好胜，何以自绘败状，令人丧气若此？译者曰：“所以昭炯戒，激众愤，图报复也。”则其意深长矣。\n夫普法之战，迄今虽为陈迹，而其事信而有征。然则此画果真邪，幻邪？幻者而同于真邪？真者而同于幻邪？斯二者盖皆有之。"}]},{"prov":"江苏","name":"徐州市","d":"M723.6 407.4 L719.8 408.5 L720.0 405.3 L716.5 402.7 L713.8 403.2 L714.0 405.8 L709.0 406.8 L706.9 404.6 L703.9 407.4 L700.9 399.1 L697.9 397.0 L697.8 398.1 L692.5 398.5 L691.2 401.5 L694.4 406.3 L700.8 408.3 L701.7 412.6 L703.7 414.2 L711.2 415.3 L713.3 418.1 L713.2 421.4 L719.9 420.4 L717.1 413.1 L725.3 413.6 L727.7 407.7 L723.6 407.4 Z","v":0,"fd":"","texts":[{"t":"杨氏之子","a":"刘义庆《世说新语》","d":"南朝宋","g":"小学五年级下","place":"杨氏府邸（洛阳一带）","lt":"birth","basis":"刘义庆彭城人（今江苏徐州），据作者故乡匹配江苏徐州市","type":"文言文","full":"梁国杨氏子九岁，甚聪惠。孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。孔指以示儿曰：\"此是君家果。\"儿应声答曰：\"未闻孔雀是夫子家禽。\""},{"t":"王戎不取道旁李","a":"刘义庆《世说新语》","d":"南朝宋","g":"小学六年级下","place":"道旁李树（洛阳附近）","lt":"birth","basis":"刘义庆彭城人（今江苏徐州），据作者故乡匹配江苏徐州市","type":"文言文","full":"王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。人问之，答曰：\"树在道边而多子，此必苦李。\"取之，信然。"},{"t":"咏雪","a":"刘义庆《世说新语》","d":"南朝宋","g":"初中七年级上","place":"谢安府邸（东晋建康）","lt":"birth","basis":"刘义庆彭城人（今江苏徐州），据作者故乡匹配江苏徐州市","type":"文言文","full":"谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：\"白雪纷纷何所似？\"兄子胡儿曰：\"撒盐空中差可拟。\"兄女曰：\"未若柳絮因风起。\"公大笑乐。即公大兄无奕女，左将军王凝之妻也。"},{"t":"陈太丘与友期行","a":"刘义庆《世说新语》","d":"南朝宋","g":"初中七年级上","place":"洛阳城外","lt":"birth","basis":"刘义庆彭城人（今江苏徐州），据作者故乡匹配江苏徐州市","type":"文言文","full":"陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：\"尊君在不？\"答曰：\"待君久不至，已去。\"友人便怒曰：\"非人哉！与人期行，相委而去。\"元方曰：\"君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。\"友人惭，下车引之。元方入门不顾。"},{"t":"唐雎不辱使命","a":"刘向《战国策》","d":"西汉","g":"初中九年级下","place":"秦国咸阳安陵","lt":"birth","basis":"刘向沛人（今江苏徐州），据编者故乡匹配江苏徐州市","type":"文言文","full":"秦王使人谓安陵君曰:\"寡人欲以五百里之地易安陵,安陵君其许寡人!\"安陵君曰:\"大王加惠,以大易小,甚善;虽然,受地于先王,愿终守之,弗敢易!\"秦王不说。安陵君因使唐雎使于秦。秦王谓唐雎曰:\"寡人以五百里之地易安陵,安陵君不听寡人,何也?且秦灭韩亡魏,而君以五十里之地存者,以君为长者,故不错意也。今吾以十倍之地,请广于君,而君逆寡人者,轻寡人与?\"唐雎对曰:\"否,非若是也。安陵君受地于先王而守之,虽千里不敢易也,岂直五百里哉?\"秦王怫然怒,谓唐雎曰:\"公亦尝闻天子之怒乎?\"唐雎对曰:\"臣未尝闻也。\"秦王曰:\"天子之怒,伏尸百万,流血千里。\"唐雎曰:\"大王尝闻布衣之怒乎?\"秦王曰:\"布衣之怒,亦免冠徒跣,以头抢地耳。\"唐雎曰:\"此庸夫之怒也,非士之怒也。夫专诸之刺王僚也,彗星袭月;聂政之刺韩傀也,白虹贯日;要离之刺庆忌也,仓鹰击于殿上。此三子者,皆布衣之士也,怀怒未发,休祲降于天,与臣而将四矣。若士必怒,伏尸二人,流血五步,天下缟素,今日是也。\"挺剑而起。秦王色挠,长跪而谢之曰:\"先生坐!何至于此!寡人谕矣:夫韩、魏灭亡,而安陵以五十里之地存者,徒以有先生也。\""},{"t":"邹忌讽齐王纳谏","a":"刘向《战国策》","d":"西汉","g":"初中九年级下","place":"齐国临淄（山东淄博）","lt":"birth","basis":"刘向沛人（今江苏徐州），据编者故乡匹配江苏徐州市","type":"文言文","full":"邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：\"我孰与城北徐公美？\"其妻曰：\"君美甚，徐公何能及君也？\"城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰：\"吾孰与徐公美？\"妾曰：\"徐公何能及君也？\"旦日，客从外来，与坐谈，问之：\"吾与徐公孰美？\"客曰：\"徐公不若君之美也。\"明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之，曰：\"吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。\"于是入朝见威王曰：\"臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。\"王曰：\"善。\"乃下令：\"群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝闻寡人之耳者，受下赏。\"令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。"}]},{"prov":"江苏","name":"常州市","d":"M749.2 455.2 L745.6 453.6 L744.7 459.7 L741.8 457.2 L738.4 457.3 L735.2 465.1 L736.2 468.7 L738.6 468.0 L739.1 470.5 L741.4 470.8 L743.4 462.1 L749.4 464.3 L750.4 467.4 L749.7 462.7 L752.1 459.3 L751.6 457.1 L748.8 457.9 L749.2 455.2 Z","v":1,"fd":"待定","texts":[{"t":"游子吟","a":"孟郊","d":"唐","g":"小学五年级下","place":"游子家中","lt":"write","basis":"写作地溧阳（今江苏溧阳市，由常州市代管），从写作地匹配","type":"古诗","full":"慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。"}]},{"prov":"江苏","name":"苏州市","d":"M747.5 470.6 L750.9 475.0 L755.7 475.4 L756.8 478.6 L759.9 476.4 L759.9 474.5 L762.9 473.8 L762.8 471.3 L765.9 470.8 L767.0 465.3 L770.5 463.2 L766.9 459.3 L763.3 458.5 L761.2 454.2 L756.2 453.7 L754.8 456.2 L758.1 458.8 L758.4 463.7 L747.5 470.6 Z","v":1,"fd":"2020.08","texts":[{"t":"四时田园杂兴（其二十五）","a":"范成大","d":"南宋","g":"小学四年级下","place":"江南田园","lt":"write","basis":"写作地石湖（今江苏苏州），从写作地匹配","type":"古诗","full":"梅子金黄杏子肥，麦花雪白菜花稀。日长篱落无人过，惟有蜻蜓蛱蝶飞。"},{"t":"四时田园杂兴（其三十一）","a":"范成大","d":"南宋","g":"小学五年级下","place":"江南农家","lt":"write","basis":"写作地石湖（今江苏苏州），范成大晚年居此，从写作地匹配","type":"古诗","full":"昼出耘田夜绩麻，村庄儿女各当家。童孙未解供耕织，也傍桑阴学种瓜。"},{"t":"项脊轩志","a":"归有光","d":"明","g":"高中选择性必修中","place":"昆山自家项脊轩","lt":"write","basis":"写作地昆山（今江苏昆山，由苏州市代管），归有光故里项脊轩，从写作地匹配","type":"文言文","full":"项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。\n然余居于此，多可喜，亦多可悲。先是，庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。\n家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。\n余自束发，读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。\n轩东，故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。\n项脊生曰：“蜀清守丹穴，利甲天下，其后秦皇帝筑女怀清台；刘玄德与曹操争天下，诸葛孔明起陇中。方二人之昧昧于一隅也，世何足以知之，余区区处败屋中，方扬眉、瞬目，谓有奇景。人知之者，其谓与埳井之蛙何异？”\n余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。\n庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。"},{"t":"画鸡","a":"唐寅","d":"明","g":"小学一年级下","place":"家中雄鸡形象","lt":"write","basis":"写作地吴县（今江苏苏州），唐寅故里吴县，从写作地匹配","type":"古诗","full":"头上红冠不用裁，满身雪白走将来。平生不敢轻言语，一叫千门万户开。"},{"t":"先妣事略","a":"归有光","d":"—","g":"课外/补充-明清古文","place":"今江苏省苏州市昆山市","lt":"birth","basis":"作者昆山人，于故乡项脊轩追忆先妣","type":"记叙文散文","full":"先妣周孺人，弘治元年二月十一日生。年十六来归。逾年生女淑静。淑静者，大姊也。期而生有光。又期而生女子，殇一人，期而不育者一人。又逾年生有尚，妊十二月。逾年生淑顺，一岁又生有功。\n有功之生也，孺人比乳他子加健。然数颦蹙顾诸婢曰：“吾为多子苦。”老妪以杯水盛二螺进，曰：“饮此后，妊不数矣。”孺人举之尽，喑不能言。\n正德八年五月二十三日，孺人卒。诸儿见家人泣，则随之泣，然犹以为母寝也。伤哉！于是家人延画工画，出二子。命之曰：“鼻以上画有光，鼻以下画大姊。”以二子肖母也。\n孺人讳桂。外曾祖讳明；外祖讳行，太学生；母何氏。世居吴家桥，去县城东南三十里，由千墩浦而南直桥，并小港以东，居人环聚，尽周氏也。外祖与其三兄皆以资雄，敦尚简直，与人姁姁说村中语，见子弟甥侄无不爱。\n孺人之吴家桥，则治木棉。入城，则缉，灯火荧荧，每至夜分。外祖不二日使人问遗。孺人不忧米盐，乃劳苦若不谋夕，冬月炉火炭屑，使婢子为团，累累暴阶下。室靡弃物，家无闲人。儿女大者攀衣，小者乳抱，手中纫缀不辍，户内洒然。遇童仆有恩，虽至棰楚，皆不忍有后言。吴家桥岁致鱼蟹饼铒，率人人得食。家中人闻吴家桥人至，皆喜。\n有光七岁与从兄有嘉入学。每阴风细雨，从兄辄留，有光意恋恋，不得留也。孺人中夜觉寝，促有光暗诵《孝经》，即熟读无一字龃龉，乃喜。\n孺人卒，母何孺人亦卒。周氏家有羊狗之疴。舅母卒，四姨归顾氏，又卒，死三十人而定。惟外祖与二舅存。\n孺人死十一年，大姊归王三接，孺人所许聘者也。十二年，有光补学官弟子。十六年而有妇，孺人所聘者也。期而抱女，抚爱之，益念孺人。中夜与其妇泣，追惟一二，仿佛如昨，馀则茫然矣。世乃有无母之人，天乎！痛哉！"},{"t":"寒花葬志","a":"归有光","d":"—","g":"课外/补充-明清古文","place":"今江苏省苏州市昆山市","lt":"famous","basis":"作者昆山人，葬婢女寒花于昆山","type":"抒情散文","full":"婢,魏孺人媵也。嘉靖丁酉五月四日死,葬虚丘。事我而不卒,命也夫!婢初媵时,年十岁,垂双鬟,曳深绿布裳。一日,天寒,爇火煮荸荠熟,婢削之盈瓯,予入自外,取食之,婢持去,不与。魏孺人笑之。孺人每令婢倚几旁饭,即饭,目眶冉冉动。孺人又指予以为笑。回思是时,奄忽便已十年。吁,可悲也已!"},{"t":"沧浪亭记","a":"归有光","d":"—","g":"课外/补充-明清古文","place":"今江苏省苏州市（沧浪亭）","lt":"famous","basis":"文中记苏州城南沧浪亭废而复兴，作于苏州","type":"散文","full":"浮图文瑛，居大云庵，环水，即苏子美沧浪亭之地也。亟求余作《沧浪亭记》，曰：昔子美之记，记亭之胜也；请子记吾所以为亭者。\n余曰：昔吴越有国时，广陵王镇吴中，治南园于子城之西南；其外戚孙承祐，亦治园于其偏。迨淮海纳土，此园不废。苏子美始建沧浪亭，最后禅者居之，此沧浪亭为大云庵也。有庵以来二百年，文瑛寻古遗事，复子美之构于荒残灭没之余，此大云庵为沧浪亭也。\n夫古今之变，朝市改易。尝登姑苏之台，望五湖之渺茫，群山之苍翠，太伯、虞仲之所建，阖闾、夫差之所争，子胥、种、蠡之所经营，今皆无有矣。庵与亭何为者哉？虽然，钱镠因乱攘窃，保有吴越，国富兵强，垂及四世，诸子姻戚，乘时奢僭，宫馆苑囿，极一时之盛。而子美之亭，乃为释子所钦重如此。可以见士之欲垂名于千载，不与其澌然而俱尽者，则有在矣。\n文瑛读书喜诗，与吾徒游，呼之为沧浪僧云。"},{"t":"五人墓碑记","a":"张溥","d":"—","g":"课外/补充-明清古文","place":"今江苏省苏州市（虎丘山塘五人墓）","lt":"famous","basis":"作者太仓人，记苏州颜佩韦等五人墓事","type":"碑记散文","full":"五人者，盖当蓼洲周公之被逮，激于义而死焉者也。至于今，郡之贤士大夫请于当道，即除魏阉废祠之址以葬之；且立石于其墓之门，以旌其所为。呜呼，亦盛矣哉！\n夫五人之死，去今之墓而葬焉，其为时止十有一月耳。夫十有一月之中，凡富贵之子，慷慨得志之徒，其疾病而死，死而湮没不足道者，亦已众矣；况草野之无闻者欤？独五人之皦皦，何也？\n予犹记周公之被逮，在丁卯三月之望。吾社之行为士先者，为之声义，敛资财以送其行，哭声震动天地。缇骑按剑而前，问：“谁为哀者？”众不能堪，抶而仆之。是时以大中丞抚吴者为魏之私人周公之逮所由使也；吴之民方痛心焉，于是乘其厉声以呵，则噪而相逐。中丞匿于溷藩以免。既而以吴民之乱请于朝，按诛五人，曰颜佩韦、杨念如、马杰、沈扬、周文元，即今之傫然在墓者也。\n然五人之当刑也，意气扬扬，呼中丞之名而詈之，谈笑以死。断头置城上，颜色不少变。有贤士大夫发五十金，买五人之脰而函之，卒与尸合。故今之墓中全乎为五人也。\n嗟夫！大阉之乱，缙绅而能不易其志者，四海之大，有几人欤？而五人生于编伍之间，素不闻《诗》《书》之训，激昂大义，蹈死不顾，亦曷故哉？且矫诏纷出，钩党之捕遍于天下，卒以吾郡之发愤一击，不敢复有株治；大阉亦逡巡畏义，非常之谋难于猝发，待圣人之出而投缳道路，不可谓非五人之力也。\n由是观之，则今之高爵显位，一旦抵罪，或脱身以逃，不能容于远近，而又有剪发杜门，佯狂不知所之者，其辱人贱行，视五人之死，轻重固何如哉？是以蓼洲周公忠义暴于朝廷，赠谥美显，荣于身后；而五人亦得以加其土封，列其姓名于大堤之上，凡四方之士无有不过而拜且泣者，斯固百世之遇也。不然，令五人者保其首领，以老于户牖之下，则尽其天年，人皆得以隶使之，安能屈豪杰之流，扼腕墓道，发其志士之悲哉？故予与同社诸君子，哀斯墓之徒有其石也，而为之记，亦以明死生之大，匹夫之有重于社稷也。\n贤士大夫者，冏卿因之吴公，太史文起文公、孟长姚公也。"},{"t":"五人墓碑记","a":"张溥","d":"—","g":"课外/补充-古文观止","place":"苏州虎丘山塘五人墓","lt":"famous","basis":"颜佩韦等五义士抗魏阉就义，墓在苏州虎丘山塘街","type":"记文","full":"五人者，盖当蓼洲周公之被逮，激于义而死焉者也。至于今，郡之贤士大夫请于当道，即除魏阉废祠之址以葬之；且立石于其墓之门，以旌其所为。呜呼，亦盛矣哉！\n夫五人之死，去今之墓而葬焉，其为时止十有一月耳。夫十有一月之中，凡富贵之子，慷慨得志之徒，其疾病而死，死而湮没不足道者，亦已众矣；况草野之无闻者欤？独五人之皦皦，何也？\n予犹记周公之被逮，在丁卯三月之望。吾社之行为士先者，为之声义，敛资财以送其行，哭声震动天地。缇骑按剑而前，问：“谁为哀者？”众不能堪，抶而仆之。是时以大中丞抚吴者为魏之私人周公之逮所由使也；吴之民方痛心焉，于是乘其厉声以呵，则噪而相逐。中丞匿于溷藩以免。既而以吴民之乱请于朝，按诛五人，曰颜佩韦、杨念如、马杰、沈扬、周文元，即今之傫然在墓者也。\n然五人之当刑也，意气扬扬，呼中丞之名而詈之，谈笑以死。断头置城上，颜色不少变。有贤士大夫发五十金，买五人之脰而函之，卒与尸合。故今之墓中全乎为五人也。\n嗟夫！大阉之乱，缙绅而能不易其志者，四海之大，有几人欤？而五人生于编伍之间，素不闻《诗》《书》之训，激昂大义，蹈死不顾，亦曷故哉？且矫诏纷出，钩党之捕遍于天下，卒以吾郡之发愤一击，不敢复有株治；大阉亦逡巡畏义，非常之谋难于猝发，待圣人之出而投缳道路，不可谓非五人之力也。\n由是观之，则今之高爵显位，一旦抵罪，或脱身以逃，不能容于远近，而又有剪发杜门，佯狂不知所之者，其辱人贱行，视五人之死，轻重固何如哉？是以蓼洲周公忠义暴于朝廷，赠谥美显，荣于身后；而五人亦得以加其土封，列其姓名于大堤之上，凡四方之士无有不过而拜且泣者，斯固百世之遇也。不然，令五人者保其首领，以老于户牖之下，则尽其天年，人皆得以隶使之，安能屈豪杰之流，扼腕墓道，发其志士之悲哉？故予
