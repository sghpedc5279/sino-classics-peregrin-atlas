照书，以夜继日焉。"},{"t":"屈原列传","a":"司马迁《史记》","d":"西汉","g":"高中选择性必修中","place":"楚国郢都（湖北荆州）","lt":"desc","basis":"《史记·屈原列传》描写楚国郢都（今湖北荆州江陵），据描写地点匹配湖北荆州市","type":"文言文","full":"屈原者,名平,楚之同姓也。为楚怀王左徒。博闻强志,明于治乱,娴于辞令。入则与王图议国事,以出号令;出则接遇宾客,应对诸侯。王甚任之。上官大夫与之同列,争宠而心害其能。怀王使屈原造为宪令,屈平属草稿未定。上官大夫见而欲夺之,屈平不与,因谗之曰:\"王使屈平为令,众莫不知。每一令出,平伐其功,曰以为非我莫能为也。\"王怒而疏屈平。屈平疾王听之不聪也,谗谄之蔽明也,邪曲之害公也,方正之不容也,故忧愁幽思而作《离骚》。\"离骚\"者,犹离忧也。夫天者,人之始也;父母者,人之本也。人穷则反本,故劳苦倦极,未尝不呼天也;疾痛惨怛,未尝不呼父母也。屈平正道直行,竭忠尽智以事其君,谗人间之,可谓穷矣。信而见疑,忠而被谤,能无怨乎?屈平之作《离骚》,盖自怨生也。《国风》好色而不淫,《小雅》怨诽而不乱。若《离骚》者,可谓兼之矣。上称帝喾,下道齐桓,中述汤、武,以刺世事。明道德之广崇,治乱之条贯,靡不毕见。其文约,其辞微,其志洁,其行廉。其称文小而其指极大,举类迩而见义远。其志洁,故其称物芳;其行廉,故死而不容。自疏濯淖污泥之中,蝉蜕于浊秽,以浮游尘埃之外,不获世之滋垢,皭然泥而不滓者也。推此志也,虽与日月争光可也。屈平既绌,其后秦欲伐齐,齐与楚从亲,惠王患之。乃令张仪详去秦,厚币委质事楚,曰:\"秦甚憎齐,齐与楚从亲,楚诚能绝齐,秦愿献商、於之地六百里。\"楚怀王贪而信张仪,遂绝齐,使使如秦受地。张仪诈之曰:\"仪与王约六里,不闻六百里。\"楚使怒去,归告怀王。怀王怒,大兴师伐秦。秦发兵击之,大破楚师于丹、淅,斩首八万,虏楚将屈匄,遂取楚之汉中地。怀王乃悉发国中兵,以深入击秦,战于蓝田。魏闻之,袭楚至邓。楚兵惧,自秦归。而齐竟怒,不救楚,楚大困。明年,秦割汉中地与楚以和。楚王曰:\"不愿得地,愿得张仪而甘心焉。\"张仪闻,乃曰:\"以一仪而当汉中地,臣请往如楚。\"如楚,又因厚币用事者臣靳尚,而设诡辩于怀王之宠姬郑袖。怀王竟听郑袖,复释去张仪。是时屈原既疏,不复在位,使于齐,顾反,谏怀王曰:\"何不杀张仪?\"怀王悔,追张仪,不及。其后,诸侯共击楚,大破之,杀其将唐眜。时秦昭王与楚婚,欲与怀王会。怀王欲行,屈平曰:\"秦,虎狼之国,不可信,不如毋行。\"怀王稚子子兰劝王行:\"奈何绝秦欢!\"怀王卒行。入武关,秦伏兵绝其后,因留怀王,以求割地。怀王怒,不听。亡走赵,赵不内。复之秦,竟死于秦而归葬。长子顷襄王立,以其弟子兰为令尹。楚人既咎子兰以劝怀王入秦而不反也。屈平既嫉之,虽放流,眷顾楚国,系心怀王,不忘欲反。冀幸君之一悟,俗之一改也。其存君兴国,而欲反覆之,一篇之中,三致志焉。然终无可奈何,故不可以反。卒以此见怀王之终不悟也。人君无愚、智、贤、不肖,莫不欲求忠以自为,举贤以自佐。然亡国破家相随属,而圣君治国累世而不见者,其所谓忠者不忠,而所谓贤者不贤也。怀王以不知忠臣之分,故内惑于郑袖,外欺于张仪,疏屈平而信上官大夫、令尹子兰,兵挫地削,亡其六郡,身客死于秦,为天下笑,此不知人之祸也。《易》曰:\"井泄不食,为我心恻,可以汲。王明,并受其福。\"王之不明,岂足福哉!令尹子兰闻之,大怒,卒使上官大夫短屈原于顷襄王,顷襄王怒而迁之。屈原至于江滨,被发行吟泽畔,颜色憔悴,形容枯槁。渔父见而问之曰:\"子非三闾大夫欤?何故而至此?\"屈原曰:\"举世混浊而我独清,众人皆醉而我独醒,是以见放。\"渔父曰:\"夫圣人者,不凝滞于物,而能与世推移。举世混浊,何不随其流而扬其波?众人皆醉,何不餔其糟而啜其醨?何故怀瑾握瑜,而自令见放为?\"屈原曰:\"吾闻之,新沐者必弹冠,新浴者必振衣。人又谁能以身之察察,受物之汶汶者乎?宁赴常流而葬乎江鱼腹中耳。又安能以皓皓之白,而蒙世之温蠖乎?\"乃作《怀沙》之赋。于是怀石,遂自投汨罗以死。屈原既死之后,楚有宋玉、唐勒、景差之徒者,皆好辞而以赋见称。然皆祖屈原之从容辞令,终莫敢直谏。其后楚日以削,数十年竟为秦所灭。太史公曰:\"余读《离骚》《天问》《招魂》《哀郢》,悲其志。适长沙,观屈原所自沉渊,未尝不垂涕,想见其为人。及见贾生吊之,又怪屈原以彼其材游诸侯,何国不容,而自令若是!读《鵩鸟赋》,同死生,轻去就,又爽然自失矣。\""},{"t":"行军九日思长安故园","a":"岑参","d":"唐","g":"初中七年级上","place":"重阳思乡","lt":"birth","basis":"作者岑参'江陵'故里（今湖北荆州），'西域行军途中'不可考具体城，从作者故乡匹配","type":"古诗","full":"强欲登高去，无人送酒来。遥怜故园菊，应傍战场开。"},{"t":"逢入京使","a":"岑参","d":"唐","g":"初中七年级下","place":"边塞逢使者","lt":"birth","basis":"作者岑参'江陵'故里（今湖北荆州），'赴安西途中'不可考具体城，从作者故乡匹配","type":"古诗","full":"故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安。"},{"t":"虎丘记","a":"袁宏道","d":"—","g":"课外/补充-明清古文","place":"今江苏省苏州市（虎丘）","lt":"birth","basis":"袁宏道公安人（今湖北公安，由荆州市管辖），据作者故乡匹配湖北荆州市","type":"游记散文","full":"虎丘去城可七八里，其山无高岩邃壑，独以近城，故箫鼓楼船，无日无之。凡月之夜，花之晨，雪之夕，游人往来，纷错如织，而中秋为尤胜。\n每至是日，倾城阖户，连臂而至。衣冠士女，下迨蔀屋，莫不靓妆丽服，重茵累席，置酒交衢间。从千人石上至山门，栉比如鳞，檀板丘积，樽罍云泻，远而望之，如雁落平沙，霞铺江上，雷辊电霍，无得而状。\n布席之初，唱者千百，声若聚蚊，不可辨识。分曹部署，竞以歌喉相斗，雅俗既陈，妍媸自别。未几而摇头顿足者，得数十人而已；已而明月浮空，石光如练，一切瓦釜，寂然停声，属而和者，才三四辈；一箫，一寸管，一人缓板而歌，竹肉相发，清声亮彻，听者魂销。比至夜深，月影横斜，荇藻凌乱，则箫板亦不复用；一夫登场，四座屏息，音若细发，响彻云际，每度一字，几尽一刻，飞鸟为之徘徊，壮士听而下泪矣。\n剑泉深不可测，飞岩如削。千顷云得天池诸山作案，峦壑竞秀，最可觞客。但过午则日光射人，不堪久坐耳。文昌阁亦佳，晚树尤可观。而北为平远堂旧址，空旷无际，仅虞山一点在望，堂废已久，余与江进之谋所以复之，欲祠韦苏州、白乐天诸公于其中；而病寻作，余既乞归，恐进之之兴亦阑矣。山川兴废，信有时哉！\n吏吴两载，登虎丘者六。最后与江进之、方子公同登，迟月生公石上。歌者闻令来，皆避匿去。余因谓进之曰：“甚矣，乌纱之横，皂隶之俗哉！他日去官，有不听曲此石上者，如月！”今余幸得解官称吴客矣。虎丘之月，不知尚识余言否耶？"},{"t":"初至西湖记","a":"袁宏道","d":"—","g":"课外/补充-明清古文","place":"今浙江省杭州市（西湖）","lt":"birth","basis":"袁宏道公安人（今湖北公安，由荆州市管辖），据作者故乡匹配湖北荆州市","type":"游记小品","full":"西湖最盛，为春为月。一日之盛，为朝烟，为夕岚。今岁春雪甚盛，梅花为寒所勒，与杏桃相次开发，尤为可观。"},{"t":"王孙圉论楚宝","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"楚郢都（今湖北荆州江陵）","lt":"famous","basis":"王孙圉使晋论楚宝以楚之所宝者，楚都纪南城在今荆州江陵","type":"史传（国语）","full":"王孙圉聘于晋，定公飨之。赵简子鸣玉以相，问于王孙圉曰：“楚之白珩犹在乎？”对曰：“然。”简子曰：“其为宝也，几何矣？”曰：“未尝为宝。楚之所宝者，曰观射父，能作训辞，以行事于诸侯，使无以寡君为口实。又有左史倚相，能道训典，以叙百物，以朝夕献善败于寡君，使寡君无忘先王之业；又能上下说乎鬼神，顺道其欲恶，使神无有怨痛于楚国。又有薮曰云，连徒洲，金、木、竹、箭之所生也，龟、珠、角、齿、皮、革、羽、毛，所以备赋，以戒不虞者也；所以共币帛，以宾享于诸侯者也。若诸侯之好币具，而导之以训辞，有不虞之备，而皇神相之，寡君其可以免罪于诸侯，而国民保焉。此楚国之宝也。若夫白珩，先王之玩也，何宝焉？”\n“圉闻国之宝，六而已：圣能制议百物，以辅相国家，则宝之；玉足以庇荫嘉谷，使无水旱之灾，则宝之；龟足以宪臧否，则宝之；珠足以御火灾，则宝之；金足以御兵乱，则宝之；山林薮泽足以备财用，则宝之。若夫哗嚣之美，楚虽蛮夷，不能宝也。”"},{"t":"与韩荆州书","a":"李白","d":"—","g":"课外/补充-古文观止","place":"荆州","lt":"famous","basis":"李白弱冠后干谒荆州长史韩朝宗于荆州","type":"书信","full":"白闻天下谈士相聚而言曰：“生不用封万户侯，但愿一识韩荆州。”何令人之景慕，一至于此！岂不以周公之风，躬吐握之事，使海内豪俊，奔走而归之，一登龙门，则声价十倍！所以龙蟠凤逸之士，皆欲收名定价于君侯。君侯不以富贵而骄之、寒贱而忽之，则三千之中有毛遂，使白得颖脱而出，即其人焉。\n白，陇西布衣，流落楚、汉。十五好剑术，遍干诸侯。三十成文章，历抵卿相。虽长不满七尺，而心雄万夫。皆王公大人许与气义。此畴曩心迹，安敢不尽于君侯哉！\n君侯制作侔神明，德行动天地，笔参造化，学究天人。幸愿开张心颜，不以长揖见拒。必若接之以高宴，纵之以清谈，请日试万言，倚马可待。今天下以君侯为文章之司命，人物之权衡，一经品题，便作佳士。而今君侯何惜阶前盈尺之地，不使白扬眉吐气，激昂青云耶？\n昔王子师为豫州，未下车，即辟荀慈明，既下车，又辟孔文举；山涛作冀州，甄拔三十余人，或为侍中、尚书，先代所美。而君侯亦一荐严协律，入为秘书郎，中间崔宗之、房习祖、黎昕、许莹之徒，或以才名见知，或以清白见赏。白每观其衔恩抚躬，忠义奋发，白以此感激，知君侯推赤心于诸贤之腹中，所以不归他人，而愿委身国士。倘急难有用，敢效微躯。\n且人非尧舜，谁能尽善？白谟猷筹画，安能自矜？至于制作，积成卷轴，则欲尘秽视听。恐雕虫小技，不合大人。若赐观刍荛，请给纸笔，兼之书人，然后退扫闲轩，缮写呈上。庶青萍、结绿，长价于薛、卞之门。幸推下流，大开奖饰，唯君侯图之。"},{"t":"虎丘记","a":"袁宏道","d":"—","g":"课外/补充-古文观止","place":"苏州虎丘","lt":"birth","basis":"袁宏道公安人（今湖北公安，由荆州市管辖），据作者故乡匹配湖北荆州市","type":"游记","full":"虎丘去城可七八里，其山无高岩邃壑，独以近城，故箫鼓楼船，无日无之。凡月之夜，花之晨，雪之夕，游人往来，纷错如织，而中秋为尤胜。\n每至是日，倾城阖户，连臂而至。衣冠士女，下迨蔀屋，莫不靓妆丽服，重茵累席，置酒交衢间。从千人石上至山门，栉比如鳞，檀板丘积，樽罍云泻，远而望之，如雁落平沙，霞铺江上，雷辊电霍，无得而状。\n布席之初，唱者千百，声若聚蚊，不可辨识。分曹部署，竞以歌喉相斗，雅俗既陈，妍媸自别。未几而摇头顿足者，得数十人而已；已而明月浮空，石光如练，一切瓦釜，寂然停声，属而和者，才三四辈；一箫，一寸管，一人缓板而歌，竹肉相发，清声亮彻，听者魂销。比至夜深，月影横斜，荇藻凌乱，则箫板亦不复用；一夫登场，四座屏息，音若细发，响彻云际，每度一字，几尽一刻，飞鸟为之徘徊，壮士听而下泪矣。\n剑泉深不可测，飞岩如削。千顷云得天池诸山作案，峦壑竞秀，最可觞客。但过午则日光射人，不堪久坐耳。文昌阁亦佳，晚树尤可观。而北为平远堂旧址，空旷无际，仅虞山一点在望，堂废已久，余与江进之谋所以复之，欲祠韦苏州、白乐天诸公于其中；而病寻作，余既乞归，恐进之之兴亦阑矣。山川兴废，信有时哉！\n吏吴两载，登虎丘者六。最后与江进之、方子公同登，迟月生公石上。歌者闻令来，皆避匿去。余因谓进之曰：“甚矣，乌纱之横，皂隶之俗哉！他日去官，有不听曲此石上者，如月！”今余幸得解官称吴客矣。虎丘之月，不知尚识余言否耶？"}]},{"prov":"湖北","name":"黄冈市","d":"M671.9 488.7 L677.3 496.2 L684.3 498.6 L687.6 496.7 L686.4 489.2 L683.9 487.2 L684.1 483.3 L681.6 480.0 L686.3 473.6 L680.7 470.0 L678.4 470.8 L675.5 466.0 L673.5 466.3 L672.2 462.2 L671.1 464.0 L666.9 465.0 L663.9 462.6 L662.0 463.1 L660.2 469.4 L663.5 475.3 L669.3 473.4 L670.9 476.2 L666.4 479.1 L667.3 480.9 L666.3 481.3 L667.1 484.6 L670.5 485.7 L671.9 488.7 Z","v":1,"fd":"待定","texts":[{"t":"浣溪沙","a":"苏轼","d":"北宋","g":"小学六年级下","place":"黄州清泉寺","lt":"write","basis":"写作地黄州（今湖北黄冈），苏轼贬黄州时作，从写作地匹配","type":"词","full":"山下兰芽短浸溪，松间沙路净无泥，萧萧暮雨子规啼。谁道人生无再少？门前流水尚能西！休将白发唱黄鸡。"},{"t":"记承天寺夜游","a":"苏轼","d":"北宋","g":"初中八年级上","place":"黄州承天寺庭院","lt":"write","basis":"写作地黄州（今湖北黄冈），苏轼贬黄州时作，从写作地匹配","type":"文言文","full":"元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。庭下如积水空明，水中藻、荇交横，盖竹柏影也。何夜无月？何处无竹柏？但少闲人如吾两人者耳。"},{"t":"赤壁赋","a":"苏轼","d":"北宋","g":"高中必修上","place":"黄州赤壁（赤鼻矶）","lt":"write","basis":"写作地黄州（今湖北黄冈），苏轼贬黄州作《赤壁赋》，从写作地匹配","type":"文言文","full":"壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。\n于是饮酒乐甚，扣舷而歌之。歌曰：『桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。』客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。\n苏子愀然，正襟危坐而问客曰：『何为其然也？』客曰：『月明星稀，乌鹊南飞，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。』\n苏子曰：『客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭。是造物者之无尽藏也，而吾与子之所共适。』\n客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。"},{"t":"念奴娇·赤壁怀古","a":"苏轼","d":"北宋","g":"高中必修上","place":"黄州赤壁","lt":"write","basis":"写作地黄州（今湖北黄冈），苏轼贬黄州作，从写作地匹配","type":"词","full":"大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。\n遥想公瑾当年，小乔初嫁了，雄姿英发。羽扇纶巾，谈笑间，樯橹灰飞灭。故国神游，多情应笑我，早生华发。人生如梦，一尊还酹江月。"},{"t":"卜算子·黄州定慧院寓居作","a":"苏轼","d":"北宋","g":"初中八年级下","place":"黄州定慧院","lt":"write","basis":"写作地黄州定慧院（今湖北黄冈），苏轼贬黄州作，从写作地匹配","type":"词","full":"缺月挂疏桐，漏断人初静。谁见幽人独往来，缥缈孤鸿影。惊起却回头，有恨无人省。拣尽寒枝不肯栖，寂寞沙洲冷。"},{"t":"定风波（莫听穿林打叶声）","a":"苏轼","d":"北宋","g":"初中九年级下","place":"黄州道中遇雨","lt":"write","basis":"写作地黄州沙湖道中（今湖北黄冈），苏轼贬黄州作，从写作地匹配","type":"词","full":"莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。"},{"t":"童心说","a":"李贽","d":"—","g":"课外/补充-明清古文","place":"无具体地点（文论）","lt":"famous","basis":"作者晚年客居麻城芝佛院时作此文","type":"议论文","full":"龙洞山农叙《西厢》，末语云：“知者勿谓我尚有童心可也。”夫童心者，真心也。若以童心为不可，是以真心为不可也。夫童心者，绝假纯真，最初一念之本心也。若失却童心，便失却真心；失却真心，便失却真人。人而非真，全不复有初矣。童子者，人之初也；童心者，心之初也。夫心之初，曷可失也？然童心胡然而遽失也。\n盖方其始也，有闻见从耳目而入，而以为主于其内而童心失。其长也，有道理从闻见而入，而以为主于其内而童心失。其久也，道理闻见日以益多，则所知所觉日以益广，于是焉又知美名之可好也，而务欲以扬之而童心失。知不美之名之可丑也，而务欲以掩之而童心失。夫道理闻见，皆自多读书识义理而来也。古之圣人，曷尝不读书哉。然纵不读书，童心固自在也；纵多读书，亦以护此童心而使之勿失焉耳，非若学者反以多读书识义理而反障之也。夫学者既以多读书识义理障其童心矣，圣人又何用多著书立言以障学人为耶？童心既障，于是发而为言语，则言语不由衷；见而为政事，则政事无根柢；著而为文辞，则文辞不能达。非内含于章美也，非笃实生辉光也，欲求一句有德之言，卒不可得，所以者何？以童心既障，而以从外入者闻见道理为之心也。\n夫既以闻见道理为心矣，则所言者皆闻见道理之言，非童心自出之言也，言虽工，于我何与？岂非以假人言假言，而事假事、文假文乎！盖其人既假，则无所不假矣。由是而以假言与假人言，则假人喜；以假事与假人道，则假人喜；以假文与假人谈，则假人喜。无所不假，则无所不喜。满场是假，矮人何辩也。然则虽有天下之至文，其湮灭于假人而不尽见于后世者，又岂少哉！何也？天下之至文，未有不出于童心焉者也。苟童心常存，则道理不行，闻见不立，无时不文，无人不文，无一样创制体格文字而非文者。诗何必古《选》，文何必先秦，降而为六朝，变而为近体，又变而为传奇，变而为院本，为杂剧，为《西厢曲》，为《水浒传》，为今之举子业，皆古今至文，不可得而时势先后论也·故吾因是而有感于童心者之自文也，更说什么六经，更说什么《语》、《孟》乎！\n夫六经、《语》、《孟》，非其史官过为褒崇之词，则其臣子极为赞美之语，又不然，则其迂阔门徒、懵懂弟子，记忆师说，有头无尾，得后遗前，随其所见，笔之于书。后学不察，便谓出自圣人之口也，决定目之为经矣，孰知其大半非圣人之言乎？纵出自圣人，要亦有为而发，不过因病发药，随时处方，以救此一等懵懂弟子，迂阔门徒云耳。医药假病，方难定执，是岂可遽以为万世之至论乎？然则六经、《语》、《孟》，乃道学之口实，假人之渊薮也，断断乎其不可以语于童心之言明矣。呜呼！吾又安得真正大圣人童心未曾失者而与之一言文哉！"},{"t":"黄冈竹楼记","a":"王禹偁","d":"—","g":"课外/补充-古文观止","place":"黄州城","lt":"famous","basis":"咸平二年王禹偁贬黄州团练副使，于城西北建竹楼作记","type":"记文","full":"黄冈之地多竹，大者如椽。竹工破之，刳去其节，用代陶瓦。比屋皆然，以其价廉而工省也。\n予城西北隅，雉堞圮毁，蓁莽荒秽，因作小楼二间，与月波楼通。远吞山光，平挹江濑，幽阒辽夐，不可具状。夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。宜鼓琴，琴调和畅；宜咏诗，诗韵清绝；宜围棋，子声丁丁然；宜投壶，矢声铮铮然。皆竹楼之所助也。\n公退之暇，被鹤氅衣，戴华阳巾，手执《周易》一卷，焚香默坐，消遣世虑。江山之外，第见风帆沙鸟，烟云竹树而已。待其酒力醒，茶烟歇，送夕阳，迎素月，亦谪居之胜槩也。\n彼齐云、落星，高则高矣；井干、丽谯，华则华矣，止于贮妓女，藏歌舞，非骚人之事，吾所不取。\n吾闻竹工云：“竹之为瓦，仅十稔；若重复之，得二十稔。”噫！吾以至道乙未岁，自翰林出滁上，丙申，移广陵；丁酉，又入西掖；戊戌岁除日，有齐安之命；己亥闰三月到郡。四年之间，奔走不暇；未知明年又在何处，岂惧竹楼之易朽乎？幸后之人，与我同志，嗣而葺之，庶斯楼之不朽也！\n咸平二年八月十五日记。"},{"t":"后赤壁赋","a":"苏轼","d":"—","g":"课外/补充-古文观止","place":"黄州赤壁（赤鼻矶）","lt":"famous","basis":"元丰五年苏轼两游黄州赤壁，前赋秋声后赋冬景","type":"赋","full":"是岁十月之望,步自雪堂,将归于临皋。二客从予,过黄泥之坂。霜露既降,木叶尽脱。人影在地,仰见明月。顾而乐之,行歌相答。已而叹曰:\"有客无酒,有酒无肴。月白风清,如此良夜何?\"客曰:\"今者薄暮,举网得鱼,巨口细鳞,状如松江之鲈。顾安所得酒乎?\"归而谋诸妇。妇曰:\"我有斗酒,藏之久矣,以待子不时之需。\"于是携酒与鱼,复游于赤壁之下。江流有声,断岸千尺。山高月小,水落石出。曾日月之几何,而江山不可复识矣。\n予乃摄衣而上,履巉岩,披蒙茸,踞虎豹,登虬龙,攀栖鹘之危巢,俯冯夷之幽宫,盖二客不能从焉。划然长啸,草木震动,山鸣谷应,风起水涌。予亦悄然而悲,肃然而恐,凛乎其不可留也。反而登舟,放乎中流,听其所止而休焉。\n时夜将半,四顾寂寥。适有孤鹤,横江东来。翅如车轮,玄裳缟衣,戛然长鸣,掠予舟而西也。须臾客去,予亦就睡。梦一道士,羽衣蹁跹,过临皋之下,揖予而言曰:\"赤壁之游乐乎?\"问其姓名,俛而不答。\"呜呼!噫嘻!我知之矣。畴昔之夜,飞鸣而过我者,非子也耶?\"道士顾笑,予亦惊寤。开户视之,不见其处。"}]},{"prov":"湖北","name":"咸宁市","d":"M662.2 493.8 L657.1 493.2 L655.5 489.5 L652.3 487.9 L651.6 4 ；而晨览夕披，疲役于此，义不能振，机不能乘，则与六博投琼、耽酒渔色也，又何以异哉？夫人心一有所倚，则圣贤之训典，足以锢志气于寻行数墨之中，得纤曲而忘大义，迷影迹而失微言，且为大惑之资也，况百家小道，取青妃白之区区者乎？\n呜呼！岂徒元帝之不仁，而读书止以导淫哉？宋末胡元之世，名为儒者，与闻格物之正训，而不念格之也将以何为。数《五经》、《语》、《孟》文字之多少而总记之，辨章句合离呼应之形声而比拟之，饱食终日，以役役于无益之较订，而发为文章，侈筋脉排偶以为工，于身心何与耶？于伦物何与耶？于政教何与耶？自以为密而傲人之疏，自以为专而傲人之散，自以为勤而傲人之惰。若此者，非色取不疑之不仁、好行小慧之不知哉？其穷也，以教而锢人之子弟；其达也，以执而误人之国家；则亦与元帝之兵临城下而讲《老子》，黄潜善之虏骑渡江而参圆悟者奚别哉？抑与萧宝卷、陈叔宝之酣歌恒舞，白刃垂头而不觉者，又奚别哉？故程子斥谢上蔡之玩物丧志，有所玩者，未有不丧者也。梁元、隋炀、陈后主、宋徽宗皆读书者也，宋末胡元之小儒亦读书者也，其迷均也。\n或曰：“读先圣先儒之书，非雕虫之比，固不失为君子也。”夫先圣先儒之书，岂浮屠氏之言，书写读诵而有功德者乎？读其书，察其迹，析其字句，遂自命为君子，无怪乎为良知之说者起而斥之也。乃为良知之说，迷于其所谓良知，以刻画而仿佛者，其害尤烈也。\n夫读书将以何为哉？辨其大义，以立修己治人之体也；察其微言，以善精义入神之用也。乃善读者有得于心而正之以书者鲜矣，下此而如太子弘之读《春秋》而不忍卒读者鲜矣，下此而如穆姜之于《易》，能自反而知愧者鲜矣。不规其大，不研其精，不审其时，且有如汉儒之以《公羊》废大伦，王莽之以讥二名待匈奴，王安石以国服赋青苗者，经且为蠹。而史尤勿论已。读汉高之诛韩、彭而乱萌消，则杀亲贤者益其忮毒；读光武之易太子而国本定，则丧元良者启其偏私；读张良之辟谷以全身，则炉火彼家之术进；读丙吉之杀人而不问，则怠荒废事之陋成。无高明之量以持其大体，无斟酌之权以审于独知，则读书万卷，止以导迷，顾不如不学无术者之尚全其朴也。\n故子曰：“吾十有五而志于学。”志定而学乃益，未闻无志而以学为志者也。以学而游移其志，异端邪说，流俗之传闻，淫曼之小慧，大以蚀其心思，而小以荒其日月，元帝所为至死而不悟者也。恶得不归咎于万卷之涉猎乎？儒者之徒，而效其卑陋，可勿警哉？"}]},{"prov":"湖南","name":"邵阳市","d":"M606.3 563.7 L607.9 558.7 L609.1 561.6 L610.8 561.1 L611.7 554.0 L614.8 554.3 L617.7 549.9 L620.6 552.7 L623.4 551.0 L623.0 545.7 L615.1 539.1 L611.8 541.1 L605.9 538.5 L603.0 540.4 L601.0 539.7 L600.0 545.7 L593.5 549.0 L591.1 554.0 L591.5 557.1 L587.7 558.6 L588.1 561.6 L590.5 563.4 L589.8 566.8 L591.9 567.3 L591.4 569.6 L593.5 569.3 L594.5 571.4 L600.0 564.2 L604.9 565.7 L606.3 563.7 Z","v":1,"fd":"待定","texts":[{"t":"\"人之心事，多欲则忧，寡欲则乐\"","a":"金缨","d":"清","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《格言联璧》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"人之心事，多欲则忧，寡欲则乐"}]},{"prov":"湖南","name":"岳阳市","d":"M627.0 502.4 L630.0 506.5 L633.1 507.0 L632.8 508.9 L636.7 509.7 L636.7 512.1 L630.4 518.3 L631.4 521.4 L633.2 520.3 L633.4 522.0 L634.8 521.1 L640.3 522.8 L641.6 519.1 L644.6 519.6 L649.0 523.8 L655.6 520.6 L656.2 515.9 L652.9 511.7 L648.7 511.0 L648.8 508.1 L647.5 507.7 L649.8 503.9 L647.9 502.7 L649.6 501.1 L648.4 499.3 L646.4  L652.9 567.0 L649.5 569.8 L647.4 560.8 L644.2 559.1 L644.7 555.7 L640.2 554.5 L641.5 561.3 L638.4 567.3 L634.5 566.8 L632.4 568.7 L631.5 566.3 L630.3 567.9 L628.2 566.6 L625.7 568.3 L627.4 569.1 L626.2 572.6 L627.7 572.4 L628.2 575.6 L625.9 576.3 L625.9 579.0 L627.9 579.5 L629.3 582.7 L627.8 586.2 Z","v":1,"fd":"待定","texts":[{"t":"鹊桥仙","a":"秦观","d":"北宋","g":"高中必修上","place":"七夕银河","lt":"write","basis":"写作地郴州（今湖南郴州），秦观贬郴州时作，从写作地匹配","type":"词","full":"纤云弄巧，飞星传恨，银汉迢迢暗度。金风玉露一相逢，便胜却人间无数。\n柔情似水，佳期如梦，忍顾鹊桥归路。两情若是久长时，又岂在朝朝暮暮。"}]},{"prov":"湖南","name":"永州市","d":"M627.8 586.2 L629.3 582.7 L625.8 578.3 L625.9 576.3 L628.2 575.6 L628.2 573.3 L626.2 572.6 L627.4 569.1 L625.7 568.5 L624.3 563.1 L625.9 560.3 L624.3 560.8 L623.8 558.0 L622.1 559.1 L620.0 555.2 L611.7 554.0 L610.8 561.1 L609.1 561.6 L607.9 558.7 L606.2 564.0 L610.8 565.7 L609.2 571.5 L610.2 573.2 L614.0 573.1 L611.1 576.1 L610.8 581.5 L606.2 586.7 L605.9 591.6 L610.5 587.0 L612.5 587.5 L613.0 596.0 L615.1 596.9 L617.4 594.0 L622.4 595.0 L624.7 592.6 L625.0 586.4 L627.8 586.2 Z","v":1,"fd":"待定","texts":[{"t":"小石潭记","a":"柳宗元","d":"唐","g":"初中八年级下","place":"永州小石潭","lt":"write","basis":"写作地永州（今湖南永州），柳宗元贬永州时作，从写作地匹配","type":"文言文","full":"从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。\n潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。\n潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。\n坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。"},{"t":"种树郭橐驼传","a":"柳宗元","d":"唐","g":"高中选择性必修下","place":"长安城郊","lt":"write","basis":"写作地永州（今湖南永州），柳宗元贬永州作，从写作地匹配","type":"文言文","full":"郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。驼闻之，曰：“甚善。名我固当。”因舍其名，亦自谓橐驼云。\n其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活，且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。\n有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然，根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤，旦视而暮抚，已去而复顾，甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之，故不我若也。吾又何能为哉！”\n问者曰：“以子之道，移之官理，可乎？”驼曰：“我知种树而已，理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？”\n问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒也。"},{"t":"江雪","a":"柳宗元","d":"唐","g":"小学二年级上","place":"湘江雪景孤舟渔翁","lt":"write","basis":"写作地永州（今湖南永州），柳宗元贬永州作《江雪》，从写作地匹配","type":"古诗","full":"千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。"},{"t":"捕蛇者说","a":"柳宗元","d":"—","g":"课外/补充-古文观止","place":"永州郊外","lt":"famous","basis":"柳宗元永贞革新失败贬永州司马时作，柳子庙在今永州","type":"杂文","full":"永州之野产异蛇，黑质而白章，触草木，尽死；以啮人，无御之者。然得而腊之以为饵，可以已大风、挛踠、瘘、疠，去死肌，杀三虫。其始，太医以王命聚之，岁赋其二。募有能捕之者，当其租入。永之人争奔走焉。\n有蒋氏者，专其利三世矣。问之，则曰：吾祖死于是，吾父死于是，今吾嗣为之十二年，几死者数矣。言之，貌若甚戚者。余悲之，且曰：若毒之乎？余将告于莅事者，更若役，复若赋，则何如？蒋氏大戚，汪然出涕曰：君将哀而生之乎？则吾斯役之不幸，未若复吾赋不幸之甚也。向吾不为斯役，则久已病矣。自吾氏三世居是乡，积于今六十岁矣，而乡邻之生日蹙，殚其地之出，竭其庐之入，号呼而转徙，饥渴而顿踣，触风雨，犯寒暑，呼嘘毒疠，往往而死者相藉也。曩与吾祖居者，今其室十无一焉；与吾父居者，今其室十无二三焉；与吾居十二年者，今其室十无四五焉，非死即徙尔。而吾以捕蛇独存。悍吏之来吾乡，叫嚣乎东西，隳突乎南北，哗然而骇者，虽鸡狗不得宁焉。吾恂恂而起，视其缶，而吾蛇尚存，则弛然而卧。谨食之，时而献焉。退而甘食其土之有，以尽吾齿。盖一岁之犯死者二焉，其余则熙熙而乐，岂若吾乡邻之旦旦有是哉！今虽死乎此，比吾乡邻之死，则已后矣，又安敢毒耶！\n余闻而愈悲。孔子曰：苛政猛于虎也！吾尝疑乎是，今以蒋氏观之，犹信。呜呼！孰知赋敛之毒，有甚是蛇者乎！故为之说，以俟夫观人风者得焉。"},{"t":"愚溪诗序","a":"柳宗元","d":"—","g":"课外/补充-古文观止","place":"永州冉溪（改名愚溪）","lt":"famous","basis":"柳宗元寓永州冉溪自号愚溪，愚溪在今永州零陵","type":"序文","full":"灌水之阳有溪焉，东流入于潇水。或曰：冉氏尝居也，故姓是溪为冉溪。或曰：可以染也，名之以其能，故谓之染溪。予以愚触罪，谪潇水上，爱是溪，入二三里，得其尤绝者家焉。古有愚公谷，今予家是溪，而名莫能定，土之居者犹龂龂然，不可以不更也，故更之为愚溪。\n愚溪之上，买小丘，为愚丘。自愚丘东北行六十步，得泉焉，又买居之，为愚泉。愚泉凡六穴，皆出山下平地，盖上出也。合流屈曲而南，为愚沟。遂负土累石，塞其隘，为愚池。愚池之东为愚堂，其南为愚亭。池之中为愚岛。嘉木异石错置，皆山水之奇者，以予故，咸以愚辱焉。\n夫水，智者乐也。今是溪独见辱于愚，何哉？盖其流甚下，不可以灌溉；又峻急，多坻石，大舟不可入也。幽邃浅狭，蛟龙不屑，不能兴云雨，无以利世，而适类于予，然则虽辱而愚之，可也。宁武子邦无道则愚，智而为愚者也；颜子终日不违如愚，睿而为愚者也，皆不得为真愚。今予遭有道，而违于理，悖于事，故凡为愚者，莫我若也。夫然，则天下莫能争是溪，予得专而名焉。\n溪虽莫利于世，而善鉴万类，清莹秀澈，锵鸣金石，能使愚者喜笑眷慕，乐而不能去也。予虽不合于俗，亦颇以文墨自慰，漱涤万物，牢笼百态，而无所避之。以愚辞歌愚溪，则茫然而不违，昏然而同归，超鸿蒙，混希夷，寂寥而莫我知也。于是作《八愚诗》，纪于溪石上。"},{"t":"钴鉧潭西小丘记","a":"柳宗元","d":"—","g":"课外/补充-古文观止","place":"永州西山","lt":"famous","basis":"永州八记之三，西山钴鉧潭在今永州零陵区柳子街","type":"游记","full":"得西山后八日，寻山口西北道二百步，又得钴鉧潭。潭西二十五步，当湍而浚者为鱼梁。梁之上有丘焉，生竹树。其石之突怒偃蹇，负土而出，争为奇状者，殆不可数。其嵚然相累而下者，若牛马之饮于溪；其冲然角列而上者，若熊罴之登于山。\n丘之小不能一亩，可以笼而有之。问其主，曰：“唐氏之弃地，货而不售。”问其价，曰：“止四百。”余怜而售之。李深源、元克己时同游，皆大喜，出自意外。即更取器用，铲刈秽草，伐去恶木，烈火而焚之。嘉木立，美竹露，奇石显。由其中以望，则山之高，云之浮，溪之流，鸟兽之遨游，举熙熙然回巧献技，以效兹丘之下。枕席而卧，则清泠之状与目谋，瀯瀯之声与耳谋，悠然而虚者与神谋，渊然而静者与心谋。不匝旬而得异地者二，虽古好事之士，或未能至焉。\n噫！以兹丘之胜，致之沣、镐、鄠、杜，则贵游之士争买者，日增千金而愈不可得。今弃是州也，农夫渔父过而陋之，价四百，连岁不能售。而我与深源、克己独喜得之，是其果有遭乎！书于石，所以贺兹丘之遭也。"}]},{"prov":"湖南","name":"怀化市","d":"M581.1 537.3 L581.8 540.4 L579.2 543.1 L576.7 542.6 L571.2 549.7 L572.5 551.3 L575.8 549.0 L577.1 550.0 L578.4 548.3 L582.0 548.7 L583.3 552.3 L581.4 553.9 L583.9 555.9 L579.0 557.1 L581.0 560.2 L578.8 564.3 L579.9 565.5 L581.9 564.5 L581.7 569.6 L585.7 570.3 L585.3 572.9 L586.8 573.2 L590.6 563.9 L588.1 561.6 L587.7 558.6 L591.5 557.1 L591.1 554.0 L593.5 549.0 L600.0 545.7 L601.0 539.7 L603.9 539.8 L602.5 535.9 L605.8 533.6 L606.5 531.1 L604.1 531.7 L603.9 527.9 L601.8 526.1 L607.4 521.7 L605.1 520.0 L608.0 517.5 L604.8 511.9 L602.6 514.4 L599.2 512.7 L592.0 523.2 L594.2 527.9 L592.1 532.1 L590.7 533.7 L586.1 531.5 L584.8 535.1 L581.1 537.3 Z","v":1,"fd":"待定","texts":[{"t":"\"濂洛关闽，皆从砥节砺行中出\"","a":"金缨","d":"清","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《格言联璧》真实条目按覆盖补缺分配（此为文化渊源补缺）。清·金缨《格言联璧》名句，无地理属性，按覆盖补缺分配","type":"清言格言","full":"濂洛关闽，皆从砥节砺行中出"}]},{"prov":"湖南","name":"娄底市","d":"M623.5 547.3 L624.6 545.0 L625.6 546.2 L630.3 543.0 L628.8 541.1 L626.9 541.7 L626.6 537.6 L622.8 538.2 L624.1 536.8 L620.5 531.5 L614.9 532.4 L613.8 528.0 L611.2 527.4 L607.5 532.0 L605.9 531.4 L605.0 534.6 L602.9 534.7 L604.1 538.6 L610.1 541.1 L615.1 539.1 L623.5 547.3 Z","v":1,"fd":"待定","texts":[{"t":"\"深山毕竟藏猛虎，大海终须纳细流\"","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）。蒙学格言，无地理属性，按覆盖补缺分配","type":"蒙学格言","full":"深山毕竟藏猛虎，大海终须纳细流"}]},{"prov":"湖南","name":"湘西土家族苗族自治州","d":"M581.1 537.3 L584.8 535.1 L586.1 531.5 L590.7 533.7 L592.1 532.1 L594.2 527.9 L592.0 523.2 L596.6 515.2 L595.2 510.8 L591.7 509.6 L591.9 506.6 L589.3 506.3 L589.2 504.0 L587.6 505.4 L586.7 500.8 L584.1 500.3 L581.3 502.3 L578.1 510.4 L579.6 511.8 L578.2 515.2 L579.2 517.5 L577.4 519.9 L579.6 520.7 L578.7 525.4 L580.8 526.7 L579.3 532.7 L581.1 537.3 Z","v":1,"fd":"2026.10","texts":[{"t":"'公道世间唯白发，贵人头上不曾饶'","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"蒙学格言","full":"'公道世间唯白发，贵人头上不曾饶'"}]},{"prov":"广东","name":"广州市","d":"M643.7 633.0 L648.2 638.0 L649.6 637.6 L646.2 627.9 L651.2 626.4 L652.1 622.0 L653.7 622.9 L653.4 619.5 L650.8 616.3 L654.7 613.6 L653.9 610.6 L649.2 612.0 L647.3 615.8 L643.9 614.5 L640.9 618.7 L637.3 620.0 L638.6 623.8 L640.7 623.4 L640.7 627.2 L643.7 633.0 Z","v":1,"fd":"2023.03","texts":[{"t":"与妻书","a":"林觉民","d":"清","g":"高中必修下","place":"广州起义前绝笔","lt":"desc","basis":"写于香港（特别行政区，不在333地级清单内），文中为广州黄花岗起义前绝笔，按描写地广州匹配","type":"文言文","full":"意映卿卿如晤：吾今以此书与汝永别矣！吾作此书时，尚是世中一人；汝看此书时，吾已成为阴间一鬼。吾作此书，泪珠和笔墨齐下，不能竟书而欲搁笔。又恐汝不察吾衷，谓吾忍舍汝而死，谓吾不知汝之不欲吾死也，故遂忍悲为汝言之。\n吾至爱汝！即此爱汝一念，使吾勇于就死也！吾自遇汝以来，常愿天下有情人都成眷属，然遍地腥云，满街狼犬，称心快意，几家能彀？司马春衫，吾不能学太上之忘情也。语云，仁者“老吾老以及人之老，幼吾幼以及人之幼”。吾充吾爱汝之心，助天下人爱其所爱，所以敢先汝而死，不顾汝也。汝体吾此心，于啼泣之余，亦以天下人为念，当亦乐牺牲吾身与汝身之福利，为天下人谋永福也。汝其勿悲。\n汝忆否？四五年前某夕，吾尝语曰：“与使吾先死也，无宁汝先吾而死。”汝初闻言而怒，后经吾婉解，虽不谓吾言为是，而亦无辞相答。吾之意盖谓以汝之弱，必不能禁失吾之悲，吾先死留苦与汝，吾心不忍，故宁请汝先死，吾担悲也。嗟夫，谁知吾卒先汝而死乎！\n吾真真不能忘汝也！回忆后街之屋，入门穿廊，过前后厅，又三四折有小厅，厅旁一室为吾与汝双栖之所。初婚三四个月，适冬之望日前后，窗外疏梅筛月影，依稀掩映，吾与汝并肩携手，低低切切，何事不语，何情不诉！及今思之，空余泪痕！又回忆六七年前，吾之逃家复归也，汝泣告我：“望今后有远行，必以告妾，妾愿随君行。”吾亦既许汝矣。前十余日回家，即欲乘便以此行之事语汝，及与汝相对，又不能启口；且以汝之有身也，更恐不胜悲，故惟日日呼酒买醉。嗟夫！当时余心之悲，盖不能以寸管形容之。\n吾诚愿与汝相守以死。第以今日事势观之，天灾可以死，盗贼可以死，瓜分之日可以死，奸官污吏虐民可以死，吾辈处今日之中国，国中无地无时不可以死！到那时使吾眼睁睁看汝死，或使汝眼睁睁看我死，吾能之乎！抑汝能之乎！即可不死，而离散不相见，徒使两地眼成穿而骨化石，试问古来几曾见破镜能重圆，则较死为苦也。将奈之何？今日吾与汝幸双健；天下人人不当死而死，与不愿离而离者，不可数计；钟情如我辈者，能忍之乎？此吾所以敢率性就死不顾汝也！吾今死无余憾，国事成不成，自有同志者在。依新已五岁，转眼成人，汝其善抚之，使之肖我。汝腹中之物，吾疑其女也，女必像汝，吾心甚慰；或又是男，则亦教其以父志为志，则我死后，尚有二意洞在也，甚幸甚幸！吾家后日当甚贫，贫无所苦，清静过日而已。\n吾今与汝无言矣。吾居九泉之下遥闻汝哭声，当哭相和也。吾平日不信有鬼，今则又望其真有。今是人又言心电感应有道，吾亦望其言是实，则吾之死，吾灵尚依依旁汝也，汝不必以无侣悲。\n吾平生未尝以吾所志语汝，是吾不是处；然语之，又恐汝日日为吾担忧。吾牺牲百死而不辞，而使汝担忧，的的非吾所忍。吾爱汝至，所以为汝谋者惟恐未尽。汝幸而偶我，又何不幸而生今日中国！吾幸而得汝，又何不幸而生今日之中国！卒不忍独善其身。嗟夫！巾短情长，所未尽者，尚有万千，汝可以模拟得之。吾今不能见汝矣！汝不能舍吾，其时时于梦中得我乎？一恸。辛未三月廿六夜四鼓，意洞手书。\n家中诸母皆通文，有不解处，望请其指教，当尽吾意为幸。"},{"t":"七律·和郭沫若同志","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"孙悟空三打白骨精","lt":"famous","basis":"1961年11月17日在广州读郭诗《看孙悟空三打白骨精》后和作","type":"七律","full":"一从大地起风雷，便有精生白骨堆。僧是愚氓犹可训，妖为鬼蜮必成灾。金猴奋起千钧棒，玉宇澄清万里埃。今日欢呼孙大圣，只缘妖雾又重来。"},{"t":"卜算子·咏梅","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"雪里梅花","lt":"famous","basis":"1961年12月在广州“读陆游咏梅词，反其意而用之”","type":"词","full":"风雨送春归，飞雪迎春到。已是悬崖百丈冰，犹有花枝俏。\n俏也不争春，只把春来报。待到山花烂漫时，她在丛中笑。"}]},{"prov":"广东","name":"韶关市","d":"M650.6 611.2 L657.9 610.1 L659.3 611.5 L663.1 606.1 L662.5 604.5 L661.3 607.1 L658.9 606.8 L657.6 601.1 L658.6 598.2 L656.4 596.0 L659.0 594.8 L660.4 590.5 L665.4 587.6 L665.5 584.6 L662.3 581.9 L654.4 585.1 L653.1 581.2 L650.8 583.6 L647.2 584.0 L641.7 580.0 L636.7 584.1 L635.5 583.5 L635.8 585.1 L638.4 586.1 L638.2 592.7 L636.1 597.8 L638.9 600.2 L647.2 599.3 L650.0 600.9 L652.6 605.5 L649.3 609.4 L650.6 611.2 Z","v":1,"fd":"待定","texts":[{"t":"六祖能禅师碑铭","a":"王维","d":"唐","g":"课外/补充-覆盖平衡新增","place":"南华寺","lt":"famous","basis":"唐·王维《六祖能禅师碑铭》记六祖慧能韶州南华寺事，据《王右丞集笺注》","type":"古文","full":"无有可舍，是达有源；无空可住，是知空本。离寂非动，乘化用常，在百法而无得，周万物而不殆。鼓枻海师，不知菩提之行；散花天女，能变声闻之身。则知法本不生，因心起见，见无可取，法则常如。世之至人，有证于此。得无漏不尽漏，度有为非无为者，其惟我曹溪禅师乎！禅师俗姓卢氏，某郡某县人也。名是虚假，不生族姓之家；法无中边，不居华夏之地。善习表于儿戏，利根发于童心。不私其身，臭味于耕桑之侣；苟适其道，膻行于蛮貊之乡。年若干，事黄梅忍大师。愿竭其力，即安于井臼；素刳其心，获悟于稊稗。每大师登座，学众盈庭，中有三乘之根，共听一音之法，禅师默然受教，曾不起予；退省其私，回超无我。其有犹怀渴鹿之想，尚求飞鸟之迹，香饭未消，弊衣仍覆。皆曰升堂入室，测海窥天，谓得黄帝之珠，堪受法王之印。大师心知独得，谦而不鸣。天何言哉，圣与仁岂敢；子曰赐也，吾与汝弗如。临终，遂密授以祖师袈裟，而谓之曰：“物忌独贤，人恶出已。吾且死矣，汝其行乎！”禅师遂怀宝迷邦，销声异域。众生为净土，杂居止于编人；世事是度门，混农商于劳侣。如此积十六载，南海有印宗法师讲《涅槃经》，禅师听于座下，因问大义，质以真乘。既不能酬，翻从请益，乃叹曰：“化身菩萨，在此色身。肉眼凡夫，愿开慧眼。”遂领其（一作徒）属，尽诣禅居，奉为挂衣，亲自削发。于是大兴法雨，普洒客尘，乃教人以忍曰：“忍者无生，方得无我。始成于初发心，以为教首；至于定无所入，慧无所依。大身过于十方，本觉超于三世。根尘不灭，非色灭空，行愿无成，既凡成圣。举足下足，长在道场，是心是情，同归性海。”商人告倦，自息化城；穷子无疑，直开宝藏。其有不植德本，难入顿门，妄系空花之狂，曾非慧日之咎。常叹曰：“七宝布施，等恒河沙；亿劫修行，尽大地墨。不如无为之运，无碍之慈，宏济四生，大庇三有。”既而道德遍覆，名声普闻。泉馆卉服之人，去圣历劫；涂身穿耳之国，航海穷年。皆愿拭目于龙象之姿，忘身于鲸鲵之口；骈立于户外，趺坐于床前。林是栴檀，更无杂树；花惟薝葡，不嗅余香。皆以实归，多离妄执。九重延想，万里驰诚，思布发以奉迎，愿叉手而作礼。则天太后、孝和皇帝并敕书劝谕，徵赴京城。禅师子牟之心，敢忘凤阙；远公之足，不过虎溪。固以此辞。竟不奉诏，遂送百衲袈裟，及钱帛等供养。天王厚礼，献玉衣于幻人；女后宿因，施金钱于化佛。尚德贵物，异代同符。至某载月日，忽谓门人曰：“吾将行矣。”俄而异香满室，白虹属地，饭食讫而敷坐，沐浴毕而更衣。弹指不留，水流灯焰，金身永谢，薪尽火灭。山崩川竭，鸟哭猿啼，诸人唱言，人无眼目，列郡恸哭，世且空虚。某月日，迁神于曹溪，安坐于某所。择吉祥之地，不待青鸟；变功德之林，皆成白鹤。呜呼！大师至性淳一，天姿贞素，百福成相，众妙会心。经行宴息，皆在正受；谭笑语言，曾无戏论。故能五天重迹，百越稽首。修蛇雄虺，毒螫之气销；跳殳弯弓，猜悍之风变。畋渔悉罢，蛊毒知非。多绝膻腥，效桑门之食；悉弃罟网，袭稻田之衣。永惟浮图之法，实助皇王之化。弟子曰神会，遇师于晚景，闻道于中年，广量出于凡心，利智踰于宿学。虽末后供，乐最上乘。先师所明，有类献珠之顾；世人未识，犹多抱玉之悲。谓余知道，以颂见托。偈曰：\n五蕴本空，六尘非有。众生倒计，不知正受。莲花承足，杨枝生肘。苟离身心，孰为休咎？（其一）\n至人达观，与佛齐功。无心舍有，何处依空？不著三界，徒劳八风，以兹利智，遂与宗通。（其二）\n愍彼偏方，不闻正法。俯同恶类，将兴善业。教忍断嗔，修慈舍猎。世界一花，祖宗六叶。（其三）\n大开宝藏，明示衣珠。本源常在，妄辙遂殊。过动不动，离俱不俱。吾道如是，道岂非吾？（其四）\n道遍四生，常依六趣。有漏圣智，无义章句。六十二种，一百八喻。悉无所得，应如是住。（其五）"}]},{"prov":"广东","name":"深圳市","d":"M657.4 632.3 L656.5 635.3 L651.2 631.9 L649.8 634.1 L651.8 639.3 L660.0 636.3 L661.5 639.4 L663.4 638.7 L663.3 635.3 L660.6 635.2 L660.1 632.9 L657.4 632.3 Z","v":1,"fd":"2025.01","texts":[{"t":"'国清才子贵，家富小儿骄'","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"蒙学格言","full":"'国清才子贵，家富小儿骄'"}]},{"prov":"广东","name":"珠海市","d":"M642.0 640.4 L640.5 640.2 L639.3 645.5 L642.1 650.5 L646.8 646.6 L648.5 639.6 L645.7 640.1 L644.7 644.1 L642.0 640.4 Z","v":1,"fd":"待定","texts":[{"t":"'君子坦荡荡，小人长戚戚'","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"蒙学格言","full":"'君子坦荡荡，小人长戚戚'"}]},{"prov":"广东","name":"汕头市","d":"M694.2 626.6 L698.3 624.6 L699.7 616.7 L696.7 617.1 L696.5 620.2 L694.6 619.7 L694.4 621.3 L693.1 619.0 L690.5 620.0 L689.3 625.9 L691.4 627.9 L694.2 626.6 Z","v":1,"fd":"2025.01","texts":[{"t":"\"少壮不努力，老大徒伤悲\"","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"蒙学格言","full":"少壮不努力，老大徒伤悲"}]},{"prov":"广东","name":"佛山市","d":"M637.5 619.7 L635.1 617.7 L634.5 621.5 L636.0 621.9 L634.1 624.7 L635.2 628.4 L628.2 633.1 L628.6 635.0 L630.3 633.9 L630.7 635.6 也有思，其哭也有怀，凡出乎口而为声者，其皆有弗平者乎！\n乐也者，郁于中而泄于外者也，择其善鸣者而假之鸣。金、石、丝、竹、匏、土、革、木八者，物之善鸣者也。维天之于时也亦然，择其善鸣者而假之鸣。是故以鸟鸣春，以雷鸣夏，以虫鸣秋，以风鸣冬。四时之相推敔，其必有不得其平者乎？其于人也亦然，人声之精者为言，文辞之于言，又其精也，尤择其善鸣者而假之鸣。\n其在唐虞，咎陶禹，其善鸣者也，而假以鸣；夔弗能以文辞鸣，又自假于《韶》以鸣。夏之时，五子以其歌鸣；伊尹鸣殷，周公鸣周。凡载于《诗》《书》六艺，皆鸣之善者也。周之衰，孔子之徒鸣之，其声大而远。传曰：“天将以夫子为木铎。”其弗信矣乎！其末也，庄周以其荒唐之辞鸣。楚，大国也，其亡也，以屈原鸣。臧孙辰、孟轲、荀卿，以道鸣者也。杨朱、墨翟、管夷吾、晏婴、老聃、申不害、韩非、慎到、田骈、邹衍、尸佼、孙武、张仪、苏秦之属，皆以其术鸣。秦之兴，李斯鸣之。汉之时，司马迁、相如、扬雄，最其善鸣者也。其下魏晋氏，鸣者不及于古，然亦未尝绝也。就其善者，其声清以浮，其节数以急，其辞淫以哀，其志弛以肆；其为言也，乱杂而无章。将天丑其德莫之顾邪？何为乎不鸣其善鸣者也？\n唐之有天下，陈子昂、苏源明、元结、李白、杜甫、李观，皆以其所能鸣。其存而在下者，孟郊东野始以其诗鸣。其高出魏晋，不懈而及于古，其他浸淫乎汉氏矣。从吾游者，李翱、张籍其尤也。三子者之鸣信善矣。抑不知天将和其声而使鸣国家之盛邪？抑将穷饿其身，思愁其心肠，而使自鸣其不幸邪？三子者之命，则悬乎天矣。其在上也奚以喜？其在下也奚以悲？东野之役于江南也，有若不释然者，故吾道其命于天者以解之。"}]},{"prov":"广东","name":"潮州市","d":"M699.9 618.4 L704.3 617.8 L700.7 612.0 L701.2 605.8 L699.9 604.8 L693.3 611.8 L693.3 614.1 L691.3 614.5 L695.4 620.3 L698.6 616.1 L699.9 618.4 Z","v":1,"fd":"2025.01","texts":[{"t":"辟佛累千言，雪冷蓝关，从此儒风开海峤；到官才八月，潮平鳄渚，于今香火遍瀛洲。","a":"【不可考】","d":"—","g":"课外/补充-楹联","place":"广东潮州韩文公祠","lt":"famous","basis":"悬于潮州韩文公祠正殿石柱","type":"楹联","full":"辟佛累千言，雪冷蓝关，从此儒风开海峤；到官才八月，潮平鳄渚，于今香火遍瀛洲。"}]},{"prov":"广东","name":"揭阳市","d":"M694.2 626.6 L691.4 627.9 L689.3 625.9 L691.4 619.0 L694.4 621.3 L695.5 619.9 L690.7 613.7 L688.0 616.7 L682.8 615.9 L682.0 618.6 L679.4 618.8 L680.3 621.8 L682.6 622.1 L681.1 625.1 L684.0 626.2 L685.1 630.1 L693.4 630.0 L694.2 626.6 Z","v":1,"fd":"待定","texts":[{"t":"\"莫贪意外之财，莫饮过量之酒\"","a":"朱柏庐","d":"清","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《朱子治家格言》真实条目按覆盖补缺分配（此为文化渊源补缺）。清·朱柏庐《朱子治家格言》名句，无地理属性，按覆盖补缺分配","type":"蒙学格言","full":"莫贪意外之财，莫饮过量之酒"}]},{"prov":"广东","name":"云浮市","d":"M629.6 634.4 L628.6 635.0 L626.1 630.4 L627.0 626.3 L622.6 627.2 L616.6 625.6 L614.6 622.4 L611.8 623.0 L613.1 627.3 L611.9 630.8 L609.6 633.5 L607.1 633.8 L611.4 637.2 L610.6 638.5 L612.7 638.1 L612.9 639.7 L615.6 637.3 L617.1 638.7 L619.5 634.7 L619.2 636.4 L621.3 635.7 L621.8 638.2 L625.0 640.9 L628.7 635.1 L630.3 636.2 L629.6 634.4 Z","v":1, 而止，必须参差高下互相照应，以气势联络为上。若中高两低，后高前低，成排对列，又犯俗所谓“锦灰堆”矣。或密或疏，或进或出，全在会心者得画意乃可。\n若盆碗盘洗，用漂青松香榆皮面和油，先熬以稻灰，收成胶，以铜片按钉向上，将膏火化，粘铜片于盘碗盆洗中。俟冷，将花用铁丝扎把，插于钉上，宜偏斜取势，不可居中，更宜枝疏叶清，不可拥挤。然后加水，用碗沙少许掩铜片，使观者疑丛花生于碗底方妙。\n若以木本花果插瓶，剪裁之法（不能色色自觅，倩人攀折者每不合意），必先执在手中，横斜以观其势，反侧以取其态；相定之后，剪去杂枝，以疏瘦古怪为佳；再思其梗如何入瓶，或折或曲，插入瓶口，方免背叶侧花之患。若一枝到手，先拘定其梗之直者插瓶中，势必枝乱梗强，花侧叶背，既难取态，更无韵致矣。折梗打曲之法，锯其梗之半而嵌以砖石，则直者曲矣；如患梗倒，敲一二钉以筦之。即枫叶竹枝，乱草荆棘，均堪入选。或绿竹一竿配以枸杞数粒，几茎细草伴以荆棘两枝，苟位置得宜，另有世外之趣。若新栽花木，不妨歪斜取势，听其叶侧，一年后枝叶自能向上；如树树直栽，即难取势矣。\n至剪裁盆树，先取根露鸡爪者，左右剪成三节，然后起枝，一枝一节，七枝到顶，或九枝到顶。枝忌对节如肩臂，节忌臃肿如鹤膝；须盘旋出枝，不可光留左右，以避赤胸露背之病；又不可前后直出。有名双起三起者，一根而起两三树也。如根无爪形，便成插树，故不取。然一树剪成，至少得三四十年。余生平仅见吾乡万翁名彩章者，一生剪成数树。\n点缀盆中花石，小景可以入画，大景可以入神。一瓯清茗，神能趋入其中，方可供幽斋之玩。种水仙无灵壁石，余尝以炭之有石意者代之。黄芽菜心其白如玉，取大小五七枝，用沙土植长方盘内，以炭代石，黑白分明，颇有意思。以此类推，幽趣无穷，难以枚举。\n若夫园亭楼阁，套室回廊，叠石成山，栽花取势，又在大中见小，小中见大，虚中有实，实中有虚，或藏或露，或浅或深。不仅在“周回曲折”四字，又不在地广石多徒烦工费。或掘地堆土成山，间以块石，杂以花草，篱用梅编，墙以藤引，则无山而成山矣。大中见小者，散漫处植易长之竹，编易茂之梅以屏之；小中见大者，窄院之墙宜凹凸其形，饰以绿色，引以藤蔓，嵌大石，凿字作碑记形，推窗如临石壁，便觉峻峭无穷。虚中有实者，或山穷水尽处，一折而豁然开朗；或轩阁设厨处，一开而通别院。实中有虚者，开门于不通之院，映以竹石，如有实无也；设矮栏于墙头，如上有月台而实虚也。\n贫士屋少人多，当仿吾乡太平船后梢之位置，再加转移。其间台级为床，前后借凑，可作三榻，间以板而裱以纸，则前后上下皆越绝，譬之如行长路，即不觉其窄矣。余夫妇乔寓扬州时，曾仿此法，屋仅两椽，上下卧室、厨灶、客座皆越绝而绰然有余。芸曾笑曰：“位置虽精，终非富贵家气象也。”是诚然欤？\n余扫墓山中，检有峦纹可观之石，归与芸商曰：“用油灰叠宣州石于白石盆，取色匀也。本山黄石虽古朴，亦用油灰，则黄白相阅，凿痕毕露，将奈何？”芸曰：“择石之顽劣者，捣末于灰痕处，乘湿糁之，干或色同也。”乃如其言，用宜兴窑长方盆叠起一峰：偏于左而凸于右，背作横方纹，如云林石法，巉岩凹凸，若临江石砚状；虚一角，用河泥种千瓣白萍；石上植茑萝，俗呼云松。经营数日乃成。至深秋，茑萝蔓延满山，如藤萝之悬石壁，花开正红色，白萍亦透水大放，红白相间，神游其中，如登蓬岛。置之檐下与芸品题：此处宜设水阁，此处宜立茅亭，此处宜凿六字曰“落花流水之间”，此可以居，此可以钓，此可以眺。胸中丘壑，若将移居者然。\n一夕，猫奴争食，自檐而堕，连盆与架顷刻碎之。余叹曰：“即此小经营，尚干造物忌耶！”两人不禁泪落。\n静室焚香，闲中雅趣。芸尝以沉速等香，于饭铛蒸透，在炉上设一铜丝架，离火中寸许，徐徐烘之，其香幽韵而无烟。佛手忌醉，鼻嗅则易烂；木瓜忌出汗，汗出用水洗之；惟香圆无忌。佛手、木瓜亦有供法，不能笔宣，每有入将供妥者，随手取嗅，随手置之，即不知供法者也。\n余闲居，案头瓶花不绝。芸曰：“子之插花能备风、晴、雨、露，可谓精妙入神。而画中有草虫一法，盍仿而效之。”余曰：“虫踯躅不受制，焉能仿效？”芸曰：“有一法，恐作俑罪过耳。”余曰：“试言之。”曰：“虫死色不变，觅螳螂、蝉、蝶之属，以针刺死，用细丝扣虫项系花草间，整其足，或抱梗，或踏叶，宛然如生，不亦善乎？”余喜，如其法行之，见者无不称绝。求之闺中，今恐未必有此会心者矣。\n余与芸寄居锡山华氏，时华夫人以两女从芸识字。乡居院旷，夏日逼人，劳教其家，作活花屏法甚妙。每屏一扇，用木梢二枝约长四五寸作矮条凳式，虚其中，横四挡，宽一尺许，四角凿圆眼，插竹编方眼，屏约高六七尺，用砂盆种扁豆置屏中，盘延屏上，两人可移动。多编数屏，随意遮拦，恍如绿阴满窗，透风蔽日，纡回曲折，随时可更，故曰“活花屏”。有此一法，则一切藤本香草随地可用。此真乡居之良法也。\n友人鲁半舫名璋，字春山，善写松柏及梅菊，工隶书，兼工铁笔。余寄居其家之萧爽楼一年有半。楼共五椽，东向，余后其三，晦明风雨，可以远眺。庭中有木犀一株，清香撩人，有廊有厢，地极幽静。移居时，有一仆一媪，并挈其小女来。仆能成衣，媪能纺绩，于是芸绣、媪绩、仆则成衣，以供薪水。余素爱客，小酌必行令。芸善不费之烹庖，瓜蔬鱼虾，一经芸手，便有意外味。同人知余贫，每出杖头钱，作竟日叙。余又好洁，地无纤尘，且无拘束，不嫌放纵。时有杨补凡名昌绪，善人物写真；袁少迂名沛，工山水；王星澜名岩，工花卉翎毛，爱萧爽楼幽雅，皆携画具来。余则从之学画，写草篆，镌图章，加以润笔，交芸备茶酒供客，终日品诗论画而已。\n更有夏淡安、揖山两昆季，并缪山、慕知白两昆季，及蒋韵香、陆橘香、周啸霞、郭小愚、华杏帆、张间憨诸君子，如梁上之燕，自去自来。芸则拔钗沽酒，不动声色，良辰美景，不放轻越。今则天各一方，风流云散，兼之玉碎香埋，不堪回首矣！非所谓“当日浑闲事，而今旧怜”者乎！\n萧爽楼有四忌：谈官宦升迁、公廨时事、八股时文、看牌掷色，有犯必罚酒五觥。有四取：慷慨豪爽、风流蕴藉、落拓不羁、澄静缄默。长夏无事，考对为会，每会八人，每人各携青蚨二百。先拈阄，得第一者为东道主，关防别座，第二者为謄录，亦就座，余作举子，各于謄录处取纸一条，盖用印章。主考出五七言各一句，刻香为限，行立构思，不准交头私语，对就后投入一匣，方许就座。各人交卷毕，謄录启匣，并录一册，转呈主考，以杜徇私。十六对中取七言三联，五言三联。六联中取第一者即为后任主考，第二者为謄录。每人有两联不取者罚钱二十文，取一联者免罚十文，过限者倍罚。一场，主考得香钱百文。一日可十场，积钱千文，酒资大畅矣。惟芸议为官卷，准坐而构思。\n杨补凡为余夫妇写载花小影，神情确肖。是夜月色颇佳，兰影上粉墙，别有幽致。星澜醉后兴发曰：“补凡能为君写真，我能为花图影。”余笑曰：“花影能如人影否？”星澜取素纸铺于墙，即就兰影，用墨浓淡图之，日间取视，虽不成画，而花叶萧疏，自有月下之趣。芸甚宝之，各有题咏。\n苏城有南园、北园二处，菜花黄时，苦无酒家小饮，携盒而往，对花冷饮，殊无意味。或议就近觅饮者，或议看花归饮者，终不如对花热饮为快。众议未定，芸笑曰：“明日但各出杖头钱，我自担炉火来。”众笑曰：“诺。”\n众去，余问曰：“卿果自往乎？”芸曰：“非也。妾见市中卖馄饨者，其担锅灶无不备，盍雇之而往？妾先烹调端整，到彼处再一下锅，茶酒两便。”余曰：“酒菜固便矣，茶乏烹具。”芸曰：“携一砂罐去，以铁叉串罐柄，去其锅，悬于行灶中，加柴火煎茶，不亦便乎？”余鼓掌称善。\n街头有鲍姓者，卖馄饨为业，以百钱雇其担，约以明日午后。鲍欣然允议。明日看花者至，余告以故，众咸叹服。饭后同往，并带席垫，至南园，择柳阴下团坐。先烹茗，饮毕，然后暖酒烹肴。是时风和日丽，遍地黄金，青衫红袖，越阡度陌，蝶蜂乱飞，令人不饮自醉。既而酒肴俱熟，坐地大嚼，担者颇不俗，拉与同饮。游人见之，莫不羡为奇想。杯盘狼藉，各已陶然，或坐或卧，或歌或啸。红日将颓，余思粥，担者即为买米煮之，果腹而归。芸曰：“今日之游乐乎？”众曰：“非夫人之力不及此。”大笑而散。"}]},{"prov":"海南","name":"五指山市","d":"M585.8 709.2 L586.1 707.7 L584.0 707.8 L582.8 705.4 L579.7 707.4 L581.0 713.2 L585.6 711.4 L585.8 709.2 Z","v":0,"fd":"","texts":[]},{"prov":"海南","name":"琼海市","d":"M600.0 704.4 L601.9 698.7 L599.9 699.2 L599.0 697.0 L596.2 698.4 L595.8 701.6 L592.2 703.4 L594.3 706.5 L600.0 704.4 Z","v":0,"fd":"","texts":[]},{"prov":"海南","name":"文昌市","d":"M601.9 698.7 L607.3 693.9 L605.7 686.5 L601.2 683.5 L598.7 685.2 L601.4 689.4 L600.5 695.4 L597.8 695.7 L599.9 699.2 L601.9 698.7 Z","v":0,"fd":"","texts":[]},{"prov":"海南","name":"万宁市","d":"M592.8 706.0 L590.7 712.6 L593.7 714.2 L598.2 712.8 L600.0 704.4 L592.8 706.0 Z","v":0,"fd":"","texts":[]},{"prov":"海南","name" L488.4 467.3 L486.6 476.0 L479.3 478.2 L482.4 483.3 L480.4 488.0 L481.7 489.2 L484.4 488.2 L486.7 491.4 L492.0 486.5 L494.6 487.0 Z","v":0,"fd":"","texts":[{"t":"绝句·两个黄鹂鸣翠柳","a":"杜甫","d":"唐","g":"小学二年级下","place":"成都草堂春景","lt":"write","basis":"写作地成都（今四川成都），杜甫草堂，从写作地匹配","type":"古诗","full":"两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。"},{"t":"江畔独步寻花","a":"杜甫","d":"唐","g":"小学四年级下","place":"成都锦江江畔","lt":"write","basis":"写作地成都（今四川成都），从写作地匹配","type":"古诗","full":"黄师塔前江水东，春光懒困倚微风。桃花一簇开无主，可爱深红爱浅红。"},{"t":"蜀相","a":"杜甫","d":"唐","g":"高中选择性必修中","place":"成都武侯祠","lt":"write","basis":"写作地成都（今四川成都），杜甫居成都草堂作《蜀相》，从写作地匹配","type":"古诗","full":"丞相祠堂何处寻？锦官城外柏森森。映阶碧草自春色，隔叶黄鹂空好音。三顾频烦天下计，两朝开济老臣心。出师未捷身先死，长使英雄泪满襟。"},{"t":"春夜喜雨","a":"杜甫","d":"唐","g":"小学六年级下","place":"成都春夜喜雨","lt":"write","basis":"写作地成都（今四川成都），杜甫草堂作，从写作地匹配","type":"古诗","full":"好雨知时节，当春乃发生。随风潜入夜，润物细无声。野径云俱黑，江船火独明。晓看红湿处，花重锦官城。"},{"t":"茅屋为秋风所破歌","a":"杜甫","d":"唐","g":"初中八年级下","place":"成都茅屋秋风","lt":"write","basis":"写作地成都草堂（今四川成都），杜甫作《茅屋为秋风所破歌》，从写作地匹配","type":"古诗","full":"八月秋高风怒号，卷我屋上三重茅。茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。\n南村群童欺我老无力，忍能对面为盗贼。公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。\n俄顷风定云墨色，秋天漠漠向昏黑。布衾多年冷似铁，娇儿恶卧踏里裂。床头屋漏无干处，雨脚如麻未断绝。\n自经丧乱少睡眠，长夜沾湿何由彻！安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山！\n呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！"},{"t":"浣花溪记","a":"钟惺","d":"—","g":"课外/补充-明清古文","place":"今四川省成都市（浣花溪杜甫草堂）","lt":"famous","basis":"作者典试四川，游成都浣花溪作","type":"游记散文","full":"出成都南门，左为万里桥。西折纤秀长曲，所见如连环、如玦、如带、如规、如钩，色如鉴、如琅玕、如绿沉瓜，窈然深碧，潆回城下者，皆浣花溪委也。然必至草堂，而后浣花有专名，则以少陵浣花居在焉耳。\n行三四里为青羊宫，溪时远时近。竹柏苍然，隔岸阴森者尽溪，平望如荠。水木清华，神肤洞达。自宫以西，流汇而桥者三，相距各不半里。舁夫云通灌县，或所云江从灌口来是也。\n人家住溪左，则溪蔽不时见，稍断则复见溪。如是者数处，缚柴编竹，颇有次第。桥尽，一亭树道左，署曰缘江路。过此则武侯祠。祠前跨溪为板桥一，覆以水槛，乃睹浣花溪题榜。过桥，一小洲横斜插水间如梭，溪周之，非桥不通，置亭其上，题曰百花潭水。由此亭还度桥，过梵安寺，始为杜工部祠。像颇清古，不必求肖，想当尔尔。石刻像一，附以本传，何仁仲别驾署华阳时所为也。碑皆不堪读。\n钟子曰：杜老二居，浣花清远，东屯险奥，各不相袭。严公不死，浣溪可老，患难之于朋友大矣哉！然天遣此翁增夔门一段奇耳。穷愁奔走，犹能择胜，胸中暇整，可以应世，如孔子微服主司城贞子时也。\n时万历辛亥十月十七日，出城欲雨，顷之霁。使客游者，多由监司郡邑招饮，冠盖稠浊，磬折喧溢，迫暮趣归。是日清晨，偶然独往。楚人钟惺记。"},{"t":"能攻心则反侧自消，从古知兵非好战；不审势即宽严皆误，后来治蜀要深思。","a":"赵藩","d":"—","g":"课外/补充-楹联","place":"四川成都武侯祠","lt":"famous","basis":"悬于成都武侯祠诸葛亮殿门柱，世称攻心联","t a":"杜甫","d":"唐","g":"小学五年级下","place":"蜀地想象归乡路途","lt":"write","basis":"写作地梓州（今四川三台县，属绵阳市），杜甫流寓此处，从写作地匹配","type":"古诗","full":"剑外忽传收蓟北，初闻涕泪满衣裳。却看妻子愁何在，漫卷诗书喜欲狂。\n白日放歌须纵酒，青春作伴好还乡。即从巴峡穿巫峡，便下襄阳向洛阳。"},{"t":"梦游天姥吟留别","a":"李白","d":"唐","g":"高中必修上","place":"天姥山【梦境】","lt":"birth","basis":"作者李白故里绵州昌隆（今四川江油市，由绵阳市代管），'东鲁'泛指山东，从作者故乡匹配","type":"古诗","full":"海客谈瀛洲，烟涛微茫信难求；越人语天姥，云霞明灭或可睹。天姥连天向天横，势拔五岳掩赤城。\n天台四万八千丈，对此欲倒东南倾。我欲因之梦吴越，一夜飞度镜湖月。\n湖月照我影，送我至剡溪。谢公宿处今尚在，渌水荡漾清猿啼。脚著谢公屐，身登青云梯。\n半壁见海日，空中闻天鸡。千岩万转路不定，迷花倚石忽已暝。熊咆龙吟殷岩泉，栗深林兮惊层巅。\n云青青兮欲雨，水澹澹兮生烟。列缺霹雳，丘峦崩摧。洞天石扉，訇然中开。\n青冥浩荡不见底，日月照耀金银台。霓为衣兮风为马，云之君兮纷纷而来下。\n虎鼓瑟兮鸾回车，仙之人兮列如麻。忽魂悸以魄动，恍惊起而长嗟。惟觉时之枕席，失向来之烟霞。\n世间行乐亦如此，古来万事东流水。别君去兮何时还？且放白鹿青崖间，须行即骑访名山。\n安能摧眉折腰事权贵，使我不得开心颜！"},{"t":"蜀道难","a":"李白","d":"唐","g":"高中选择性必修中","place":"蜀道","lt":"birth","basis":"李白故乡绵州昌隆（今四川江油，由绵阳市代管），据作者故乡匹配四川绵阳市","type":"古诗","full":"噫吁嚱，危乎高哉！蜀道之难，难于上青天！蚕丛及鱼凫，开国何茫然！\n尔来四万八千岁，不与秦塞通人烟。西当太白有鸟道，可以横绝峨眉巅。\n地崩山摧壮士死，然后天梯石栈相钩连。上有六龙回日之高标，下有冲波逆折之回川。\n黄鹤之飞尚不得过，猿猱欲度愁攀援。青泥何盘盘，百步九折萦岩峦。\n扪参历井仰胁息，以手抚膺坐长叹。问君西游何时还？畏途巉岩不可攀。\n但见悲鸟号古木，雄飞雌从绕林间。又闻子规啼夜月，愁空山。蜀道之难，难于上青天，使人听此凋朱颜！\n连峰去天不盈尺，枯松倒挂倚绝壁。飞湍瀑流争喧豗，砯崖转石万壑雷。\n其险也如此，嗟尔远道之人胡为乎来哉！剑阁峥嵘而崔嵬，一夫当关，万夫莫开。\n所守或匪亲，化为狼与豺。朝避猛虎，夕避长蛇；磨牙吮血，杀人如麻。\n锦城虽云乐，不如早还家。蜀道之难，难于上青天，侧身西望长咨嗟！"},{"t":"行路难（其一）","a":"李白","d":"唐","g":"初中九年级上","place":"行路宴饮","lt":"birth","basis":"李白故乡绵州昌隆（今四川江油，由绵阳市代管），据作者故乡匹配四川绵阳市","type":"古诗","full":"金樽清酒斗十千，玉盘珍羞直万钱。停杯投箸不能食，拔剑四顾心茫然。欲渡黄河冰塞川，将登太行雪满山。闲来垂钓碧溪上，忽复乘舟梦日边。行路难，行路难，多歧路，今安在？长风破浪会有时，春来江水流。"}]},{"prov":"四川","name":"广元市","d":"M518.4 463.7 L520.9 463.2 L522.6 459.8 L524.8 462.0 L528.2 460.4 L529.0 457.8 L533.4 458.3 L535.9 450.1 L539.3 448.8 L537.9 447.8 L537.1 441.2 L533.6 442.6 L528.9 440.6 L527.3 438.0 L520.6 441.0 L518.3 436.5 L517.1 437.5 L518.2 440.4 L513.4 442.9 L505.3 441.6 L507.5 446.8 L510.7 448.1 L511.0 449.8 L515.0 448.3 L515.6 452.4 L514.0 456.3 L518.4 463.7 Z","v":0,"fd":"","texts":[{"t":"\"晴空朗月，何天不可翱翔，而飞蛾独避灯烛\"","a":"洪应明","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《菜根谭》真实条目按覆盖补缺分配（此为文化渊源补缺）。明·洪应明《 孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。\n逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢；郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许。臣之进退，实为狼狈。\n伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母孙二人，更相为命，是以区区不能废远。\n臣密今年四十有四，祖母刘今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土，实所共鉴。愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。"},{"t":"石钟山记","a":"苏轼","d":"北宋","g":"高中选择性必修下","place":"湖口石钟山","lt":"birth","basis":"苏轼眉州眉山人（今四川眉山），据作者故乡匹配四川眉山市","type":"文言文","full":"《水经》云：“彭蠡之口有石钟山焉。”郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？\n元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵澹澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！”\n事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。"},{"t":"心术","a":"苏洵","d":"—","g":"课外/补充-古文观止","place":"眉山","lt":"famous","basis":"苏洵《权书》十篇之一，作于眉山故里潓滨","type":"策论","full":"为将之道，当先治心。泰山崩于前而色不变，麋鹿兴于左而目不瞬，然后可以制利害，可以待敌。\n凡兵上义；不义，虽利勿动。非一动之为利害，而他日将有所不可措手足也。夫惟义可以怒士，士以义怒，可与百战。\n凡战之道，未战养其财，将战养其力，既战养其气，既胜养其心。谨烽燧，严斥堠，使耕者无所顾忌，所以养其财；丰犒而优游之，所以养其力；小胜益急，小挫益厉，所以养其气；用人不尽其所欲为，所以养其心。故士常蓄其怒、怀其欲而不尽。怒不尽则有余勇，欲不尽则有余贪。故虽并天下，而士不厌兵，此黄帝之所以七十战而兵不殆也。不养其心，一战而胜，不可用矣。\n凡将欲智而严，凡士欲愚。智则不可测，严则不可犯，故士皆委己而听命，夫安得不愚？夫惟士愚，而后可与之皆死。\n凡兵之动，知敌之主，知敌之将，而后可以动于险。邓艾缒兵于蜀中，非刘禅之庸，则百万之师可以坐缚，彼固有所侮而动也。故古之贤将，能以兵尝敌，而又以敌自尝，故去就可以决。\n凡主将之道，知理而后可以举兵，知势而后可以加兵，知节而后可以用兵。知理则不屈，知势则不沮，知节则不穷。见小利不动，见小患不避，小利小患不足以辱吾技也，夫然后有以支大利大患。夫惟养技而自爱者，无敌于天下。故一忍可以支百勇，一静可以制百动。\n兵有长短，敌我一也。敢问：吾之所长，吾出而用之，彼将不与吾校；吾之所短，吾蔽而置之，彼将强与吾角，奈何？曰：吾之所短，吾抗而暴之，使之疑而却；吾之所长，吾阴而养之，使之狎而堕其中。此用长短之术也。\n善用兵者，使之无所顾，有所恃。无所顾，则知死之不足惜；有所恃，则知不至于必败。尺棰当猛虎，奋呼而操击；徒手遇蜥蜴，变色而却步，人之情也。知此者，可以将矣。袒裼而案剑，则乌获不敢逼；冠胄衣甲，据兵而寝，则童子弯弓杀之矣。故善用兵者以形固。夫能以形固，则力有余矣。"}]},{"prov":"四川","name":"宜宾市","d":"M491.8 521.8 L492.9 519.0 L494.4 520.3 L502.0 519.8 L499.2 521.7 L499.9 525.8 L502.6 527.2 L502.4 529.7 L500.0 531.1 L504.5 535.0 L509.1 533.7 L512.0 530.0 L516.8 528.9 L516.2 523.6 L514.1 523.3 L514.3 514.6 L510.2 511.4 L506.7 512.6 L506.2 508.7 L503.8 509.8 L502.3 508.0 L498.3 508.0 L494.9 516.6 L491.5 516.1 L489.2 520.1 L490.9 522.8 L491.8 521.8 Z","v":0,"fd":"","texts":[{"t":"\"有关家国书常读，无益身心事莫为\"","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）。蒙学格言，无地理属性，按覆盖补缺分配","type":"蒙学格言","full":"有关家国书常读，无益身心事莫为"}]},{"prov":"四川","name":"广安市","d":"M542.4 491.6 L543.7 492.4 L546.9 488.1 L546.2 483.5 L542.5 483.6 L543.5 480.8 L538.5 477.1 L536.3 478.9 L534.7 478.0 L533.1 480.1 L530.2 479.2 L528.7 483.5 L526.2 484.5 L530.3 489.3 L535.8 487.1 L538.6 492.7 L542.4 491.6 Z","v":0,"fd":"","texts":[{"t":"\"宠辱不惊，肝木自宁；动静以敬，心火自定\"","a":"陈继儒","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）。明·陈继儒《小窗幽记》名句，无地理属性，按覆盖补缺分配","type":"清言格言","full":"宠辱不惊，肝木自宁；动静以敬，心火自定"}]},{"prov":"四川","name":"达州市","d":"M547.6 486.4 L551.0 480.8 L549.5 478.9 L550.4 477.0 L554.2 476.0 L556.3 477.9 L557.9 476.3 L560.1 469.9 L559.0 469.1 L561.6 467.3 L561.7 464.4 L567.3 461.0 L562.8 455.2 L565.8 453.1 L564.5 451.2 L566.7 450.6 L566.1 449.3 L559.7 450.1 L558.3 451.7 L554.2 448.2 L552.7 451.6 L554.9 453.2 L551.0 456.0 L550.6 462.3 L544.0 466.7 L541.8 471.6 L537.5 475.6 L542.0 479.6 L541.3 480.4 L543.5 480.8 L542.5 483.6 L545.1 484.1 L545.7 482.9 L546.3 486.5 L547.6 486.4 Z","v":0,"fd":"","texts":[{"t":"\"居轩冕之中，不可无山林的气味\"","a":"洪应明/陈继儒","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《菜根谭》/《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"居轩冕之中，不可无山林的气味"}]},{"p .5 L546.0 544.4 Z","v":0,"fd":"","texts":[{"t":"瘗旅文","a":"王守仁","d":"—","g":"课外/补充-古文观止","place":"龙场","lt":"famous","basis":"正德三年王守仁谪龙场驿丞，瘗旅途中死于道之吏子仆三人","type":"祭文","full":"维正德四年秋月三日，有吏目云自京来者，不知其名氏，携一子一仆，将之任，过龙场，投宿土苗家。予从篱落间望见之，阴雨昏黑，欲就问讯北来事，不果。明早，遣人觇之，已行矣。\n薄午，有人自蜈蚣坡来，云：“一老人死坡下，傍两人哭之哀。”予曰：“此必吏目死矣。伤哉！”薄暮，复有人来，云：“坡下死者二人，傍一人坐哭。”询其状，则其子又死矣。明日，复有人来，云：“见坡下积尸三焉。”则其仆又死矣。呜呼伤哉！\n念其暴骨无主，将二童子持畚、锸往瘗之，二童子有难色然。予曰：“噫！吾与尔犹彼也！”二童闵然涕下，请往。就其傍山麓为三坎，埋之。又以只鸡、饭三盂，嗟吁涕洟而告之，曰：\n呜呼伤哉！繄何人？繄何人？吾龙场驿丞余姚王守仁也。吾与尔皆中土之产，吾不知尔郡邑，尔乌乎来为兹山之鬼乎？古者重去其乡，游宦不逾千里。吾以窜逐而来此，宜也。尔亦何辜乎？闻尔官吏目耳，俸不能五斗，尔率妻子躬耕可有也。胡为乎以五斗而易尔七尺之躯？又不足，而益以尔子与仆乎？呜呼伤哉！\n尔诚恋兹五斗而来，则宜欣然就道，胡为乎吾昨望见尔容蹙然，盖不胜其忧者？夫冲冒霜露，扳援崖壁，行万峰之顶，饥渴劳顿，筋骨疲惫，而又瘴疠侵其外，忧郁攻其中，其能以无死乎？吾固知尔之必死，然不谓若是其速，又不谓尔子尔仆亦遽然奄忽也！皆尔自取，谓之何哉！吾念尔三骨之无依而来瘗耳，乃使吾有无穷之怆也。\n呜呼伤哉！纵不尔瘗，幽崖之狐成群，阴壑之虺如车轮，亦必能葬尔于腹，不致久暴尔。尔既已无知，然吾何能为心乎？自吾去父母乡国而来此，三年矣，历瘴毒而苟能自全，以吾未尝一日之戚戚也。今悲伤若此，是吾为尔者重，而自为者轻也。吾不宜复为尔悲矣。\n吾为尔歌，尔听之。歌曰：连峰际天兮，飞鸟不通。游子怀乡兮，莫知西东。莫知西东兮，维天则同。异域殊方兮，环海之中。达观随寓兮，莫必予宫。魂兮魂兮，无悲以恫。\n又歌以慰之曰：与尔皆乡土之离兮，蛮之人言语不相知兮。性命不可期，吾苟死于兹兮，率尔子仆，来从予兮。吾与尔遨以嬉兮，骖紫彪而乘文螭兮，登望故乡而嘘唏兮。吾苟获生归兮，尔子尔仆，尚尔随兮，无以无侣悲兮！道旁之冢累累兮，多中土之流离兮，相与呼啸而徘徊兮。餐风饮露，无尔饥兮。朝友麋鹿，暮猿与栖兮。尔安尔居兮，无为厉于兹墟兮！"},{"t":"五百年稳占鳌矶，独撑天宇，让我一层更上，茫茫眼界拓开。看东枕衡湘，西襟滇诏，南屏粤峤，北带巴夔，迢递关河，喜雄跨两游，支持那中原半壁；数千仞高凌牛渚，永镇边隅，问谁双柱重镌，茫茫劫灰销尽。溯汉通邛笮，唐辟牂牁，宋设罗甸，元改顺元，萦怀将相，从兹辟草莱，再睹其羽仪车服。漫云竹壤偏荒，难与神州争胜概。","a":"刘韫良","d":"字玉山","g":"课外/补充-楹联","place":"贵州贵阳甲秀楼","lt":"famous","basis":"悬于贵阳甲秀楼正门两侧，为甲秀楼镇楼长联","type":"楹联","full":"五百年稳占鳌矶，独撑天宇，让我一层更上，茫茫眼界拓开。看东枕衡湘，西襟滇诏，南屏粤峤，北带巴夔，迢递关河，喜雄跨两游，支持那中原半壁；数千仞高凌牛渚，永镇边隅，问谁双柱重镌，茫茫劫灰销尽。溯汉通邛笮，唐辟牂牁，宋设罗甸，元改顺元，萦怀将相，从兹辟草莱，再睹其羽仪车服。漫云竹壤偏荒，难与神州争胜概。"}]},{"prov":"贵州","name":"六盘水市","d":"M507.3 555.8 L506.0 560.5 L504.3 560.1 L506.1 563.5 L503.9 565.7 L500.2 577.2 L502.2 580.8 L504.0 579.7 L503.9 582.2 L506.2 583.6 L509.3 582.9 L509.1 574.4 L511.4 567.7 L514.1 567.2 L515.1 571.0 L522.6 567.3 L518.6 565.6 L519.1 562.1 L513.3 559.4 L511.4 552.9 L509.8 554.5 L508.4 553.6 L507.3 555.8 Z","v":0,"fd":"","texts":[{"t":"司马错论伐蜀","a":"战国游士","d":"刘向辑","g":"课外/补充-古文观止","place":"秦咸阳；蜀成都（今四川成都）","lt":"famous","basis":"原作写于成都市，作者与次选锚点俱不可确考，按覆盖补缺分配至贵州省六盘水市","type":"史传（战国策）","full":"司马错与张仪争论于秦惠王前。司马错欲伐蜀,张仪曰:\"不如伐韩。\"王曰:\"请闻其说。\"对曰:\"亲魏善楚,下兵三川,塞轘辕、缑氏之口,当屯留之道,魏绝南阳,楚临南郑,秦攻新城、宜阳,以临二周之郊,诛周主之罪,侵楚、魏之地。周自知不救,九鼎宝器必出。据九鼎,案图籍,挟天子以令天下,天下莫敢不听,此王业也。今夫蜀,西僻之国也,而戎狄之长也,敝兵劳众不足以成名,得其地不足以为利。臣闻争名者于朝,争利者于市。今三川、周室,天下之市朝也,而王不争焉,顾争于戎狄,去王业远矣。\"司马错曰:\"不然。臣闻之,欲富国者,务广其地;欲强兵者,务富其民;欲王者,务博其德。三资者备,而王随之矣。今王之地小民贫,故臣愿从事于易。夫蜀,西僻之国也,而戎狄之长也,而有桀纣之乱。以秦攻之,譬如使豺狼逐群羊也。取其地足以广国,得其财足以富民,缮兵不伤众,而彼已服矣。故拔一国,而天下不以为暴;利尽西海,诸侯不以为贪。是我一举而名实两附,而又有禁暴止乱之名。今攻韩劫天子,劫天子,恶名也,而未必利也,又有不义之名。而攻天下之所不欲,危!臣请谒其故:周,天下之宗室也;齐、韩,周之与国也。周自知失九鼎,韩自知亡三川,则必将二国并力合谋,以因乎齐、赵而求解乎楚、魏,以鼎与楚,以地与魏,王不能禁。此臣所谓危,不如伐蜀之完也。\"惠王曰:\"善!寡人之听。\"卒起兵伐蜀,十月取之,遂定蜀,贬蜀王,更号为侯,而使陈庄相蜀。蜀既属,秦益强富厚,轻诸侯。"}]},{"prov":"贵州","name":"遵义市","d":"M559.7 510.9 L556.5 513.3 L554.7 508.7 L553.9 509.8 L551.8 508.3 L549.2 508.9 L549.1 515.3 L546.7 517.2 L545.9 514.7 L543.9 514.6 L542.6 516.9 L540.3 516.8 L540.7 519.8 L539.0 520.1 L538.2 523.2 L536.0 522.6 L537.3 519.4 L534.5 515.8 L535.3 520.7 L533.3 520.9 L533.0 522.6 L526.4 517.2 L525.1 520.4 L522.1 520.5 L521.2 525.9 L523.6 525.4 L525.3 529.6 L530.2 529.3 L532.1 532.6 L532.4 535.4 L528.0 536.2 L527.0 538.4 L529.7 540.5 L531.4 539.3 L532.2 542.1 L536.6 541.0 L538.8 547.0 L540.0 545.0 L541.1 546.2 L542.9 544.4 L546.0 544.4 L547.2 542.0 L549.3 544.6 L550.7 544.2 L550.9 547.3 L553.2 546.1 L556.8 548.5 L559.0 546.8 L558.0 544.5 L555.2 544.5 L554.8 542.4 L557.1 540.3 L557.8 536.4 L555.5 528.4 L556.7 524.8 L558.6 524.8 L558.3 523.3 L559.2 524.8 L559.2 520.5 L562.0 516.9 L559.7 510.9 Z","v":0,"fd":"","texts":[{"t":"卜来敦记","a":"黎庶昌","d":"—","g":"课外/补充-明清古文","place":"英国布莱顿海滨","lt":"birth","basis":"作者遵义人，出使西欧时作（写作地在海外，依作者故乡匹配）","type":"游记散文","full":"卜来敦者，英国之海滨，欧洲胜境也。距伦敦南一百六十余里，轮车可两点钟而至，为国人游息之所。后带冈岭，前则石岸斩然。好事者凿岸为巨厦，养鱼其间，注以原泉，涵以颇黎，四洲之物，奇奇怪怪，无不毕致。又架木为长桥，斗入海中数百丈，使游者得以扳援凭眺。桥尽处有作乐亭。余则浅草平沙，绿窗华屋，与水光揜映，迤逦一碧而已。\n人民十万，栉比而居，衢市从衡，日辟益广。其地固无波涛汹涌之观、估客帆樯之集，无机匠厂师之兴作、杂然而尘鄙也，盖独以静洁胜。\n每岁会堂散后，游人率休憩于此。方其风日晴和，天水相际，邦人士女，联袂娭游，衣裙杂袭，都丽如云。时或一二小艇，棹漾于空碧之中。而豪华世家，则又鲜车怒马，并辔争驰，以相遨放。迨夫暮色苍然，灯火粲列，音乐作于水上，与风潮相吞吐，夷犹要眇，飘飘乎有遗世之意矣。\n予至伦敦之次月，富绅阿什伯里道往游焉，即叹为绝特殊胜，自是屡游不厌。再逾年而之他邦，多涉名迹，而卜来敦未尝一日去诸怀，其移人若此。\n英之为国，号为强盛杰大，议者徒知其船坚炮巨，逐利若驰，故尝得志海内；而不知其国中之忧游暇豫，乃有如是之一境也。昔荀卿氏论立国惟坚凝之难，而晋栾鍼之对楚子重则曰：“好以众整。”又曰：“好以暇。”夫唯坚凝，斯能整暇，若卜来敦者，可以觇人国已。\n大清前驻英参赞黎庶昌记。光绪六年七月。"},{"t":"忆秦娥·娄山关","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"娄山关、苍山残阳","lt":"famous","basis":"1935年2月遵义战役二克娄山关后作","type":"词","full":"西风烈，长空雁叫霜晨月。霜晨月，马蹄声碎，喇叭声咽。\n雄关漫道真如铁，而今迈步从头越。从头越，苍山如海，残阳如血。"}]},{"prov":"贵州","name":"安顺市","d":"M515.1 570.9 L519.5 576.5 L521.9 577.2 L523.6 580.9 L525.8 581.6 L526.7 578.1 L528.2 578.4 L529.0 581.2 L533.8 582.8 L534.7 577.4 L530.6 576.4 L531.9 570.8 L530.3 570.2 L531.0 565.9 L534.7 565.5 L535.9 563.3 L529.3 558.5 L528.8 561.2 L526.5 562.1 L525.6 560.5 L519.3 563.8 L519.1 566.2 L522.6 567.3 L515.1 570.9 Z","v":0,"fd":"","texts":[{"t":"\"路逢侠客须呈剑，不是才人莫献诗\"","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）。蒙学格言，无地理属性，按覆盖补缺分配","type":"蒙学格言","full":"路逢侠客须呈剑，不是才人莫献诗"}]},{"prov":"贵州","name":"毕节市","d":"M519.6 563.6 L525.6 560.5 L526.5 562.1 L528.9 561.1 L529.0 554.5 L532.6 553.3 L533.5 548.4 L538.3 545.3 L538.0 542.3 L536.4 541.0 L532.2 542.1 L532.2 540.1 L529.5 540.4 L527.0 536.8 L521.3 538.5 L518.2 536.3 L515.9 537.8 L514.0 544.2 L512.2 543.2 L509.1 545.6 L508.1 544.4 L505.0 545.3 L500.7 542.3 L498.0 546.2 L500.1 547.1 L500.6 551.2 L504.6 552.1 L507.3 555.8 L508.4 553.6 L509.8 554.5 L511.4 552.9 L513.3 559.4 L519.6 563.6 ZM505.4 553.9 L504.6 552.1 L500.6 551.2 L500.1 547.1 L495.5 543.0 L494.2 542.7 L488.9 550.1 L491.7 552.2 L490.6 555.2 L493.1 560.7 L496.1 560.8 L497.3 558.2 L500.9 558.6 L501.9 556.8 L502.6 559.1 L506.0 560.5 L507.4 556.4 L506.4 555.1 L504.7 556.3 L505.4 553.9 Z","v":0,"fd":"","texts":[{"t":"\"少年不努力，老大徒伤悲\"","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"蒙学格言","full":"少年不努力，老大徒伤悲"}]},{"prov":"贵州","name":"铜仁市","d":"M572.7 548.9 L576.8 542.6 L579 ","d":"唐","g":"小学五年级上","place":"辋川山居","lt":"write","basis":"写作地辋川（今陕西蓝田县，属西安市），从写作地匹配","type":"古诗","full":"空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。"},{"t":"鸟鸣涧","a":"王维","d":"唐","g":"小学五年级下","place":"辋川山涧","lt":"write","basis":"写作地辋川（今陕西蓝田县，属西安市），从写作地匹配","type":"古诗","full":"人闲桂花落，夜静春山空。月出惊山鸟，时鸣春涧中。"},{"t":"李凭箜篌引","a":"李贺","d":"唐","g":"高中选择性必修上","place":"长安宫廷音乐","lt":"write","basis":"写作地长安（今陕西西安），李贺在长安作《李凭箜篌引》，从写作地匹配","type":"古诗","full":"吴丝蜀桐张高秋，空山凝云颓不流。江娥啼竹素女愁，李凭中国弹箜篌。昆山玉碎凤凰叫，芙蓉泣露香兰笑。十二门前融冷光，二十三丝动紫皇。女娲炼石补天处，石破天惊逗秋雨。梦入神山教神妪，老鱼跳波瘦蛟舞。吴质不眠倚桂树，露脚斜飞湿寒兔。"},{"t":"过秦论（上）","a":"贾谊","d":"西汉","g":"高中选择性必修中","place":"秦关中六国旧地","lt":"write","basis":"写作地长安（西汉都，今陕西西安），贾谊在长安作《过秦论》，从写作地匹配","type":"文言文","full":"秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具；外连衡而斗诸侯。于是秦人拱手而取西河之外。\n孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、赵、宋、卫、中山之众。于是六国之士，有宁越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。\n延及孝文王、庄襄王，享国之日浅，国家无事。\n及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。\n始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。\n且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄耰棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。"},{"t":"鹿柴","a":"王维","d":"唐","g":"小学四年级上","place":"鹿柴山林夕照","lt":"write","basis":"写作地辋川（今陕西蓝田县，属西安市），从写作地匹配","type":"古诗","full":"空山不见人，但闻人语响。返景入深林，复照青苔上。"},{"t":"竹里馆","a":"王维","d":"唐","g":"初中七年级下","place":"竹里馆幽篁","lt":"write","basis":"写作地辋川（今陕西蓝田县，属西安市），从写作地匹配","type":"古诗","full":"独坐幽篁里，弹琴复长啸。深林人不知，明月来相照。"},{"t":"召公谏厉王止谤","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"镐京（今陕西西安）","lt":"famous","basis":"周厉王止谤、召公\"防民之口甚于防川\"事发于西周镐京","type":"史传（国语）","full":"厉王虐,国人谤王。召公告曰:\"民不堪命矣!\"王怒,得卫巫,使监谤者。以告,则杀之。国人莫敢言,道路以目。王喜,告召公曰:\"吾能弭谤矣,乃不敢言。\"召公曰:\"是障之也。防民之口,甚于防川。川壅而溃,伤人必多,民亦如之。是故为川者决之使导,为民者宣之使言。故天子听政,使公卿至于列士献诗,瞽献曲,史献书,师箴,瞍赋,矇诵,百工谏,庶人传语,近臣尽规,亲戚补察,瞽、史教诲,耆、艾修之,而后王斟酌焉,是以事行而不悖。民之有口,犹土之有山川也,财用于是乎出;犹其原隰之有衍沃也,衣食于是乎生。口之宣言也,善败于是乎兴。行善而备败,其所以阜财用衣食者也。夫民虑之于心而宣之于口,成而行之,胡可壅也?若壅其口,其与能几何?\"王不听,于是国人莫敢出言。三年,乃流王于彘。"},{"t":"钟号景云鸣采凤；楼雄川口锁金鳌。","a":"张过","d":"—","g":"课外/补充-楹联","place":"陕西西安钟楼","lt":"famous","basis":"当代楹联家张过撰，藏头联，悬于西安钟楼","type":"楹联","full":"钟号景云鸣采凤；楼雄川口锁金鳌。"}]},{"prov":"陕西","name":"铜川市","d":"M572.4 389.8 L567.9 395.7 L571.7 400.3 L574.1 400.0 L578.8 394.6 L581.3 395.2 L581.4 393.3 L579.0 391.7 L582.3 389.6 L581.9 386.7 L577.3 385.3 L572.4 389.8 Z","v":0,"fd":"","texts":[{"t":"\"功不足以矜，业不足以傲\"","a":"金缨","d":"清","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《格言联璧》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"功不足以矜，业不足以傲"}]},{"prov":"陕西","name":"宝鸡市","d":"M559.1 411.4 L557.9 410.3 L559.5 409.6 L558.9 401.8 L555.8 397.0 L546.3 398.9 L541.2 394.7 L534.7 396.1 L536.1 401.0 L531.9 404.7 L538.3 408.7 L537.5 411.1 L534.8 410.9 L536.2 413.0 L533.5 417.6 L536.4 424.0 L537.6 421.6 L539.6 422.0 L540.5 418.3 L543.2 419.8 L543.8 418.4 L545.8 420.7 L548.2 419.4 L547.6 421.5 L549.1 422.6 L553.5 421.7 L554.1 417.3 L557.9 416.1 L559.1 411.4 Z","v":0,"fd":"","texts":[{"t":"采薇（节选）","a":"《诗经·小雅》","d":"—","g":"小学六年级下","place":"边塞归途","lt":"famous","basis":"《诗经·小雅·采薇》为西周诗歌，周人起源于周原（今陕西宝鸡岐山），据周文化发祥地匹配陕西宝鸡市","type":"古诗","full":"昔我往矣，杨柳依依。今我来思，雨雪霏霏。行道迟迟，载渴载饥。我心伤悲，莫知我哀！"},{"t":"无衣","a":"《诗经·秦风》","d":"—","g":"高中选择性必修上","place":"出征战场","lt":"desc","basis":"《诗经·秦风》，春秋秦都雍城在今陕西宝鸡凤翔区，据秦风产地推定","type":"古诗","full":"岂曰无衣？与子同袍。王于兴师，修我戈矛。与子同仇！岂曰无衣？与子同泽。王于兴师，修我矛戟。与子偕作！岂曰无衣？与子同裳。王于兴师，修我甲兵。与子偕行！"},{"t":"蒹葭","a":"《诗经·秦风》","d":"—","g":"初中八年级下","place":"秋水边伊人","lt":"desc","basis":"《诗经·秦风》，春秋秦都雍城在今陕西宝鸡凤翔区，据秦风产地推定","type":"古诗","full":"蒹葭苍苍，白露为霜。\n所谓伊人，在水一方。\n溯洄从之，道阻且长。\n溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。\n所谓伊人，在水之湄。\n溯洄从之，道阻且跻。\n溯游从之，宛在水中坻。\n蒹葭采采，白露未已。\n所谓伊人，在水之涘。\n溯洄从之，道阻且右。\n溯游从之，宛在水中沚。"},{"t":"喜雨亭记","a":"苏轼","d":"—","g":"课外/补充-古文观止","place":"凤翔府官舍","lt":"famous","basis":"嘉祐七年苏轼任凤翔府签判，于官舍建喜雨亭作记","type":"记文","full":"亭以雨名,志喜也。古者有喜,则以名物,示不忘也。周公得禾,以名其书;汉武得鼎,以名其年;叔孙胜敌,以名其良弓。其喜之大小不齐,其示不忘一也。\n予至扶风之明年,始治官舍。为亭于堂之北,而凿池其南,引流种树,以为休息之所。是岁之春,雨麦于岐山之阳,其占为有年。既而弥月不雨,民方以为忧。越三月,乙卯乃雨,甲子又雨,民以为未足。丁卯大雨,三日乃止。官吏相与庆于庭,商贾相与歌于市,农夫相与忭于野,忧者以喜,病者以愈,而吾亭适成。\n于是举酒于亭上,以属客而告之曰:\"五日不雨可乎?\"曰:\"五日不雨则无麦。\"\"十日不雨可乎?\"曰:\"十日不雨则无禾。\"无麦无禾,岁且荐饥,狱讼繁兴,而盗贼滋炽。则吾与二三子,虽欲优游以乐于此亭,其可得耶?今天不遗斯民,始旱而赐之以雨。使吾与二三子得相与优游而乐于此亭者,皆雨之赐也。其又可忘耶?\n既以名亭,又从而歌之,曰:\"使天而雨珠,寒者不得以为襦;使天而雨玉,饥者不得以为粟。一雨三日,伊谁之力?民曰太守,太守不有;归之天子,天子曰不然;归之造物,造物不自以为功;归之太空,太空冥冥;不可得而名,吾以名吾亭。\""}]},{"prov":"陕西","name":"咸阳市","d":"M555.8 397.0 L558.9 401.8 L558.5 411.6 L569.6 411.2 L573.9 407.6 L573.8 404.9 L576.7 404.5 L577.2 402.2 L575.2 402.6 L574.1 400.0 L569.6 398.8 L567.9 395.7 L570.5 390.8 L572.5 390.2 L569.1 386.1 L567.7 390.9 L554.2 390.7 L553.1 391.9 L555.8 397.0 Z","v":0,"fd":"","texts":[{"t":"守株待兔","a":"韩非《韩非子》","d":"战国","g":"小学三年级下","place":"宋国田野【虚构】","lt":"famous","basis":"寓言\"宋人有耕田者\"故事发生于宋国（今河南商丘），商丘匹配已达9篇上限；作者韩非入秦（咸阳）为其生平终局地，按作者生平活动地次选锚点匹配陕西咸阳市","type":"文言文","full":"宋人有耕者。田中有株，兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。"},{"t":"伯牙鼓琴","a":"吕不韦《吕氏春秋》","d":"战国","g":"小学六年级上","place":"泰山江河【虚构】","lt":"write","basis":"写作地咸阳（今陕西咸阳），《吕氏春秋》成书于秦咸阳，从写作地匹配","type":"文言文","full":"伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：\"善哉乎鼓琴，巍巍乎若太山。\"少选之间而志在流水，锺子期又曰：\"善哉乎鼓琴，汤汤乎若流水。\"锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。"},{"t":"谏逐客书","a":"李斯","d":"秦","g":"高中必修下","place":"秦咸阳宫廷","lt":"write","basis":"写作地咸阳（今陕西咸阳），李斯上《谏逐客书》于秦咸阳，从写作地匹配","type":"文言文","full":"臣闻吏议逐客，窃以为过矣。\n昔穆公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，求丕豹、公孙支于晋。此五人者，不产于秦，而穆公用之，并国二十，遂霸西戎。孝公用商鞅之法，移风易俗，民以殷盛，国以富强。百姓乐用，诸侯亲服。获楚、魏之师，举地千里，至今治强。惠王用张仪之计，拔三川之地；西并巴、蜀；北收上郡；南取汉中，包九夷，制鄢、郢；东据成皋之险，割膏腴之壤。遂散六国之从，使之西面事秦，功施到今。昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉？向使四君却客而不内，疏士而不用，是使国无富利之实，而秦无强大之名也。\n今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。此数宝者，秦不生一焉，而陛下说之，何也？必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。所以饰后宫、充下陈、娱心意、说耳目者，必出于秦然后可，则是宛珠之簪，傅玑之珥，阿缟之衣，锦绣之饰不进于前，而随俗雅化、佳冶窈窕赵女不立于侧也。夫击瓮叩缶、弹筝搏髀而歌呼呜呜快耳目者，真秦之声也；郑、卫、桑间、韶虞武象者，异国之乐也。今弃击瓮而就郑卫，退弹筝而取韶虞，若是者何也？快意当前，适观而已矣。\n今取人则不然，不问可否，不论曲直，非秦者去，为客者逐。然则是所重者在乎色、乐、珠、玉，而所轻者在乎人民也。此非所以跨海内、制诸侯之术也。\n臣闻地广者粟多，国大者人众，兵强则士勇。是以泰山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。是以地无四方，民无异国，四时充美，鬼神降福，此五帝、三王之所以无敌也。今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而赍盗粮”者也。\n夫物不产于秦可宝者多，士不产于秦而愿忠者众。今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯，求国之无危，不可得也。"},{"t":"苏武传","a":"班固《汉书》","d":"东汉","g":"高中选择性必修中","place":"匈奴北海（贝加尔湖）","lt":"birth","basis":"班固扶风安陵人（今陕西咸阳），据作者故乡匹配陕西咸阳市","type":"文言文","full":"武字子卿，少以父任，兄弟并为郎，稍迁至栘中厩监。时汉连伐胡，数通使相窥观。匈奴留汉使郭吉、路充国等前后十余辈，匈奴使来，汉亦留之以相当。天汉元年，且鞮侯单于初立，恐汉袭之，乃曰：汉天子我丈人行也。尽归汉使路充国等。武帝嘉其义，乃遣武以中郎将使持节送匈奴使留在汉者，因厚赂单于，答其善意。武与副中郎将张胜及假吏常惠等募士斥候百余人俱。既至匈奴，置币遗单于；单于益骄，非汉所望也。\n方欲发使送武等，会缑王与长水虞常等谋反匈奴中。缑王者，昆邪王姊子也，与昆邪王俱降汉，后随浞野侯没胡中，及卫律所将降者，阴相与谋，劫单于母阏氏归汉。会武等至匈奴。虞常在汉时，素与副张胜相知，私候胜曰：闻汉天子甚怨卫律，常能为汉伏弩射杀之，吾母与弟在汉，幸蒙其赏赐。张胜许之，以货物与常。\n后月余，单于出猎，独阏氏子弟在。虞常等七十余人欲发，其一人夜亡告之。单于子弟发兵与战，缑王等皆死，虞常生得。单于使卫律治其事。张胜闻之，恐前语发，以状语武。武曰：事如此，此必及我，见犯乃死，重负国！欲自杀，胜惠共止之。虞常果引张胜。单于怒，召诸贵人议，欲杀汉使者。左伊秩訾曰：即谋单于，何以复加？宜皆降之。\n单于使卫律召武受辞。武谓惠等：屈节辱命，虽生何面目以归汉？引佩刀自刺。卫律惊，自抱持武。驰召医，凿地为坎，置煴火，覆武其上，蹈其背，以出血。武气绝，半日复息。惠等哭，舆归营。单于壮其节，朝夕遣人候问武，而收系张胜。\n武益愈。单于使使晓武，会论虞常，欲因此时降武。剑斩虞常已，律曰：汉使张胜谋杀单于近臣，当死；单于募降者，赦罪。举剑欲击之，胜请降。律谓武曰：副有罪，当相坐。武曰：本无谋，又非亲属，何谓相坐？复举剑拟之，武不动。律曰：苏君，律前负汉归匈奴，幸蒙大恩，赐号称王，拥众数万，马畜弥山，富贵如此。苏君今日降，明日复然。空以身膏草野，谁复知之？武不应。律曰：君因我降，与君为兄弟；今不听吾计，后虽欲复见我，尚可得乎？武骂律曰：汝为人臣子，不顾恩义，畔主背亲，为降虏于蛮夷，何以女为见？且单于信女，使决人死生，不平心持正，反欲斗两主观祸败。若知我不降明，欲令两国相攻，匈奴之祸，从我始矣！\n律知武终不可胁，白单于。单于愈益欲降之。乃幽武置大窖中，绝不饮食。天雨雪。武卧，啮雪与旃毛并咽之，数日不死。匈奴以为神，乃徙武北海上无人处，使牧羝。羝乳，乃得归。别其官属常惠等，各置他所。武既至海上，廪食不至，掘野鼠去草实而食之。杖汉节牧羊，卧起操持，节旄尽落。积五、六年，单于弟於靬王弋射海上。武能网纺缴，檠弓弩，于靬王爱之，给其衣食。三岁余，王病，赐武马畜、服匿、穹庐。王死后，人众徙去。其冬，丁令盗武牛羊，武复穷厄。\n初，武与李陵俱为侍中。武使匈奴明年，陵降，不敢求武。久之，单于使陵至海上，为武置酒设乐。因谓武曰：单于闻陵与子卿素厚，故使陵来说足下，虚心欲相待。终不得归汉，空自苦亡人之地，信义安所见乎？前长君为奉车，从至雍棫阳宫，扶辇下除，触柱，折辕，劾大不敬，伏剑自刎，赐钱二百万以葬。孺卿从祠河东後土，宦骑与黄门驸马争船，推堕驸马河中，溺死，宦骑亡。诏使孺卿逐捕。不得，惶恐饮药而死。来时太夫人已不幸，陵送葬至阳陵。子卿妇年少，闻已更嫁矣。独有女弟二人，两女一男，今复十余年，存亡不可知。人生如朝露，何久自苦如此？陵始降时，忽忽如狂，自痛负汉；加以老母系保宫。子卿不欲降，何以过陵？且陛下春秋高，法令亡常，大臣亡罪夷灭者数十家，安危不可知。子卿尚复谁为乎？愿听陵计，勿复有云！武曰：武父子亡功德，皆为陛下所成就，位列将，爵通侯，兄弟亲近，常愿肝脑涂地。今得杀身自效，虽蒙斧钺汤镬，诚甘乐之。臣事君，犹子事父也。子为父死，亡所恨，愿无复再言。\n陵与武饮数日，复曰：子卿，壹听陵言。武曰：自分已死久矣！王必欲降武，请毕今日之欢，效死于前！陵见其至诚，喟然叹曰：嗟呼！义士！陵与卫律之罪上通于天！因泣下沾衿，与武决去。陵恶自赐武，使其妻赐武牛羊数十头。后陵复至北海上，语武：区脱捕得云中生口，言太守以下吏民皆白服，曰：『『上崩。』』武闻之，南乡号哭，欧血，旦夕临。\n数月，昭帝即位。数年，匈奴与汉和亲。汉求武等。匈奴诡言武死。后汉使复至匈奴。常惠请其守者与俱，得夜见汉使，具自陈道。教使者谓单于言：天子射上林中，得雁足有系帛书，言武等在某泽中。使者大喜，如惠语以让单于。单于视左右而惊，谢汉使曰：武等实在。于是李陵置酒贺武曰：今足下还归，扬名于匈奴，功显于汉室，虽古竹帛所载，丹青所画，何以过子卿！陵虽驽怯，令汉且贳陵罪，全其老母，使得奋大辱之积志，庶几乎曹柯之盟。此陵宿昔之所不忘也！收族陵家，为世大戮，陵尚复何顾乎？已矣！令子卿知吾心耳！异域之人，壹别长绝！陵起舞，歌曰：径万里兮度沙幕，为君将兮奋匈奴。路穷绝兮矢刃摧，士众灭兮名已隤，老母已死，虽欲报恩将安归？陵泣下数行，因与武决。\n单于召会武官属，前以降及物故，凡随武还者九人。武以始元六年春至京师，诏武奉一太牢谒武帝园庙，拜为典属国，秩中二千石，赐钱二百万，公田二顷，宅一区。常惠徐圣赵终根皆拜为中郎，赐帛各二百匹。其余六人，老归家，赐钱人十万，复终身。常惠后至右将军，封列侯，自有传。武留匈奴凡十九岁，始以强壮出，及还，须发尽白。\n武来归明年，上官桀、子安与桑弘羊及燕王、盖主谋反，武子男元与安有谋，坐死。初桀、安与大将军霍光争权，数疏光过失予燕王，令上书告之。又言苏武使匈奴二十年，不降，还乃为典属国。大将军长史无功劳，为搜粟都尉，光颛权自恣。及燕王等反诛，穷治党与，武素与桀、弘羊有旧，数为燕王所讼，子又在谋中，廷尉奏请逮捕武。霍光寝其奏，免武官。\n数年，昭帝崩。武以故二千石与计谋立宣帝，赐爵关内侯，食邑三百户。久之，卫将军张安世荐武明习故事，奉使不辱命，先帝以为遗言。宣帝即时召武待诏宦者署。数进见，复为右曹典属国。以武著节老臣，令朝朔望，号称祭酒，甚优宠之。武所得赏赐，尽以施予昆弟故人，家不余财。皇后父平恩侯、帝舅平昌侯、乐昌侯、车骑将军韩增、丞相魏相、御史大夫丙吉，皆敬重武。武年老，子前坐事死，上闵之。问左右：“武在匈奴久，岂有子乎？”武因平恩侯自白：“前发匈奴时，胡妇适产一子通国，有声问来，原因使者致金帛赎之。”上许焉。后通国随使者至，上以为郎。又以武弟子为右曹。武年八十余，神爵二年病卒。\n甘露三年，单于始入朝。上思股肱之美，乃图画其人于麒麟阁，法其形貌，署其官爵、姓名。唯霍光不名，曰大司马大将军博陆侯姓霍氏，次曰卫将军富平侯张安世，次曰车骑将军龙额侯韩增，次曰后将军营平侯赵充国，次曰丞相高平侯魏相，次曰丞相博阳侯丙吉，次曰御史大夫建平侯杜延年，次曰宗正阳城侯刘德，次曰少府梁丘贺，次曰太子太傅萧望之，次曰典属国苏武。皆有功德，知名当世，是以表而扬之，明著中兴辅佐，列于方叔、召虎、仲山甫焉。凡十一人，皆有传。自丞相黄霸、廷尉于定国、大司农朱邑、京兆尹张敞、右扶风尹翁归及儒者夏侯胜等，皆以善终，著名宣帝之世，然不得列于名臣之图，以此知其选矣。"},{"t":"送元二使安西","a":"王维","d":"唐","g":"小学六年级下","place":"渭城送别","lt":"write","basis":"写作地渭城（今陕西咸阳渭城区），王维送元二使安西，从写作地匹配","type":"古诗","full":"渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。"},{"t":"穿井得一人","a":"吕不韦《吕氏春秋》","d":"战国","g":"初中七年级上","place":"宋国穿井得人传言","lt":"write","basis":"写作地咸阳（秦都，今陕西咸阳），《吕氏春秋》成书于秦咸阳，从写作地匹配","type":"文言文","full":"宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰：\"吾穿井得一人。\"有闻而传之者：\"丁氏穿井得一人。\"国人道之，闻之于宋君。宋君令人问之于丁氏，丁氏对曰：\"得一人之使，非得一人于井中也。\"求闻之若此，不若无闻也。"},{"t":"咸阳城东楼","a":"许浑","d":"唐","g":"初中九年级上","place":"咸阳城楼","lt":"write","basis":"写作地咸阳（今陕西咸阳），许浑登咸阳城东楼，从写作地匹配","type":"古诗","full":"一上高城万里愁，蒹葭杨柳似汀洲。溪云初起日沉阁，山雨欲来风满楼。鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。行人莫问当年事，故国东来渭水流。"},{"t":"苏秦以连横说秦","a":"战国游士","d":"刘向辑","g":"课外/补充-古文观止","place":"咸阳宫（今陕西咸阳）","lt":"famous","basis":"苏秦说秦惠王于咸阳宫，秦都咸阳遗址在今咸阳东北","type":"史传（战国策）","full":"苏秦始将连横说秦惠王曰：“大王之国，西有巴、蜀、汉中之利，北有胡貉、代马之用，南有巫山、黔中之限，东有殽、函之固。田肥美，民殷富，战车万乘，奋击百万，沃野千里，蓄积饶多，地势形便，此所谓天府，天下之雄国也。以大王之贤，士民之众，车骑之用，兵法之教，可以并诸侯，吞天下，称帝而治。愿大王少留意，臣请奏其效。”\n秦王曰：“寡人闻之：毛羽不丰满者，不可以高飞，文章不成者不可以诛罚，道德不厚者不可以使民，政教不顺者不可以烦大臣。今先生俨然不远千里而庭教之，愿以异日。”\n苏秦曰：“臣固疑大王之不能用也。昔者神农伐补遂，黄帝伐涿鹿而禽蚩尤，尧伐驩兜，舜伐三苗，禹伐共工，汤伐有夏，文王伐崇，武王伐纣，齐桓任战而霸天下。由此观之，恶有不战者乎？古者使车毂击驰，言语相结，天下为一，约从连横，兵革不藏。文士并饬，诸侯乱惑，万端俱起，不可胜理。科条既备，民多伪态，书策稠浊，百姓不足。上下相愁，民无所聊，明言章理，兵甲愈起。辩言伟服，战攻不息，繁称文辞，天下不治。舌敝耳聋，不见成功，行义约信，天下不亲。于是乃废文任武，厚养死士，缀甲厉兵，效胜于战场。夫徒处而致利，安坐而广地，虽古五帝三王五霸，明主贤君，常欲坐而致之，其势不能。故以战续之，宽则两军相攻，迫则杖戟相撞，然后可建大功。是故兵胜于外，义强于内，威立于上，民服于下。今欲并天下，凌万乘，诎敌国，制海内，子元元，臣诸侯，非兵不可。今之嗣主，忽于至道，皆惛于教，乱于治，迷于言，惑于语，沉于辩，溺于辞。以此论之，王固不能行也。”\n说秦王书十上而说不行，黑貂之裘敝，黄金百斤尽，资用乏绝，去秦而归，羸縢履蹻，负书担囊，形容枯槁，面目黧黑，状有愧色。归至家，妻不下纴，嫂不为炊。父母不与言。苏秦喟然叹曰：“妻不以我为夫，嫂不以我为叔，父母不以我为子，是皆秦之罪也。”乃夜发书，陈箧数十，得太公阴符之谋，伏而诵之，简练以为揣摩。读书欲睡，引锥自刺其股，血流至足，曰：“安有说人主，不能出其金玉锦绣，取卿相之尊者乎？”期年，揣摩成，曰：“此真可以说当世之君矣。”\n于是乃摩燕乌集阙，见说赵王于华屋之下，抵掌而谈，赵王大说，封为武安君。受相印，革车百乘，锦绣千纯，白璧百双，黄金万镒，以随其后，约从散横以抑强秦，故苏秦相于赵而关不通。\n当此之时，天下之大，万民之众，王侯之威，谋臣之权，皆欲决于苏秦之策。不费斗粮，未烦一兵，未战一士，未绝一弦，未折一矢，诸侯相亲，贤于兄弟。夫贤人任而天下服，一人用而天下从，故曰：式于政不式于勇；式于廊庙之内，不式于四境之外。当秦之隆，黄金万镒为用，转毂连骑，炫熿于道，山东之国从风而服，使赵大重。且夫苏秦，特穷巷掘门桑户棬枢之士耳，伏轼撙衔，横历天下，庭说诸侯之主，杜左右之口，天下莫之伉。\n将说楚王，路过洛阳，父母闻之，清宫除道，张乐设饮，郊迎三十里。妻侧目而视，侧耳而听。嫂蛇行匍伏，四拜自跪而谢。苏秦曰：“嫂何前倨而后卑也？”嫂曰：“以季子位尊而多金。”苏秦曰：“嗟乎！贫穷则父母不子，富贵则亲戚畏惧。人生世上，势位富厚，盖可以忽乎哉？”"},{"t":"诫兄子严敦书","a":"马援","d":"—","g":"课外/补充-古文观止","place":"交趾","lt":"famous","basis":"马援为扶风茂陵人，南征交趾时写信戒侄马严马敦","type":"家书（后汉书）","full":"援兄子严、敦并喜讥议，而通轻侠客。援前在交趾，还书诫之曰：“吾欲汝曹闻人过失，如闻父母之名，耳可得闻，口不可得言也。好议论人长短，妄是非正法，此吾所大恶也，宁死不愿闻子孙有此行也。汝曹知吾恶之甚矣，所以复言者，施衿结缡，申父母之戒，欲使汝曹不忘之耳！\n龙伯高敦厚周慎，口无择言，谦约节俭，廉公有威，吾爱之重之，愿汝曹效之。杜季良豪侠好义，忧人之忧，乐人之乐，清浊无所失，父丧致客，数郡毕至，吾爱之重之，不愿汝曹效也。效伯高不得，犹为谨敕之士，所谓“刻鹄不成，尚类鹜”者也；效季良不得，陷为天下轻薄子，所谓“画虎不成，反类狗”者也。讫今季良尚未可知，郡将下车辄切齿，州郡以为言，吾常为寒心，是以不愿子孙效也。”"}]},{"prov":"陕西","name":"渭南市","d":"M597.2 407.9 L596.3 404.2 L594.1 402.9 L594.0 398.8 L600.0 384.3 L599.0 380.0 L592.9 382.8 L594.8 385.5 L591.7 388.6 L583.2 387.9 L579.0 391.7 L581.4 393.3 L581.3 395.2 L578.8 394.6 L574.0 398.8 L575.2 402.6 L581.0 401.5 L580.7 406.8 L582.8 410.9 L586.4 411.7 L587.6 410.3 L589.8 411.8 L591.3 407.9 L597.2 407.9 Z","v":0,"fd":"","texts":[{"t":"周亚夫军细柳","a":"司马迁《史记》","d":"西汉","g":"初中九年级下","place":"细柳营（陕西西安）","lt":"birth","basis":"司马迁左冯翊夏阳人（今陕西韩城，由渭南市代管），据作者故乡匹配陕西渭南市","type":"文言文","full":"文帝之后六年,匈奴大入边。乃以宗正刘礼为将军,军霸上;祝兹侯徐厉为将军,军棘门;以河内守亚夫为将军,军细柳:以备胡。上自劳军。至霸上及棘门军,直驰入,将以下骑送迎。已而之细柳军,军士吏被甲,锐兵刃,彀弓弩,持满。天子先驱至,不得入。先驱曰:\"天子且至!\"军门都尉曰:\"将军令曰:\"军中闻将军令,不闻天子之诏。\"\"居无何,上至,又不得入。于是上乃使使持节诏将军:\"吾欲入劳军。\"亚夫乃传言开壁门。壁门士吏谓从属车骑曰:\"将军约,军中不得驱驰。\"于是天子乃按辔徐行。至营,将军亚夫持兵揖曰:\"介胄之士不拜,请以军礼见。\"天子为动,改容式车。使人称谢:\"皇帝敬劳将军。\"成礼而去。既出军门,群臣皆惊。文帝曰:\"嗟乎,此真将军矣!曩者霸上、棘门军,若儿戏耳,其将固可袭而虏也。至于亚夫,可得而犯邪!\"称善者久之。"},{"t":"鸿门宴","a":"司马迁《史记》","d":"西汉","g":"高中必修下","place":"新丰鸿门（陕西临潼）","lt":"birth","basis":"司马迁左冯翊夏阳人（今陕西韩城，由渭南市代管），据作者故乡匹配陕西渭南市","type":"文言文","full":"沛公军霸上，未得与项羽相见。沛公左司马曹无伤使人言于项羽曰：“沛公欲王关中，使子婴为相，珍宝尽有之。”项羽大怒，曰：“旦日飨士卒，为击破沛公军！”当是时，项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。范增说项羽曰：“沛公居山东时，贪于财货，好美姬。今入关，财物无所取，妇女无所幸，此其志不在小。吾令人望其气，皆为龙虎，成五采，此天子气也，急击勿失！”\n楚左尹项伯者，项羽季父也，素善留侯张良。张良是时从沛公，项伯乃夜驰之沛公军，私见张良，具告以事，欲呼张良与俱去，曰：“毋从俱死也！”张良曰：“臣为韩王送沛公，沛公今事有急，亡去不义，不可不语。”良乃入，具告沛公。沛公大惊，曰：“为之奈何？”张良曰：“谁为大王为此计者？”曰：“鲰生说我曰：‘距关，毋内诸侯，秦地可尽王也。’故听之。”良曰：“料大王士卒足以当项王乎？”沛公默然，曰：“固不如也，且为之奈何？”张良曰：“请往谓项伯，言沛公不敢背项王也。”沛公曰：“君安与项伯有故？”张良曰：“秦时与臣游，项伯杀人，臣活之；今事有急，故幸来告良。”沛公曰：“孰与君少长？”良曰：“长于臣。”沛公曰：“君为我呼入，吾得兄事之。”张良出，要项伯。项伯即入见沛公。沛公奉卮酒为寿，约为婚姻，曰：“吾入关，秋毫不敢有所近，籍吏民，封府库，而待将军。所以遣将守关者，备他盗之出入与非常也。日夜望将军至，岂敢反乎！愿伯具言臣之不敢倍德也。”项伯许诺，谓沛公曰：“旦日不可不蚤自来谢项王！”沛公曰：“诺。”于是项伯复夜去，至军中，具以沛公言报项王，因言曰：“沛公不先破关中，公岂敢入乎？今人有大功而击之，不义也。不如因善遇之。”项王许诺。\n沛公旦日从百余骑来见项王，至鸿门，谢曰：“臣与将军戮力而攻秦，将军战河北，臣战河南，然不自意能先入关破秦，得复见将军于此。今者有小人之言，令将军与臣有郤。”项王曰：“此沛公左司马曹无伤言之；不然，籍何以至此。”项王即日因留沛公与饮。项王、项伯东向坐；亚父南向坐——亚父者，范增也；沛公北向坐，张良西向侍。\n范增数目项王，举所佩玉玦以示之者三，项王默然不应。范增起，出，召项庄，谓曰：“君王为人不忍，若入前为寿，寿毕，请以剑舞，因击沛公于坐，杀之。不者，若属皆且为所虏！”庄则入为寿。寿毕，曰：“君王与沛公饮，军中无以为乐，请以剑舞。”项王曰：“诺。”项庄拔剑起舞，项伯亦拔剑起舞，常以身翼蔽沛公，庄不得击。\n于是张良至军门，见樊哙。樊哙曰：“今日之事何如？”良曰：“甚急！今者项庄拔剑舞，其意常在沛公也。”哙曰：“此迫矣！臣请入，与之同命。”哙即带剑拥盾入军门。交戟之卫士欲止不内，樊哙侧其盾以撞，卫士仆地，哙遂入，披帷西向立，瞋目视项王，头发上指，目眦尽裂。项王按剑而跽曰：“客何为者？”张良曰：“沛公之参乘樊哙者也。”项王曰：“壮士，赐之卮酒。”则与斗卮酒。哙拜谢，起，立而饮之。项王曰：“赐之彘肩。”则与一生彘肩。樊哙覆其盾于地，加彘肩上，拔剑切而啖之。项王曰：“壮士，能复饮乎？”樊哙曰：“臣死且不避，卮酒安足辞！夫秦王有虎狼之心，杀人如不能举，刑人如恐不胜，天下皆叛之。怀王与诸将约曰：‘先破秦入咸阳者王之。’今沛公先破秦入咸阳，毫毛不敢有所近，封闭宫室，还军霸上，以待大王来。故遣将守关者，备他盗出入与非常也。劳苦而功高如此，未有封侯之赏，而听细说，欲诛有功之人。此亡秦之续耳，窃为大王不取也！”项王未有以应，曰：“坐。”樊哙从良坐。\n坐须臾，沛公起如厕，因招樊哙出。\n沛公已出，项王使都尉陈平召沛公。沛公曰：“今者出，未辞也，为之奈何？”樊哙曰：“大行不顾细谨，大礼不辞小让。如今人方为刀俎，我为鱼肉，何辞为。”于是遂去。乃令张良留谢。良问曰：“大王来何操？”曰：“我持白璧一双，欲献项王，玉斗一双，欲与亚父，会其怒，不敢献。公为我献之。”张良曰：“谨诺。”\n当是时，项王军在鸿门下，沛公军在霸上，相去四十里。沛公则置车骑，脱身独骑，与樊哙、夏侯婴、靳彊、纪信等四人持剑盾步走，从骊山下，道芷阳间行。沛公谓张良曰：“从此道至吾军，不过二十里耳。度我至军中，公乃入。”\n沛公已去，间至军中。张良入谢，曰：“沛公不胜桮杓，不能辞。谨使臣良奉白璧一双，再拜献大王足下；玉斗一双，再拜奉大将军足下。”项王曰：“沛公安在？”良曰：“闻大王有意督过之，脱身独去，已至军矣。”项王则受璧，置之坐上。亚父受玉斗，置之地，拔剑撞而破之，曰：“唉！竖子不足与谋。夺项王天下者，必沛公也。吾属今为之虏矣！”\n沛公至军，立诛杀曹无伤。"},{"t":"潼关","a":"谭嗣同","d":"清","g":"初中七年级上","place":"潼关山川","lt":"write","basis":"写作地潼关（今陕西潼关县，属渭南市），谭嗣同过潼关作，从写作地匹配","type":"古诗","full":"终古高云簇此城，秋风吹散马蹄声。河流大野犹嫌束，山入潼关不解平。"},{"t":"山坡羊·潼关怀古","a":"张养浩","d":"元","g":"初中九年级下","place":"潼关怀古","lt":"write","basis":"写作地潼关（今陕西潼关县，属渭南市），张养浩过潼关作，从写作地匹配","type":"曲","full":"峰峦如聚，波涛如怒，山河表里潼关路。望西都，意踌躇。伤心秦汉经行处，宫阙万间都做了土。兴，百姓苦；亡，百姓苦。"},{"t":"报任安书","a":"司马迁","d":"—","g":"课外/补充-古文观止","place":"长安","lt":"birth","basis":"司马迁左冯翊夏阳人（今陕西韩城，由渭南市代管），据作者故乡匹配陕西渭南市","type":"书信（汉书）","full":"太史公牛马走司马迁再拜言。少卿足下：曩者辱赐书，教以慎于接物，推贤进士为务。意气勤勤恳恳，若望仆不相师，而用流俗人之言，仆非敢如此也。仆虽罢驽，亦尝侧闻长者之遗风矣。顾自以为身残处秽，动而见尤，欲益反损，是以独抑郁而谁与语？谚曰：谁为为之，孰令听之？盖钟子期死，伯牙终身不复鼓琴。何则？士为知己者用，女为说己者容。若仆大质已亏缺矣，虽才怀随、和，行若由、夷，终不可以为荣，适足以见笑而自点耳。书辞宜答，会东从上来，又迫贱事，相见日浅，卒卒无须臾之闲，得竭志意。今少卿抱不测之罪，涉旬月，迫季冬，仆又薄从上雍，恐卒然不可为讳，是仆终已不得舒愤懑以晓左右，则长逝者魂魄，私恨无穷。请略陈固陋，阙然久不报，幸勿为过。\n仆闻之：修身者，智之符也；爱施者，仁之端也；取予者，义之表也；耻辱者，勇之决也；立名者，行之极也。士有此五者，然后可以托于世，而列于君子之林矣。故祸莫僭于欲利，悲莫痛于伤心，行莫丑于辱先，诟莫大于宫刑。刑余之人，无所比数，非一世也，所从来远矣。昔卫灵公与雍渠同载，孔子适陈；商鞅因景监见，赵良寒心；同子参乘，袁丝变色；自古而耻之。夫中材之人，事有关于宦竖，莫不伤气，而况于慷慨之士乎？如今朝廷虽乏人，奈何令刀锯之余，荐天下之豪俊哉！\n仆赖先人绪业，得待罪辇毂下，二十余年矣。所以自惟：上之不能纳忠效信，有奇策材力之誉，自结明主；次之，又不能拾遗补阙，招贤进能，显岩穴之士；外之，不能备行伍，攻城野战，有斩将搴旗之功；下之，不能积日累劳，取尊官厚禄，以为宗族交游光宠。四者无一遂，苟合取容，无所短长之效，可见于此矣。向者仆亦尝厕下大夫之列，陪奉外廷末议，不以此时引纲维，尽思虑，今已亏形为扫除之隶，在阘茸之中，乃欲仰首伸眉，论列是非，不亦轻朝廷羞当世之士邪？嗟乎！嗟乎！如仆尚何言哉？尚何言哉！\n且事本末未易明也。仆少负不羁之才，长无乡曲之誉，主上幸以先人之故，使得奉薄伎，出入周卫之中。仆以为戴盆何以望天，故绝宾客，亡室家，日夜思竭其不肖之材力，务一心营职，以求亲媚于主上。而事乃有大谬不然者夫！仆与李陵俱奉使出塞，时上书言匈奴兵事，益材短长，仆固以为李陵素与士大夫绝甘分少，能得人之死力，虽古名将不过也。身虽陷败，彼观其意，且欲得其当而报于汉。事已无可奈何，其所摧败，功亦足以暴于天下矣。仆怀欲陈之，而未有路，适会召问，即以此指，推言陵之功，欲以广主上之意，塞睚眦之辞。未能尽明，明主不晓，以为仆沮贰师，而为李陵游说，遂下于理。拳拳之忠，终不能自列。因为诬上，卒从吏议。家贫，货赂不足以自赎，交游莫救，左右亲近不为一言。身非木石，独与法吏为伍，深幽囹圄之中，谁可告愬者！此真少卿所亲见，仆行事岂不然邪？李陵既生降，隤其家声，而仆又佴之蚕室，重为天下观笑。悲夫！悲夫！事未易一二为俗人言也。\n且李陵提步卒不满五千，深践戎马之地，足历王庭，垂饵虎口，横挑强胡，卬亿万之师，与单于连战十有馀日，所杀过当。虏救死扶伤不给，旃裘之君长咸震怖，乃悉征其左、右贤王，举引弓之民，一国共攻而围之。转斗千里，矢尽道穷，救兵不至，士卒死伤如积。然陵一呼劳军，士无不起，躬自流涕，沬血饮泣，更张空拳，冒白刃，北首争死敌者。陵未没时，使有来报，汉公卿王侯皆奉觞上寿。后数日，陵败书闻，主上为之食不甘味，听朝不怡。大臣忧惧，不知所出。于是上书言：臣以私见，节事有可录于汉，未敢不以闻。\n人固有一死，或重于泰山，或轻于鸿毛，用之所趋异也。\n是以肠一日而九回，居则忽忽若有所亡，出则不知其所往。每念斯耻，汗未尝不发背沾衣也。身直为闺阃之臣，宁得自引深藏于岩穴邪！故且从俗浮沉，与时俯仰，以通其狂惑。\n且夫臧获婢妾，犹能引决，况若仆之不得已乎！所以隐忍苟活，幽于粪土之中而不辞者，恨私心有所不尽，鄙陋没世，而文采不表于后也。"},{"t":"报孙会宗书","a":"杨恽","d":"—","g":"课外/补充-古文观止","place":"长安/华阴","lt":"desc","basis":"杨恽为丞相杨敞子，华阴人，废为庶人后治产业作此书","type":"书信（汉书）","full":"恽材朽行秽，文质无所底，幸赖先人余业，得备宿卫。遭遇时变，以获爵位；终非其任，卒与祸会。足下哀其愚蒙，赐书教督以所不及，殷勤甚厚。然窃恨足下不深惟其终始，而猥随俗之毁誉也。言鄙陋之愚心，若逆指而文过；默而息乎，恐违孔氏各言尔志之义。故敢略陈其愚，惟君子察焉。\n恽家方隆盛时，乘朱轮者十人，位在列卿，爵为通侯，总领从官，与闻政事。曾不能以此时有所建明，以宣德化；又不能与群僚同心并力，陪辅朝廷之遗忘，已负窃位素餐之责久矣。怀禄贪势，不能自退，遭遇变故，横被口语，身幽北阙，妻子满狱。当此之时，自以夷灭不足以塞责，岂意得全首领，复奉先人之丘墓乎？伏惟圣主之恩不可胜量。君子游道，乐以忘忧；小人全躯，说以忘罪。窃自思念，过已大矣，行已亏矣，长为农夫以没世矣。是故身率妻子，戮力耕桑，灌园治产，以给公上，不意当复用此为讥议也。\n夫人情所不能止者，圣人弗禁。故君父至尊亲，送其终也，有时而既。臣之得罪，已三年矣。田家作苦，岁时伏腊，烹羊炰羔，斗酒自劳。家本秦也，能为秦声；妇，赵女也，雅善鼓瑟；奴婢歌者数人。酒后耳热，仰天拊缶而呼乌乌。其诗曰：田彼南山，芜秽不治，种一顷豆，落而为萁。人生行乐耳，须富贵何时！是日也，拂衣而喜，奋袖低昂，顿足起舞，诚淫荒无度，不知其不可也。恽幸有余禄，方籴贱贩贵，逐什一之利。此贾竖之事，污辱之处，恽亲行之。下流之人，众毁所归，不寒而栗。虽雅知恽者，犹随风而靡，尚何称誉之有？董生不云乎：明明求仁义，常恐不能化民者，卿大夫之意也；明明求财利，常恐困乏者，庶人之事也。故道不同，不相为谋，今子尚安得以卿大夫之制而责仆哉！\n夫西河魏土，文侯所兴，有段干木、田子方之遗风，漂然皆有节概，知去就之分。顷者足下离旧土，临安定，安定山谷之间，昆戎旧壤，子弟贪鄙，岂习俗之移人哉？于今乃睹子之志矣。方当盛汉之隆，愿勉旃，毋多谈。"}]},{"prov":"陕西","name":"延安市","d":"M599.0 380.0 L597.0 358.3 L591.7 358.1 L589.6 353.8 L590.8 352.7 L586.6 352.6 L585.9 349.4 L582.3 348.2 L579.9 351.1 L572.3 352.7 L570.8 358.3 L566.6 357.8 L567.3 354.7 L565.3 349.9 L562.1 351.5 L563.1 352.8 L562.0 354.5 L556.9 356.2 L555.4 353.1 L553.5 355.5 L554.7 357.8 L553.4 361.1 L559.4 365.6 L562.2 365.0 L565.0 368.5 L568.5 368.8 L569.9 374.5 L569.0 378.1 L566.6 379.6 L566.9 383.7 L572.1 389.7 L577.3 385.3 L581.9 386.7 L582.3 389.6 L583.2 387.9 L591.7 388.6 L594.8 385.5 L592.9 382.8 L599.0 380.0 Z","v":0,"fd":"","texts":[{"t":"渔家傲·秋思","a":"范仲淹","d":"北宋","g":"初中九年级下","place":"边塞秋景","lt":"write","basis":"写作地延州（今陕西延安），范仲淹知延州作《渔家傲·秋思》，从写作地匹配","type":"词","full":"塞下秋来风景异，衡阳雁去无留意。四面边声连角起，千嶂里，长烟落日孤城闭。\n浊酒一杯家万里，燕然未勒归无计。羌管悠悠霜满地，人不寐，将军白发征夫泪。"},{"t":"七律·长征","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"五岭、乌蒙、金沙江、大渡河、岷山","lt":"famous","basis":"毛泽东自注1935年10月，中央红军抵达吴起镇后作","type":"七律","full":"红军不怕远征难，万水千山只等闲。五岭逶迤腾细浪，乌蒙磅礴走泥丸。金沙水拍云崖暖，大渡桥横铁索寒。更喜岷山千里雪，三军过后尽开颜。"},{"t":"六言诗·给彭德怀同志","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"吴起镇切尾巴战斗","lt":"famous","basis":"1935年10月吴起镇战斗后赠彭德怀之作","type":"六言诗","full":"山高路远坑深，大军纵横驰奔。谁敢横刀立马？唯我彭大将军。"},{"t":"临江仙·给丁玲同志","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"保安（今志丹县）窑洞","lt":"famous","basis":"1936年12月作于陕北保安县，今属延安市志丹县","type":"词","full":"壁上红旗飘落照，西风漫卷孤城。保安人物一时新。洞中开宴会，招待出牢人。纤笔一枝谁与似？三千毛瑟精兵。阵图开向陇山东。昨天文小姐，今日武将军。"}]},{"prov":"陕西","name":"汉中市","d":"M559.5 421.5 L549.1 422.6 L547.6 421.5 L548.2 419.4 L545.8 420.7 L543.8 418.4 L543.2 419.8 L540.5 418.3 L539.6 422.0 L537.6 421.6 L535.5 425.3 L533.8 423.2 L529.9 424.6 L526.4 423.5 L524.3 427.8 L522.3 427.8 L526.4 431.3 L525.6 435.3 L518.9 437.0 L520.0 440.5 L527.3 438.0 L528.9 440.6 L533.6 442.6 L538.6 440.3 L543.9 440.8 L544.1 444.0 L546.5 446.5 L549.7 444.3 L550.0 446.5 L553.1 446.6 L558.6 451.7 L561.5 449.5 L560.5 446.2 L563.1 444.9 L561.6 442.8 L562.9 442.6 L562.5 440.7 L559.9 437.6 L560.8 435.0 L559.0 430.2 L561.2 426.8 L559.5 421.5 Z","v":0,"fd":"","texts":[{"t":"后出师表","a":"诸葛亮","d":"—","g":"课外/补充-古文观止","place":"汉中","lt":"famous","basis":"诸葛亮第二次北伐前上后主表于汉中，武侯墓在今勉县","type":"表文（汉魏）","full":"先帝深虑汉、贼不两立,王业不偏安,故托臣以讨贼也。以先帝之明,量臣之才,固知臣伐贼,才弱敌强也。然不伐贼,王业亦亡。惟坐而待亡,孰与伐之?是故托臣而弗疑也。\n臣受命之日,寝不安席,食不甘味。思惟北征,宜先入南。故五月渡泸,深入不毛,并日而食。臣非不自惜也,顾王业不可得偏安于蜀都,故冒危难,以奉先帝之遗意,而议者谓为非计。今贼适疲于西,又务于东,兵法乘劳,此进趋之时也。谨陈其事如左:\n高帝明并日月,谋臣渊深,然涉险被创,危然后安。今陛下未及高帝,谋臣不如良、平,而欲以长策取胜,坐定天下,此臣之未解一也。\n刘繇、王朗,各据州郡,论安言计,动引圣人,群疑满腹,众难塞胸,今岁不战,明年不征,使孙策坐大,遂并江东,此臣之未解二也。\n曹操智计,殊绝于人,其用兵也,仿佛孙、吴,然困于南阳,险于乌巢,危于祁连,逼于黎阳,几败北山,殆死潼关,然后伪定一时耳。况臣才弱,而欲以不危而定之,此臣之未解三也。\n曹操五攻昌霸不下,四越巢湖不成,任用李服而李服图之,委任夏侯而夏侯败亡,先帝每称操为能,犹有此失,况臣驽下,何能必胜?此臣之未解四也。\n自臣到汉中,中间期年耳,然丧赵云、阳群、马玉、阎芝、丁立、白寿、刘郃、邓铜等及曲长、屯将七十余人,突将、无前、賨叟、青羌、散骑、武骑一千余人。此皆数十年之内,所纠合四方之精锐,非一州之所有。若复数年,则损三分之二也,当何以图敌?此臣之未解五也。\n今民穷兵疲,而事不可息。事不可息,则住与行,劳费正等。而不及今图之,欲以一州之地,与贼持久,此臣之未解六也。\n夫难平者,事也。昔先帝败军于楚,当此时也,曹操拊手,谓天下已定。然后先帝东连吴越,西取巴蜀,举兵北征,夏侯授首,此操之失计,而汉事将成也。然后吴更违盟,关羽毁败,秭归蹉跌,曹丕称帝。凡事如是,难可逆见。臣鞠躬尽瘁,死而后已。至于成败利钝,非臣之明所能逆睹也。"}]},{"prov":"陕西","name":"榆林市","d":"M597.0 358.3 L602.9 346.9 L602.3 343.2 L598.6 339.3 L598.4 334.9 L604.7 328.4 L605.9 319.7 L608.4 317.9 L610.1 313.3 L607.2 311.4 L608.4 307.8 L604.5 309.3 L601.2 314.0 L598.6 311.7 L596.4 313.1 L592.8 310.3 L593.7 313.7 L588.3 314.3 L589.1 317.1 L585.1 319.2 L584.4 321.9 L575.4 330.1 L573.5 334.5 L575.6 338.0 L573.5 340.0 L571.3 337.5 L571.0 344.6 L560.8 345.8 L558.4 342.6 L553.6 340.6 L547.8 346.0 L547.5 359.2 L551.4 361.1 L554.3 360.5 L554.7 357.8 L553.3 356.7 L555.4 353.1 L558.0 356.2 L560.6 353.9 L562.0 354.5 L563.1 352.8 L562.1 351.5 L565.3 349.9 L567.3 354.7 L566.6 357.8 L570.8 358.3 L572.3 352.7 L579.9 351.1 L582.3 348.2 L586.2 349.6 L586.6 352.6 L590.8 352.7 L589.6 353.8 L591.7 358.1 L597.0 358.3 Z","v":0,"fd":"","texts":[{"t":"沁园春·雪","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"北国雪景、黄河冰封","lt":"famous","basis":"1936年2月东征前作于清涧县袁家沟（今属榆林市）","type":"词","full":"北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽；大河上下，顿失滔滔。山舞银蛇，原驰蜡象，欲与天公试比高。须晴日，看红装素裹，分外妖娆。\n江山如此多娇，引无数英雄竞折腰。惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。一代天骄，成吉思汗，只识弯弓射大雕 ,"d":"—","g":"课外/补充-古文观止","place":"塞外","lt":"famous","basis":"李陵为陇西成纪人，兵败降匈奴后答苏武书","type":"书信（文选）","full":"子卿足下：\n勤宣令德，策名清时，荣问休畅，幸甚幸甚。远托异国，昔人所悲，望风怀想，能不依依？昔者不遗，远辱还答，慰诲勤勤，有逾骨肉，陵虽不敏，能不慨然？\n自从初降，以至今日，身之穷困，独坐愁苦。终日无睹，但见异类。韦韝毳幕，以御风雨；羶肉酪浆，以充饥渴。举目言笑，谁与为欢？胡地玄冰，边土惨裂，但闻悲风萧条之声。凉秋九月，塞外草衰。夜不能寐，侧耳远听，胡笳互动，牧马悲鸣，吟啸成群，边声四起。晨坐听之，不觉泪下。嗟乎子卿，陵独何心，能不悲哉！\n与子别后，益复无聊，上念老母，临年被戮；妻子无辜，并为鲸鲵；身负国恩，为世所悲。子归受荣，我留受辱，命也何如？身出礼义之乡，而入无知之俗；违弃君亲之恩，长为蛮夷之域，伤已！令先君之嗣，更成戎狄之族，又自悲矣。功大罪小，不蒙明察，孤负陵心区区之意。每一念至，忽然忘生。陵不难刺心以自明，刎颈以见志，顾国家于我已矣，杀身无益，适足增羞，故每攘臂忍辱，辄复苟活。左右之人，见陵如此，以为不入耳之欢，来相劝勉。异方之乐，只令人悲，增忉怛耳。\n嗟乎子卿，人之相知，贵相知心，前书仓卒，未尽所怀，故复略而言之。\n昔先帝授陵步卒五千，出征绝域。五将失道，陵独遇战，而裹万里之粮，帅徒步之师；出天汉之外，入强胡之域；以五千之众，对十万之军；策疲乏之兵，当新羁之马。然犹斩将搴旗，追奔逐北，灭迹扫尘，斩其枭帅，使三军之士，视死如归。陵也不才，希当大任，意谓此时，功难堪矣。匈奴既败，举国兴师。更练精兵，强逾十万。单于临阵，亲自合围。客主之形，既不相如；步马之势，又甚悬绝。疲兵再战，一以当千，然犹扶乘创痛，决命争首。死伤积野，余不满百，而皆扶病，不任干戈，然陵振臂一呼，创病皆起，举刃指虏，胡马奔走。兵尽矢穷，人无尺铁，犹复徒首奋呼，争为先登。当此时也，天地为陵震怒，战士为陵饮血。单于谓陵不可复得，便欲引还，而贼臣教之，遂使复战，故陵不免耳。\n昔高皇帝以三十万众，困于平城。当此之时，猛将如云，谋臣如雨，然犹七日不食，仅乃得免。况当陵者，岂易为力哉？而执事者云云，苟怨陵以不死。然陵不死，罪也；子卿视陵，岂偷生之士而惜死之人哉？宁有背君亲，捐妻子而反为利者乎？然陵不死，有所为也，故欲如前书之言，报恩于国主耳，诚以虚死不如立节，灭名不如报德也。昔范蠡不殉会稽之耻，曹沫不死三败之辱，卒复勾践之仇，报鲁国之羞，区区之心，窃慕此耳。何图志未立而怨已成，计未从而骨肉受刑，此陵所以仰天椎心而泣血也。\n足下又云：“汉与功臣不薄。”子为汉臣，安得不云尔乎？昔萧樊囚絷，韩彭菹醢，晁错受戮，周魏见辜。其余佐命立功之士，贾谊亚夫之徒，皆信命世之才，抱将相之具，而受小人之谗，并受祸败之辱，卒使怀才受谤，能不得展。彼二子之遐举，谁不为之痛心哉？陵先将军，功略盖天地，义勇冠三军，徒失贵臣之意，刭身绝域之表。此功臣义士所以负戟而长叹者也。何谓不薄哉？且足下昔以单车之使，适万乘之虏。遭时不遇，至于伏剑不顾；流离辛苦，几死朔北之野。丁年奉使，皓首而归；老母终堂，生妻去帷。此天下所希闻，古今所未有也。蛮貊之人，尚犹嘉子之节，况为天下之主乎？陵谓足下当享茅土之荐，受千乘之赏。闻子之归，赐不过二百万，位不过典属国，无尺土之封，加子之勤。而妨功害能之臣，尽为万户侯；亲戚贪佞之类，悉为廊庙宰。子尚如此，陵复何望哉？且汉厚诛陵以不死，薄赏子以守节，欲使远听之臣望风驰命，此实难矣，所以每顾而不悔者也。陵虽孤恩，汉亦负德。昔人有言：“虽忠不烈，视死如归。”陵诚能安，而主岂复能眷眷乎？男儿生以不成名，死则葬蛮夷中，谁复能屈身稽颡，还向北阙，使刀笔之吏弄其文墨耶？愿足下勿复望陵。\n嗟乎子卿，夫复何言？相去万里，人绝路殊。生为别世之人，死为异域之鬼。长与足下生死辞矣。幸谢故人，勉事圣君。足下胤子无恙，勿以为念。努力自爱，时因北风，复惠德音。李陵顿首。"},{"t":"立极同天，德合乾坤，百王仪则；开物成务，道传今古，万世文祖。","a":"胡缵宗集句","d":"—","g":"课外/补充-楹联","place":"甘肃天水伏羲庙","lt":"famous","basis":"集明代胡缵宗《伏羲赞》诗句，悬于伏羲庙大门檐柱","type":"楹联","full":"立极同天，德合乾坤，百王仪则；开物成务，道传今古，万世文祖。"}]},{"prov":"甘肃","name":"武威市","d":"M488.4 358.3 L492.9 345.6 L485.8 341.1 L485.3 336.8 L487.9 335.4 L486.0 330.6 L493 次选锚点俱不可确考，按覆盖补缺分配至新疆维吾尔自治区伊犁哈萨克自治州","type":"抒情骈文","full":"岁在单阏，客居江宁城南，出入经迴光寺，其左有废圃焉。寒流清泚，秋菘满田，室庐皆尽，唯古柏半生，风烟掩抑，怪石数峰，支离草际，明南苑妓马守真故居也。秦淮水逝，迹往名留，其色艺风情，故老遗闻，多能道者。余尝览其画迹，丛兰修竹，文弱不胜，秀气灵襟，纷披楮墨之外，未尝不爱赏其才，怅吾生之不及见也。\n夫托身乐籍，少长风尘，人生实难，岂可责之以死？婉娈倚门之笑，绸缪鼓瑟之娱，谅非得已。在昔婕妤悼伤，文姬悲愤，矧兹薄命，抑又下焉。嗟夫！天生此才，在于女子，百年千里，犹不可期，奈何钟美如斯，而摧辱之至于斯极哉！\n余单家孤子，寸田尺宅，无以治生。老弱之命，悬于十指。一从操翰，数更府主。俯仰异趣，哀乐由人。如黄祖之腹中，在本初之弦上。静言身世，与斯人其何异？只以荣期二乐，幸而为男，差无床簟之辱耳！\n江上之歌，怜以同病，秋风鸣鸟，闻者生哀，事有伤心，不嫌非偶。乃为辞曰：\n嗟佳人之信嫮兮，挺妍姿之绰约。羌既被此冶容兮，又工颦与善谑。攘皓腕以抒思兮，乍含毫以绵邈。寄幽怨于子墨兮，想蕙心之盘薄。惟生女而从人兮，固各安乎室家。何斯人之高秀兮，乃荡堕于女闾！奉君子之光仪兮，誓偕老以没身，何坐席之未温兮，又改服而事人。顾七尺其不自由兮，倏风荡而波沦。纷啼笑其感人兮，孰知其不出于余心。哆乐舞之婆娑兮，固非微躯之可任。哀吾生之鄙贱兮，又何矜乎才艺也。予夺其不可冯兮，吾又安知夫天意也。人固有不偶兮，将异世同其狼籍。遇秋气之恻怆兮，抚灵踪而太息。谅时命其不可为兮，独申哀而竟夕。"},{"t":"荷戈纪程","a":"林则徐","d":"清","g":"课外/补充-覆盖平衡新增","place":"伊犁河","lt":"famous","basis":"清·林则徐谪戍伊犁时修水利、察地形，作《荷戈纪程》，据《林则徐诗集》","type":"古文","full":"壬寅七月初六日壬子晴。已刻出西安城二十七里泗池汛，又二十里为沣水桥，俗谓之三里桥，沿岸北行二里许即渡渭。此处报水以分数计，是日水势浩瀚，舟人以为不止十分，幸舟过尚平稳。及登北岸，即咸阳县城矣。住东门内行馆。\n初七日癸丑晴。黎明行，出北门，颇有小坡，十五里上照，又十里双照，又十五里店张驿饭。其地属兴平，距县三十五里。饭罢又行，十里晏村，五里仪门寺，五里药王洞，十里醴泉县，馆于西门外。\n初八日甲寅晨行，天已阴，二十里至杨凤汛，雨渐大。又行二十里至乾州，馆于城内。因途中难行，即住此。\n初九日、初十日两日俱因阻雨发水未行，仍住乾州。\n十一日丁巳晴。黎明出北门，十里黑虎湾，八里十八里铺，十二里阳峪岭，十五里安驾宫桥，交永寿县界，又五里监军镇饭。此镇以监军名，阅祁鹤皋先生《万里行程记》，谓沿唐时宦官监军旧名。迨考《永寿县志》，乃知明崇祯时邑人任栋为河南监军道，家住于此。栋剿流贼被难，以忠义称，亦足以名其镇矣。饭后又行，五里旧永寿县，十里圪塔铺，五里蒿店塘，十里穆陵关，唐人许棠尝过此，有诗。五里沙庙店，五里老虎头，一里永寿县，馆于南城外。是日行九十里，自乾州至此皆向北行。按永寿在汉时为漆县，见《史记》，又为好时，见《汉书》。秦始皇起梁山宫，即太王踰梁山处也。《汉书·陆贾传》云以好时田地善，往家焉。今县之西南五十里有陆贾墓。唐长孙无忌窜居于此，今有子孙在焉。自过监军镇后，沿途多山，其民皆穴居，即古陶复陶穴之风，今士人谓之审洞。\n十二日戊午晴，寅正刻行，入南门出北门，即上坡，行五里分水岭，五里乏牛坡，十五里瑶垣坡，下坡五里为底害沟，沿途多有涧水，舆人皆涉过。又十里太峪镇，邠州辖，饭后上太峪坡，计坡路十里始下坡，又五里腰铺子，又五里十里铺，又七里三里台，又三里邠州城，入东门，馆于城内，与州署为邻，其署中求书者全集勉应之。\n十三日己未晴。黎明行，出西门，十里有明峇山，圆如覆盂，其下有水帘洞，泉出不涸，土人误信西游小说，谓其山即花果山者谬也。自此而西北，皆沿泾河行，水势浩瀚，泾水自甘肃平凉来，众水汇之，河宽处不下数百丈，两旁皆重山屹立如墙。又十里大佛寺，即庆寿寺，唐贞观二年所建也，佛有三尊，一正坐，二旁坐，高约八丈，宽约二三丈，皆就石岩凿而成。此外造像不可胜计。此二十里间枣树最多，其实已纂纂矣，桑林亦葱葱弥望，诚一幅豳风图也。十五里安仙镇，又五里则渡泾河，士人谓之黑水渡。过高岸即亭口镇，长武县辖，有行馆甚小，饭罢又行。自此至长武四十里，皆上高坡，肩舆须臾纬行。十里小村，土人谓之为马儿包；又十里文家；十里谓之三厂里；又五里冉店；又十五里至长武县城，馆于南门内。求书者又全集应之，至夜分始罢。\n十四日庚申阴。是日赴泾州，计程一百里，闻路甚长，天未明即行，幸无大坡。出西门十五里洪家铺，又十五里窑店，入甘肃泾州界，是处市集略大，为向卖嬴马之所。又十里张村铺，又五里氏云驿，饭后又行，忽起西北大风，凉甚。十五里高家硖，又十里三十里铺，又十里二十里铺，又十里太平关，又十里泾州城。行馆在东门外，颇宽敞，其前为严家山，相传为徙置严嵩家属处也。晚微雨。"}]},{"prov":"新疆","name":"塔城地区","d":"M188.8 201.1 L187.5 197.1 L190.6 190.5 L196.2 188.6 L200.2 180.9 L193.7 178.4 L192.5 174.2 L189.2 171.4 L190.4 168.4 L193.3 167.0 L190.2 164.2 L177.3 165.0 L162.9 160.2 L154.0 184.1 L152.1 185.0 L151.1 192.6 L155.3 194.8 L157.5 200.1 L170.0 203.5 L175.1 207.8 L175.1 213.4 L170.7 213.4 L169.5 216.9 L170.4 222.4 L176.5 223.3 L182.9 227.6 L187.1 227.2 L193.4 232.4 L195.1 230.8 L201.1 232.5 L203.7 231.5 L211.6 220.0 L209.8 219.4 L208.6 214.2 L212.1 213.4 L208.0 205.7 L204.8 204.6 L204.8 196.7 L198.1 196.7 L198.3 202.5 L195.0 204.4 L194.4 207.8 L194.5 210.4 L197.4 210.1 L198.2 213.2 L197.0 216.1 L194.1 216.4 L192.9 218.9 L190.0 220.0 L192.3 210.3 L188.3 207.1 L188.0 203.2 L186.5 203.3 L186.9 200.1 L188.8 201.1 ZM198.1 196.7 L231.2 196.7 L231.2 183.6 L226.5 174.0 L229.1 167.3 L226.4 164.9 L226.5 162.1 L211.3 163.9 L198.6 163.0 L190.4 168.4 L189.2 171.4 L195.4 179.6 L200.8 181.2 L204.5 179.6 L208.5 180.2 L210.4 182.4 L204.4 187.8 L202.0 193.1 L198.1 196.7 Z","v":1,"fd":"待定","texts":[{"t":"“知足常足，终身不辱；知止常止，终身不耻”","a":"佚名","d":"明清蒙学","g":"课外/补充-增广贤文","place":"【无实景，说理格言】","lt":"famous","basis":"蒙学格言无地理属性，作者不可考，作为蒙学通识素材按覆盖缺口分配至新疆维吾尔自治区塔城地区","type":"蒙学格言","full":"“知足常足，终身不辱；知止常止，终身不耻”"},{"t":"江格尔","a":"卫拉特蒙古民间","d":"—","g":"课外/补充-覆盖平衡新增","place":"江格尔","lt":"famous","basis":"蒙古族英雄史诗《江格尔》主要流传于新疆塔城/博尔塔拉卫拉特蒙古人中，据《江格尔》史诗版本","type":"史诗","full":"《江格尔》是卫拉特蒙古英雄史诗，与《格萨尔》《玛纳斯》并称中国三大英雄史诗。以韵文说唱叙述宝木巴国的缔造者江格尔汗与十二位勇士保卫家园、抵御外敌、追求太平的故事，在蒙古族聚居区口耳相传数百年，是研究蒙古语言、历史与英雄叙事传统的珍贵活态遗产。"}]},{"prov":"新疆","name":"阿勒泰地区","d":"M248.5 159.4 L246.6 158.3 L246.7 155.6 L250.0 149.4 L251.6 149.3 L247.9 146.1 L251.9 141.5 L251.3 138.5 L241.3 133.9 L243.2 131.1 L237.6 128.0 L240.3 126.1 L238.9 122.3 L232.8 124.2 L224.0 123.2 L221.6 125.8 L222.4 130.9 L219.3 134.5 L206.2 137.2 L203.0 142.3 L205.3 158.8 L202.7 163.3 L226.5 162.1 L226.2 158.5 L232.7 156.0 L234.7 157.5 const LS_HOLDER = 'jw_passport_holder_v1';
const LS_OVER   = 'jw_passport_overrides_v1';
function loadJSON(k,def){ try{ const s=localStorage.getItem(k); return s?JSON.parse(s):def; }catch(e){ return def; } }
function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* 持牒人 / 签发 / 文牒编号 */
const HOLDER_DEFAULT = {name:'',issuer:'',no:''};
let HOLDER = Object.assign({}, HOLDER_DEFAULT, loadJSON(LS_HOLDER,{}));
function saveHolder(){ saveJSON(LS_HOLDER, HOLDER); }

/* 每个地区的编辑覆盖：{fd, notes, v, del:[篇·作者], add:[{t,a,d,g,place,lt,type,full}]} */
let OV = loadJSON(LS_OVER, {}) || {};
function saveOver(){ saveJSON(LS_OVER, OV); }
function ovOf(name){ return OV[name] || (OV[name]={}); }

/* 合并基础数据与用户覆盖，得到当前展示状态 */
function getState(name){
  const o = PREF[name]; if(!o) return null;
  const ov = OV[name] || {};
  let texts = o.texts.slice();
  const del = ov.del || [];
  texts = texts.filter(t=> !del.includes(keyOf(t)));
  const add = ov.add || [];
  add.forEach(a=>{ texts.push(Object.assign({d:'—',g:'自添',place:'—',lt:'famous',type:'自添',full:''}, a, {_add:true})); });
  const v = (typeof ov.v==='boolean')? ov.v : o.v;
  return { prov:o.prov, v:v, fd:(ov.fd!=null?ov.fd:o.fd), notes: ov.notes||'', texts:texts, _ov:ov };
}
function keyOf(t){ return (t.t||'')+'·'+(t.a||''); }
/* 该单元是否存在“非默认”编辑（供 UI 提示） */
function hasEdit(name){
  const ov = OV[name]; if(!ov) return false;
  return !!(ov.fd||ov.notes||(typeof ov.v==='boolean')||(ov.del&&ov.del.length)||(ov.add&&ov.add.length));
}

  const wall=document.getElementById('wall');
  if(wall){ wall.innerHTML=''; PROVS.forEach(short=>{

    c.className='chip '+(on?'on':'off'); c.innerHTML=`<i class="s">${ABBR[short]||short.slice(0,2)}</i>${short}`;

/* 应用某单元的“已通关/未至”覆盖到地图与 VPROV */
function applyV(name, v){
  const pe=PREF_EL[name]; if(pe) pe.setAttribute('class','pref '+(v?'v':'u'));
  const prov=PREF[name].prov;
  // VPROV：以任一兄弟单元是否通关为准（合并后任意单元 visited 即视为该省通关）
  let onAny=false;
  (PREF_BY_PROV[prov]||[]).forEach(nm=>{ if(getState(nm).v) onAny=true; });
  if(onAny) VPROV.add(prov); else VPROV.delete(prov);
}

      <button class="btn editbtn" id="ezOpen">${editOpen?'收起编辑':'编辑'}</button>
    </div>
    ${editZone}
    <div class="pass-seal">${sealSVG(ABBR[prov]||prov.slice(0,2),88,st.v?'通关':'待达')}</div>
    <div class="pass-nav">
      <button class="btn" id="prevTxt" ${multi?'':'disabled'}>← 上一篇</button>
      <span class="pg">${multi?(curIdx+1)+' / '+texts.length:'单篇'}</span>
      <button class="btn" id="nextTxt" ${multi?'':'disabled'}>下一篇 →</button>
    </div>`;
  pass.innerHTML=body;
  const pv=document.getElementById('prevTxt'), nx=document.getElementById('nextTxt');
  if(pv) pv.onclick=()=>flip(-1);
  if(nx) nx.onclick=()=>flip(1);
  bindCardEvents(st);
  pass.querySelector('.close').focus();
}

function bindCardEvents(st){
  const name=curName;
  const ezOpen=document.getElementById('ezOpen');
  if(ezOpen) ezOpen.onclick=()=>{ editOpen=!editOpen; renderCard(); };
  const ezToggle=document.getElementById('ezToggle');
  if(ezToggle) ezToggle.onclick=()=>{
    const ov=ovOf(name); ov.v=!getState(name).v; saveOver();
    applyV(name, ov.v); refreshStats(); renderCard();
  };
  const ezFd=document.getElementById('ezFd');
  if(ezFd){ ezFd.oninput=()=>{ ovOf(name).fd=ezFd.value; saveOver(); };
            ezFd.onchange=()=>{ renderCard(); }; }
  const ezNotes=document.getElementById('ezNotes');
  if(ezNotes){ ezNotes.oninput=()=>{ ovOf(name).notes=ezNotes.value; saveOver(); };
               ezNotes.onchange=()=>{ renderCard(); }; }
  // 删除篇目
  pass.querySelectorAll('.ez-del').forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.getAttribute('data-i'); const tx=st.texts[i]; if(!tx) return;
      const ov=ovOf(name); ov.del=ov.del||[]; ov.add=ov.add||[];
      if(tx._add){ const k=keyOf(tx); const idx=ov.add.findIndex(a=>keyOf(a)===k); if(idx>=0) ov.add.splice(idx,1); }
      else if(!ov.del.includes(keyOf(tx))) ov.del.push(keyOf(tx));
      saveOver(); curIdx=0; renderCard();
    };
  });
  // 增篇目
  const ezAdd=document.getElementById('ezAdd'), ezMsg=document.getElementById('ezMsg');
  if(ezAdd) ezAdd.onclick=()=>{
    const t=document.getElementById('ezAt').value.trim();
    const a=document.getElementById('ezAa').value.trim();
    const d=document.getElementById('ezAd').value.trim();
    const f=document.getElementById('ezAf').value;
    if(!t){ ezMsg.textContent='请填写篇名'; return; }
    const ov=ovOf(name); ov.add=ov.add||[];
    ov.add.push({t:t,a:a||'佚名',d:d||'—',g:'自添',place:'—',lt:'famous',type:'自添',full:f||''});
    saveOver(); ezMsg.textContent='已加入！';
    setTimeout(()=>{ ezMsg.textContent=''; },1800);
    curIdx=st.texts.length; renderCard();
  };
  // 恢复默认
  const ezRestore=document.getElementById('ezRestore');
  if(ezRestore) ezRestore.onclick=()=>{
    delete OV[name]; saveOver();
    const o=PREF[name]; applyV(name, o.v); refreshStats(); renderCard();
  };
}

function flip(dir){
  const st=getState(curName); if(!st) return;
  let i=curIdx+dir;
  if(i<0)i=st.texts.length-1; if(i>=st.texts.length)i=0;
  curIdx=i; renderCard();
}

function openCard(name){
  if(!PREF[name])return;
  curName=name; curIdx=0;
  renderCard();
  mask.classList.add('show');
}

mask.addEventListener('click',e=>{
  if(e.target===mask){mask.classList.remove('show');return;}
  const c=e.target.closest('.close'); if(c){mask.classList.remove('show');return;}
});
document.addEventListener('keydown',e=>{
  if(!mask.classList.contains('show'))return;
  if(e.key==='Escape')mask.classList.remove('show');
  if(e.key==='ArrowRight')flip(1);
  if(e.key==='ArrowLeft')flip(-1);
});

/* ===================== 检索：篇名 / 作者 / 地点 ===================== */
const q=document.getElementById('q');
const qClear=document.getElementById('qClear');
const results=document.getElementById('results');
const numHit=document.getElementById('numHit');

function clearHighlight(){
  svg.classList.remove('searching');
  for(const k in PREF_EL) PREF_EL[k].classList.remove('hl');
  numHit.textContent='0';
}
function onSearch(){
  const term=q.value.trim().toLowerCase();
  qClear.classList.toggle('show', term.length>0);
  if(!term){ clearHighlight(); results.classList.remove('show'); results.innerHTML=''; return; }
  svg.classList.add('searching');
  const hits=[];
  for(const name in PREF){
    const o=PREF[name];
    let hit=false;
    if(name.toLowerCase().includes(term) || o.prov.toLowerCase().includes(term)) hit=true;
    if(!hit){
      for(const tx of o.texts){
        if(((tx.t||'')+' '+(tx.a||'')+' '+(tx.place||'')).toLowerCase().includes(term)){hit=true;break;}
      }
    }
    const pe=PREF_EL[name];
    if(hit){ pe.classList.add('hl'); hits.push(name); }
    else { pe.classList.remove('hl'); }
  }
  numHit.textContent=String(hits.length);
  // 结果列表
  results.classList.add('show');
  if(hits.length===0){
    results.innerHTML='<div class="rempty">未匹配到相关地区或古文</div>';
    return;
  }
  const head=document.createElement('div'); head.className='rhead';
  head.textContent=`命中 ${hits.length} 个地区（点击定位）`;
  results.innerHTML=''; results.appendChild(head);
  hits.slice(0,300).forEach(name=>{
    const o=PREF[name]; const t=o.texts[0];
    const it=document.createElement('div'); it.className='ritem';
    it.innerHTML=`<b>${name} <span style="color:#9a9184;font-weight:400">${o.prov}</span></b>`+
      `<span>${o.texts.length>1?o.texts.length+' 篇 · ':''}《${t.t}》<span class="rg"> ${t.a}</span></span>`;
    it.onclick=()=>{ openCard(name); };
    results.appendChild(it);
  });
}
q.addEventListener('input',onSearch);
qClear.addEventListener('click',()=>{ q.value=''; onSearch(); q.focus(); });

/* ===================== 统计面板 ===================== */
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function countTo(node,to,suffix,delay){
  if(reduce){node.textContent=to+(suffix||'');return;}
  setTimeout(()=>{
    const t0=performance.now(),dur=1100;
    (function step(now){
      const k=Math.max(0,Math.min(1,(now-t0)/dur)), e=1-Math.pow(1-k,3);
      node.textContent=Math.round(to*e)+(suffix||'');
      if(k<1)requestAnimationFrame(step);
    })(t0);
  },delay);
}
