从写作地匹配","type":"古诗","full":"梅花南北路，风雨湿征衣。出岭同谁出？归乡如不归！山河千古在，城郭一时非。饿死真吾志，梦中行采薇。"},{"t":"大铁椎传","a":"魏禧","d":"—","g":"课外/补充-明清古文","place":"无具体地点（传记）","lt":"famous","basis":"康熙九年作者隐居宁都翠微峰易堂时作","type":"传记散文","full":"大铁椎,不知何许人。北平陈子灿省兄河南,与遇宋将军家。宋,怀庆青华镇人,工技击,七省好事者皆来学,人以其雄健,呼宋将军云。宋弟子高信之,亦怀庆人,多力善射,长子灿七岁,少同学,故尝与过宋将军。时座上有健啖客,貌甚寝,右胁夹大铁椎,重四五十斤,饮食拱揖不暂去。柄铁折叠环复,如锁上练,引之长丈许。与人罕言语,语类楚声。扣其乡及姓字,皆不答。既同寝,夜半,客曰:\"吾去矣!\"言讫不见。子灿见窗户皆闭,惊问信之。信之曰:\"客初至,不冠不袜,以蓝手巾裹头,足缠白布,大铁椎外,一物无所持,而腰多白金。吾与将军俱不敢问也。\"子灿寐而醒,客则鼾睡炕上矣。一日,辞宋将军曰:\"吾始闻汝名,以为豪,然皆不足用。吾去矣!\"将军强留之,乃曰:\"吾数击杀响马贼,夺其物,故仇我。久居,祸且及汝。今夜半,方期我决斗某所。\"宋将军欣然曰:\"吾骑马挟矢以助战。\"客曰:\"止!贼能且众,吾欲护汝,则不快吾意。\"宋将军故自负,且欲观客所为,力请客。客不得已,与偕行。将至斗处,送将军登空堡上,曰:\"但观之,慎弗声,令贼知也。\"时鸡鸣月落,星光照旷野,百步见人。客驰下,吹觱篥数声。顷之,贼二十余骑四面集,步行负弓矢从者百许人。一贼提刀突奔客,客大呼挥椎,贼应声落马,马首裂。众贼环而进,客奋椎左右击,人马仆地,杀三十许人。宋将军屏息观之,股栗欲堕。忽闻客大呼曰:\"吾去矣。\"尘滚滚东向驰去。后遂不复至。魏禧论曰:子房得力士,椎秦皇帝博浪沙中,大铁椎其人欤!天生异人,必有所用之。予读陈同甫《中兴遗传》,豪俊、侠烈、魁奇之士,泯泯然不见功名于世者,又何多也!岂天之生才,不必为人用欤?抑用之自有其时欤?子灿遇大铁椎,为壬寅岁,当年三十;然则大铁椎今四十耳!子灿又尝见其写市物帖子,甚工楷书也。"},{"t":"渔家傲·反第一次大“围剿”","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"龙冈大捷、活捉张辉瓒","lt":"famous","basis":"1931年春龙冈战斗后作，龙冈圩属赣州兴国县","type":"词","full":"万木霜天红烂漫，天兵怒气冲霄汉。雾满龙冈千嶂暗，齐声唤，前头捉了张辉瓒。二十万军重入赣，风烟滚滚来天半。唤起工农千百万，同心干，不周山下红旗乱。"},{"t":"菩萨蛮·大柏地","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"大柏地战场彩虹","lt":"famous","basis":"1933年夏重过大柏地作，大柏地乡属赣州瑞金市","type":"词","full":"赤橙黄绿青蓝紫，谁持彩练当空舞？雨后复斜阳，关山阵阵苍。当年鏖战急，弹洞前村壁。装点此关山，今朝更好看。"},{"t":"清平乐·会昌","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"会昌山（岚山）","lt":"famous","basis":"1934年夏登会昌山后作于会昌","type":"词","full":"东方欲晓，莫道君行早。踏遍青山人未老，风景这边独好。会昌城外高峰，颠连直接东溟。战士指看南粤，更加郁郁葱葱。"}]},{"prov":"江西","name":"吉安市","d":"M658.2 540.1 L656.5 542.7 L654.2 543.0 L656.2 546.6 L651.1 555.0 L652.2 558.7 L655.4 559.5 L652.8 567.4 L657.4 567.1 L654.0 571.1 L660.5 569.0 L662.9 566.1 L670.8 567.8 L671.1 561.2 L674.9 557.6 L680.2 558.2 L680.8 554.1 L682.0 555.1 L684.4 551.9 L679.7 547.6 L681.1 542.7 L678.9 541.1 L681.2 537.1 L677.9 532.9 L675.8 533.0 L674.3 536.2 L667.7 539.8 L666.1 539.1 L663.8 541.0 L661.9 539.5 L658.2 540.1 Z","v":0,"fd":"","texts":[{"t":"小池","a":"杨万里","d":"南宋","g":"小学一年级下","place":"初夏小池","lt":"write","basis":"写作地吉水（今江西吉水县，属吉安市），从写作地匹配","type":"古诗","full":"泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。"},{"t":"晓出净慈寺送林子方","a":"杨万里","d":"南宋","g":"小学二年级下","place":"西湖荷塘","lt":"birth","basis":"杨万里吉州吉水人（今江西吉水，由吉安市代管），据作者故乡匹配江西吉安市","type":"古诗","full":"毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。"},{"t":"稚子弄冰","a":"杨万里","d":"南宋","g":"小学五年级下","place":"孩童庭院","lt":"write","basis":"写作地吉水（今江西吉水县，属吉安市），从写作地匹配","type":"古诗","full":"稚子金盆脱晓冰，彩丝穿取当银钲。敲成玉磬穿林响，忽作玻璃碎地声。"},{"t":"过松源晨炊漆公店（其五）","a":"杨万里","d":"南宋","g":"初中七年级下","place":"山区行路","lt":"birth","basis":"作者杨万里故里吉州吉水（今江西吉水县，属吉安市），'皖南赣东道中'不可考具体城，从作者故乡匹配","type":"古诗","full":"莫言下岭便无难，赚得行人错喜欢。\n政入万山围子里，一山放出一山拦。"},{"t":"登快阁","a":"黄庭坚","d":"北宋","g":"高中选择性必修下","place":"泰和快阁","lt":"write","basis":"写作地太和（今江西泰和县，属吉安市），黄庭坚知泰和县登快阁作，从写作地匹配","type":"古诗","full":"痴儿了却公家事，快阁东西倚晚晴。落木千山天远大，澄江一道月分明。朱弦已为佳人绝，青眼聊因美酒横。万里归船弄长笛，此心吾与白鸥盟。"},{"t":"西江月·井冈山","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"井冈山黄洋界保卫战","lt":"famous","basis":"1928年秋黄洋界保卫战胜利后作于井冈山","type":"词","full":"山下旌旗在望，山头鼓角相闻。敌军围困万千重，我自岿然不动。早已森严壁垒，更加众志成城。黄洋界上炮声隆，报道敌军宵遁。"},{"t":"水调歌头·重上井冈山","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"井冈山、黄洋界","lt":"famous","basis":"1965年5月重上井冈山（时隔38年）后作","type":"词","full":"久有凌云志，重上井冈山。千里来寻故地，旧貌变新颜。到处莺歌燕舞，更有潺潺流水，高路入云端。过了黄洋界，险处不须看。风雷动，旌旗奋，是人寰。三十八年过去，弹指一挥间。可上九天揽月，可下五洋捉鳖，谈笑凯歌还。世上无难事，只要肯登攀。"},{"t":"泷冈阡表","a":"欧阳修","d":"—","g":"课外/补充-古文观止","place":"泷冈（今江西吉安永丰凤凰山）","lt":"famous","basis":"欧阳修父母葬于永丰泷冈，熙宁三年知青州时书阡表","type":"墓表","full":"呜呼！惟我皇考崇公，卜吉于泷冈之六十年，其子修始克表于其阡。非敢缓也，盖有待也。\n修不幸，生四岁而孤。太夫人守节自誓，居穷，自力于衣食，以长以教，俾至于成人。太夫人告之曰：汝父为吏，廉而好施与，喜宾客；其俸禄虽薄，常不使有余，曰：毋以是为我累。故其亡也，无一瓦之覆，一垄之植，以庇而为生，吾何恃而能自守邪？吾于汝父，知其一二，以有待于汝也。自吾为汝家妇，不及事吾姑，然知汝父之能养也。汝孤而幼，吾不能知汝之必有立，然知汝父之必将后也。\n吾之始归也，汝父免于母丧方逾年，岁时祭祀，则必涕泣曰：祭而丰，不如养之薄也。间御酒食，则又涕泣曰：昔常不足，而今有余，其何及也！吾始一二见之，以为新免于丧适然耳。既而其后常然，至其终身未尝不然。吾虽不及事姑，而以此知汝父之能养也。\n汝父为吏，尝夜烛治官书，屡废而叹。吾问之，则曰：此死狱也，我求其生不得尔。吾曰：生可求乎？曰：求其生而不得，则死者与我皆无恨也；矧求而有得邪？以其有得，则知不求而死者有恨也。夫常求其生，犹失之死，而世常求其死也。回顾乳者，携汝而立于旁，因指而叹曰：术者谓我岁行在戌将死，使其言然，吾不及见儿之立也，后当以我语告之。其平居教他子弟，常用此语，吾耳熟焉，故能详也。其施于外事，吾不能知；其居于家，无所矜饰，而所为如此，是真发于中者邪！呜呼！其心厚于仁者邪！此吾知汝父之必将后也。汝其勉之！夫养不必丰，要于孝；利虽不得博于物，要其心之厚于仁。吾不能教汝，此汝父之志也。修泣而志之，不敢忘。\n先公少孤力学，咸平三年进士及第，为道州判官，泗、绵二州推官，又为泰州判官。享年五十有九，葬沙溪之泷冈。\n太夫人姓郑氏，考讳德仪，世为江南名族。太夫人恭俭仁爱而有礼，初封福昌县太君，进封乐安、安康、彭城三郡太君。自其家少微时，治其家以俭约，其后常不使过之，曰：吾儿不能苟合于世，俭薄所以居患难也。其后修贬夷陵，太夫人言笑自若，曰：汝家故贫贱也，吾处之有素矣。汝能安之，吾亦安矣。\n自先公之亡二十年，修始得禄而养。又十有二年，列官于朝，始得赠封其亲。又十年，修为龙图阁直学士、尚书吏部郎中、留守南京，太夫人以疾终于官舍，享年七十有二。又八年，修以非才入副枢密，遂参政事，又七年而罢。自登二府，天子推恩，其三世，盖自嘉祐以来，逢国大庆，必加宠锡。皇曾祖府君累赠金紫光禄大夫、太师、中书令；曾祖妣累封楚国太夫人。皇祖府君累赠金紫光禄大夫、太师、中书令兼尚书令，祖妣累封吴国太夫人。皇考崇公累赠金紫光禄大夫、太师、中书令兼尚书令，皇妣累封越国太夫人。今上初郊，皇考赐爵为崇国公，太夫人进号魏国。\n于是小子修泣而言曰：呜呼！为善无不报，而迟速有时，此理之常也。惟我祖考，积善成德，宜享其隆，虽不克有于其躬，而赐爵受封，显荣褒大，实有三朝之锡命，是足以表见于后世，而庇赖其子孙矣。乃列其世谱，具刻于碑。既又载我皇考崇公之遗训，太夫人之所以教而有待于修者，并揭于阡，俾知夫小子修之德薄能鲜，遭时窃位，而幸全大节，不辱其先者，其来有自。\n熙宁三年，岁次庚戌，四月辛酉朔十有五日乙亥，男推诚保德崇仁翊戴功臣，观文殿学士、特进、行兵部尚书、知青州军州事兼管内劝农使、充京东东路安抚使、上柱国、乐安郡开国公，食邑四千三百户，食实封一千二百户修表。"},{"t":"插秧歌","a":"杨万里","d":"南宋","g":"高中必修上","place":"江南插秧田间","lt":"famous","basis":"作于吉水（今属吉安市），写江南插秧农事","type":"古诗","full":"田夫抛秧田妇接，小儿拔秧大儿插。笠是兜鍪蓑是甲，雨从头上湿到胛。唤渠朝餐歇半霎，低头折腰只不答。秧根未牢莳未匝，照管鹅儿与雏鸭。"}]},{"prov":"江西","name":"宜春市","d":"M662.1 539.6 L663.0 535.6 L661.4 533.9 L664.3 529.9 L667.7 531.5 L672.0 530.5 L672.6 534.3 L677.9 532.9 L681.2 537.1 L682.9 537.1 L683.3 534.7 L687.3 531.8 L686.6 526.3 L683.5 526.4 L682.5 524.1 L679.8 525.4 L679.4 523.8 L678.0 524.3 L678.9 520.8 L678.4 517.8 L676.5 517.2 L678.0 515.2 L676.6 511.4 L673.0 510.7 L669.6 512.4 L667.9 517.0 L665.4 518.6 L662.7 517.0 L659.2 518.3 L657.1 515.9 L656.2 517.0 L655.1 521.1 L657.2 522.6 L657.8 525.6 L653.6 528.8 L654.5 530.8 L652.4 532.0 L653.8 532.8 L652.1 535.2 L656.0 536.5 L658.1 540.1 L662.1 539.6 Z","v":0,"fd":"","texts":[{"t":"书博鸡者事","a":"高启","d":"—","g":"课外/补充-明清古文","place":"今江西省宜春市（元袁州）","lt":"desc","basis":"高启长洲人（今江苏苏州），文记袁州事（今江西宜春），据描写地点匹配江西宜春市","type":"传记散文","full":"博鸡者，袁人，素无赖，不事产业，日抱鸡呼少年博市中。任气好斗，诸为里侠者皆下之。\n元至正间，袁有守多惠政，民甚爱之。部使者臧新贵，将按郡至袁。守自负年德易之，闻其至，笑曰：“臧氏之子也。”或以告臧，臧怒，欲中守法。会袁有豪民尝受守杖，知使者意嗛守，即诬守纳己赇。使者遂逮守，胁服，夺其官。袁人大愤，然未有以报也。\n一日，博鸡者遨于市。众知有为，因让之曰：“若素名勇，徒能藉贫孱者耳，彼豪民恃其资，诬去贤使君，袁人失父母；若诚丈夫，不能为使君一奋臂耶？”博鸡者曰：“诺。”即入闾左，呼子弟素健者，得数十人，遮豪民于道。豪民方华衣乘马，从群奴而驰，博鸡者直前捽下，提殴之。奴惊，各亡去。乃褫豪民衣自衣，复自策其马，麾众拥豪民马前，反接，徇诸市。使自呼曰：“为民诬太守者视此！”一步一呼，不呼则杖，其背尽创。豪民子闻难，鸠宗族童奴百许人，欲要篡以归。博鸡者逆谓曰：“若欲死而父，即前斗。否则阖门善俟。吾行市毕，即归若父，无恙也。”豪民子惧遂杖杀其父，不敢动，稍敛众以去。袁人相聚从观，欢动一城。郡录事骇之，驰白府。府佐快其所为，阴纵之不问。日暮，至豪民第门，捽使跪，数之曰：“若为民不自谨，冒使君，杖汝，法也；敢用是为怨望，又投间蔑污使君，使罢。汝罪宜死，今姑贷汝。后不善自改，且复妄言，我当焚汝庐、戕汝家矣！”豪民气尽，以额叩地，谢不敢。乃释之。\n博鸡者因告众曰：“是足以报使君未耶？”众曰：“若所为诚快，然使君冤未白，犹无益也。”博鸡者曰：“然。”即连楮为巨幅，广二丈，大书一“屈”字，以两竿夹揭之，走诉行御史台。台臣弗为理。乃与其徒日张“屈”字游金陵市中。台臣惭，追受其牒，为复守官而黜臧使者。\n方是时，博鸡者以义闻东南。\n高子曰：余在史馆，闻翰林天台陶先生言博鸡者之事。观袁守虽得民，然自喜轻上，其祸非外至也。臧使者枉用三尺，以仇一言之憾，固贼戾之士哉！第为上者不能察，使匹夫攘袂群起，以伸其愤，识音固知元政紊弛，而变兴自下之渐矣。"}]},{"prov":"江西","name":"抚州市","d":"M684.4 551.9 L685.5 549.1 L687.4 548.7 L688.4 550.9 L687.3 556.6 L691.4 560.8 L692.6 559.0 L694.2 559.5 L693.6 556.7 L695.9 552.0 L700.2 550.9 L703.9 546.1 L701.3 539.2 L704.5 538.0 L706.1 535.2 L703.2 533.7 L701.7 534.7 L700.2 530.1 L696.4 527.7 L698.2 527.0 L697.7 524.8 L694.6 524.6 L694.2 522.3 L692.7 527.1 L689.0 528.9 L687.3 527.3 L686.7 532.9 L683.3 534.7 L682.9 537.1 L681.2 537.1 L679.2 540.1 L681.1 542.7 L679.7 547.6 L684.4 551.9 Z","v":0,"fd":"","texts":[{"t":"答司马谏议书","a":"王安石","d":"北宋","g":"高中必修下","place":"汴京书信","lt":"birth","basis":"王安石抚州临川人（今江西抚州），据作者故乡匹配江西抚州市","type":"文言文","full":"某启：\n昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。\n盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。\n人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已。盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。"},{"t":"游园（皂罗袍）","a":"汤显祖","d":"明","g":"高中必修下","place":"杜丽娘后花园","lt":"write","basis":"写作地临川（今江西抚州），汤显祖故里临川，从写作地匹配","type":"曲","full":"原来姹紫嫣红开遍，似这般都付与断井颓垣。良辰美景奈何天，赏心乐事谁家院！朝飞暮卷，云霞翠轩；雨丝风片，烟波画船——锦屏人忒看的这韶光贱！"},{"t":"减字木兰花·广昌路上","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"风雪漫天的行军","lt":"famous","basis":"1930年2月率红军途经广昌时作","type":"词","full":"漫天皆白，雪里行军情更迫。头上高山，风卷红旗过大关。此行何去？赣江风雪迷漫处。命令昨颁，十万工农下吉安。"},{"t":"墨池记","a":"曾巩","d":"—","g":"课外/补充-古文观止","place":"临川州学墨池","lt":"famous","basis":"王羲之临池学书处传说在临川州学，曾巩应州学教授之请作记","type":"记文","full":"临川之城东,有地隐然而高,以临于溪,曰新城。新城之上,有池洼然而方以长,曰王羲之之墨池者,荀伯子《临川记》云也。羲之尝慕张芝,临池学书,池水尽黑,此为其故迹,岂信然邪?方羲之之不可强以仕,而尝极东方,出沧海,以娱其意于山水之间,岂其徜徉肆恣,而又尝自休于此邪?羲之之书晚乃善,则其所能,盖亦以精力自致者,非天成也。然后世未有能及者,岂其学不如彼邪?则学固岂可以少哉!况欲深造道德者邪?墨池之上,今为州学舍。教授王君盛恐其不章也,书\"晋王右军墨池\"之六字于楹间以揭之,又告于巩曰:\"愿有记。\"推王君之心,岂爱人之善,虽一能不以废,而因以及乎其迹邪?其亦欲推其事,以勉其学者邪?夫人之有一能,而使后人尚之如此,况仁人庄士之遗风余思,被于来世者何如哉!庆历八年九月十二日,曾巩记。"}]},{"prov":"江西","name":"上饶市","d":"M708.3 533.2 L709.7 532.3 L713.0 535.8 L714.8 533.0 L722.7 530.1 L722.1 527.6 L724.7 525.7 L723.2 516.7 L717.7 510.6 L718.2 507.0 L720.4 505.9 L719.4 502.9 L714.2 501.5 L709.3 504.1 L707.2 508.9 L709.1 509.5 L708.5 513.1 L710.0 516.3 L707.5 515.9 L705.2 518.0 L700.6 514.4 L702.5 510.6 L701.4 507.1 L702.7 499.0 L698.4 501.6 L693.5 501.0 L695.7 508.1 L692.9 509.6 L689.3 516.4 L692.5 518.4 L694.4 524.4 L697.9 525.3 L699.4 522.1 L705.4 520.1 L705.5 528.8 L708.2 529.8 L708.3 533.2 Z","v":0,"fd":"","texts":[{"t":"村居","a":"高鼎","d":"清","g":"小学二年级下","place":"江南乡村春日","lt":"write","basis":"写作地上饶（今江西上饶），从写作地匹配","type":"古诗","full":"草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。"},{"t":"清平乐·村居","a":"辛弃疾","d":"南宋","g":"小学四年级下","place":"江南乡村","lt":"write","basis":"写作地信州（今江西上饶），从写作地匹配","type":"词","full":"茅檐低小，溪上青青草。醉里吴音相媚好，白发谁家翁媪？\n大儿锄豆溪东，中儿正织鸡笼。最喜小儿亡赖，溪头卧剥莲蓬。"},{"t":"西江月·夜行黄沙道中","a":"辛弃疾","d":"南宋","g":"小学六年级上","place":"黄沙岭（江西上饶）","lt":"write","basis":"写作地信州（今江西上饶），黄沙岭在上饶，从写作地匹配","type":"词","full":"明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。\n七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。"},{"t":"丑奴儿·书博山道中壁","a":"辛弃疾","d":"南宋","g":"初中九年级上","place":"博山道中","lt":"write","basis":"写作地上饶博山（今江西广丰区，属上饶市），辛弃疾瓢泉闲居时作，从写作地匹配","type":"词","full":"少年不识愁滋味，爱上层楼。爱上层楼，为赋新词强说愁。而今识尽愁滋味，欲说还休。欲说还休，却道天凉好个秋。"},{"t":"破阵子·为陈同甫赋壮词以寄之","a":"辛弃疾","d":"南宋","g":"初中九年级下","place":"军营追忆","lt":"write","basis":"写作地江西上饶，辛弃疾闲居上饶带湖作，从写作地匹配","type":"词","full":"醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。马作的卢飞快，弓如霹雳弦惊。了却君王天下事，赢得生前身后名。可怜白发生！"}]},{"prov":"山东","name":"济南市","d":"M694.1 369.3 L689.0 373.8 L690.1 376.6 L694.4 375.1 L693.5 372.3 L697.7 371.1 L700.9 372.5 L705.8 368.0 L708.4 375.5 L716.3 377.2 L716.7 372.0 L712.3 366.2 L713.1 362.7 L710.0 358.2 L707.5 358.7 L706.3 357.4 L708.5 355.7 L705.6 347.5 L701.6 349.4 L702.2 355.2 L699.3 357.8 L700.7 360.9 L694.1 369.3 Z","v":1,"fd":"待定","texts":[{"t":"夏日绝句","a":"李清照","d":"南宋","g":"小学四年级上","place":"怀古乌江","lt":"birth","basis":"李清照济南章丘人（今山东章丘，由济南市代管），据作者故乡匹配山东济南市","type":"古诗","full":"生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。"},{"t":"声声慢","a":"李清照","d":"南宋","g":"高中必修上","place":"南渡寓居地","lt":"birth","basis":"李清照济南章丘人（今山东章丘，由济南市代管），据作者故乡匹配山东济南市","type":"词","full":"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急？雁过也，正伤心，却是旧时相识。\n满地黄花堆积，憔悴损，如今有谁堪摘？守着窗儿，独自怎生得黑？梧桐更兼细雨，到黄昏、点点滴滴。这次第，怎一个愁字了得！"},{"t":"渔家傲（天接云涛连晓雾）","a":"李清照","d":"南宋","g":"初中八年级上","place":"梦境云天星河","lt":"birth","basis":"李清照济南章丘人（今山东章丘，由济南市代管），据作者故乡匹配山东济南市","type":"词","full":"天接云涛连晓雾，星河欲转千帆舞。仿佛梦魂归帝所，闻天语，殷勤问我归何处。我报路长嗟日暮，学诗谩有惊人句。九万里风鹏正举。风休住，蓬舟吹取三山去！"},{"t":"如梦令（常记溪亭日暮）","a":"李清照","d":"南宋","g":"初中八年级上","place":"溪亭游赏","lt":"write","basis":"写作地济南溪亭（今山东济南），李清照故里济南，从写作地匹配","type":"词","full":"常记溪亭日暮，沉醉不知归路。兴尽晚回舟，误入藕花深处。争渡，争渡，惊起一滩鸥鹭。"},{"t":"山坡羊·骊山怀古","a":"张养浩","d":"元","g":"初中九年级下","place":"骊山怀古","lt":"birth","basis":"张养浩济南人（今山东济南），据作者故乡匹配山东济南市","type":"曲","full":"骊山四顾，阿房一炬，当时奢侈今何处？只见草萧疏，水萦纡。至今遗恨迷烟树。列国周齐秦汉楚。赢，都变做了土；输，都变做了土！"},{"t":"海右此亭古；济南名士多。","a":"杜甫诗句、何绍基书","d":"—","g":"课外/补充-楹联","place":"山东济南大明湖历下亭","lt":"famous","basis":"集杜甫《陪李北海宴历下亭》诗句，清何绍基书，悬于历下亭大门","type":"楹联","full":"海右此亭古；济南名士多。"}]},{"prov":"山东","name":"青岛市","d":"M762.3 365.3 L758.9 366.1 L757.4 362.3 L758.5 357.4 L757.0 354.9 L754.3 356.3 L752.5 355.4 L751.3 357.6 L742.6 357.6 L741.6 363.1 L749.0 368.1 L746.0 373.9 L743.6 373.7 L744.6 379.8 L742.7 380.8 L742.8 382.7 L741.2 382.5 L741.5 385.1 L746.9 384.7 L747.6 381.8 L749.0 382.7 L750.0 379.4 L753.6 377.7 L750.6 375.2 L751.7 373.2 L754.5 373.3 L753.5 376.3 L760.1 374.7 L759.8 369.6 L761.9 368.1 L762.6 370.1 L764.1 367.9 L762.3 365.3 Z","v":1,"fd":"2026.07","texts":[{"t":"\"嫁女择佳婿，毋索重聘\"","a":"朱柏庐","d":"清","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《朱子治家格言》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"蒙学格言","full":"嫁女择佳婿，毋索重聘"}]},{"prov":"山东","name":"淄博市","d":"M716.9 378.2 L718.8 376.6 L721.2 378.6 L725.1 377.8 L724.9 374.7 L722.0 372.3 L719.9 365.9 L724.9 358.9 L719.7 358.2 L717.0 352.7 L711.7 352.5 L710.4 356.1 L714.7 356.5 L716.5 359.3 L712.2 365.5 L716.7 372.0 L715.6 373.8 L716.9 378.2 Z","v":1,"fd":"待定","texts":[{"t":"狼","a":"蒲松龄","d":"清","g":"初中七年级上","place":"屠户野外途中","lt":"write","basis":"写作地淄川（今山东淄博淄川区），蒲松龄故里，从写作地匹配","type":"文言文","full":"一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。"},{"t":"鱼我所欲也","a":"孟子《孟子》","d":"战国","g":"初中九年级下","place":"说理无实景","lt":"write","basis":"写作地齐国（都临淄，今山东淄博临淄区），孟子游齐时讲论，从写作地匹配","type":"文言文","full":"鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。"},{"t":"得道多助失道寡助","a":"孟子《孟子》","d":"战国","g":"初中九年级下","place":"说理无实景","lt":"write","basis":"写作地齐国（都临淄，今山东淄博临淄区），孟子游齐时讲论，从写作地匹配","type":"文言文","full":"天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。"},{"t":"富贵不能淫","a":"孟子《孟子》","d":"战国","g":"初中九年级下","place":"说理无实景","lt":"write","basis":"写作地齐国（都临淄，今山东淄博临淄区），孟子游齐时讲论，从写作地匹配","type":"文言文","full":"景春曰：\"公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。\"孟子曰：\"是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：'往之女家，必敬必戒，无违夫子！'以顺为正者，妾妇之道也。居天下之广居，立天下之正位，行天下之大道。得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈。此之谓大丈夫。\""},{"t":"生于忧患死于安乐","a":"孟子《孟子》","d":"战国","g":"初中九年级下","place":"说理无实景","lt":"write","basis":"写作地齐国（都临淄，今山东淄博临淄区），孟子游齐时讲论，从写作地匹配","type":"文言文","full":"舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。然后知生于忧患而死于安乐也。"},{"t":"齐桓晋文之事","a":"孟子《孟子》","d":"战国","g":"高中必修下","place":"齐国宫廷","lt":"write","basis":"写作地齐国临淄（今山东淄博临淄区），孟子游齐时对齐宣王言，从写作地匹配","type":"文言文","full":"齐宣王问曰：“齐桓、晋文之事，可得闻乎？”\n孟子对曰：“仲尼之徒，无道桓、文之事者，是以后世无传焉，臣未之闻也。无以，则王乎？”曰：“德何如，则可以王矣？”曰：“保民而王，莫之能御也。”曰：“若寡人者，可以保民乎哉？”曰：“可。”曰：“何由知吾可也？”曰：“臣闻之胡龁曰：‘王坐于堂上，有牵牛而过堂下者，王见之，曰：“牛何之？”对曰：“将以衅钟。”王曰：“舍之！吾不忍其觳觫，若无罪而就死地。”对曰：“然则废衅钟与？”曰：“何可废也，以羊易之。”’不识有诸？”曰：“有之。”\n曰：“是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。”王曰：“然，诚有百姓者。齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也。”曰：“王无异于百姓之以王为爱也。以小易大，彼恶知之？王若隐其无罪而就死地，则牛羊何择焉？”王笑曰：“是诚何心哉！我非爱其财而易之以羊也，宜乎百姓之谓我爱也。”曰：“无伤也，是乃仁术也，见牛未见羊也。君子之于禽兽也，见其生，不忍见其死；闻其声，不忍食其肉。是以君子远庖厨也。”\n王说，曰：“《诗》云：‘他人有心，予忖度之。’夫子之谓也。夫我乃行之，反而求之，不得吾心；夫子言之，于我心有戚戚焉。此心之所以合于王者何也？”曰：“有复于王者曰：‘吾力足以举百钧，而不足以举一羽；明足以察秋毫之末，而不见舆薪。’则王许之乎？”曰：“否。”“今恩足以及禽兽，而功不至于百姓者，独何与？然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。”曰：“不为者与不能者之形，何以异？”曰：“挟太山以超北海，语人曰：‘我不能。’是诚不能也。为长者折枝，语人曰：‘我不能。’是不为也，非不能也。故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。”\n“老吾老，以及人之老；幼吾幼，以及人之幼。天下可运于掌。《诗》云：‘刑于寡妻，至于兄弟，以御于家邦。’言举斯心加诸彼而已。故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而已矣。今恩足以及禽兽，而功不至于百姓者，独何与？权，然后知轻重；度，然后知长短。物皆然，心为甚，王请度之。”\n“抑王兴甲兵，危士臣，构怨于诸侯，然后快于心与？”王曰：“否，吾何快于是？将以求吾所大欲也。”曰：“王之所大欲，可得闻与？”王笑而不言。曰：“为肥甘不足于口与？轻暖不足于体与？抑为采色不足视于目与？声音不足听于耳与？便嬖不足使令于前与？王之诸臣皆足以供之，而王岂为是哉？”曰：“否，吾不为是也。”曰：“然则王之所大欲可知已：欲辟土地，朝秦楚，莅中国而抚四夷也。以若所为，求若所欲，犹缘木而求鱼也。”\n王曰：“若是其甚与？”曰：“殆有甚焉。缘木求鱼，虽不得鱼，无后灾；以若所为，求若所欲，尽心力而为之，后必有灾。”曰：“可得闻与？”曰：“邹人与楚人战，则王以为孰胜？”曰：“楚人胜。”曰：“然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。海内之地，方千里者九，齐集有其一。以一服八，何以异于邹敌楚哉？盍亦反其本矣？今王发政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野，商贾皆欲藏于王之市，行旅皆欲出于王之涂，天下之欲疾其君者皆欲赴愬于王。其若是，孰能御之？”\n王曰：“吾惛，不能进于是矣。愿夫子辅吾志，明以教我。我虽不敏，请尝试之。”曰：“无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。苟无恒心，放辟邪侈，无不为已。及陷于罪，然后从而刑之，是罔民也。焉有仁人在位罔民而可为也？是故明君制民之产，必使仰足以事父母，俯足以畜妻子，乐岁终身饱，凶年免于死亡；然后驱而之善，故民之从之也轻。”\n“今也制民之产，仰不足以事父母，俯不足以畜妻子，乐岁终身苦，凶年不免于死亡。此惟救死而恐不赡，奚暇治礼义哉？王欲行之，则盍反其本矣：五亩之宅，树之以桑，五十者可以衣帛矣；鸡、豚、狗、彘之畜，无失其时，七十者可以食肉矣；百亩之田，勿夺其时，八口之家可以无饥矣；谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。”"},{"t":"人皆有不忍人之心","a":"孟子《孟子》","d":"战国","g":"高中选择性必修上","place":"说理无实景","lt":"write","basis":"写作地齐国（都临淄，今山东淄博临淄区），孟子游齐时讲论，从写作地匹配","type":"文言文","full":"孟子曰：人皆有不忍人之心。先王有不忍人之心，斯有不忍人之政矣。如恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也。人之有是四端也，犹其有四体也。\n孟子曰：「大而化之之谓圣，圣而不可知之谓神。」伯夷，圣之清者也；伊尹，圣之任者也；柳下惠，圣之和者也；孔子，圣之时者也。\n孟子曰：「君子所以异于人者，以其存心也。君子以仁存心，以礼存心。仁者如射，射者正己而后发；发而不中，不怨胜己者，反求诸己而已矣。」"},{"t":"促织","a":"蒲松龄","d":"清","g":"高中选择性必修下","place":"华阴【虚构故事】","lt":"write","basis":"写作地淄川（今山东淄博淄川区），蒲松龄故里作《促织》，从写作地匹配","type":"文言文","full":"宣德间，宫中尚促织之戏，岁征民间。此物故非西产；有华阴令欲媚上官，以一头进，试使斗而才，因责常供。令以责之里正。市中游侠儿得佳者笼养之，昂其直，居为奇货。里胥猾黠，假此科敛丁口，每责一头，辄倾数家之产。\n邑有成名者，操童子业，久不售。为人迂讷，遂为猾胥报充里正役，百计营谋不能脱。不终岁，薄产累尽。会征促织，成不敢敛户口，而又无所赔偿，忧闷欲死。妻曰：“死何裨益？不如自行搜觅，冀有万一之得。”成然之。早出暮归，提竹筒铜丝笼，于败堵丛草处，探石发穴，靡计不施，迄无济。即捕得三两头，又劣弱不中于款。宰严限追比，旬余，杖至百，两股间脓血流离，并虫亦不能行捉矣。转侧床头，惟思自尽。\n时村中来一驼背巫，能以神卜。成妻具资诣问。见红女白婆，填塞门户。入其舍，则密室垂帘，帘外设香几。问者爇香于鼎，再拜。巫从旁望空代祝，唇吻翕辟，不知何词。各各竦立以听。少间，帘内掷一纸出，即道人意中事，无毫发爽。成妻纳钱案上，焚拜如前人。食顷，帘动，片纸抛落。拾视之，非字而画：中绘殿阁，类兰若；后小山下，怪石乱卧，针针丛棘，青麻头伏焉；旁一蟆，若将跳舞。展玩不可晓。然睹促织，隐中胸怀。折藏之，归以示成。\n成反复自念，得无教我猎虫所耶？细瞻景状，与村东大佛阁真逼似。乃强起扶杖，执图诣寺后，有古陵蔚起。循陵而走，见蹲石鳞鳞，俨然类画。遂于蒿莱中侧听徐行，似寻针芥。而心目耳力俱穷，绝无踪响。冥搜未已，一癞头蟆猝然跃去。成益愕，急逐趁之，蟆入草间。蹑迹披求，见有虫伏棘根。遽扑之，入石穴中。掭以尖草，不出；以筒水灌之，始出，状极俊健。逐而得之。审视，巨身修尾，青项金翅。大喜，笼归，举家庆贺，虽连城拱璧不啻也。上于盆而养之，蟹白栗黄，备极护爱，留待限期，以塞官责。\n成有子九岁，窥父不在，窃发盆。虫跃掷径出，迅不可捉。及扑入手，已股落腹裂，斯须就毙。儿惧，啼告母。母闻之，面色灰死，大骂曰：“业根，死期至矣！而翁归，自与汝复算耳！”儿涕而出。\n未几，成归，闻妻言，如被冰雪。怒索儿，儿渺然不知所往。既得其尸于井，因而化怒为悲，抢呼欲绝。夫妻向隅，茅舍无烟，相对默然，不复聊赖。日将暮，取儿藁葬。近抚之，气息惙然。喜置榻上，半夜复苏。夫妻心稍慰，但儿神气痴木，奄奄思睡。成顾蟋蟀笼虚，则气断声吞，亦不复以儿为念，自昏达曙，目不交睫。东曦既驾，僵卧长愁。忽闻门外虫鸣，惊起觇视，虫宛然尚在。喜而捕之，一鸣辄跃去，行且速。覆之以掌，虚若无物；手裁举，则又超忽而跃。急趋之，折过墙隅，迷其所在。徘徊四顾，见虫伏壁上。审谛之，短小，黑赤色，顿非前物。成以其小，劣之。惟彷徨瞻顾，寻所逐者。壁上小虫忽跃落襟袖间，视之，形若土狗，梅花翅，方首，长胫，意似良。喜而收之。将献公堂，惴惴恐不当意，思试之斗以觇之。\n村中少年好事者，驯养一虫，自名“蟹壳青”，日与子弟角，无不胜。欲居之以为利，而高其直，亦无售者。径造庐访成，视成所蓄，掩口胡卢而笑。因出己虫，纳比笼中。成视之，庞然修伟，自增惭怍，不敢与较。少年固强之。顾念蓄劣物终无所用，不如拼博一笑，因合纳斗盆。小虫伏不动，蠢若木鸡。少年又大笑。试以猪鬣毛撩拨虫须，仍不动。少年又笑。屡撩之，虫暴怒，直奔，遂相腾击，振奋作声。俄见小虫跃起，张尾伸须，直龁敌领。少年大骇，急解令休止。虫翘然矜鸣，似报主知。成大喜。方共瞻玩，一鸡瞥来，径进以啄。成骇立愕呼，幸啄不中，虫跃去尺有咫。鸡健进，逐逼之，虫已在爪下矣。成仓猝莫知所救，顿足失色。旋见鸡伸颈摆扑，临视，则虫集冠上，力叮不释。成益惊喜，掇置笼中。\n翼日进宰，宰见其小，怒诃成。成述其异，宰不信。试与他虫斗，虫尽靡。又试之鸡，果如成言。乃赏成，献诸抚军。抚军大悦，以金笼进上，细疏其能。既入宫中，举天下所贡蝴蝶、螳螂、油利挞、青丝额一切异状遍试之，莫出其右者。每闻琴瑟之声，则应节而舞。益奇之。上大嘉悦，诏赐抚臣名马衣缎。抚军不忘所自，无何，宰以卓异闻。宰悦，免成役。又嘱学使俾入邑庠。后岁余，成子精神复旧，自言身化促织，轻捷善斗，今始苏耳。抚军亦厚赉成。不数年，田百顷，楼阁万椽，牛羊蹄躈各千计；一出门，裘马过世家焉。\n异史氏曰：“天子偶用一物，未必不过此已忘；而奉行者即为定例。加以官贪吏虐，民日贴妇卖儿，更无休止。故天子一跬步，皆关民命，不可忽也。独是成氏子以蠹贫，以促织富，裘马扬扬。当其为里正，受扑责时，岂意其至此哉！天将以酬长厚者，遂使抚臣、令尹，并受促织恩荫。闻之：一人飞升，仙及鸡犬。信夫！”"},{"t":"聊斋自志","a":"蒲松龄","d":"—","g":"课外/补充-明清古文","place":"无具体地点（自序）","lt":"famous","basis":"作者淄川人，为《聊斋志异》作自序","type":"序跋散文","full":"披萝带荔，三闾氏感而为骚；牛鬼蛇神，长爪郎吟而成癖。自鸣天籁，不择好音，有由然矣。松，落落秋萤之火，魑魅争光；逐逐野马之尘，罔两见笑。才非干宝，雅爱搜神；情类黄州，喜人谈鬼。闻则命笔，遂以成编。久之，四方同人，又以邮筒相寄，因而物以好聚，所积益伙。甚者，人非化外，事或奇于断发之乡；睫在目前，怪有过于飞头之国。遄飞逸兴，狂固难辞；永托旷怀，痴且不讳。展如之人，得毋向我胡卢耶？然五父衢头，或涉滥听；而三生石上，颇悟前因。放纵之言，有未可概以人废者。\n松悬弧时，先大人梦一病瘠瞿昙，偏袒入室，药膏如钱，圆黏乳际，寤而松生，果符墨志。且也，少羸多病，长命不犹。门庭之凄寂，则冷淡如僧；笔墨之耕耘，则萧条似钵。每搔头自念，勿亦面壁人果是吾前身耶？盖有漏根因，未结人天之果；而随风荡堕，竟成藩溷之花。茫茫六道，何可谓无其理哉！\n独是子夜荧荧，灯昏欲蕊；萧斋瑟瑟，案冷疑冰。集腋为裘，妄续幽冥之录；浮白载笔，仅成孤愤之书。寄托如此，亦足悲矣。嗟乎！惊霜寒雀，抱树无温；吊月秋虫，偎阑自热。知我者，其在青林黑塞间乎！\n康熙己未春日。"}]},{"prov":"山东","name":"枣庄市","d":"M707.5 404.7 L709.0 406.8 L714.0 405.8 L712.9 395.9 L707.0 390.4 L698.3 393.1 L707.5 404.7 Z","v":1,"fd":"待定","texts":[{"t":"冯谖客孟尝君","a":"战国游士","d":"刘向辑","g":"课外/补充-古文观止","place":"齐临淄（今山东淄博）；薛（今山东枣庄滕州）","lt":"famous","basis":"孟尝君封邑薛城遗址在今山东滕州官桥","type":"史传（战国策）","full":"齐人有冯谖者，贫乏不能自存，使人属孟尝君，愿寄食门下。孟尝君曰：“客何好？”曰：“客无好也。”曰：“客何能？”曰：“客无能也。”孟尝君笑而受之曰：“诺。”\n左右以君贱之也，食以草具。居有顷，倚柱弹其剑，歌曰：“长铗归来乎！食无鱼。”左右以告。孟尝君曰：“食之，比门下之客。”居有顷，复弹其铗，歌曰：“长铗归来乎！出无车。”左右皆笑之，以告。孟尝君曰：“为之驾，比门下之车客。”于是乘其车，揭其剑，过其友曰：“孟尝君客我。”后有顷，复弹其剑铗，歌曰：“长铗归来乎！无以为家。”左右皆恶之，以为贪而不知足。孟尝君问：“冯公有亲乎？”对曰，“有老母。”孟尝君使人给其食用，无使乏。于是冯谖不复歌。\n后孟尝君出记，问门下诸客：“谁习计会，能为文收责于薛者乎？”冯谖署曰：“能。”孟尝君怪之，曰：“此谁也？”左右曰：“乃歌夫长铗归来者也。”孟尝君笑曰：“客果有能也，吾负之，未尝见也。”请而见之，谢曰：“文倦于是，愦于忧，而性㤖愚，沉于国家之事，开罪于先生。先生不羞，乃有意欲为收责于薛乎？”冯谖曰：“愿之。”于是约车治装，载券契而行，辞曰：“责毕收，以何市而反？”孟尝君曰：“视吾家所寡有者。”\n驱而之薛，使吏召诸民当偿者，悉来合券。券遍合，起，矫命，以责赐诸民。因烧其券。民称万岁。\n长驱到齐，晨而求见。孟尝君怪其疾也，衣冠而见之，曰：“责毕收乎？来何疾也！”曰：“收毕矣。”“以何市而反？”冯谖曰：“君云‘视吾家所寡有者’。臣窃计，君宫中积珍宝，狗马实外厩，美人充下陈。君家所寡有者，以义耳！窃以为君市义。”孟尝君曰：“市义奈何？”曰：“今君有区区之薛，不拊爱子其民，因而贾利之。臣窃矫君命，以责赐诸民，因烧其券，民称万岁。乃臣所以为君市义也。”孟尝君不说，曰：“诺，先生休矣！”\n后期年，齐王谓孟尝君曰：“寡人不敢以先王之臣为臣。”孟尝君就国于薛，未至百里，民扶老携幼，迎君道中，终日。孟尝君顾谓冯谖：“先生所为文市义者，乃今日见之。”\n冯谖曰：“狡兔有三窟，仅得免其死耳；今有一窟，未得高枕而卧也。请为君复凿二窟。”孟尝君予车五十乘，金五百斤，西游于梁，谓梁王曰：“齐放其大臣孟尝君于诸侯，先迎之者，富而兵强。”于是梁王虚上位，以故相为上将军，遣使者黄金千斤，车百乘，往聘孟尝君。冯谖先驱，诫孟尝君曰：“千金，重币也；百乘，显使也。齐其闻之矣。”梁使三反，孟尝君固辞不往也。\n齐王闻之，君臣恐惧，遣太傅赍黄金千斤、文车二驷，服剑一，封书，谢孟尝君曰：“寡人不祥，被于宗庙之祟，沉于谄谀之臣，开罪于君。寡人不足为也；愿君顾先王之宗庙，姑反国统万人乎！”冯谖诫孟尝君曰：“愿请先王之祭器，立宗庙于薛。”庙成，还报孟尝君曰：“三窟已就，君姑高枕为乐矣。”\n孟尝君为相数十年，无纤介之祸者，冯谖之计也。"}]},{"prov":"山东","name":"东营市","d":"M721.0 335.7 L720.7 337.7 L723.8 338.0 L720.6 338.5 L722.8 342.5 L719.7 345.4 L718.9 349.3 L723.0 352.5 L721.8 358.4 L725.9 359.0 L727.9 353.4 L733.6 351.9 L732.2 347.1 L733.3 345.4 L737.1 345.0 L737.8 341.5 L735.1 341.8 L731.0 335.6 L727.0 335.8 L725.9 337.4 L721.0 335.7 Z","v":1,"fd":"待定","texts":[{"t":"卖炭翁","a":"白居易","d":"唐","g":"初中八年级下","place":"长安市南卖炭","lt":"famous","basis":"原作写于西安市，作者与次选锚点俱不可确考，按覆盖补缺分配至山东省东营市","type":"古诗","full":"卖炭翁，伐薪烧炭南山中。满面尘灰烟火色，两鬓苍苍十指黑。卖炭得钱何所营？身上衣裳口中食。\n可怜身上衣正单，心忧炭贱愿天寒。夜来城外一尺雪，晓驾炭车辗冰辙。牛困人饥日已高，市南门外泥中歇。\n翩翩两骑来是谁？黄衣使者白衫儿。手把文书口称敕，回车叱牛牵向北。一车炭，千余斤，宫使驱将惜不得。半匹红绡一丈绫，系向牛头充炭直。"}]},{"prov":"山东","name":"烟台市","d":"M742.1 355.4 L742.6 357.6 L744.5 358.0 L751.3 357.6 L752.5 355.4 L754.3 356.3 L757.0 354.9 L758.5 357.4 L757.4 362.3 L758.9 366.1 L765.1 366.1 L772.2 362.3 L767.7 356.4 L769.5 355.1 L776.3 355.4 L779.4 349.1 L773.6 349.3 L770.8 345.7 L768.1 346.5 L767.0 343.9 L760.7 341.6 L752.4 344.4 L752.3 347.5 L746.3 350.5 L747.1 352.7 L744.7 355.2 L742.1 355.4 Z","v":1,"fd":"2024.08","texts":[{"t":"阿房宫赋","a":"杜牧","d":"唐","g":"高中必修下","place":"咸阳阿房宫","lt":"desc","basis":"杜牧京兆万年人（今陕西西安），《阿房宫赋》描写咸阳阿房宫，据覆盖补缺分配至烟台市","type":"文言文","full":"六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。\n妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦，朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不得见者，三十六年。\n燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。\n嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家；奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！\n呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟乎！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。"}]},{"prov":"山东","name":"潍坊市","d":"M725.2 375.7 L730.3 373.2 L731.1 375.5 L734.0 375.6 L733.3 377.6 L735.8 377.7 L735.1 379.2 L738.4 379.2 L738.8 381.6 L740.3 380.9 L742.8 382.7 L742.7 380.8 L744.6 379.6 L743.2 374.7 L746.1 373.7 L749.0 368.1 L744.5 366.3 L741.4 362.8 L742.1 355.4 L738.2 355.6 L736.2 352.4 L735.1 353.3 L733.6 351.9 L727.9 353.4 L725.9 359.0 L724.7 358.7 L724.7 360.7 L720.8 363.1 L719.9 365.9 L722.0 372.3 L725.2 375.7 Z","v":1,"fd":"待定","texts":[{"t":"江城子·乙卯正月二十日夜记梦","a":"苏轼","d":"北宋","g":"高中选择性必修上","place":"梦忆亡妻","lt":"write","basis":"写作地密州（今山东诸城市，由潍坊市代管），苏轼知密州时作，从写作地匹配","type":"词","full":"十年生死两茫茫，不思量，自难忘。千里孤坟，无处话凄凉。纵使相逢应不识，尘满面，鬓如霜。夜来幽梦忽还乡，小轩窗，正梳妆。相顾无言，惟有泪千行。料得年年肠断处，明月夜，短松冈。"},{"t":"竹石","a":"郑燮","d":"清","g":"小学六年级下","place":"岩竹","lt":"write","basis":"写作地潍县（今山东潍坊），郑板桥任潍县知县作《竹石》，从写作地匹配","type":"古诗","full":"咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。"},{"t":"水调歌头（明月几时有）","a":"苏轼","d":"北宋","g":"初中九年级上","place":"中秋怀子由","lt":"write","basis":"写作地密州（今山东诸城市，由潍坊市代管），苏轼知密州作《水调歌头》，从写作地匹配","type":"词","full":"明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。"},{"t":"左迁至蓝关示侄孙湘","a":"韩愈","d":"唐","g":"初中九年级上","place":"蓝关雪拥","lt":"famous","basis":"韩愈河阳人（今河南孟州），《左迁至蓝关示侄孙湘》作于蓝田蓝关，据覆盖补缺分配至潍坊市","type":"古诗","full":"一封朝奏九重天，夕贬潮阳路八千。欲为圣明除弊事，肯将衰朽惜残年！云横秦岭家何在？雪拥蓝关马不前。知汝远来应有意，好收吾骨瘴江边。"},{"t":"江城子·密州出猎","a":"苏轼","d":"北宋","g":"初中九年级下","place":"密州出猎","lt":"write","basis":"写作地密州（今山东诸城市，由潍坊市代管），苏轼知密州出猎作，从写作地匹配","type":"词","full":"老夫聊发少年狂，左牵黄，右擎苍，锦帽貂裘，千骑卷平冈。为报倾城随太守，亲射虎，看孙郎。\n酒酣胸胆尚开张，鬓微霜，又何妨！持节云中，何日遣冯唐？会挽雕弓如满月，西北望，射天狼。"},{"t":"潍县署中与舍弟墨第二书","a":"郑燮","d":"—","g":"课外/补充-明清古文","place":"无具体地点（家书）","lt":"famous","basis":"作者任潍县知县时作于官署","type":"书信散文","full":"余五十二岁始得一子，岂有不爱之理！然爱之必以其道，虽嬉戏顽耍，务令忠厚悱恻，毋为刻急也。\n平生最不喜笼中养鸟，我图娱悦，彼在囚牢，何情何理，而必屈物之性以适吾性乎！至于发系蜻蜓，线缚螃蟹，为小儿顽具，不过一时片刻便摺拉而死。夫天地生物，化育劬劳，一蚁一虫，皆本阴阳五行之气，絪缊而出。上帝亦心心爱念。而万物之性，人为贵。吾辈竟不能体天之心以为心，万物将何所托命乎？蛇虺、蜈蚣、豺狼、虎豹，虫之最毒者也，然天既生之，我何得而杀之？若必欲尽杀，天地又何必生？亦惟驱之使远，避之使不相害而已。蜘蛛结网，于人何罪？或谓其夜间咒月，令人墙倾壁倒，遂击杀无遗。此等说话，出于何经何典，而遂以此残物之命，可乎哉？\n我不在家，儿子便是你管束。要须长其忠厚之情，驱其残忍之性，不得以为犹子而姑纵惜也。家人儿女，总是天地间一般人，当一般爱惜，不可使吾儿凌虐他。凡鱼飧果饼，宜均分散给，大家欢嬉跳跃。若吾儿坐食好物，令家人子远立而望，不得一沾唇齿，其父母见而怜之，无可如何，呼之使去，岂非割心剜肉乎！\n夫读书中举、中进士、作官，此是小事，第一要明理作个好人。可将此书读与郭嫂、饶嫂听，使二妇人知爱子之道在此不在彼也。"},{"t":"超然台记","a":"苏轼","d":"—","g":"课外/补充-古文观止","place":"密州北城超然台","lt":"famous","basis":"熙宁八年苏轼知密州，修葺北城旧台名超然作记","type":"记文","full":"凡物皆有可观。苟有可观，皆有可乐，非必怪奇伟丽者也。餔糟啜醨，皆可以醉；果蔬草木，皆可以饱。推此类也，吾安往而不乐？\n夫所为求福而辞祸者，以福可喜而祸可悲也。人之所欲无穷，而物之可以足吾欲者有尽，美恶之辨战于中，而去取之择交乎前。则可乐者常少，而可悲者常多，是谓求祸而辞福。夫求祸而辞福，岂人之情也哉？物有以盖之矣。彼游于物之内，而不游于物之外。物非有大小也，自其内而观之，未有不高且大者也。彼挟其高大以临我，则我常眩乱反复，如隙中之观斗，又焉知胜负之所在？是以美恶横生，而忧乐出焉，可不大哀乎！\n余自钱塘移守胶西，释舟楫之安，而服车马之劳；去雕墙之美，而蔽采椽之居；背湖山之观，而适桑麻之野。始至之日，岁比不登，盗贼满野，狱讼充斥；而斋厨索然，日食杞菊。人固疑余之不乐也。处之期年，而貌加丰，发之白者，日以反黑。余既乐其风俗之淳，而其吏民亦安予之拙也。\n于是治其园囿，洁其庭宇，伐安丘、高密之木，以修补破败，为苟全之计。而园之北，因城以为台者旧矣，稍葺而新之，时相与登览，放意肆志焉。南望马耳、常山，出没隐见，若近若远，庶几有隐君子乎！而其东则庐山，秦人卢敖之所从遁也。西望穆陵，隐然如城郭，师尚父、齐威公之遗烈，犹有存者。北俯潍水，慨然大息，思淮阴之功，而吊其不终。台高而安，深而明，夏凉而冬温。雨雪之朝，风月之夕，余未尝不在，客未尝不从。撷园蔬，取池鱼，酿秫酒，瀹脱粟而食之，曰：“乐哉游乎！”\n方是时，余弟子由适在济南，闻而赋之，且名其台曰“超然”，以见余之无所往而不乐者，盖游于物之外也。"}]},{"prov":"山东","name":"济宁市","d":"M691.9 399.4 L698.3 397.2 L700.9 399.1 L703.9 407.4 L705.2 407.1 L707.8 403.8 L703.8 400.7 L702.9 397.7 L700.7 397.5 L698.3 393.1 L706.3 390.3 L708.6 390.9 L708.0 387.6 L710.7 385.5 L709.7 382.8 L701.4 380.9 L697.8 383.4 L695.1 382.7 L696.0 378.3 L690.3 381.5 L686.2 377.5 L684.0 377.9 L683.6 380.9 L687.3 383.5 L689.9 391.8 L687.2 396.0 L691.9 399.4 Z","v":1,"fd":"待定","texts":[{"t":"学弈","a":"孟子《孟子》","d":"战国","g":"小学六年级下","place":"弈秋授弈【虚构】","lt":"birth","basis":"孟子邹国人（今山东邹城，由济宁市代管），据作者故乡匹配山东济宁市","type":"文言文","full":"弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。"},{"t":"古人谈读书","a":"《论语》《朱子语类》汇编","d":"—","g":"小学六年级下","place":"读书治学场景","lt":"famous","basis":"汇编以孔子讲学为主（孔子故里陬邑，今山东曲阜市，属济宁市），朱熹婺源为辅，取主源地匹配","type":"文言文","full":"一、知之为知之,不知为不知,是知也。敏而好学,不耻下问。默而识之,学而不厌,诲人不倦。我非生而知之者,好古,敏以求之者也。学如不及,犹恐失之。吾尝终日不食,终夜不寝,以思,无益,不如学也。——《论语》\n二、余尝谓读书有三到,谓心到、眼到、口到。心不在此,则眼不看仔细,心眼既不专一,却只漫浪诵读,决不能记,记亦不能久也。三到之中,心到最急。心既到矣,眼口岂不到乎?——[宋]朱熹\n三、盖士人读书,第一要有志,第二要有识,第三要有恒。有志则断不甘为下流;有识则知学问无尽,不敢以一得自足,如河伯之观海,如井蛙之窥天,皆无识者也;有恒则断无不成之事。此三者缺一不可。——[清]曾国藩"},{"t":"〈论语〉十二章","a":"孔子弟子及再传弟子汇编","d":"—","g":"初中七年级上","place":"曲阜讲学场景","lt":"write","basis":"写作地鲁国（都曲阜，今山东曲阜市，属济宁市），从写作地匹配","type":"文言文","full":"1）子曰：「学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？」\n2）曾子曰：「吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？」\n3）子曰：「吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。」\n4）曾公曰：「夫子临事而惧，好谋而成者也。」\n5）子曰：「温故而知新，可以为师矣。」\n6）子曰：「学而不思则罔，思而不学则殆。」\n7）子曰：「贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！」\n8）子曰：「知之者不如好之者，好之者不如乐之者。」\n9）子曰：「饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。」\n10）子曰：「三人行，必有我师焉。择其善者而从之，其不善者而改之。」\n11）子在川上曰：「逝者如斯夫，不舍昼夜。」\n12）子曰：「三军可夺帅也，匹夫不可夺志也。」"},{"t":"曹刿论战","a":"左丘明《左传》","d":"春秋","g":"初中九年级下","place":"长勺（山东莱芜）","lt":"write","basis":"写作地鲁国（都曲阜，今山东曲阜市，属济宁市），《左传》传于鲁国，从写作地匹配（描写地长勺在今山东济南）","type":"文言文","full":"十年春，齐师伐我。公将战，曹刿请见。其乡人曰：\"肉食者谋之，又何间焉？\"刿曰：\"肉食者鄙，未能远谋。\"乃入见。问：\"何以战？\"公曰：\"衣食所安，弗敢专也，必以分人。\"对曰：\"小惠未遍，民弗从也。\"公曰：\"牺牲玉帛，弗敢加也，必以信。\"对曰：\"小信未孚，神弗福也。\"公曰：\"小大之狱，虽不能察，必以情。\"对曰：\"忠之属也，可以一战。战则请从。\"公与之乘，战于长勺。公将鼓之，刿曰：\"未可。\"齐人三鼓，刿曰：\"可矣。\"齐师败绩。公将驰之，刿曰：\"未可。\"下视其辙，登轼而望之，曰：\"可矣。\"遂逐齐师。既克，公问其故，对曰：\"夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。\""},{"t":"子路曾皙冉有公西华侍坐","a":"《论语》孔门弟子","d":"—","g":"高中必修下","place":"孔子讲学厅堂","lt":"write","basis":"写作地鲁国曲阜（今山东曲阜市，属济宁市），《论语》记孔子讲学，从写作地匹配","type":"文言文","full":"子路、曾皙、冉有、公西华侍坐。子曰:\"以吾一日长乎尔,毋吾以也。居则曰:不吾知也!如或知尔,则何以哉?\"子路率尔而对曰:\"千乘之国,摄乎大国之间,加之以师旅,因之以饥馑;由也为之,比及三年,可使有勇,且知方也。\"夫子哂之。\"求!尔何如?\"对曰:\"方六七十,如五六十,求也为之,比及三年,可使足民。如其礼乐,以俟君子。\"\"赤!尔何如?\"对曰:\"非曰能之,愿学焉。宗庙之事,如会同,端章甫,愿为小相焉。\"\"点!尔何如?\"鼓瑟希,铿尔,舍瑟而作,对曰:\"异乎三子者之撰。\"子曰:\"何伤乎?亦各言其志也。\"曰:\"莫春者,春服既成,冠者五六人,浴乎沂,风乎舞雩,咏而归。\"夫子喟然叹曰:\"吾与点也!\"三子者出,曾皙后。曾皙曰:\"夫三子者之言何如?\"子曰:\"亦各言其志也已矣。\"曰:\"夫子何哂由也?\"曰:\"为国以礼,其言不让,是故哂之。唯求则非邦也与?安见方六七十如五六十而非邦也者?唯赤则非邦也与?宗庙会同,非诸侯而何?赤也为之小,孰能为之大?\""},{"t":"兼爱","a":"墨子","d":"战国","g":"高中选择性必修上","place":"说理无实景","lt":"write","basis":"写作地鲁国（今山东曲阜一带），墨子曾学于鲁，从写作地匹配","type":"文言文","full":"兼相爱，交相利。"},{"t":"季札观周乐","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"鲁曲阜（今山东济宁曲阜）","lt":"famous","basis":"吴公子季札聘鲁观乐于曲阜孔庙开国公后裔所藏周乐","type":"史传（左传）","full":"吴公子札来聘。请观于周乐。使工为之歌《周南》《召南》,曰:\"美哉!始基之矣,犹未也,然勤而不怨矣。\"为之歌《邶》《鄘》《卫》,曰:\"美哉,渊乎!忧而不困者也。吾闻卫康叔、武公之德如是,是其《卫风》乎!\"为之歌《王》,曰:\"美哉!思而不惧,其周之东乎?\"为之歌《郑》,曰:\"美哉!其细已甚,民弗堪也。是其先亡乎?\"为之歌《齐》,曰:\"美哉!泱泱乎,大风也哉!表东海者,其大公乎?国未可量也。\"为之歌《豳》,曰:\"美哉,荡乎!乐而不淫,其周公之东乎?\"为之歌《秦》,曰:\"此之谓夏声。夫能夏则大,大之至也,其周之旧乎!\"为之歌《魏》,曰:\"美哉,沨沨乎!大而婉,险而易行。以德辅此,则明主也。\"为之歌《唐》,曰:\"思深哉!其有陶唐氏之遗民乎?不然,何忧之远也?非令德之后,谁能若是?\"为之歌《陈》,曰:\"国无主,其能久乎!\"自《郐》以下无讥焉。为之歌《小雅》,曰:\"美哉!思而不贰,怨而不言,其周德之衰乎?犹有先王之遗民焉。\"为之歌《大雅》,曰:\"广哉,熙熙乎!曲而有直体,其文王之德乎!\"为之歌《颂》,曰:\"至矣哉!直而不倨,曲而不屈;迩而不逼,远而不携;迁而不淫,复而不厌;哀而不愁,乐而不荒;用而不匮,广而不宣;施而不费,取而不贪;处而不底,行而不流。五声和,八风平;节有度,守有序。盛德之所同也。\"见舞《象箾》《南籥》者,曰:\"美哉,犹有憾。\"见舞《大武》者,曰:\"美哉,周之盛也,其若此乎?\"见舞《韶濩》者,曰:\"圣人之弘也,而犹有惭德,圣人之难也!\"见舞《大夏》者,曰:\"美哉!勤而不德。非禹,其谁能修之!\"见舞《韶箾》者,曰:\"德至矣哉!大矣,如天之无不帱也,如地之无不载也!虽甚盛德,其蔑以加于此矣。观止矣!若有他乐,吾不敢请已!\""},{"t":"得道多助，失道寡助","a":"孟子《孟子》","d":"战国","g":"初中八年级上","place":"说理无实景","lt":"birth","basis":"作者孟子为邹国（今山东邹城，属济宁市）人；写作地临淄（淄博）匹配已达上限，按作者故乡次选锚点匹配济宁市","type":"文言文","full":"天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。"},{"t":"子路、曾皙、冉有、公西华侍坐","a":"《论语》","d":"编者","g":"高中必修下","place":"孔子讲学厅堂","lt":"famous","basis":"记孔子与弟子于鲁国（今曲阜，属济宁市）侍坐言志","type":"文言文","full":"子路、曾皙、冉有、公西华侍坐。子曰:\"以吾一日长乎尔,毋吾以也。居则曰:不吾知也!如或知尔,则何以哉?\"子路率尔而对曰:\"千乘之国,摄乎大国之间,加之以师旅,因之以饥馑;由也为之,比及三年,可使有勇,且知方也。\"夫子哂之。\"求!尔何如?\"对曰:\"方六七十,如五六十,求也为之,比及三年,可使足民。如其礼乐,以俟君子。\"\"赤!尔何如?\"对曰:\"非曰能之,愿学焉。宗庙之事,如会同,端章甫,愿为小相焉。\"\"点!尔何如?\"鼓瑟希,铿尔,舍瑟而作,对曰:\"异乎三子者之撰。\"子曰:\"何伤乎?亦各言其志也。\"曰:\"莫春者,春服既成,冠者五六人,浴乎沂,风乎舞雩,咏而归。\"夫子喟然叹曰:\"吾与点也!\"三子者出,曾皙后。曾皙曰:\"夫三子者之言何如?\"子曰:\"亦各言其志也已矣。\"曰:\"夫子何哂由也?\"曰:\"为国以礼,其言不让,是故哂之。唯求则非邦也与?安见方六七十如五六十而非邦也者?唯赤则非邦也与?宗庙会同,非诸侯而何?赤也为之小,孰能为之大?\""}]},{"prov":"山东","name":"泰安市","d":"M716.1 377.2 L708.4 375.5 L705.8 368.0 L700.9 372.5 L697.7 371.1 L693.5 372.3 L694.4 375.1 L692.3 376.4 L691.5 375.4 L690.1 376.6 L688.1 373.9 L686.2 378.2 L690.3 381.5 L696.0 378.3 L695.2 382.9 L699.1 383.4 L701.1 380.9 L706.1 381.1 L710.7 384.3 L716.8 379.3 L716.1 377.2 Z","v":1,"fd":"待定","texts":[{"t":"登泰山记","a":"姚鼐","d":"清","g":"高中必修上","place":"泰山（山东泰安）","lt":"write","basis":"写作地泰安（今山东泰安），姚鼐游泰山作记，从写作地匹配","type":"文言文","full":"泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。\n余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅，崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南；望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。\n戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之。或曰，此东海也。回视日观以西峰，或得日或否，绛皓驳色，而皆若偻。\n亭西有岱祠，又有碧霞元君祠；皇帝行宫在碧霞元君祠东。是日观道中石刻，自唐显庆以来，其远古刻尽漫失。僻不当道者，皆不及往。\n山多石，少土；石苍黑色，多平方，少圜。少杂树，多松，生石罅，皆平顶。冰雪，无瀑水，无鸟兽音迹。至日观数里内无树，而雪与人膝齐。\n桐城姚鼐记。"},{"t":"望岳","a":"杜甫","d":"唐","g":"初中七年级下","place":"泰山","lt":"desc","basis":"描写地东岳泰山（今山东泰安），杜甫《望岳》咏泰山，从描写地匹配","type":"古诗","full":"岱宗夫如何？齐鲁青未了。造化钟神秀，阴阳割昏晓。荡胸生曾云，决眦入归鸟。会当凌绝顶，一览众山小。"}]},{"prov":"山东","name":"威海市","d":"M779.3 348.7 L776.3 355.4 L769.5 355.1 L767.7 356.4 L770.9 361.8 L773.7 361.2 L772.3 362.1 L773.1 363.0 L775.0 363.2 L774.6 361.7 L780.2 358.6 L784.4 361.0 L789.1 359.5 L789.8 357.0 L787.8 357.1 L788.2 355.3 L790.4 354.1 L789.6 352.1 L791.6 349.8 L783.4 349.5 L782.5 346.8 L779.3 348.7 Z","v":1,"fd":"待定","texts":[{"t":"出塞","a":"王昌龄","d":"唐","g":"小学四年级上","place":"边塞关山","lt":"famous","basis":"王昌龄京兆长安人（今陕西西安），《出塞》为边塞名篇，据覆盖补缺分配至威海市","type":"古诗","full":"秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。"}]},{"prov":"山东","name":"日照市","d":"M743.4 385.1 L741.5 385.1 L740.8 381.2 L738.8 381.6 L738.7 379.4 L735.5 379.4 L735.8 377.7 L732.9 376.4 L728.5 380.4 L728.3 382.2 L729.9 382.6 L726.7 389.0 L734.1 389.4 L735.8 390.9 L735.6 393.7 L739.0 395.1 L743.4 385.1 Z","v":1,"fd":"待定","texts":[{"t":"从军行","a":"王昌龄","d":"唐","g":"小学五年级下","place":"青海边塞","lt":"famous","basis":"王昌龄京兆长安人（今陕西西安），《从军行》写青海边塞，据覆盖补缺分配至日照市","type":"古诗","full":"青海长云暗雪山，孤城遥望玉门关。黄沙百战穿金甲，不破楼兰终不还。"}]},{"prov":"山东","name":"临沂市","d":"M736.2 394.4 L735.3 390.0 L726.7 389.0 L728.7 387.1 L729.4 378.8 L734.0 375.6 L731.1 375.5 L730.3 373.2 L725.2 374.9 L725.1 377.9 L721.2 378.6 L718.3 376.8 L708.0 387.6 L708.0 391.4 L713.1 396.1 L714.0 403.4 L718.7 403.3 L719.9 408.5 L723.5 407.6 L725.4 402.1 L729.5 401.9 L728.5 401.1 L730.8 395.9 L736.2 394.4 Z","v":1,"fd":"待定","texts":[{"t":"诫子书","a":"诸葛亮","d":"三国蜀","g":"初中七年级上","place":"成都","lt":"birth","basis":"诸葛亮琅琊阳都人（今山东沂南，由临沂市管辖），据作者故乡匹配山东临沂市","type":"文言文","full":"夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。夫学须静也，才须学也，非学无以广才，非志无以成学。淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！"},{"t":"出师表","a":"诸葛亮","d":"三国蜀","g":"初中九年级下","place":"成都上书后主","lt":"birth","basis":"诸葛亮琅琊阳都人（今山东沂南，由临沂市管辖），据作者故乡匹配山东临沂市","type":"文言文","full":"先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。\n侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。\n亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。\n臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。\n先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。\n愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。臣不胜受恩感激。\n今当远离，临表涕零，不知所言。"},{"t":"劝学","a":"荀子","d":"战国","g":"高中必修上","place":"说理无实景","lt":"write","basis":"写作地楚国兰陵（今山东兰陵县，属临沂市），荀子仕楚为兰陵令，从写作地匹配","type":"文言文","full":"君子曰：学不可以已。\n青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。\n故不登高山，不知天之高也；不临深谿，不知地之厚也；不闻先王之遗言，不知学问之大也。干、越、夷、貉之子，生而同声，长而异俗，教使之然也。\n吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。\n积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。"},{"t":"拟行路难（其四）","a":"鲍照","d":"南朝宋","g":"高中选择性必修下","place":"门第愤懑","lt":"birth","basis":"鲍照东海郯人（今山东郯城，由临沂市代管），据作者故乡匹配山东临沂市","type":"古诗","full":"泻水置平地，各自东西南北流。人生亦有命，安能行叹复坐愁？酌酒以自宽，举杯断绝歌路难。心非木石岂无感？吞声踯躅不敢言。"}]},{"prov":"山东","name":"德州市","d":"M705.6 347.5 L706.8 344.1 L707.2 345.3 L710.1 344.0 L710.0 338.3 L707.7 341.5 L698.0 341.4 L692.3 348.7 L690.5 346.6 L689.1 350.8 L685.0 351.3 L681.6 359.3 L687.0 360.1 L689.1 357.2 L692.7 358.7 L691.8 367.0 L695.1 369.0 L695.1 367.1 L700.7 360.9 L699.3 357.8 L702.2 355.2 L701.6 349.4 L705.6 347.5 Z","v":1,"fd":"待定","texts":[{"t":"\"谦，美德也，过谦者多怀诈；默，懿行也，过默者或藏奸\"","a":"金缨","d":"清","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《格言联璧》真实条目按覆盖补缺分配（此为文化渊源补缺）。清·金缨《格言联璧》名句，无地理属性，按覆盖补缺分配","type":"清言格言","full":"谦，美德也，过谦者多怀诈；默，懿行也，过默者或藏奸"}]},{"prov":"山东","name":"聊城市","d":"M694.1 369.3 L691.7 366.8 L691.4 361.7 L692.9 358.8 L689.1 357.2 L687.0 360.1 L681.7 359.3 L677.1 362.5 L673.9 367.5 L677.1 372.4 L674.9 381.1 L685.3 376.3 L694.1 369.3 Z","v":1,"fd":"待定","texts":[{"t":"\"仁人心地宽舒，便福厚而庆长\"","a":"洪应明/陈继儒","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《菜根谭》/《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"仁人心地宽舒，便福厚而庆长"}]},{"prov":"山东","name":"滨州市","d":"M705.6 347.5 L708.5 355.7 L706.3 357.4 L707.5 358.7 L710.0 358.2 L712.6 363.7 L716.5 359.3 L714.7 356.5 L710.4 356.1 L711.7 352.5 L717.0 352.7 L719.5 358.0 L721.7 357.8 L723.0 352.5 L718.9 348.9 L719.7 345.4 L722.8 342.5 L720.9 341.0 L721.0 335.7 L715.5 332.6 L712.8 336.7 L710.1 337.4 L710.1 344.0 L707.2 345.3 L706.8 344.1 L705.6 347.5 Z","v":1,"fd":"待定","texts":[{"t":"' movable不做亏心事， 国","g":"初中八年级下","place":"太行王屋二山","lt":"write","basis":"写作地郑国（都新郑，今河南新郑市属郑州市），从写作地匹配","type":"文言文","full":"太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰：\"吾与汝毕力平险，指通豫南，达于汉阴，可乎？\"杂然相许。其妻献疑曰：\"以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？\"杂曰：\"投诸渤海之尾，隐土之北。\"遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。河曲智叟笑而止之曰：\"甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？\"北山愚公长息曰：\"汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉；子又生孙，孙又生子；子又有子，子又有孙；子子孙孙无穷匮也，而山不加增，何苦而不平？\"河曲智叟亡以应。操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。"},{"t":"杞人忧天","a":"列御寇《列子》","d":"战国","g":"初中九年级下","place":"杞国【虚构寓言】","lt":"write","basis":"写作地郑国（都新郑，今河南新郑市属郑州市），从写作地匹配","type":"文言文","full":"杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰：\"天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？\"其人曰：\"天果积气，日月星宿，不当坠耶？\"晓之者曰：\"日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。\"其人曰：\"奈地坏何？\"晓之者曰：\"地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？\"其人舍然大喜，晓之者亦舍然大喜。"},{"t":"烛之武退秦师","a":"左丘明《左传》","d":"春秋","g":"高中必修下","place":"郑国都城（河南新郑）","lt":"write","basis":"写作地郑国（都新郑，今河南新郑市属郑州市），烛之武退秦师于郑，从写作地匹配","type":"文言文","full":"晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。晋军函陵，秦军氾南。佚之狐言于郑伯曰：国危矣，若使烛之武见秦君，师必退。公从之。辞曰：臣之壮也，犹不如人；今老矣，无能为也已。公曰：吾不能早用子，今急而求子，是寡人之过也。然郑亡，子亦有不利焉。许之。\n夜缒而出。见秦伯曰：秦、晋围郑，郑既知亡矣。若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也。焉用亡郑以陪邻？邻之厚，君之薄也。若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。且君尝为晋君赐矣，许君焦、瑕，朝济而夕设版焉，君之所知也。夫晋，何厌之有？既东封郑，又欲肆其西封。若不阙秦，将焉取之？阙秦以利晋，唯君图之。\n秦伯说，与郑人盟。使杞子、逢孙、杨孙戍之，乃还。\n子犯请击之。公曰：不可。微夫人之力不及此。因人之力而敝之，不仁；失其所与，不知；以乱易整，不武。吾其还也。亦去之。"},{"t":"子衿","a":"《诗经·郑风》","d":"—","g":"初中八年级下","place":"城阙思恋","lt":"desc","basis":"《诗经·郑风》，郑都新郑（今河南新郑市，属郑州市），据郑风产地推定","type":"古诗","full":"青青子衿，悠悠我心。纵我不往，子宁不嗣音？青青子佩，悠悠我思。纵我不往，子宁不来？挑兮达兮，在城阙兮。一日不见，如三月兮。"},{"t":"郑伯克段于鄢","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"鄢（今河南许昌鄢陵）；郑伯克段封地新郑（今河南郑州新郑）","lt":"famous","basis":"文中\"克段于鄢\"，郑武公都城及郑庄公掘地见母处相传在今河南新郑","type":"史传（左传）","full":"初，郑武公娶于申，曰武姜，生庄公及共叔段。庄公寤生，惊姜氏，故名曰寤生，遂恶之。爱共叔段，欲立之。亟请于武公，公弗许。\n及庄公即位，为之请制。公曰：“制，岩邑也，虢叔死焉。佗邑唯命。”请京，使居之，谓之京城大叔。祭仲曰：“都城过百雉，国之害也。先王之制：大都不过参国之一，中五之一，小九之一。今京不度，非制也，君将不堪。”公曰：“姜氏欲之，焉辟害？”对曰：“姜氏何厌之有！不如早为之所，无使滋蔓，蔓难图也。蔓草犹不可除，况君之宠弟乎！”公曰：“多行不义，必自毙，子姑待之。”\n既而大叔命西鄙北鄙贰于己。公子吕曰：“国不堪贰，君将若之何？欲与大叔，臣请事之；若弗与，则请除之。无生民心。”公曰：“无庸，将自及。”大叔又收贰以为己邑，至于廪延。子封曰：“可矣，厚将得众。”公曰：“不义，不暱，厚将崩。”\n大叔完聚，缮甲兵，具卒乘，将袭郑。夫人将启之。公闻其期，曰：“可矣！”命子封帅车二百乘以伐京。京叛大叔段，段入于鄢，公伐诸鄢。五月辛丑，大叔出奔共。\n书曰：“郑伯克段于鄢。”段不弟，故不言弟；如二君，故曰克；称郑伯，讥失教也；谓之郑志。不言出奔，难之也。\n遂寘姜氏于城颍，而誓之曰：“不及黄泉，无相见也。”既而悔之。颍考叔为颍谷封人，闻之，有献于公，公赐之食。食舍肉，公问之，对曰：“小人有母，皆尝小人之食矣，未尝君之羹，请以遗之。”公曰：“尔有母遗，繄我独无！”颍考叔曰：“敢问何谓也？”公语之故，且告之悔。对曰：“君何患焉？若阙地及泉，隧而相见，其谁曰不然？”公从之。公入而赋：“大隧之中，其乐也融融！”姜出而赋：“大隧之外，其乐也洩洩。”遂为母子如初。\n君子曰：“颍考叔，纯孝也，爱其母，施及庄公。《诗》曰：‘孝子不匮，永锡尔类。’其是之谓乎！”"}]},{"prov":"河南","name":"开封市","d":"M651.9 409.5 L655.8 412.0 L660.2 411.1 L660.7 409.3 L665.3 411.5 L667.9 410.7 L668.6 402.7 L666.9 401.1 L673.5 400.4 L673.0 397.3 L667.5 396.0 L665.2 398.7 L657.2 398.1 L655.7 400.0 L655.2 406.3 L652.2 407.1 L651.9 409.5 Z","v":1,"fd":"待定","texts":[{"t":"惠崇春江晚景","a":"苏轼","d":"北宋","g":"小学三年级下","place":"江南春江（画中景）","lt":"write","basis":"写作地汴京（今河南开封），从写作地匹配","type":"古诗","full":"竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。"},{"t":"虞美人","a":"李煜","d":"南唐","g":"高中必修上","place":"故国江山","lt":"write","basis":"写作地汴京（今河南开封），李煜被俘入宋后居汴京作，从写作地匹配","type":"词","full":"春花秋月何时了？往事知多少。小楼昨夜又东风，故国不堪回首月明中。\n雕栏玉砌应犹在，只是朱颜改。问君能有几多愁？恰似一江春水向东流。"},{"t":"六国论","a":"苏洵","d":"北宋","g":"高中必修下","place":"六国旧地论史","lt":"write","basis":"写作地汴京（今河南开封），苏洵父子在汴京作《六国论》，从写作地匹配","type":"文言文","full":"六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。"},{"t":"梅花","a":"王安石","d":"北宋","g":"小学二年级上","place":"墙角寒梅","lt":"write","basis":"写作地汴京（今河南开封），王安石在汴京作《梅花》，从写作地匹配","type":"古诗","full":"墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。"},{"t":"元日","a":"王安石","d":"北宋","g":"小学三年级下","place":"春节元日习俗","lt":"write","basis":"写作地汴京（今河南开封），王安石在汴京作《元日》，从写作地匹配","type":"古诗","full":"爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。"},{"t":"木兰诗","a":"郭茂倩编《乐府诗集》","d":"北宋","g":"初中七年级下","place":"木兰从军故事","lt":"write","basis":"写作地汴京（北宋都，今河南开封），郭茂倩编《乐府诗集》于汴京，从写作地匹配","type":"古诗","full":"唧唧复唧唧，木兰当户织。不闻机杼声，惟闻女叹息。问女何所思，问女何所忆。女亦无所思，女亦无所忆。\n昨夜见军帖，可汗大点兵。军书十二卷，卷卷有爷名。阿爷无大儿，木兰无长兄。愿为市鞍马，从此替爷征。\n东市买骏马，西市买鞍鞯，南市买辔头，北市买长鞭。\n旦辞爷娘去，暮宿黄河边。不闻爷娘唤女声，但闻黄河流水鸣溅溅。\n旦辞黄河去，暮至黑山头。不闻爷娘唤女声，但闻燕山胡骑鸣啾啾。\n万里赴戎机，关山度若飞。朔气传金柝，寒光照铁衣。将军百战死，壮士十年归。\n归来见天子，天子坐明堂。策勋十二转，赏赐百千强。可汗问所欲，木兰不用尚书郎，愿驰千里足，送儿还故乡。\n爷娘闻女来，出郭相扶将；阿姊闻妹来，当户理红妆；小弟闻姊来，磨刀霍霍向猪羊。\n开我东阁门，坐我西阁床。脱我战时袍，著我旧衣裳。当窗理云鬓，对镜帖花黄。\n出门看火伴，火伴皆惊忙：同行十二年，不知木兰是女郎。\n雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？"},{"t":"浣溪沙（一曲新词酒一杯）","a":"晏殊","d":"北宋","g":"初中八年级上","place":"园中抒怀","lt":"write","basis":"写作地汴京（今河南开封），晏殊在汴京作，从写作地匹配","type":"词","full":"一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？无可奈何花落去，似曾相识燕归来。小园香径独徘徊。"},{"t":"朋党论","a":"欧阳修","d":"—","g":"课外/补充-古文观止","place":"汴京","lt":"famous","basis":"庆历三年欧阳修支持新政作《朋党论》呈仁宗于汴京","type":"政论","full":"臣闻朋党之说，自古有之，惟幸人君辨其君子小人而已。大凡君子与君子以同道为朋，小人与小人以同利为朋，此自然之理也。然臣谓小人无朋，惟君子则有之，其故何哉？小人之所好者，禄利也；所贪者，财货也。当其同利之时，暂相党引以为朋者，伪也；及其见利而争先，或利尽而交疏，则反相贼害，虽其兄弟亲戚，不能相保。故臣谓小人无朋，其暂为朋者，伪也。\n君子则不然，所守者道义，所行者忠信，所惜者名节；以之修身，则同道而相益；以之事国，则同心而共济，终始如一，此君子之朋也。故为人君者，但当退小人之伪朋，用君子之真朋，则天下治矣。\n尧之时，小人共工、驩兜等四人为一朋，君子八元、八恺十六人为一朋。舜佐尧，退四凶小人之朋，而进元、恺君子之朋，尧之天下大治。及舜自为天子，而皋、夔、稷、契等二十二人并列于朝，更相称美，更相推让，凡二十二人为一朋，而舜皆用之，天下亦大治。《书》曰：纣有臣亿万，惟亿万心；周有臣三千，惟一心。纣之时，亿万人各异心，可谓不为朋矣，然纣以亡国。周武王之臣，三千人为一大朋，而周用以兴。\n后汉献帝时，尽取天下名士囚禁之，目为党人。及黄巾贼起，汉室大乱，后方悔悟，尽解党人而释之，然已无救矣。唐之晚年，渐起朋党之论。及昭宗时，尽杀朝之名士，或投之黄河，曰：此辈清流，可投浊流。而唐遂亡矣。\n夫前世之主，能使人入异心不为朋，莫如纣；能禁绝善人为朋，莫如汉献帝；能诛戮清流之朋，莫如唐昭宗之世，然皆乱亡其国。更相称美推让而不自疑，莫如舜之二十二臣，舜亦不疑而皆用之；然而后世不诮舜为二十二人朋党所欺，而称舜为聪明之圣者，以能辨君子与小人也。周武之世，举其国之臣三千人共为一朋，自古为朋之多且大，莫如周；然周用此以兴者，善人虽多而不厌也。\n嗟乎！夫兴亡治乱之迹，为人君者可以鉴矣！"},{"t":"汴梁自古繁华，溯信陵卜宅，天保建寺，唐宋迄今，香火因缘历劫盛；佛法西来微妙，算白马驮经，达摩面壁，东南遥望，金轮辉映万家春。","a":"【不可考】","d":"—","g":"课外/补充-楹联","place":"河南开封大相国寺","lt":"famous","basis":"悬于大相国寺大雄宝殿房柱","type":"楹联","full":"汴梁自古繁华，溯信陵卜宅，天保建寺，唐宋迄今，香火因缘历劫盛；佛法西来微妙，算白马驮经，达摩面壁，东南遥望，金轮辉映万家春。"}]},{"prov":"河南","name":"洛阳市","d":"M610.3 419.8 L620.7 424.1 L623.4 423.5 L626.4 419.7 L630.5 418.2 L631.9 413.1 L630.8 410.5 L634.3 409.2 L633.8 406.4 L637.6 405.4 L635.1 403.8 L636.4 400.9 L632.1 399.3 L631.0 397.3 L629.9 398.5 L621.4 395.3 L620.2 398.6 L622.5 400.7 L620.9 404.2 L619.3 403.3 L617.2 405.5 L615.3 404.9 L608.5 408.3 L608.7 411.5 L612.0 414.1 L609.4 417.9 L610.3 419.8 Z","v":1,"fd":"待定","texts":[{"t":"春夜洛城闻笛","a":"李白","d":"唐","g":"小学六年级下","place":"洛阳城","lt":"write","basis":"写作地洛阳（今河南洛阳），春夜洛城闻笛，从写作地匹配","type":"古诗","full":"谁家玉笛暗飞声，散入春风满洛城。此夜曲中闻折柳，何人不起故园情。"},{"t":"涉江采芙蓉","a":"《古诗十九首》","d":"—","g":"高中必修上","place":"江南采芙蓉","lt":"write","basis":"写作地洛阳（东汉都，今河南洛阳），《古诗十九首》多作于洛阳，从写作地匹配","type":"古诗","full":"涉江采芙蓉，兰泽多芳草。采之欲遗谁？所思在远道。还顾望旧乡，长路漫浩浩。同心而离居，忧伤以终老。"},{"t":"马诗","a":"李贺","d":"唐","g":"小学六年级下","place":"边塞马景","lt":"birth","basis":"作者李贺故里福昌（今河南宜阳县，属洛阳市），写作地不可考，从作者故乡匹配","type":"古诗","full":"大漠沙如雪，燕山月似钩。何当金络脑，快走踏清秋。"},{"t":"雁门太守行","a":"李贺","d":"唐","g":"初中八年级上","place":"雁门边塞战事","lt":"birth","basis":"作者李贺故里福昌（今河南宜阳县，属洛阳市），写作地不可考，从作者故乡匹配","type":"古诗","full":"黑云压城城欲摧，甲光向日金鳞开。角声满天秋色里，塞上燕脂凝夜紫。半卷红旗临易水，霜重鼓寒声不起。报君黄金台上意，提携玉龙为君死。"},{"t":"庭中有奇树","a":"《古诗十九首》","d":"—","g":"初中八年级上","place":"庭中奇树","lt":"write","basis":"写作地洛阳（东汉都，今河南洛阳），《古诗十九首》多作于洛阳，从写作地匹配","type":"古诗","full":"庭中有奇树，绿叶发华滋。攀条折其荣，将以遗所思。馨香盈怀袖，路远莫致之。此物何足贵，但感别经时。"},{"t":"王孙满对楚子","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"洛邑（今河南洛阳）","lt":"famous","basis":"楚庄王问鼎轻重于洛邑王城，东周王城遗址在今洛阳","type":"史传（左传）","full":"楚子伐陆浑之戎，遂至于雒，观兵于周疆。定王使王孙满劳楚子。楚子问鼎之大小轻重焉。\n对曰：“在德不在鼎。昔夏之方有德也，远方图物，贡金九牧，铸鼎象物，百物而为之备，使民知神奸。故民入川泽山林，不逢不若。螭魅罔两，莫能逢之。用能协于上下，以承天休。桀有昏德，鼎迁于商，载祀六百。商纣暴虐，鼎迁于周。德之休明，虽小，重也。其奸回昏乱，虽大，轻也。天祚明德，有所厎止。成王定鼎于郏鄏，卜世三十，卜年七百，天所命也。周德虽衰，天命未改。鼎之轻重，未可问也。”"},{"t":"洛神赋","a":"曹植","d":"—","g":"课外/补充-古文观止","place":"洛水之滨（今河南洛阳）","lt":"famous","basis":"曹植朝京师归藩渡洛水，感宋玉对楚王神女事而作","type":"赋","full":"黄初三年，余朝京师，还济洛川。古人有言，斯水之神，名曰宓妃。感宋玉对楚王神女之事，遂作斯赋，其辞曰：\n余从京域，言归东藩。背伊阙，越轘辕，经通谷，陵景山。日既西倾，车殆马烦。尔乃税驾乎蘅皋，秣驷乎芝田，容与乎阳林，流眄乎洛川。\n于是精移神骇，忽焉思散；俯则未察，仰以殊观，睹一丽人，于岩之畔。乃援御者而告之曰：尔有觌于彼者乎？彼何人斯，若此之艳也！\n御者对曰：臣闻河洛之神，名曰宓妃。然则君王所见，无乃是乎？其状若何？臣愿闻之。\n余告之曰：其形也，翩若惊鸿，婉若游龙。荣曜秋菊，华茂春松。髣髴兮若轻云之蔽月，飘飖兮若流风之回雪。远而望之，皎若太阳升朝霞；迫而察之，灼若芙蕖出渌波。秾纤得衷，修短合度。肩若削成，腰如约素。延颈秀项，皓质呈露。芳泽无加，铅华弗御。云髻峨峨，修眉联娟。丹唇外朗，皓齿内鲜。明眸善睐，靥辅承权。瑰姿艳逸，仪静体闲。柔情绰态，媚于语言。奇服旷世，骨像应图。披罗衣之璀粲兮，珥瑶碧之华琚。戴金翠之首饰，缀明珠以耀躯。践远游之文履，曳雾绡之轻裾。微幽兰之芳蔼兮，步踟蹰于山隅。\n于是忽焉纵体，以遨以嬉。左倚采旄，右荫桂旗。攘皓腕于神浒兮，采湍濑之玄芝。余情悦其淑美兮，心振荡而不怡。无良媒以接欢兮，托微波而通辞。愿诚素之先达兮，解玉佩以要之。嗟佳人之信修兮，羌习礼而明诗。抗琼珶以和予兮，指潜渊而为期。执眷眷之款实兮，惧斯灵之我欺。感交甫之弃言兮，怅犹豫而狐疑。收和颜而静志兮，申礼防以自持。\n于是洛灵感焉，徙倚彷徨。神光离合，乍阴乍阳。竦轻躯以鹤立，若将飞而未翔。践椒涂之郁烈，步蘅薄而流芳。超长吟以永慕兮，声哀厉而弥长。\n尔乃众灵杂遝，命俦啸侣。或戏清流，或翔神渚；或采明珠，或拾翠羽。从南湘之二妃，携汉滨之游女。叹匏瓜之无匹兮，咏牵牛之独处。扬轻袿之猗靡兮，翳修袖以延伫。体迅飞凫，飘忽若神。凌波微步，罗袜生尘。动无常则，若危若安。进止难期，若往若还。转眄流精，光润玉颜。含辞未吐，气若幽兰。华容婀娜，令我忘餐。\n于是屏翳收风，川后静波。冯夷鸣鼓，女娲清歌。腾文鱼以警乘，鸣玉鸾以偕逝。六龙俨其齐首，载云车之容裔。鲸鲵踊而夹毂，水禽翔而为卫。\n于是越北沚，过南冈。纡素领，回清阳。动朱唇以徐言，陈交接之大纲。恨人神之道殊兮，怨盛年之莫当。抗罗袂以掩涕兮，泪流襟之浪浪。悼良会之永绝兮，哀一逝而异乡。无微情以效爱兮，献江南之明珰。虽潜处于太阴，长寄心于君王。忽不悟其所舍，怅神宵而蔽光。\n于是背下陵高，足往神留。遗情想像，顾望怀愁。冀灵体之复形，御轻舟而上溯。浮长川而忘反，思绵绵而增慕。夜耿耿而不寐，沾繁霜而至曙。命仆夫而就驾，吾将归乎东路。揽騑辔以抗策，怅盘桓而不能去。"},{"t":"书洛阳名园记后","a":"李格非","d":"—","g":"课外/补充-古文观止","place":"洛阳诸名园","lt":"famous","basis":"李格非记元祐间洛阳冯氏园、董氏西园等名园于洛阳","type":"记文","full":"洛阳处天下之中，挟殽、黾之阻，当秦陇之襟喉，而赵、魏之走集，盖四方必争之地也。天下当无事则已，有事，则洛阳先受兵。予故尝曰：洛阳之盛衰，天下治乱之候也。"},{"t":"大肚能容，容天下难容之事；慈颜常笑，笑世间可笑之人。","a":"【不可考】","d":"—","g":"课外/补充-楹联","place":"河南洛阳白马寺","lt":"famous","basis":"悬于洛阳白马寺弥勒佛殿","type":"楹联","full":"大肚能容，容天下难容之事；慈颜常笑，笑世间可笑之人。"}]},{"prov":"河南","name":"平顶山市","d":"M647.2 421.4 L643.8 420.0 L644.0 415.1 L640.3 413.8 L639.1 410.5 L634.3 409.2 L630.8 410.5 L631.9 413.1 L630.6 417.9 L626.0 421.1 L630.4 423.8 L637.0 423.4 L638.6 426.7 L644.2 428.7 L644.0 432.7 L648.2 431.7 L648.7 427.1 L645.3 426.7 L647.8 423.0 L647.2 421.4 Z","v":1,"fd":"待定","texts":[{"t":"\"耳目见闻为外贼，情欲意识为内贼\"","a":"洪应明","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《菜根谭》真实条目按覆盖补缺分配（此为文化渊源补缺）。明·洪应明《菜根谭》名句，无地理属性，按覆盖补缺分配","type":"清言格言","full":"耳目见闻为外贼，情欲意识为内贼"}]},{"prov":"河南","name":"安阳市","d":"M660.4 387.3 L660.7 392.5 L669.3 388.5 L667.6 384.4 L669.4 377.8 L668.2 374.4 L663.0 374.8 L659.2 372.2 L654.7 371.8 L654.1 370.3 L649.5 370.1 L648.0 379.7 L650.3 383.5 L654.8 381.8 L654.2 377.7 L656.5 376.2 L658.6 378.1 L657.8 381.7 L662.7 380.2 L665.6 381.7 L660.4 387.3 Z","v":1,"fd":"待定","texts":[{"t":"静女","a":"《诗经·邶风》","d":"—","g":"高中必修上","place":"城隅约会","lt":"desc","basis":"《诗经·邶风》，邶地在今河南汤阴县东南（属安阳市），据国风产地推定","type":"古诗","full":"静女其姝，俟我于城隅。爱而不见，搔首踟蹰。静女其娈，贻我彤管。彤管有炜，说怿女美。自牧归荑，洵美且异。匪女之为美，美人之贻。"},{"t":"式微","a":"《诗经·邶风》","d":"—","g":"初中八年级下","place":"泥中劳役","lt":"desc","basis":"《诗经·邶风》，邶地在今河南汤阴县东南（属安阳市），据国风产地推定","type":"古诗","full":"式微，式微，胡不归？微君之故，胡为乎中露？式微，式微，胡不归？微君之躬，胡为乎泥中？"},{"t":"相州昼锦堂记","a":"欧阳修","d":"—","g":"课外/补充-古文观止","place":"相州（今河南安阳）","lt":"famous","basis":"韩琦以武康节度使知乡郡相州建昼锦堂，欧阳修为记","type":"记文","full":"仕宦而至将相，富贵而归故乡。此人情之所荣，而今昔之所同也。\n盖士方穷时，困厄闾里，庸人孺子，皆得易而侮之。若季子不礼于其嫂，买臣见弃于其妻。一旦高车驷马，旗旄导前，而骑卒拥后，夹道之人，相与骈肩累迹，瞻望咨嗟；而所谓庸夫愚妇者，奔走骇汗，羞愧俯伏，以自悔罪于车尘马足之间。此一介之士，得志于当时，而意气之盛，昔人比之衣锦之荣者也。\n惟大丞相魏国公则不然：公，相人也，世有令德，为时名卿。自公少时，已擢高科，登显仕。海内之士，闻下风而望余光者，盖亦有年矣。所谓将相而富贵，皆公所宜素有；非如穷厄之人，侥幸得志于一时，出于庸夫愚妇之不意，以惊骇而夸耀之也。然则高牙大纛，不足为公荣；桓圭衮冕，不足为公贵。惟德被生民，而功施社稷，勒之金石，播之声诗，以耀后世而垂无穷，此公之志，而士亦以此望于公也。岂止夸一时而荣一乡哉！\n公在至和中，尝以武康之节，来治于相，乃作“昼锦”之堂于后圃。既又刻诗于石，以遗相人。其言以快恩仇、矜名誉为可薄，盖不以昔人所夸者为荣，而以为戒。于此见公之视富贵为何如，而其志岂易量哉！故能出入将相，勤劳王家，而夷险一节。至于临大事，决大议，垂绅正笏，不动声色，而措天下于泰山之安：可谓社稷之臣矣！其丰功盛烈，所以铭彝鼎而被弦歌者，乃邦家之光，非闾里之荣也。\n余虽不获登公之堂，幸尝窃诵公之诗，乐公之志有成，而喜为天下道也。于是乎书。\n尚书吏部侍郎、参知政事欧阳修记。"},{"t":"人生自古谁无死；第一功名不爱钱。","a":"何金寿撰","d":"上句集文天祥诗，下句集杨继盛诗","g":"课外/补充-楹联","place":"河南汤阴岳飞庙","lt":"famous","basis":"清同治榜眼何金寿撰，悬于汤阴岳飞庙正殿门楣","type":"楹联","full":"人生自古谁无死；第一功名不爱钱。"}]},{"prov":"河南","name":"鹤壁市","d":"M653.7 382.9 L658.9 387.9 L665.7 381.9 L662.7 380.2 L657.8 381.7 L658.6 378.1 L656.5 376.2 L654.2 377.7 L655.0 381.0 L653.7 382.9 Z","v":1,"fd":"待定","texts":[{"t":"氓","a":"《诗经·卫风》","d":"—","g":"高中选择性必修中","place":"卫国","lt":"desc","basis":"《诗经·卫风》，卫都朝歌在今河南淇县（属鹤壁市），据卫风产地推定","type":"古诗","full":"氓之蚩蚩，抱布贸丝。匪来贸丝，来即我谋。送子涉淇，至于顿丘。匪我愆期，子无良媒。将子无怒，秋以为期。\n乘彼垝垣，以望复关。不见复关，泣涕涟涟。既见复关，载笑载言。尔卜尔筮，体无咎言。以尔车来，以我贿迁。\n桑之未落，其叶沃若。于嗟鸠兮，无食桑葚。于嗟女兮，无与士耽！士之耽兮，犹可说也；女之耽兮，不可说也。\n桑之落矣，其黄而陨。自我徂尔，三岁食贫。淇水汤汤，渐车帷裳。女也不爽，士贰其行。士也罔极，二三其德。\n三岁为妇，靡室劳矣；夙兴夜寐，靡有朝矣。言既遂矣，至于暴矣。兄弟不知，咥其笑矣。静言思之，躬自悼矣。\n及尔偕老，老使我怨。淇则有岸，隰则有泮。总角之宴，言笑晏晏。信誓旦旦，不思其反。\n反是不思，亦已焉哉！"}]},{"prov":"河南","name":"新乡市","d":"M668.8 389.1 L660.0 392.3 L660.5 387.4 L655.0 385.5 L653.7 382.9 L650.3 383.5 L649.0 380.3 L647.1 380.5 L647.8 384.3 L646.6 383.8 L645.9 386.5 L643.9 386.9 L648.1 395.8 L647.3 397.8 L651.0 398.9 L654.2 397.3 L665.8 398.6 L667.0 393.4 L669.8 390.4 L668.8 389.1 Z","v":1,"fd":"待定","texts":[{"t":"\"昔孟母，择邻处；子不学，断机杼\"","a":"王应麟","d":"宋","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《三字经》真实条目按覆盖补缺分配（此为文化渊源补缺）。宋·王应麟《三字经》名句，无地理属性，按覆盖补缺分配","type":"蒙学经典","full":"昔孟母，择邻处；子不学，断机杼"}]},{"prov":"河南","name":"焦作市","d":"M635.1 400.0 L644.3 396.7 L647.3 397.8 L648.1 395.8 L643.9 386.9 L634.0 392.6 L633.7 395.7 L631.0 397.3 L632.1 399.3 L635.1 400.0 Z","v":1,"fd":"待定","texts":[{"t":"马说","a":"韩愈","d":"唐","g":"初中八年级下","place":"千里马喻人才","lt":"birth","basis":"韩愈故乡河阳（今河南孟州，由焦作市代管），据作者故乡匹配河南焦作市","type":"文言文","full":"世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰：\"天下无马！\"呜呼！其真无马邪？其真不知马也！"},{"t":"师说","a":"韩愈","d":"唐","g":"高中必修上","place":"长安论师道","lt":"birth","basis":"韩愈故乡河阳（今河南孟州，由焦作市代管），据作者故乡匹配河南焦作市","type":"文言文","full":"古之学者必有师。师者,所以传道受业解惑也。人非生而知之者,孰能无惑?惑而不从师,其为惑也,终不解矣。生乎吾前,其闻道也固先乎吾,吾从而师之;生乎吾后,其闻道也亦先乎吾,吾从而师之。吾师道也,夫庸知其年之先后生于吾乎?是故无贵无贱,无长无少,道之所存,师之所存也。\n嗟乎!师道之不传也久矣!欲人之无惑也难矣!古之圣人,其出人也远矣,犹且从师而问焉;今之众人,其下圣人也亦远矣,而耻学于师。是故圣益圣,愚益愚。圣人之所以为圣,愚人之所以为愚,其皆出于此乎?爱其子,择师而教之;于其身也,则耻师焉,惑矣。彼童子之师,授之书而习其句读者,非吾所谓传其道解其惑者也。句读之不知,惑之不解,或师焉,或不焉,小学而大遗,吾未见其明也。巫医乐师百工之人,不耻相师。士大夫之族,曰师曰弟子云者,则群聚而笑之。问之,则曰:\"彼与彼年相若也,道相似也,位卑则足羞,官盛则近谀。\"呜呼!师道之不复,可知矣。巫医乐师百工之人,君子不齿,今其智乃反不能及,其可怪也欤!\n圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒,其贤不及孔子。孔子曰:三人行,则必有我师。是故弟子不必不如师,师不必贤于弟子,闻道有先后,术业有专攻,如是而已。\n李氏子蟠,年十七,好古文,六艺经传皆通习之,不拘于时,学于余。余嘉其能行古道,作《师说》以贻之。"},{"t":"锦瑟","a":"李商隐","d":"唐","g":"高中选择性必修上","place":"沧海蓝田意象","lt":"birth","basis":"作者李商隐故里怀州河内（今河南沁阳市，由焦作市代管），写作地不可考，从作者故乡匹配","type":"古诗","full":"锦瑟无端五十弦，一弦一柱思华年。庄生晓梦迷蝴蝶，望帝春心托杜鹃。沧海月明珠有泪，蓝田日暖玉生烟。此情可待成追忆，只是当时已惘然。"},{"t":"嫦娥","a":"李商隐","d":"唐","g":"小学四年级上","place":"月宫嫦娥","lt":"birth","basis":"作者李商隐故里怀州河内（今河南沁阳市，由焦作市代管），写作地不可考，从作者故乡匹配","type":"古诗","full":"云母屏风烛影深，长河渐落晓星沉。嫦娥应悔偷灵药，碧海青天夜夜心。"},{"t":"早春呈水部张十八员外","a":"韩愈","d":"唐","g":"小学六年级下","place":"长安早春","lt":"birth","basis":"韩愈故乡河阳（今河南孟州，由焦作市代管），据作者故乡匹配河南焦作市","type":"古诗","full":"天街小雨润如酥，草色遥看近却无。最是一年春好处，绝胜烟柳满皇都。"},{"t":"夜雨寄北","a":"李商隐","d":"唐","g":"初中七年级上","place":"巴山夜雨","lt":"birth","basis":"作者李商隐故里怀州河内（今河南沁阳市，由焦作市代管），'巴蜀'为泛称，从作者故乡匹配","type":"古诗","full":"君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。"},{"t":"无题（相见时难别亦难）","a":"李商隐","d":"唐","g":"初中九年级上","place":"相思离别","lt":"birth","basis":"作者李商隐故里怀州河内（今河南沁阳市，由焦作市代管），写作地不可考，从作者故乡匹配","type":"古诗","full":"相见时难别亦难，东风无力百花残。春蚕到死丝方尽，蜡炬成灰泪始干。晓镜但愁云鬓改，夜吟应觉月光寒。蓬山此去无多路，青鸟殷勤为探看。"},{"t":"与山巨源绝交书","a":"嵇康","d":"—","g":"课外/补充-古文观止","place":"山阳竹林","lt":"famous","basis":"嵇康寓居山阳，与阮籍等竹林七贤游处，山阳遗址在今修武","type":"书信","full":"康白：足下昔称吾于颍川，吾尝谓之知言。然经怪此意尚未熟悉于足下，何从便得之也？前年从河东还，显宗、阿都说足下议以吾自代；事虽不行，知足下故不知之。足下傍通，多可而少怪；吾直性狭中，多所不堪，偶与足下相知耳。间闻足下迁，惕然不喜。恐足下羞庖人之独割，引尸祝以自助，手荐鸾刀，漫之羶腥。故具为足下陈其可否。\n吾昔读书，得并介之人，或谓无之，今乃信其真有耳。性有所不堪，真不可强。今空语同知有达人无所不堪，外不殊俗，而内不失正，与一世同其波流，而悔吝不生耳。老子、庄周，吾之师也，亲居贱职；柳下惠、东方朔，达人也，安乎卑位，吾岂敢短之哉！又仲尼兼爱，不羞执鞭；子文无欲卿相，而三登令尹；是乃君子思济物之意也。所谓达能兼善而不渝，穷则自得而无闷。以此观之，故尧、舜之君世，许由之岩栖，子房之佐汉，接舆之行歌，其揆一也。仰瞻数君，可谓能遂其志者也。故君子百行，殊途而同致，循性而动，各附所安，故有处朝廷而不出，入山林而不反之论。且延陵高子臧之风，长卿慕相如之节，志气所托，不可夺也。\n吾每读尚子平、台孝威传，慨然慕之，想其为人。加少孤露，母兄骄恣，不涉经学。性复疏懒，筋驽肉缓，头面常一月十五日不洗，不大闷痒，不能沐也。每常小便而忍不起，令胞中略转乃起耳。又纵逸来久，情意傲散，简与礼相背，懒与慢相成，而为侪类见宽，不攻其过。又读庄老，重增其放，故使荣进之心日颓，任实之情转笃。此犹禽鹿，少见驯育，则服从教制；长而见羁，则狂顾顿缨，赴蹈汤火。虽饰以金镳，飨以嘉肴，逾思长林而志在丰草也。\n阮嗣宗口不及人过，吾每师之，而未能及。至性过之，与物无伤，唯饮酒过差耳，至为礼法之士所绳，疾之如雠，幸赖大将军保持之耳。吾不如嗣宗之贤，而有慢弛之阙；又不识人情，闇于机宜；无万石之慎，而有好尽之累。久与事接，疵衅日兴，虽欲无患，其可得乎？\n又人伦有礼，朝廷有法，自惟至熟，有必不堪者七，甚不可者二：卧喜晚起，而当关呼之不置，一不堪也；抱琴行吟，弋钓草野，而吏卒守之，不得妄动，二不堪也；危坐一时，痹不得摇，性复多虱，把搔无已，而当裹以章服，揖拜上官，三不堪也；素不便书，又不喜作书，而人间多事，堆案盈机，不相酬答，则犯教伤义，欲自勉强，则不能久，四不堪也；不喜吊丧，而人道以此为重，已见恕者，人亦不以此为重，吾非见义之人也，故其心常若有失，五不堪也；不喜俗人，而当与之共事，或宾客盈坐，鸣声聒耳，嚣尘臭处，千变万化，在人目前，六不堪也；心不耐烦，而官事鞅掌，机务缠其心，世故繁其虑，七不堪也。\n又每非汤武而薄周孔，在人间不止，此事会显，世教所不容，此甚不可一也；刚肠疾恶，轻肆直言，遇事便发，此甚不可二也。以促中小心之性，统此九患，不有外难，当有内病，宁可久处人间邪！\n又闻道士遗言，饵术黄精，令人久寿，意甚信之。游山泽，观鱼鸟，心甚乐之。一行作吏，此事便废，安能舍其所乐，而从其所惧哉！"},{"t":"送李愿归盘谷序","a":"韩愈","d":"—","g":"课外/补充-古文观止","place":"盘谷（今河南济源）","lt":"famous","basis":"济源今为省直辖县级市，1997年前长期属焦作市辖域，按文化渊源就近归入河南焦作市","type":"序文","full":"太行之阳有盘谷。盘谷之间，泉甘而土肥，草木丛茂，居民鲜少。或曰：“谓其环两山之间，故曰‘盘’。”或曰：“是谷也，宅幽而势阻，隐者之所盘旋。”友人李愿居之。\n愿之言曰：“人之称大丈夫者，我知之矣：利泽施于人，名声昭于时，坐于庙朝，进退百官，而佐天子出令；其在外，则树旗旄，罗弓矢，武夫前呵，从者塞途，供给之人，各执其物，夹道而疾驰。喜有赏，怒有刑。才畯满前，道古今而誉盛德，入耳而不烦。曲眉丰颊，清声而便体，秀外而惠中，飘轻裾，翳长袖，粉白黛绿者，列屋而闲居，妒宠而负恃，争妍而取怜。大丈夫之遇知于天子、用力于当世者之所为也。吾非恶此而逃之，是有命焉，不可幸而致也。穷居而野处，升高而望远，坐茂树以终日，濯清泉以自洁。采于山，美可茹；钓于水，鲜可食。起居无时，惟适之安。与其有誉于前，孰若无毁于其后；与其有乐于身，孰若无忧于其心。车服不维，刀锯不加，理乱不知，黜陟不闻。大丈夫不遇于时者之所为也，我则行之。伺候于公卿之门，奔走于形势之途，足将进而趑趄，口将言而嗫嚅，处污秽而不羞，触刑辟而诛戮，侥幸于万一，老死而后止者，其于为人，贤不肖何如也？”\n昌黎韩愈闻其言而壮之，与之酒而为之歌曰：“盘之中，维子之宫；盘之土，维子之稼；盘之泉，可濯可沿；盘之阻，谁争子所？窈而深，廓其有容；缭而曲，如往而复。嗟盘之乐兮，乐且无央；虎豹远迹兮，蛟龙遁藏；鬼神守护兮，呵禁不祥。饮且食兮寿而康，无不足兮奚所望！膏吾车兮秣吾马，从子于盘兮，终吾生以徜徉！”"}]},{"prov":"河南","name":"濮阳市","d":"M669.8 390.0 L675.2 387.0 L677.7 382.4 L686.2 377.7 L687.0 375.0 L675.3 381.4 L677.2 374.3 L674.7 375.5 L672.8 373.0 L670.6 373.7 L668.3 376.2 L669.4 377.8 L667.6 384.4 L669.8 390.0 Z","v":1,"fd":"待定","texts":[{"t":"范县署中寄舍弟墨第四书","a":"郑燮","d":"—","g":"课外/补充-明清古文","place":"无具体地点（家书）","lt":"famous","basis":"作者任山东范县知县时作于官署","type":"书信散文","full":"十月二十六日得家书，知新置田获秋稼五百斛，甚喜。而今而后，堪为农夫以没世矣！要须制碓、制磨、制筛罗簸箕、制大小扫帚、制升斗斛。家中妇女，率诸婢妾，皆令习舂揄蹂簸之事，便是一种靠田园长子孙气象。天寒冰冻时，穷亲戚朋友到门，先泡一大碗炒米送手中，佐以酱姜一小碟，最是暖老温贫之具。暇日咽碎米饼，煮糊涂粥，双手捧碗，缩颈而啜之，霜晨雪早，得此周身俱暖。嗟乎！嗟乎！吾其长为农夫以没世乎！\n我想天地间第一等人，只有农夫，而士为四民之末。农夫上者种地百亩，其次七八十亩，其次五六十亩，皆苦其身，勤其力，耕种收获，以养天下之人。使天下无农夫，举世皆饿死矣。我辈读书人，入则孝，出则弟，守先待后，得志泽加于民，不得志修身见于世，所以又高于农夫一等。今则不然，一捧书本，便想中举、中进士、作官，如何攫取金钱、造大房屋、置多田产。起手便错走了路头，后来越做越坏，总没有个好结果。其不能发达者，乡里作恶，小头锐面，更不可当。夫束修自好者，岂无其人；经济自期，抗怀千古者，亦所在多有。而好人为坏人所累，遂令我辈开不得口；一开口，人便笑曰：“汝辈书生，总是会说，他日居官，便不如此说了。”所以忍气吞声，只得捱人笑骂。工人制器利用，贾人搬有运无，皆有便民之处。而士独于民大不便，无怪乎居四民之末也！且求居四民之末，而亦不可得也。\n愚兄平生最重农夫，新招佃地人，必须待之以礼。彼称我为主人，我称彼为客户，主客原是对待之义，我何贵而彼何贱乎？要体貌他，要怜悯他；有所借贷，要周全他；不能偿还，要宽让他。尝笑唐人《七夕》诗，咏牛郎织女，皆作会别可怜之语，殊失命名本旨。织女，衣之源也，牵牛，食之本也，在天星为最贵；天顾重之，而人反不重乎！其务本勤民，呈象昭昭可鉴矣。吾邑妇人，不能织织布，然而主中馈，习针线，犹不失为勤谨。近日颇有听鼓儿词，以斗叶为戏者，风俗荡轶，亟宜戒之。\n吾家业地虽有三百亩，总是典产，不可久恃。将来须买田二百亩，予兄弟二人，各得百亩足矣，亦古者一夫受田百亩之义也。若再求多，便是占人产业，莫大罪过。天下无田无业者多矣，我独何人，贪求无厌，穷民将何所措足乎！或曰：“世上连阡越陌，数百顷有余者，子将奈何？”应之曰：“他自做他家事，我自做我家事，世道盛则一德遵王，风俗偷则不同为恶，亦板桥之家法也。”哥哥字。"}]},{"prov":"河南","name":"许昌市","d":"M657.8 411.0 L655.8 412.0 L650.6 409.3 L648.3 410.5 L643.0 408.0 L638.9 411.5 L640.4 413.9 L644.1 415.2 L643.8 420.0 L647.4 421.9 L649.6 421.6 L649.4 418.6 L653.4 416.2 L656.3 419.7 L658.6 420.1 L657.8 411.0 Z","v":1,"fd":"待定","texts":[{"t":"十五夜望月","a":"王建","d":"唐","g":"小学六年级下","place":"中秋望月","lt":"birth","basis":"王建故乡颍川（今河南许昌），据作者故乡匹配河南许昌市","type":"古诗","full":"中庭地白树栖鸦，冷露无声湿桂花。今夜月明人尽望，不知秋思落谁家。"},{"t":"文氏外孙入村收麦","a":"苏辙","d":"北宋","g":"高中必修上","place":"颍昌乡间收麦场景","lt":"famous","basis":"苏辙晚年居颍昌（今河南许昌）时作，写收麦农事","type":"古诗","full":"欲收新麦继陈谷，赖有诸孙替老人。三夜阴霪败场圃，一竿晴日舞比邻。急炊大饼偿饥乏，多博村酤劳苦辛。闭廪归来真了事，赋诗怜汝足精神。"}]},{"prov":"河南","name":"漯河市","d":"M648.8 427.3 L654.3 425.0 L656.7 426.9 L658.2 426.1 L657.7 421.6 L655.3 422.0 L656.3 419.4 L654.3 416.1 L649.4 418.6 L649.6 421.6 L647.0 421.5 L647.8 423.0 L645.3 427.0 L648.8 427.3 Z","v":1,"fd":"待定","texts":[{"t":"说文解字序","a":"许慎","d":"东汉","g":"课外/补充-覆盖平衡新增","place":"说文解字","lt":"famous","basis":"许慎《说文解字》作者，汝南召陵人（今河南漯河郾城区），据《后汉书·儒林传》","type":"古文","full":"古者庖牺氏之王天下也，仰则观象于天，俯则观法于地，视鸟兽之文与地之宜，近取诸身，远取诸物；于是始作《易》八卦，以垂宪象。及神农氏，结绳为治而统其事。庶业其繁，饰伪萌生。黄帝史官仓颉，见鸟兽蹄迒之迹，知分理之可相别异也，初造书契。百工以乂，万品以察，盖取诸夬。“夬，扬于王庭”，言文者，宣教明化于王者朝庭，“君子所以施禄及下，居德则忌”也。\n仓颉之初作书也，盖依类象形，故谓之文。其后形声相益，即谓之字。文者，物象之本；字者，言孳乳而寖多也。著于竹帛谓之书，书者，如也。以迄五帝三王之世，改易殊体，封于泰山者七十有二代，靡有同焉。\n《周礼》：八岁入小学，保氏教国子，先以六书。一曰指事。指事者，视而可识，察而见意，“上、下”是也。二曰象形。象形者，画成其物，随体诘诎，“日、月”是也。三曰形声。形声者，以事为名，取譬相成，“江、河”是也。四曰会意。会意者，比类合谊，以见指撝，“武、信”是也。五曰转注。转注者，建类一首，同意相受，“考、老”是也。六曰假借。假借者，本无其字，依声托事，“令、长”是也。\n及宣王太史籀，著大篆十五篇，与古文或异。至孔子书六经，左丘明述春秋传，皆以古文，厥意可得而说也。\n其后诸侯力政，不统于王，恶礼乐之害己，而皆去其典籍。分为七国，田畴异亩，车涂异轨，律令异法，衣冠异制，言语异声，文字异形。秦始皇帝初兼天下，丞相李斯乃奏同之，罢其不与秦文合者。斯作《仓颉篇》，中车府令赵高作《爰历篇》，大史令胡毋敬作《博学篇》，皆取《史籀》大篆，或颇省改，所谓小篆也。\n是时，秦烧灭经书，涤除旧典，大发吏卒，兴戍役。官狱职务繁，初有隶书，以趣约易，而古文由此绝矣。自尔秦书有八体：一曰大篆，二曰小篆，三曰刻符，四曰虫书，五曰摹印，六曰署书，七曰殳书，八曰隶书。\n汉兴有草书。尉律：学童十七以上始试，讽籀书九千字，乃得为史。又以八体试之，郡移太史并课。最者，以为尚书史。书或不正，辄举劾之。今虽有尉律，不课；小学不修，莫达其说久矣。\n孝宣皇帝时，召通《仓颉》读者，张敞从受之；凉州刺史杜业、沛人爰礼、讲学大夫秦近，亦能言之。孝平皇帝时，征礼等百余人，令说文字未央廷中，以礼为小学元士。黄门侍郎扬雄，采以作《训纂篇》。凡《仓颉》以下十四篇，凡五千三百四十字，群书所载，略存之矣。\n及亡新居摄，使大司空甄丰等校文书之部。自以为应制作，颇改定古文。时有六书：一曰古文，孔子壁中书也；二曰奇字，即古文而异者也；三曰篆书，即小篆，秦始皇帝使下杜人程邈所作也；四曰左书，即秦隶书；五曰缪篆，所以摹印也；六曰鸟虫书，所以书幡信也。\n壁中书者，鲁恭王坏孔子宅，而得《礼记》《尚书》《春秋》《论语》《孝经》。又北平侯张苍献《春秋左氏传》。郡国亦往往于山川得鼎彝，其铭即前代之古文，皆自相似。虽叵复见远流，其详可得略说也。\n而世人大共非訾，以为好奇者也，故诡更正文，乡壁虚造不可知之书，变乱常行，以耀于世。诸生竞逐说字，解经谊，称秦之隶书为仓颉时书，云：“父子相传，何得改易！”乃猥曰：“马头人为长，人持十为斗，虫者，屈中也。”廷尉说律，至以字断法：“苛人受钱，苛之字止句也。”若此者甚众，皆不合孔氏古文，谬于《史籀》。俗儒鄙夫，玩其所习，蔽所希闻。不见通学，未尝睹字例之条。怪旧埶而善野言，以其所知为秘妙，究洞圣人之微恉。又见《仓颉篇》中“幼子承诏”，因曰：“古帝之所作也，其辞有神仙之术焉。”其迷误不谕，岂不悖哉！\n《书》曰：“予欲观古人之象。”言必遵修旧文而不穿凿。孔子曰：“吾犹及史之阙文，今亡矣夫。”盖非其不知而不问，人用己私，是非无正，巧说邪辞，使天下学者疑。\n盖文字者，经艺之本，王政之始。前人所以垂后，后人所以识古。故曰：“本立而道生。”知天下之至赜而不可乱也。今叙篆文，合以古籀；博采通人，至于小大；信而有证，稽譔其说。将以理群类，解谬误，晓学者，达神恉。分别部居，不相杂厕也。万物咸睹，靡不兼载。厥谊不昭，爰明以喻。其称《易》孟氏、《书》孔氏、《诗》毛氏、《礼》周官、《春秋》左氏、《论语》《孝经》，皆古文也。其于所不知，盖阙如也。"}]},{"prov":"河南","name":"三门峡市","d":"M621.6 395.2 L616.8 396.7 L615.2 399.5 L604.9 401.7 L603.6 403.9 L596.3 404.2 L598.3 409.2 L597.3 411.1 L600.5 412.7 L599.6 415.4 L601.0 416.9 L599.6 418.0 L606.6 424.5 L610.3 419.8 L609.8 417.3 L611.8 416.2 L611.9 413.7 L608.7 411.5 L608.5 408.3 L615.3 404.9 L617.2 405.5 L619.3 403.3 L620.9 404.2 L622.5 400.7 L620.2 398.6 L621.6 395.2 Z","v":1,"fd":"待定","texts":[{"t":"〈老子〉四章","a":"老子","d":"春秋","g":"高中选择性必修上","place":"说理无实景","lt":"write","basis":"写作地函谷关（今河南灵宝市，属三门峡市），老子出关著书处，从写作地匹配","type":"文言文","full":"道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母。故常无欲，以观其妙；常有欲，以观其徼。此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。\n天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。故有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教。万物作焉而不辞，生而不有，为而不恃，功成而弗居。夫唯弗居，是以不去。\n不出户，知天下；不窥牖，见天道。其出弥远，其知弥少。是以圣人不行而知，不见而名，不为而成。\n上善若水。水善利万物而不争，处众人之所恶，故几于道。居善地，心善渊，与善仁，言善信，政善治，事善能，动善时。夫唯不争，故无尤。"},{"t":"蹇叔哭师","a":"左丘明","d":"传","g":"课外/补充-古文观止","place":"崤山（今河南三门峡洛宁西北）；秦都雍（今陕西宝鸡凤翔）","lt":"famous","basis":"秦晋崤之战战场即崤山，在今河南洛宁西北、三门峡市境内","type":"史传（左传）","full":"冬，晋文公卒。庚辰，将殡于曲沃。出绛，柩有声如牛。卜偃使大夫拜，曰：“君命大事，将有西师过轶我，击之，必大捷焉。”\n杞子自郑使告于秦曰：“郑人使我掌其北门之管，若潜师以来，国可得也。”穆公访诸蹇叔。蹇叔曰：“劳师以袭远，非所闻也。师劳力竭，远主备之，无乃不可乎？师之所为，郑必知之。勤而无所，必有悖心。且行千里，其谁不知？”公辞焉。召孟明、西乞、白乙使出师于东门之外。蹇叔哭之曰：“孟明！吾见师之出而不见其入也。”公使谓之曰：“尔何知，中寿，尔墓之木拱矣！”\n蹇叔之子与师，哭而送之，曰：“晋人御师必于崤，崤有二陵焉。其南陵，夏后皋之墓也；其北陵，文王之所辟风雨也，必死是间，余收尔骨焉！”秦师遂东。"},{"t":"石壕吏","a":"杜甫","d":"唐","g":"初中八年级下","place":"石壕村","lt":"famous","basis":"安史之乱中杜甫途经石壕村作，石壕村在今河南三门峡陕州区","type":"古诗","full":"暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。吏呼一何怒！妇啼一何苦！\n听妇前致词：三男邺城戍。一男附书至，二男新战死。存者且偷生，死者长已矣！\n室中更无人，惟有乳下孙。有孙母未去，出入无完裙。老妪力虽衰，请从吏夜归。\n急应河阳役，犹得备晨炊。夜久语声绝，如闻泣幽咽。天明登前途，独与老翁别。"}]},{"prov":"河南","name":"南阳市","d":"M606.3 424.4 L606.8 432.1 L609.0 433.0 L610.1 437.4 L615.3 443.1 L616.3 442.3 L627.2 448.3 L630.7 446.7 L634.0 447.9 L641.2 446.2 L644.5 449.3 L649.9 445.4 L650.8 442.9 L648.2 440.8 L646.0 443.5 L641.1 443.5 L641.2 436.8 L639.4 436.2 L640.9 433.9 L644.0 433.0 L644.3 428.9 L638.6 426.7 L637.0 423.4 L630.4 423.8 L624.7 421.2 L623.4 423.5 L620.7 424.1 L609.9 419.7 L608.0 424.0 L606.3 424.4 Z","v":1,"fd":"待定","texts":[{"t":"岳阳楼记","a":"范仲淹","d":"北宋","g":"初中九年级上","place":"岳阳楼洞庭湖（湖南岳阳）","lt":"write","basis":"写作地邓州（今河南邓州市，由南阳市代管），范仲淹知邓州时应友嘱作《岳阳楼记》，从写作地匹配","type":"文言文","full":"庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。\n予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？\n若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。\n至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。\n嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰『先天下之忧而忧，后天下之乐而乐』乎。噫！微斯人，吾谁与归？\n时六年九月十五日。"},{"t":"寒食","a":"韩翃","d":"唐","g":"小学六年级下","place":"长安寒食宫苑","lt":"birth","basis":"韩翃南阳人（今河南南阳），据作者故乡匹配河南南阳市","type":"古诗","full":"春城无处不飞花，寒食东风御柳斜。日暮汉宫传蜡烛，轻烟散入五侯家。"},{"t":"心在朝廷，原无论先主后主；名高天下，何必辨襄阳南阳。","a":"顾家相","d":"—","g":"课外/补充-楹联","place":"河南南阳卧龙岗武侯祠","lt":"famous","basis":"清道光年间南阳知府顾家相撰，悬于武侯祠","type":"楹联","full":"心在朝廷，原无论先主后主；名高天下，何必辨襄阳南阳。"}]},{"prov":"河南","name":"商丘市","d":"M679.9 414.7 L684.9 415.8 L688.2 421.5 L695.6 417.9 L693.8 413.5 L694.6 410.5 L691.3 410.7 L687.0 404.1 L678.0 404.8 L674.6 399.2 L666.9 401.1 L668.6 402.7 L667.5 409.9 L671.6 411.8 L670.4 417.0 L679.9 414.7 Z","v":1,"fd":"待定","texts":[{"t":"别董大","a":"高适","d":"唐","g":"小学四年级上","place":"边塞旷野","lt":"write","basis":"写作地睢阳（今河南商丘），从写作地匹配","type":"古诗","full":"千里黄云白日曛，北风吹雁雪纷纷。莫愁前路无知己，天下谁人不识君。"},{"t":"大道之行也","a":"戴圣《礼记》","d":"西汉","g":"初中八年级下","place":"大同社会【虚构】","lt":"birth","basis":"戴圣梁国人（今河南商丘），据编者故乡匹配河南商丘市","type":"文言文","full":"大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。"},{"t":"北冥有鱼","a":"庄周《庄子》","d":"战国","g":"初中八年级下","place":"北冥南冥【虚构】","lt":"write","basis":"作者庄子故里宋国蒙（今河南商丘一带），写作地宋国（都商丘），从写作地匹配","type":"文言文","full":"北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。"},{"t":"庖丁解牛","a":"庄周《庄子》","d":"战国","g":"高中必修下","place":"魏国宫廷","lt":"write","basis":"作者庄子故里宋国蒙（今河南商丘一带），写作地宋国，从写作地匹配","type":"文言文","full":"庖丁为文惠君解牛,手之所触,肩之所倚,足之所履,膝之所踦,砉然向然,奏刀騞然,莫不中音。合于《桑林》之舞,乃中《经首》之会。文惠君曰:\"嘻,善哉!技盖至此乎?\"庖丁释刀对曰:\"臣之所好者道也,进乎技矣。始臣之解牛之时,所见无非牛者。三年之后,未尝见全牛也。方今之时,臣以神遇而不以目视,官知止而神欲行。依乎天理,批大郤,导大窾,因其固然,技经肯綮之未尝,而况大軱乎!良庖岁更刀,割也;族庖月更刀,折也。今臣之刀十九年矣,所解数千牛矣,而刀刃若新发于硎。彼节者有间,而刀刃者无厚;以无厚入有间,恢恢乎其于游刃必有余地矣,是以十九年而刀刃若新发于硎。虽然,每至于族,吾见其难为,怵然为戒,视为止,行为迟。动刀甚微,謋然已解,如土委地。提刀而立,为之四顾,为之踌躇满志,善刀而藏之。\"文惠君曰:\"善哉!吾闻庖丁之言,得养生焉。\""},{"t":"五石之瓠","a":"庄周《庄子》","d":"战国","g":"高中选择性必修上","place":"虚构寓言场景","lt":"write","basis":"作者庄子故里宋国蒙（今河南商丘一带），写作地宋国，从写作地匹配","type":"文言文","full":"惠子相梁，庄子往见之。或谓惠子曰：「庄子来，欲代子相。」于是惠子恐，搜于国中三日三夜。庄子往见之，曰：「南方有鸟，其名为鹓鶵，子知之乎？夫鹓鶵翾于云雾之上，翅羽若天之澄海。游于江湖之间，弋人得之以为生，其为物甚小，而翼甚微，故得之若失。三年虚而不飞，以保身而全生。此虽有从而得之者也，非有爱于物也，故不足以累生。今夫斄牛，其大若垂天之云。此能为大矣，而不能执鼠。今子有大树，患其无用，何不树之于无何有之乡、广莫之野，彷徨乎无为其侧，逍遥乎寝卧其下？不夭斤斧，物无害者，无所可用，安所困苦哉！」"},{"t":"将进酒","a":"李白","d":"唐","g":"高中选择性必修上","place":"黄河宴饮","lt":"write","basis":"写作地梁园（今河南商丘一带），李白游梁园作《将进酒》，从写作地匹配","type":"古诗","full":"君不见黄河之水天上来，奔流到海不复回。君不见高堂明镜悲白发，朝如青丝暮成雪。\n人生得意须尽欢，莫使金樽空对月。天生我材必有用，千金散尽还复来。\n烹羊宰牛且为乐，会须一饮三百杯。岑夫子，丹丘生，将进酒，杯莫停。\n与君歌一曲，请君为我倾耳听。钟鼓馔玉不足贵，但愿长醉不复醒。\n古来圣贤皆寂寞，惟有饮者留其名。陈王昔时宴平乐，斗酒十千恣欢谑。\n主人何为言少钱，径须沽取对君酌。五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。"},{"t":"李姬传","a":"侯方域","d":"—","g":"课外/补充-明清古文","place":"今江苏省南京市（秦淮李香君）","lt":"famous","basis":"作者归乡后追忆南京旧游，传李香君","type":"传记散文","full":"李姬者，名香，母曰贞丽。贞丽有侠气，尝一夜博，输千金立尽。所交接皆当世豪杰，尤与阳羡陈贞慧善也。姬为其养女，亦侠而慧，略知书，能辨别士大夫贤否，张学士溥、夏吏部允彝亟称之。少风调皎爽不群。十三岁，从吴人周如松受歌玉茗堂四传奇，皆能尽其音节。尤工琵琶词，然不轻发也。\n雪苑侯生，己卯来金陵，与相识。姬尝邀侯生为诗，而自歌以偿之。\n初，皖人阮大铖者，以阿附魏忠贤论城旦，屏居金陵，为清议所斥。阳羡陈贞慧、贵池吴应箕实首其事，持之力。大铖不得已，欲侯生为解之，乃假所善王将军，日载酒食与侯生游。姬曰：王将军贫，非结客者，公子盍叩之？侯生三问，将军乃屏人述大铖意。姬私语侯生曰：妾少从假母识阳羡君，其人有高义，闻吴君尤铮铮，今皆与公子善，奈何以阮公负至交乎！且以公子之世望，安事阮公！公子读万卷书，所见岂后于贱妾耶？侯生大呼称善，醉而卧。王将军者殊怏怏，因辞去，不复通。\n未几，侯生下第。姬置酒桃叶渡，歌琵琶词以送之，曰：公子才名文藻，雅不减中郎。中郎学不补行，今琵琶所传词固妄，然尝昵董卓，不可掩也。公子豪迈不羁，又失意，此去相见未可期，愿终自爱，无忘妾所歌琵琶词也！妾亦不复歌矣！\n侯生去后，而故开府田仰者，以金三百锾，邀姬一见。姬固却之。开府惭且怒，且有以中伤姬。姬叹曰：田公岂异于阮公乎？吾向之所赞于侯公子者谓何？今乃利其金而赴之，是妾卖公子矣！卒不往。"},{"t":"狱中上梁王书","a":"邹阳","d":"—","g":"课外/补充-古文观止","place":"梁睢阳（今河南商丘）","lt":"famous","basis":"邹阳仕梁孝王，被谗下于梁国睢阳狱，梁园遗址在今商丘","type":"上书（汉书）","full":"邹阳从梁孝王游。阳为人有智略，慷慨不苟合，介于羊胜、公孙诡之间。胜等疾阳，恶之孝王。孝王怒，下阳吏。将杀之。阳乃从狱中上书曰：\n臣闻“忠无不报，信不见疑”，臣常以为然，徒虚语耳。昔荆轲慕燕丹之义，白虹贯日，太子畏之；卫先生为秦画长平之事，太白食昴，昭王疑之。夫精变天地而信不谕两主，岂不哀哉！今臣尽忠竭诚，毕议愿知，左右不明，卒从吏讯，为世所疑。是使荆轲、卫先生复起，而燕、秦不寤也。愿大王熟察之。\n昔玉人献宝，楚王诛之；李斯竭忠，胡亥极刑。是以箕子阳狂，接舆避世，恐遭此患也。愿大王察玉人、李斯之意，而后楚王、胡亥之听，毋使臣为箕子、接舆所笑。臣闻比干剖心，子胥鸱夷，臣始不信，乃今知之。愿大王熟察，少加怜焉。\n语曰：“有白头如新，倾盖如故。”何则？知与不知也。故樊於期逃秦之燕，藉荆轲首以奉丹事；王奢去齐之魏，临城自刭以却齐而存魏。夫王奢、樊於期非新于齐、秦而故于燕、魏也，所以去二国、死两君者，行合于志，慕义无穷也。是以苏秦不信于天下，为燕尾生；白圭战亡六城，为魏取中山。何则？诚有以相知也。苏秦相燕，人恶之燕王，燕王按剑而怒，食以駃騠；白圭显于中山，人恶之于魏文侯，文侯赐以夜光之璧。何则？两主二臣，剖心析肝相信，岂移于浮辞哉！\n故女无美恶，入宫见妒；士无贤不肖，入朝见嫉。昔司马喜膑脚于宋，卒相中山；范雎拉胁折齿于魏，卒为应侯。此二人者，皆信必然之画，捐朋党之私，挟孤独之交，故不能自免于嫉妒之人也。是以申徒狄蹈雍之河，徐衍负石入海，不容于世，义不苟取，比周于朝，以移主上之心。故百里奚乞食于道路，缪公委之以政；宁戚饭牛车下，桓公任之以国。此二人者，岂素宦于朝，借誉于左右，然后二主用之哉？感于心，合于行，坚如胶漆，昆弟不能离，岂惑于众口哉？故偏听生奸，独任成乱。昔鲁听季孙之说逐孔子，宋任子冉之计囚墨翟。夫以孔、墨之辩，不能自免于谗谀，而二国以危。何则？众口铄金，积毁销骨也。秦用戎人由余而伯中国，齐用越人子臧而强威、宣。此二国岂系于俗，牵于世，系奇偏之浮辞哉？公听并观，垂明当世。故意合则胡越为兄弟，由余、子臧是矣；不合则骨肉为仇敌，朱、象、管、蔡是矣。今人主诚能用齐、秦之明，后宋、鲁之听，则五伯不足侔，而三王易为也。\n是以圣王觉寤，捐子之之心，而不说田常之贤，封比干之后，修孕妇之墓，故功业覆于天下。何则？欲善无厌也。夫晋文亲其仇，强伯诸侯；齐桓用其仇，而一匡天下。何则？慈仁殷勤，诚加于心，不可以虚辞借也。\n臣闻明月之珠，夜光之璧，以暗投人于道，众莫不按剑相眄者。何则？无因而至前也。蟠木根柢，轮囷离奇，而为万乘器者，以左右先为之容也。故无因而至前，虽出随珠和璧，只怨结而不见德；有人先游，则枯木朽株，树功而不忘。今夫天下布衣穷居之士，身在贫羸，虽蒙尧、舜之术，挟伊、管之辩，怀龙逢、比干之意，而素无根柢之容，虽竭精神，欲开忠于当世之君，则人主必袭按剑相眄之迹矣。是使布衣之士不得为枯木朽株之资也。\n是以圣王制世御俗，独化于陶钧之上，而不牵乎卑乱之语，不夺乎众多之口。故秦皇帝任中庶子蒙嘉之言，以信荆轲，而匕首窃发；周文王猎泾渭，载吕尚归，以王天下。秦信左右而亡，周用乌集而王。何则？以其能越挛拘之语，驰域外之议，独观乎昭旷之道也。今人主沉谄谀之辞，牵帷廧之制，使不羁之士与牛骥同皁，此鲍焦所以愤于世也。\n臣闻盛饰入朝者，不以私污义，底厉名号者，不以利伤行。故里名胜母，曾子不入；邑号朝歌，墨子回车。今欲使天下寥廓之士，笼于威重之权，胁于位势之贵，回面污行，以事谄谀之人，而求亲近于左右，则士有伏死堀穴岩薮之中耳，安有尽忠信而趋阙下者哉！"},{"t":"张中丞传后叙","a":"韩愈","d":"—","g":"课外/补充-古文观止","place":"睢阳（今河南商丘）","lt":"famous","basis":"张巡许远死守睢阳抗安禄山，睢阳故城在今商丘","type":"叙文","full":"元和二年四月十三日夜,愈与吴郡张籍阅家中旧书,得李翰所为《张巡传》。翰以文章自名,为此传颇详密。然尚恨有阙者:不为许远立传,又不载雷万春事首尾。远虽材若不及巡者,开门纳巡,位本在巡上。授之柄而处其下,无所疑忌,竟与巡俱守死,成功名,城陷而虏,与巡死先后异耳。两家子弟材智下,不能通知二父志,以为巡死而远就虏,疑畏死而辞服于贼。远诚畏死,何苦守尺寸之地,食其所爱之肉,以与贼抗而不降乎?当其围守时,外无蚍蜉蚁子之援,所欲忠者,国与主耳,而贼语以国亡主灭。远见救援不至,而贼来益众,必以其言为信;外无待而犹死守,人相食且尽,虽愚人亦能数日而知死所矣。远之不畏死亦明矣!乌有城坏其徒俱死,独蒙愧耻求活?虽至愚者不忍为,呜呼!而谓远之贤而为之邪?说者又谓远与巡分城而守,城之陷,自远所分始。以此诟远,此又与儿童之见无异。人之将死,其藏腑必有先受其病者;引绳而绝之,其绝必有处。观者见其然,从而尤之,其亦不达于理矣!小人之好议论,不乐成人之美,如是哉!如巡、远之所成就,如此卓卓,犹不得免,其他则又何说!\n当二公之初守也,宁能知人之卒不救,弃城而逆遁?苟此不能守,虽避之他处何益?及其无救而且穷也,将其创残饿羸之余,虽欲去,必不达。二公之贤,其讲之精矣!守一城,捍天下,以千百就尽之卒,战百万日滋之师,蔽遮江淮,沮遏其势,天下之不亡,其谁之功也!当是时,弃城而图存者,不可一二数;擅强兵坐而观者,相环也。不追议此,而责二公以死守,亦见其自比于逆乱,设淫辞而助之攻也。\n愈尝从事于汴、徐二府,屡道于两府间,亲祭于其所谓双庙者。其老人往往说巡、远时事云:南霁云之乞救于贺兰也,贺兰嫉巡、远之声威功绩出己上,不肯出师救。爱霁云之勇且壮,不听其语,强留之,具食与乐,延霁云坐。霁云慷慨语曰:\"云来时,睢阳之人不食月余日矣。云虽欲独食,义不忍;虽食,且不下咽。\"因拔所佩刀,断一指,血淋漓,以示贺兰。一座大惊,皆感激为云泣下。云知贺兰终无为云出师意,即驰去。将出城,抽矢射佛寺浮图,矢著其上砖半箭,曰:\"吾归破贼,必灭贺兰,此矢所以志也。\"愈贞元中过泗州,船上人犹指以相语。城陷,贼以刃胁降巡,巡不屈,即牵去,将斩之。又降霁云,云未应。巡呼云曰:\"南八,男儿死耳,不可为不义屈!\"云笑曰:\"欲将以有为也。公有言,云敢不死!\"即不屈。\n张籍曰:有于嵩者,少依于巡。及巡起事,嵩常在围中。籍大历中于和州乌江县见嵩,嵩时年六十余矣。以巡初尝得临涣县尉,好学,无所不读。籍时尚小,粗问巡、远事,不能细也。云:巡长七尺余,须髯若神。尝见嵩读《汉书》,谓嵩曰:\"何为久读此?\"嵩曰:\"未熟也。\"巡曰:\"吾于书读不过三遍,终身不忘也。\"因诵嵩所读书,尽卷不错一字。嵩惊,以为巡偶熟此卷,因乱抽他帙以试,无不尽然。嵩又取架上诸书,试以问巡,巡应口诵无疑。嵩从巡久,亦不见巡常读书也。为文章,操纸笔立书,未尝起草。初守睢阳时,士卒仅万人,城中居人户亦且数万,巡因一见问姓名,其后无不识者。巡怒,须髯辄张。及城陷,贼缚巡等数十人坐,且将戮。巡起旋,其众见巡起,或起或泣。巡曰:\"汝勿怖,死,命也。\"众泣不能仰视。巡就戮时,颜色不乱,阳阳如平常。远宽厚长者,貌如其心,与巡同年生,月日后于巡,呼巡为兄,死时年四十九。嵩贞元初死于亳、宋间,或传嵩有田在亳、宋间,武人夺而有之,嵩将诣州讼理,为所杀。嵩无子。张籍云。"}]},{"prov":"河南","name":"信阳市","d":"M649.7 449.3 L651.2 457.4 L652.6 456.8 L653.5 459.4 L656.6 457.4 L658.4 459.3 L663.0 459.1 L662.6 463.0 L666.9 465.0 L671.1 464.1 L672.2 462.2 L674.5 466.5 L678.0 460.4 L684.0 458.6 L684.0 443.4 L678.5 446.7 L676.1 443.4 L668.2 441.9 L666.3 442.7 L666.2 444.7 L662.8 444.7 L663.9 447.3 L660.4 449.1 L656.8 445.0 L655.1 445.8 L654.8 444.2 L653.1 444.8 L651.0 442.5 L649.1 446.4 L649.7 449.3 Z","v":1,"fd":"2021.04","texts":[{"t" 人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。"},{"t":"黄鹤楼","a":"崔颢","d":"唐","g":"初中八年级上","place":"黄鹤楼","lt":"write","basis":"写作地江夏（今湖北武汉），崔颢登黄鹤楼作，从写作地匹配","type":"古诗","full":"昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。晴川历历汉阳树，芳草萋萋鹦鹉洲。日暮乡关何处是？烟波江上使人愁。"},{"t":"水调歌头·游泳","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"长江、武汉长江大桥","lt":"famous","basis":"1956年6月三次畅游长江后作于武汉","type":"词","full":"才饮长沙水，又食武昌鱼。万里长江横渡，极目楚天舒。不管风吹浪打，胜似闲庭信步，今日得宽余。子在川上曰：逝者如斯夫！风樯动，龟蛇静，起宏图。一桥飞架南北，天堑变通途。更立西江石壁，截断巫山云雨，高峡出平湖。神女应无恙，当惊世界殊。"},{"t":"爽气西来，云雾扫开天地憾；大江东去，波涛洗净古今愁。","a":"符秉忠撰、吴作人书","d":"—","g":"课外/补充-楹联","place":"湖北武汉黄鹤楼","lt":"famous","basis":"悬于黄鹤楼一楼大厅立柱","type":"楹联","full":"爽气西来，云雾扫开天地憾；大江东去，波涛洗净古今愁。"}]},{"prov":"湖北","name":"黄石市","d":"M662.4 492.0 L662.3 494.4 L665.2 495.3 L665.2 497.9 L668.7 501.8 L672.0 502.7 L671.4 499.3 L674.1 500.6 L677.0 498.2 L677.7 496.3 L670.8 488.2 L668.8 489.3 L665.1 486.9 L665.3 492.2 L662.4 492.0 Z","v":1,"fd":"待定","texts":[{"t":"\"处世戒多言，言多必失\"","a":"洪应明/陈继儒","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《菜根谭》/《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"处世戒多言，言多必失"}]},{"prov":"湖北","name":"十堰市","d":"M606.9 431.3 L605.6 430.2 L601.5 433.3 L599.3 430.3 L594.0 432.1 L584.6 429.9 L581.4 432.3 L587.1 433.9 L586.6 437.0 L591.9 438.4 L593.6 442.3 L590.6 444.0 L584.5 442.9 L582.5 446.9 L584.3 452.5 L583.8 459.8 L586.1 460.3 L586.0 463.3 L593.8 462.9 L594.0 459.7 L598.4 457.3 L606.5 457.8 L606.1 454.7 L607.9 455.5 L607.2 452.9 L609.9 451.4 L609.9 448.3 L615.5 443.4 L606.9 431.3 Z","v":1,"fd":"待定","texts":[{"t":"“路遥知马力，日久见人心”","a":"佚名","d":"明清蒙学","g":"课外/补充-增广贤文","place":"【无实景，说理格言】","lt":"famous","basis":"蒙学格言无地理属性，作者不可考，作为蒙学通识素材按覆盖缺口分配至湖北省十堰市","type":"蒙学格言","full":"“路遥知马力，日久见人心”"}]},{"prov":"湖北","name":"宜昌市","d":"M623.3 480.5 L621.4 471.6 L617.9 466.8 L613.6 468.0 L609.9 465.0 L606.8 465.7 L606.9 463.0 L602.1 463.5 L600.0 464.5 L599.4 467.5 L597.1 467.9 L598.9 471.3 L595.4 478.5 L597.2 478.3 L598.1 482.5 L596.2 484.2 L595.9 488.5 L594.4 488.7 L595.9 490.8 L595.2 494.1 L598.2 492.2 L602.0 492.5 L603.2 490.8 L609.0 492.4 L614.5 491.4 L617.9 486.0 L619.4 487.7 L620.9 486.4 L622.7 487.9 L620.6 484.4 L623.3 480.5 Z","v":1,"fd":"待定","texts":[{"t":"离骚（节选）","a":"屈原","d":"战国楚","g":"高中选择性必修中","place":"楚国朝廷流放途","lt":"birth","basis":"作者屈原故里丹阳（今湖北秭归县，属宜昌市），'楚地'为泛称，从作者故乡匹配","type":"古诗","full":"帝高阳之苗裔兮，朕皇考曰伯庸。摄提贞于孟陬兮，惟庚寅吾以降。皇览揆余初度兮，肇锡余以嘉名。名余曰正则兮，字余曰灵均。\n纷吾既有此内美兮，又重之以修能。扈江离与辟芷兮，纫秋兰以为佩。汩余若将不及兮，恐年岁之不吾与。朝搴阰之木兰兮，夕揽洲之宿莽。日月忽其不淹兮，春与秋其代序。惟草木之零落兮，恐美人之迟暮。不抚壮而弃秽兮，何不改此度？乘骐骥以驰骋兮，来吾道夫先路！\n昔三后之纯粹兮，固众芳之所在。杂申椒与菌桂兮，岂惟纫夫蕙茝！彼尧、舜之耿介兮，既遵道而得路。何桀纣之猖披兮，夫唯捷径以窘步。惟夫党人之偷乐兮，路幽昧以险隘。岂余身之惮殃兮，恐皇舆之败绩！忽奔走以先后兮，及前王之踵武。荃不察余之中情兮，反信谗而齌怒。余固知謇謇之为患兮，忍而不能舍也。指九天以为正兮，夫惟灵修之故也。曰黄昏以为期兮，羌中道而改路。初既与余成言兮，后悔遁而有他。余既不难夫离别兮，伤灵修之数化。\n余既滋兰之九畹兮，又树蕙之百亩。畦留夷与揭车兮，杂杜衡与芳芷。冀枝叶之峻茂兮，愿俟时乎吾将刈。虽萎绝其亦何伤兮，哀众芳之芜秽。\n众皆竞进以贪婪兮，凭不厌乎求索。羌内恕己以量人兮，各兴心而嫉妒。忽驰骛以追逐兮，非余心之所急。老冉冉其将至兮，恐修名之不立。朝饮木兰之坠露兮，夕餐秋菊之落英。苟余情其信姱以练要兮，长顑颔亦何伤。擥木根以结茝兮，贯薜荔之落蕊。矫菌桂以纫蕙兮，索胡绳之纚纚。謇吾法夫前修兮，非世俗之所服。虽不周于今之人兮，愿依彭咸之遗则。\n长太息以掩涕兮，哀民生之多艰。余虽好修姱以鞿羁兮，謇朝谇而夕替。既替余以蕙纕兮，又申之以揽茝。亦余心之所善兮，虽九死其犹未悔。怨灵修之浩荡兮，终不察夫民心。众女嫉余之蛾眉兮，谣诼谓余以善淫。固时俗之工巧兮，偭规矩而改错。背绳墨以追曲兮，竞周容以为度。忳郁邑余侘傺兮，吾独穷困乎此时也。宁溘死以流亡兮，余不忍为此态也。鸷鸟之不群兮，自前世而固然。何方圜之能周兮，夫孰异道而相安？屈心而抑志兮，忍尤而攘诟。伏清白以死直兮，固前圣之所厚。\n悔相道之不察兮，延伫乎吾将反。回朕车以复路兮，及行迷之未远。步余马于兰皋兮，驰椒丘且焉止息。进不入以离尤兮，退将复修吾初服。制芰荷以为衣兮，集芙蓉以为裳。不吾知其亦已兮，苟余情其信芳。高余冠之岌岌兮，长余佩之陆离。芳与泽其杂糅兮，唯昭质其犹未亏。忽反顾以游目兮，将往观乎四荒。佩缤纷其繁饰兮，芳菲菲其弥章。民生各有所乐兮，余独好修以为常。虽体解吾犹未变兮，岂余心之可惩。\n女嬃之婵媛兮，申申其詈予，曰：“鲧婞直以亡身兮，终然夭乎羽之野。汝何博謇而好修兮，纷独有此姱节？薋菉葹以盈室兮，判独离而不服。众不可户说兮，孰云察余之中情？世并举而好朋兮，夫何茕独而不予听？”\n依前圣以节中兮，喟凭心而历兹。济沅、湘以南征兮，就重华而敶词：启《九辩》与《九歌》兮，夏康娱以自纵。不顾难以图后兮，五子用失乎家巷。羿淫游以佚畋兮，又好射夫封狐。固乱流其鲜终兮，浞又贪夫厥家。浇身被服强圉兮，纵欲而不忍。日康娱而自忘兮，厥首用夫颠陨。夏桀之常违兮，乃遂焉而逢殃。后辛之菹醢兮，殷宗用而不长。汤、禹俨而祗敬兮，周论道而莫差。举贤才而授能兮，循绳墨而不颇。皇天无私阿兮，览民德焉错辅。夫维圣哲以茂行兮，苟得用此下土。瞻前而顾后兮，相观民之计极。夫孰非义而可用兮？孰非善而可服？阽余身而危死兮，览余初其犹未悔。不量凿而正枘兮，固前修以菹醢。曾歔欷余郁邑兮，哀朕时之不当。揽茹蕙以掩涕兮，沾余襟之浪浪。\n跪敷衽以陈辞兮，耿吾既得此中正。驷玉虬以椉鹥兮，溘埃风余上征。朝发轫于苍梧兮，夕余至乎县圃。欲少留此灵琐兮，日忽忽其将暮。吾令羲和弭节兮，望崦嵫而勿迫。路曼曼其修远兮，吾将上下而求索。饮余马于咸池兮，总余辔乎扶桑。折若木以拂日兮，聊逍遥以相羊。前望舒使先驱兮，后飞廉使奔属。鸾皇为余先戒兮，雷师告余以未具。吾令凤鸟飞腾兮，继之以日夜。飘风屯其相离兮，帅云霓而来御。纷总总其离合兮，斑陆离其上下。吾令帝阍开关兮，倚阊阖而望予。时暧暧其将罢兮，结幽兰而延伫。世溷浊而不分兮，好蔽美而嫉妒。\n朝吾将济于白水兮，登阆风而緤马。忽反顾以流涕兮，哀高丘之无女。溘吾游此春宫兮，折琼枝以继佩。及荣华之未落兮，相下女之可诒。吾令丰隆乘云兮，求宓妃之所在。解佩纕以结言兮，吾令謇修以为理。纷总总其离合兮，忽纬繣其难迁。夕归次于穷石兮，朝濯发乎洧盘。保厥美以骄傲兮，日康娱以淫游。虽信美而无礼兮，来违弃而改求。览相观于四极兮，周流乎天余乃下。望瑶台之偃蹇兮，见有娀之佚女。吾令鸩为媒兮，鸩告余以不好。雄鸠之鸣逝兮，余犹恶其佻巧。心犹豫而狐疑兮，欲自适而不可。凤皇既受诒兮，恐高辛之先我。\n欲远集而无所止兮，聊浮游以逍遥。及少康之未家兮，留有虞之二姚。理弱而媒拙兮，恐导言之不固。世溷浊而嫉贤兮，好蔽美而称恶。闺中既以邃远兮，哲王又不寤。怀朕情而不发兮，余焉能忍而与此终古？索藑茅以筳篿兮，命灵氛为余占之。曰：两美其必合兮，孰信修而慕之？思九州之博大兮，岂惟是其有女？曰：勉远逝而无狐疑兮，孰求美而释女？何所独无芳草兮，尔何怀乎故宇？世幽昧以昡曜兮，孰云察余之善恶？民好恶其不同兮，惟此党人其独异！户服艾以盈要兮，谓幽兰其不可佩。览察草木其犹未得兮，岂珵美之能当？苏粪壤以充帏兮，谓申椒其不芳。\n欲从灵氛之吉占兮，心犹豫而狐疑。巫咸将夕降兮，怀椒糈而要之。百神翳其备降兮，九疑缤其并迎。皇剡剡其扬灵兮，告余以吉故。曰：勉升降以上下兮，求矩矱之所同。汤、禹俨而求合兮，挚、咎繇而能调。苟中情其好修兮，又何必用夫行媒？说操筑于傅岩兮，武丁用而不疑。吕望之鼓刀兮，遭周文而得举。宁戚之讴歌兮，齐桓闻以该辅。及年岁之未晏兮，时亦犹其未央。恐鹈鴃之先鸣兮，使夫百草为之不芳。\n何琼佩之偃蹇兮，众薆然而蔽之。惟此党人之不谅兮，恐嫉妒而折之。时缤纷其变易兮，又何可以淹留？兰芷变而不芳兮，荃蕙化而为茅。何昔日之芳草兮，今直为此萧艾也？岂其有他故兮，莫好修之害也！余以兰为可恃兮，羌无实而容长。委厥美以从俗兮，苟得列乎众芳。椒专佞以慢慆兮，樧又欲充夫佩帏。既干进而务入兮，又何芳之能祗？固时俗之流从兮，又孰能无变化？览椒兰其若兹兮，又况揭车与江离？惟兹佩之可贵兮，委厥美而历兹。芳菲菲而难亏兮，芬至今犹未沬。和调度以自娱兮，聊浮游而求女。及余饰之方壮兮，周流观乎上下。\n灵氛既告余以吉占兮，历吉日乎吾将行。折琼枝以为羞兮，精琼爢以为粻。为余驾飞龙兮，杂瑶象以为车。何离心之可同兮？吾将远逝以自疏。邅吾道夫昆仑兮，路修远以周流。扬云霓之晻蔼兮，鸣玉鸾之啾啾。朝发轫于天津兮，夕余至乎西极。凤皇翼其承旗兮，高翱翔之翼翼。忽吾行此流沙兮，遵赤水而容与。麾蛟龙使梁津兮，诏西皇使涉予。路修远以多艰兮，腾众车使径侍。路不周以左转兮，指西海以为期。屯余车其千乘兮，齐玉轪而并驰。驾八龙之婉婉兮，载云旗之委蛇。抑志而弭节兮，神高驰之邈邈。奏《九歌》而舞《韶》兮，聊假日以媮乐。陟升皇之赫戏兮，忽临睨夫旧乡。仆夫悲余马怀兮，蜷局顾而不行。\n乱曰：已矣哉！国无人莫我知兮，又何怀乎故都！既莫足与为美政兮，吾将从彭咸之所居！"},{"t":"渡荆门送别","a":"李白","d":"唐","g":"初中八年级上","place":"长江荆门山","lt":"write","basis":"写作地荆门山（今湖北宜昌市南津关），李白渡荆门送别，从写作地匹配","type":"古诗","full":"渡远荆门外，来从楚国游。山随平野尽，江入大荒流。月下飞天镜，云生结海楼。仍怜故乡水，万里送行舟。"},{"t":"登楼赋","a":"王粲","d":"—","g":"课外/补充-古文观止","place":"当阳城楼（麦城）","lt":"famous","basis":"王粲依刘表登当阳城楼作赋，麦城遗址在今当阳两河","type":"赋","full":"登兹楼以四望兮，聊暇日以销忧。览斯宇之所处兮，实显敞而寡仇。挟清漳之通浦兮，倚曲沮之长洲。背坟衍之广陆兮，临皋隰之沃流。北弥陶牧，西接昭邱。华实蔽野，黍稷盈畴。虽信美而非吾土兮，曾何足以少留！\n遭纷浊而迁逝兮，漫逾纪以迄今。情眷眷而怀归兮，孰忧思之可任？凭轩槛以遥望兮，向北风而开襟。平原远而极目兮，蔽荆山之高岑。路逶迤而修迥兮，川既漾而济深。悲旧乡之壅隔兮，涕横坠而弗禁。昔尼父之在陈兮，有归欤之叹音。钟仪幽而楚奏兮，庄舄显而越吟。人情同于怀土兮，岂穷达而异心！\n惟日月之逾迈兮，俟河清其未极。冀王道之一平兮，假高衢而骋力。惧匏瓜之徒悬兮，畏井渫之莫食。步栖迟以徙倚兮，白日忽其将匿。风萧瑟而并兴兮，天惨惨而无色。兽狂顾以求群兮，鸟相鸣而举翼，原野阒其无人兮，征夫行而未息。心凄怆以感发兮，意忉怛而憯恻。循阶除而下降兮，气交愤于胸臆。夜参半而不寐兮，怅盘桓以反侧。"},{"t":"蜀巴荆楚之间奇观有此；元白苏黄而后游者其谁。","a":"罗哲文","d":
