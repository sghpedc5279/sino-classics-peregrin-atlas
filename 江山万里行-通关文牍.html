锚点，以《菜根谭》/《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"淡泊是高风，矫廉是美名"}]},{"prov":"江苏","name":"扬州市","d":"M736.6 450.2 L742.1 449.0 L742.8 450.3 L746.4 448.2 L745.9 442.4 L747.4 442.4 L743.1 432.9 L744.3 429.9 L741.6 427.2 L735.4 429.7 L738.7 434.2 L738.4 438.3 L735.9 438.6 L736.4 443.4 L733.2 446.5 L733.5 449.5 L736.6 450.2 Z","v":1,"fd":"2025.05","texts":[{"t":"春江花月夜","a":"张若虚","d":"唐","g":"高中选择性必修上","place":"春江花月夜","lt":"birth","basis":"作者张若虚故里扬州（今江苏扬州），写作地不可考，从作者故乡匹配","type":"古诗","full":"春江潮水连海平，海上明月共潮生。滟滟随波千万里，何处春江无月明！\n江流宛转绕芳甸，月照花林皆似霰。空里流霜不觉飞，汀上白沙看不见。\n江天一色无纤尘，皎皎空中孤月轮。\n江畔何人初见月？江月何年初照人？\n人生代代无穷已，江月年年望相似。不知江月待何人，但见长江送流水。\n白云一片去悠悠，青枫浦上不胜愁。谁家今夜扁舟子？何处相思明月楼？\n可怜楼上月徘徊，应照离人妆镜台。玉户帘中卷不去，捣衣砧上拂还来。\n此时相望不相闻，愿逐月华流照君。鸿雁长飞光不度，鱼龙潜跃水成文。\n昨夜闲潭梦落花，可怜春半不还家。\n江水流春去欲尽，江潭落月复西斜。\n斜月沉沉藏海雾，碣石潇湘无限路。不知乘月几人归，落月摇情满江树。"},{"t":"扬州慢","a":"姜夔","d":"南宋","g":"高中选择性必修中","place":"扬州战后萧条","lt":"write","basis":"写作地扬州（今江苏扬州），姜夔过扬州作，从写作地匹配","type":"词","full":"淮左名都，竹西佳处，解鞍少驻初程。过春风十里，尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。渐黄昏，清角吹寒，都在空城。\n杜郎俊赏，算而今、重到须惊。纵豆蔻词工，青楼梦好，难赋深情。二十四桥仍在，波心荡、冷月无声。念桥边红药，年年知为谁生？"},{"t":"泊船瓜洲","a":"王安石","d":"北宋","g":"小学六年级下","place":"京口瓜洲思乡","lt":"write","basis":"写作地瓜洲（今江苏扬州邗江区瓜洲镇），从写作地匹配","type":"古诗","full":"京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还。"},{"t":"闻王昌龄左迁龙标遥有此寄","a":"李白","d":"唐","g":"初中七年级上","place":"王昌龄赴龙标途中","lt":"write","basis":"写作地扬州（今江苏扬州），李白在扬州闻王昌龄左迁作，从写作地匹配","type":"古诗","full":"杨花落尽子规啼，闻道龙标过五溪。我寄愁心与明月，随君直到夜郎西。"},{"t":"酬乐天扬州初逢席上见赠","a":"刘禹锡","d":"唐","g":"初中九年级上","place":"扬州席上酬答","lt":"write","basis":"写作地扬州（今江苏扬州），刘禹锡罢和州归逢白居易于扬州，从写作地匹配","type":"古诗","full":"巴山楚水凄凉地，二十三年弃置身。怀旧空吟闻笛赋，到乡翻似烂柯人。沉舟侧畔千帆过，病树前头万木春。今日听君歌一曲，暂凭杯酒长精神。"},{"t":"行香子（树绕村庄）","a":"秦观","d":"北宋","g":"初中九年级上","place":"春日田园","lt":"birth","basis":"作者秦观故里高邮（今江苏高邮市，由扬州市代管），'乡间村野'不可考具体地名，从作者故乡匹配","type":"词","full":"树绕村庄，水满陂塘。倚东风，豪兴徜徉。小园几许，收尽春光。有桃花红，李花白，菜花黄。远远围墙，隐隐茅堂。飏青旗，流水桥旁。偶然乘兴，步过东冈。正莺儿啼，燕儿舞，蝶儿忙。"},{"t":"朝天子·咏喇叭","a":"王磐","d":"明","g":"初中九年级下","place":"宦官出使喇叭","lt":"write","basis":"写作地高邮（今江苏高邮市，由扬州市代管），王磐故里高邮，从写作地匹配","type":"曲","full":"喇叭，唢呐，曲儿小腔儿大。官船来往乱如麻，全仗你抬声价。军听了军愁，民听了民怕。哪里去辨甚么真共假？眼见的吹翻了这家，吹伤了那家，只吹的水尽鹅飞罢！"},{"t":"梅花岭记","a":"全祖望","d":"—","g":"课外/补充-明清古文","place":"今江苏省扬州市（梅花岭史可法衣冠冢）","lt":"famous","basis":"文中记扬州梅花岭史可法衣冠冢事","type":"传记散文","full":"顺治二年乙酉四月，江都围急。督相史忠烈公知势不可为，集诸将而语之曰：吾誓与城为殉，然仓皇中不可落于敌人之手以死，谁为我临期成此大节者？副将军史德威慨然任之。忠烈喜曰：吾尚未有子，汝当以同姓为吾后。吾上书太夫人，谱汝诸孙中。\n二十五日城陷，忠烈拔刀自裁，诸将果争前抱持之。忠烈大呼德威，德威流涕，不能执刃，遂为诸将所拥而行。至小东门，大兵如林而至，马副使鸣騄、任太守民育，及诸将刘都督肇基等皆死。忠烈乃瞠目曰：我史阁部也！被执至南门，和硕豫亲王以先生呼之，劝之降，忠烈大骂而死。初，忠烈遗言：我死，当葬梅花岭上。至是德威求公之骨不可得，乃以衣冠葬之。\n或曰：城之破也，有亲见忠烈青衣乌帽，乘白马出天宁门投江死者，未尝殒于城中也。自有是言，大江南北，遂谓忠烈未死。已而英、霍山师大起，皆托忠烈之名，仿佛陈涉之称项燕。吴中孙公兆奎以起兵不克，执至白下。经略洪承畴与之有旧，问曰：先生在兵间，审知故扬州阁部史公果死耶，抑未死耶？孙公答曰：经略从北来，审知故松山殉难督师洪公果死耶，抑未死耶？承畴大恚，急呼麾下驱出斩之。\n呜呼！神仙诡诞之说，谓颜太师以兵解，文少保亦以悟大光明法蝉蜕，实未尝死。不知忠义者，圣贤家法，其气浩然，常留天地之间，何必出世入世之面目？神仙之说，所谓为蛇画足。即如忠烈遗骸，不可问矣，百年而后，予登岭上，与客述忠烈遗言，无不泪下如雨，想见当日围城光景，此即忠烈之面目宛然可遇，是不必问其果解脱否也，而况冒其未死之名者哉！\n墓旁有丹徒钱烈女之冢，亦以乙酉在扬，凡五死而得绝，时告其父母火之，无留骨秽地，扬人葬之于此。江右王猷定、关中黄遵岩、粤东屈大均为作传铭哀词。顾尚有未尽表章者：予闻忠烈兄弟，自翰林可程下，尚有数人，其后皆来江都省墓。适英、霍山师败，捕得冒称忠烈者，大将发至江都，令史氏男女来认之。忠烈之第八弟已亡，其夫人年少有色，守节，亦出视之，大将艳其色，欲强娶之，夫人自裁而死。时以其出于大将之所逼也，莫敢为之表章者。呜呼！忠烈尝恨可程在北，当异姓之间，不能仗节，出疏纠之，岂知身后乃有弟妇以女子而踵兄公之馀烈乎？梅花如雪，芳香不染，异日有作忠烈祠者，副使诸公谅在从祀之列，当另为别室以祀夫人，附以烈女一辈也。"},{"t":"胜地据淮南，看云影当空，与水平分秋一色；扁舟过桥下，问箫声何处，有人吹到月三更。","a":"江峰青","d":"—","g":"课外/补充-楹联","place":"江苏扬州瘦西湖","lt":"famous","basis":"清代江峰青撰，悬于瘦西湖熙春台大门楹柱","type":"楹联","full":"胜地据淮南，看云影当空，与水平分秋一色；扁舟过桥下，问箫声何处，有人吹到月三更。"}]},{"prov":"江苏","name":"镇江市","d":"M736.7 461.8 L738.2 457.5 L740.1 456.8 L744.7 459.7 L745.6 453.6 L748.4 454.4 L746.2 448.8 L742.8 450.3 L742.1 449.0 L737.0 450.0 L733.1 452.1 L734.5 452.8 L734.9 455.0 L733.4 455.5 L734.8 456.7 L732.6 459.1 L734.2 458.7 L736.7 461.8 Z","v":0,"fd":"","texts":[{"t":"芙蓉楼送辛渐","a":"王昌龄","d":"唐","g":"小学四年级下","place":"芙蓉楼（江苏镇江）","lt":"write","basis":"《芙蓉楼送辛渐》作于润州（今江苏镇江）芙蓉楼，据写作地点匹配江苏镇江市","type":"古诗","full":"寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。"},{"t":"己亥杂诗","a":"龚自珍","d":"清","g":"小学五年级上","place":"京城","lt":"write","basis":"写作地丹阳（今江苏丹阳市，由镇江市代管），从写作地匹配","type":"古诗","full":"九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人材。"},{"t":"答谢中书书","a":"陶弘景","d":"南朝梁","g":"初中八年级上","place":"江南山水","lt":"write","basis":"写作地茅山（今江苏句容市，由镇江市代管），陶弘景隐居茅山，从写作地匹配","type":"文言文","full":"山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。实是欲界之仙都。自康乐以来，未复有能与其奇者。"},{"t":"永遇乐·京口北固亭怀古","a":"辛弃疾","d":"南宋","g":"高中必修上","place":"京口北固亭","lt":"write","basis":"写作地京口（今江苏镇江），辛弃疾知镇江府作，从写作地匹配","type":"词","full":"千古江山，英雄无觅，孙仲谋处。舞榭歌台，风流总被，雨打风吹去。斜阳草树，寻常巷陌，人道寄奴曾住。想当年，金戈铁马，气吞万里如虎。\n元嘉草草，封狼居胥，赢得仓皇北顾。四十三年，望中犹记，烽火扬州路。可堪回首，佛狸祠下，一片神鸦社鼓。凭谁问：廉颇老矣，尚能饭否？"},{"t":"江上渔者","a":"范仲淹","d":"北宋","g":"小学六年级下","place":"长江捕鱼","lt":"write","basis":"写作地润州（今江苏镇江），范仲淹在润州作《江上渔者》，从写作地匹配","type":"古诗","full":"江上往来人，但爱鲈鱼美。君看一叶舟，出没风波里。"},{"t":"次北固山下","a":"王湾","d":"唐","g":"初中七年级上","place":"长江舟行","lt":"write","basis":"写作地京口（今江苏镇江）北固山下，从写作地匹配","type":"古诗","full":"客路青山外，行舟绿水前。潮平两岸阔，风正一帆悬。海日生残夜，江春入旧年。乡书何处达？归雁洛阳边。"},{"t":"金山夜戏","a":"张岱","d":"—","g":"课外/补充-明清古文","place":"今江苏省镇江市（金山寺）","lt":"famous","basis":"崇祯二年中秋作者过镇江，夜登金山寺作","type":"小品文","full":"崇祯二年中秋后一日，余道镇江往兖。日晡，至北固，舣舟江口。月光倒囊入水，江涛吞吐，露气吸之，噀天为白。余大惊喜。移舟过金山寺，已二鼓矣。经龙王堂，入大殿，皆漆静。林下漏月光，疏疏如残雪。余呼小奚携戏具，盛张灯火大殿中，唱韩蕲王金山及长江大战诸剧。锣鼓喧阗，一寺人皆起看。有老僧以手背摋眼翳，翕然张口，呵欠与笑嚏俱至。徐定睛，视为何许人，以何事何时至，皆不敢问。剧完，将曙，解缆过江。山僧至山脚，目送久之，不知是人、是怪、是鬼。"},{"t":"南乡子·登京口北固亭有怀","a":"辛弃疾","d":"南宋","g":"初中九年级下","place":"京口北固亭（今江苏镇江）","lt":"famous","basis":"登京口北固亭（今镇江北固山）怀古而作，京口即今镇江","type":"词","full":"何处望神州？满眼风光北固楼。千古兴亡多少事？悠悠。不尽长江滚滚流。年少万兜鍪，坐断东南战未休。天下英雄谁敌手？曹刘。生子当如孙仲谋。"}]},{"prov":"江苏","name":"泰州市","d":"M757.6 454.1 L754.4 452.0 L752.8 443.0 L750.5 442.3 L752.4 439.5 L751.6 436.5 L753.6 436.1 L753.5 432.7 L744.8 432.7 L744.2 431.0 L743.1 432.9 L747.4 442.4 L745.9 442.4 L745.9 448.7 L748.5 454.6 L752.1 455.9 L757.6 454.1 Z","v":1,"fd":"待定","texts":[{"t":"\"息阴莫争枝，饮水当思源\"","a":"洪应明/陈继儒","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《菜根谭》/《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"息阴莫争枝，饮水当思源"}]},{"prov":"江苏","name":"宿迁市","d":"M735.7 414.0 L734.4 407.7 L729.3 409.9 L727.2 409.0 L724.8 413.9 L717.1 413.1 L720.1 419.3 L718.8 426.0 L716.1 430.1 L717.7 432.6 L719.9 431.0 L723.8 431.6 L729.5 428.5 L729.8 419.5 L735.7 414.0 Z","v":0,"fd":"","texts":[{"t":"垓下歌","a":"项羽","d":"秦末","g":"课外/补充-覆盖平衡新增","place":"项羽绝唱","lt":"famous","basis":"项羽下相人（今江苏宿迁），《垓下歌》为其绝唱，据《史记·项羽本纪》","type":"古诗","full":"力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何！"}]},{"prov":"浙江","name":"杭州市","d":"M760.2 487.7 L758.8 485.7 L755.4 487.1 L753.8 483.1 L748.2 484.9 L744.2 482.3 L743.5 485.5 L741.9 484.7 L736.5 487.6 L732.2 486.3 L730.5 490.2 L731.3 494.4 L727.4 500.1 L722.6 503.6 L726.7 506.3 L727.0 508.8 L731.4 506.1 L733.0 508.6 L736.0 508.6 L738.9 504.3 L740.6 506.1 L742.7 505.5 L745.5 499.9 L748.4 499.5 L747.1 497.8 L753.9 494.4 L753.5 490.8 L758.2 490.4 L760.2 487.7 Z","v":1,"fd":"2022.11","texts":[{"t":"蜂","a":"罗隐","d":"唐","g":"小学四年级下","place":"山野花间","lt":"write","basis":"作者罗隐故里余杭（今杭州余杭区），写作地钱塘（今杭州），从写作地匹配","type":"古诗","full":"不论平地与山尖，无限风光尽被占。采得百花成蜜后，为谁辛苦为谁甜。"},{"t":"湖心亭看雪","a":"张岱","d":"明","g":"初中九年级上","place":"杭州西湖湖心亭","lt":"write","basis":"写作地杭州（今浙江杭州），张岱忆西湖湖心亭，从写作地匹配","type":"文言文","full":"崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白。湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥，舟中人两三粒而已。到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰：\"湖中焉得更有此人！\"拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。及下船，舟子喃喃曰：\"莫说相公痴，更有痴似相公者。\""},{"t":"回乡偶书","a":"贺知章","d":"唐","g":"小学六年级上","place":"辞官回乡","lt":"write","basis":"写作地越州永兴（今杭州萧山区），贺知章辞官回乡，从写作地匹配","type":"古诗","full":"少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。"},{"t":"石灰吟","a":"于谦","d":"明","g":"小学六年级下","place":"石灰自喻","lt":"write","basis":"写作地钱塘（今浙江杭州），于谦故里钱塘，从写作地匹配","type":"古诗","full":"千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。"},{"t":"登飞来峰","a":"王安石","d":"北宋","g":"初中七年级下","place":"杭州飞来峰","lt":"write","basis":"写作地杭州（今浙江杭州），王安石登杭州飞来峰作，从写作地匹配","type":"古诗","full":"飞来山上千寻塔，闻说鸡鸣见日升。不畏浮云遮望眼，自缘身在最高层。"},{"t":"满江红·和郭沫若同志","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"国际风云、苍蝇蚂蚁","lt":"famous","basis":"1963年1月9日作于杭州汪庄，和郭沫若《满江红·领袖颂》","type":"词","full":"小小寰球，有几个苍蝇碰壁。嗡嗡叫，几声凄厉，几声抽泣。蚂蚁缘槐夸大国，蚍蜉撼树谈何易。正西风落叶下长安，飞鸣镝。多少事，从来急；天地转，光阴迫。一万年太久，只争朝夕。四海翻腾云水怒，五洲震荡风雷激。要扫除一切害人虫，全无敌。"},{"t":"严先生祠堂记","a":"范仲淹","d":"—","g":"课外/补充-古文观止","place":"桐庐富春江严陵濑","lt":"famous","basis":"范仲淹知睦州时为东汉严子陵建祠堂于桐庐钓台","type":"记文","full":"先生，汉光武之故人，相尚以道义。帝思其贤，而召之，三请而后起。\n乃即其家庐而祀之，又从而歌之曰：「云山苍苍，江水泱泱，先生之风，山高水长。」"},{"t":"卖柑者言","a":"刘基","d":"—","g":"课外/补充-古文观止","place":"杭州市井","lt":"famous","basis":"元末刘基寓杭州时见小售卖果柑而作，托柑者以讽世","type":"杂文","full":"杭有卖果者，善种柑，涉冬寒，剖之如膏，味香美可爱。视之他处，则柑皆不类。\n今子是之不察，而以察吾柑！\n得无以是诬欺乎？"},{"t":"青山有幸埋忠骨；白铁无辜铸佞臣。","a":"徐氏","d":"松江女史","g":"课外/补充-楹联","place":"浙江杭州西湖岳王庙","lt":"famous","basis":"悬于杭州岳王庙墓阙重门旁","type":"楹联","full":"青山有幸埋忠骨；白铁无辜铸佞臣。"}]},{"prov":"浙江","name":"宁波市","d":"M762.5 488.0 L766.1 493.5 L764.9 495.3 L766.3 497.0 L764.5 499.5 L768.3 502.6 L767.3 508.5 L769.3 510.8 L770.6 508.7 L776.8 509.3 L780.0 511.6 L780.5 501.1 L777.9 499.9 L782.7 495.1 L776.1 493.4 L770.5 486.1 L766.5 483.8 L762.5 488.0 Z","v":1,"fd":"2023.07","texts":[{"t":"雪梅","a":"卢钺","d":"南宋","g":"小学四年级上","place":"梅雪庭院","lt":"birth","basis":"作者卢钺故里鄞县（今浙江宁波鄞州区），写作地不可考，从作者故乡匹配","type":"古诗","full":"梅雪争春未肯降，骚人阁笔费评章。梅须逊雪三分白，雪却输梅一段香。"},{"t":"蝉","a":"虞世南","d":"唐","g":"小学五年级上","place":"高树鸣蝉","lt":"birth","basis":"虞世南故乡越州余姚（今浙江余姚，由宁波市代管），据作者故乡匹配浙江宁波市","type":"古诗","full":"垂緌饮清露，流响出疏桐。居高声自远，非是藉秋风。"},{"t":"深虑论","a":"方孝孺","d":"—","g":"课外/补充-明清古文","place":"无具体地点（史论）","lt":"birth","basis":"作者故乡为浙江宁海","type":"史论议论文","full":"虑天下者，常图其所难，而忽其所易；备其所可畏，而遗其所不疑。然而祸常发于所忽之中，而乱常起于不足疑之事。岂其虑之未周欤？盖虑之所能及者，人事之宜然；而出于智力之所不及者，天道也。\n当秦之世，而灭六诸侯，一天下；而其心以为周之亡在乎诸侯之强耳，变封建而为郡县，方以为兵革可不复用，天子之位可以世守；而不知汉帝起陇亩之匹夫，而卒亡秦之社稷。汉惩秦之孤立，于是大建庶孽而为诸侯，以为同姓之亲，可以相继而无变；而七国萌篡弑之谋。武、宣以后，稍剖析之而分其势，以为无事矣；而王莽卒移汉祚。光武之惩哀、平，魏之惩汉，晋之惩魏，各惩其所由亡而为之备；而其亡也，皆出其所备之外。\n唐太宗闻武氏之杀其子孙，求人于疑似之际而除之，而武氏日侍其左右而不悟。宋太祖见五代方镇之足以制其君，尽释其兵权，使力弱而易制，而不知子孙卒困于敌国。此其人皆有出人之智、盖世之才，其于治乱存亡之几，思之详而备之审矣。虑切于此，而祸兴于彼，终至于乱亡者，何哉？盖智可以谋人，而不可以谋天。良医之子，多死于病；良巫之子，多死于鬼。彼岂工于活人，而拙于谋子也哉？乃工于谋人，而拙于谋天也。\n古之圣人，知天下后世之变，非智虑之所能周，非法术之所能制，不敢肆其私谋诡计，而惟积至诚、用大德以结乎天心，使天眷其德，若慈母之保赤子而不忍释。故其子孙，虽有至愚不肖者足以亡国，而天卒不忍遽亡之。此虑之远者也。夫苟不能自结于天，而欲以区区之智笼络当世之务，而必后世之无危亡，此理之所必无者也，而岂天道哉！"},{"t":"原君","a":"黄宗羲","d":"—","g":"课外/补充-明清古文","place":"无具体地点（政论）","lt":"birth","basis":"作者故乡余姚，明亡后著《明夷待访录》","type":"政论议论文","full":"有生之初,人各自私也,人各自利也。天下有公利而莫或兴之,有公害而莫或除之。有人者出,不以一己之利为利,而使天下受其利;不以一己之害为害,而使天下释其害。此其人之勤劳,必千万于天下之人。夫以千万倍之勤劳,而己又不享其利,必非天下之人情所欲居也。故古之人君,量而不欲入者,许由、务光是也;入而又去之者,尧、舜是也;初不欲入而不得去者,禹是也。岂古之人有所异哉?好逸恶劳,亦犹夫人之情也。\n后之为人君者不然。以为天下利害之权皆出于我,我以天下之利尽归于己,以天下之害尽归于人,亦无不可。使天下之人,不敢自私,不敢自利,以我之大私为天下之大公。始而惭焉,久而安焉,视天下为莫大之产业,传之子孙,受享无穷。汉高帝所谓\"某业所就,孰与仲多\"者,其逐利之情,不觉溢之于辞矣。\n此无他,古者以天下为主,君为客,凡君之所毕世而经营者,为天下也。今也以君为主,天下为客,凡天下之无地而得安宁者,为君也。是以其未得之也,屠毒天下之肝脑,离散天下之子女,以博我一人之产业,曾不惨然,曰:\"我固为子孙创业也。\"其既得之也,敲剥天下之骨髓,离散天下之子女,以奉我一人之淫乐,视为当然,曰:\"此我产业之花息也。\"然则为天下之大害者,君而已矣!向使无君,人各得自私也,人各得自利也。岂设君之道固如是乎?\n古者天下之人爱戴其君,比之如父,拟之如天,诚不为过也。今也天下之人,怨恶其君,视之如寇仇,名之为独夫,固其所也。而小儒规规焉以君臣之义无所逃于天地之间,至桀、纣之暴,犹谓汤、武不当诛之,而妄传伯夷、叔齐无稽之事,乃兆人万姓崩溃之血肉,曾不异夫腐鼠。岂天地之大,于兆人万姓之中,独私其一人一姓乎?是故武王,圣人也;孟子之言,圣人之言也。后世之君,欲以如父如天之空名,禁人之窥伺者,皆不便于其言,至废孟子而不立,非导源于小儒乎?\n虽然,使后之为君者,果能保此产业,传之无穷,亦无怪乎其私之也。既以产业视之,人之欲得产业,谁不如我?摄缄縢,固扃鐍,一人之智力,不能胜天下欲得之者之众,远者数世,近者及身,其血肉之崩溃,在其子孙矣。昔人愿世世无生帝王家,而毅宗之语公主,亦曰:\"若何为生我家!\"痛哉斯言!回思创业时,其欲得天下之心,有不废然摧沮者乎?是故明乎为君之职分,则唐、虞之世,人人能让,许由、务光非绝尘也;不明乎为君之职分,则市井之间,人人可欲,许由、务光所以旷后世而不闻也。然君之职分难明,以俄顷淫乐,不易无穷之悲,虽愚者亦明之矣。"},{"t":"芋老人传","a":"周容","d":"—","g":"课外/补充-明清古文","place":"无具体地点（寓言）","lt":"famous","basis":"作者鄞县人，明遗民，借芋老人讽世","type":"寓言散文","full":"芋老人者，慈水祝渡人也。子佣出，独与妪居渡口。一日，有书生避雨檐下，衣湿袖单，影乃益瘦。老人延入坐，知从郡城就童子试归。老人略知书，与语久，命妪煮芋以进。尽一器，再进，生为之饱，笑曰：“他日不忘老人芋也。”雨止，别去。\n十余年，书生用甲第为相国，偶命厨者进芋，辍箸叹曰：“何向者祝渡老人之芋香而甘也！”使人访其夫妇，载以来。\n至京，相国慰劳曰：“不忘老人芋，今乃烦尔妪一煮芋也。”已而妪煮芋进，相国亦辍箸曰：“何向者之香而甘也！”老人前曰：“犹是芋也，而向之香且甘者，非调和之有异，时、位之移人也。相公昔自郡城走数十里，困于雨，不择食矣；今者堂有炼珍，朝分尚食，张筵列鼎，尚何芋是甘乎？老人犹喜相公之止于芋也。\n老人老矣，所闻实多：村南有夫妇守贫者，织纺井臼，佐读勤苦；幸获名成，遂宠妾媵，弃其妇，致郁郁死，是芋视乃妇也。城东有甲乙同学者，一砚、一灯、一窗、一榻，晨起不辨衣履；乙先得举，登仕路，闻甲落魄，笑不顾，交以绝，是芋视乃友也。更闻某氏子，读书时愿他日得志，廉干如古人某，忠孝如古人某；及为吏，以污贿不饬罢，是芋视乃学也。此犹可言也。\n老人邻有西塾，闻其师为弟子说前代事，有将相，有卿尹，有刺史、守令，或绾黄纡紫，或揽辔褰帷，一旦事变中起，衅孽外乘，辄屈膝叩首迎款，惟恐或后，竟以宗庙、社稷、身名、君宠，无不同于芋焉。然则世之以今日而忘其昔日者，岂独一箸间哉！”\n老人语未毕，相国遽惊谢曰：“老人知道者！”厚资而遣之。于是芋老人之名大著。\n赞曰：老人能于倾盖不意作缘相国，奇已！不知相国何似，能不愧老人之言否。然就其不忘一芋，固已贤夫并老人而芋视之者。特怪老人虽知书，又何长于言至是，岂果知道者欤？或传闻之过实耶？嗟夫！天下有缙绅士大夫所不能言，而野老鄙夫能言之者，往往而然。"},{"t":"天一遗形源长垂远；南雷深意藏久尤难。","a":"顾廷龙书","d":"用黄宗羲语意","g":"课外/补充-楹联","place":"浙江宁波天一阁","lt":"famous","basis":"顾廷龙以钟鼎文书写，悬于天一阁大门两侧","type":"楹联","full":"天一遗形源长垂远；南雷深意藏久尤难。"}]},{"prov":"浙江","name":"温州市","d":"M766.4 529.2 L768.7 524.0 L767.1 521.9 L764.6 522.8 L760.6 520.1 L758.7 521.6 L755.9 520.6 L754.1 524.0 L755.7 527.4 L754.1 532.5 L746.8 532.4 L743.3 537.4 L745.2 545.3 L752.7 542.8 L755.7 548.1 L757.4 548.2 L761.1 536.3 L763.7 533.9 L766.7 536.0 L767.8 535.1 L764.5 532.9 L766.4 529.2 Z","v":1,"fd":"待定","texts":[{"t":"题临安邸","a":"林升","d":"南宋","g":"小学五年级上","place":"临安（杭州）","lt":"birth","basis":"林升平阳人（今浙江平阳，由温州市管辖），据作者故乡匹配浙江温州市","type":"古诗","full":"山外青山楼外楼，西湖歌舞几时休？暖风熏得游人醉，直把杭州作汴州。"},{"t":"乡村四月","a":"翁卷","d":"南宋","g":"小学五年级下","place":"江南四月农忙","lt":"write","basis":"写作地温州乐清（今浙江乐清市，由温州市代管），翁卷故里，从写作地匹配","type":"古诗","full":"绿遍山原白满川，子规声里雨如烟。乡村四月闲人少，才了蚕桑又插田。"},{"t":"约客","a":"赵师秀","d":"南宋","g":"初中七年级下","place":"夏夜候客","lt":"write","basis":"写作地永嘉（今浙江温州永嘉县），赵师秀故里永嘉，从写作地匹配","type":"古诗","full":"黄梅时节家家雨，青草池塘处处蛙。有约不来过夜半，闲敲棋子落灯花。"}]},{"prov":"浙江","name":"嘉兴市","d":"M760.2 487.7 L764.9 487.0 L766.5 483.8 L765.6 482.3 L769.0 480.1 L766.6 476.8 L764.6 477.3 L764.0 473.3 L759.9 474.5 L759.9 476.4 L753.6 481.4 L753.8 485.9 L755.4 487.1 L759.8 485.9 L760.2 487.7 Z","v":1,"fd":"2023.11","texts":[{"t":"舟夜书所见","a":"查慎行","d":"清","g":"小学二年级下","place":"江上夜景","lt":"birth","basis":"作者查慎行故里海宁（今浙江海宁市，由嘉兴市代管），'运河舟中'不可考具体城，从作者故乡匹配","type":"古诗","full":"月黑见渔灯，孤光一点萤。微微风簇浪，散作满河星。"},{"t":"核舟记","a":"魏学洢","d":"明","g":"初中八年级下","place":"核舟雕刻（泛舟赤壁）","lt":"write","basis":"写作地嘉善（今浙江嘉善县，属嘉兴市），魏学洢故里，从写作地匹配","type":"文言文","full":"明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。\n舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻山高月小，水落石出，左刻清风徐来，水波不兴，石青糁之。\n船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背；鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之，珠可历历数也。\n舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状；居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。\n其船背稍夷，则题名其上，文曰：天启壬戌秋日，虞山王毅叔远甫刻。细若蚊足，钩画了了，其色墨。又用篆章一，文曰：初平山人，其色丹。\n通计一舟，为人五，为窗八，为箬篷、为楫、为炉、为壶、为手卷、为念珠各一；对联、题名并篆文，为字共三十有四；而计其长，曾不盈寸，盖简桃核修狭者为之。\n魏子详瞩既毕，诧曰：嘻！技亦灵怪矣哉！庄、列所载，称惊犹鬼神者良多，然谁有游削于不寸之质，而须麋瞭然者？假有人焉，举我言以复于我，亦必疑其诳，乃今亲睹之。繇斯以观，棘刺之端，未必不可为母猴也。嘻！技亦灵怪矣哉！"},{"t":"临江仙·夜登小阁忆洛中旧游","a":"陈与义","d":"两宋之际","g":"初中九年级下","place":"夜登小阁","lt":"write","basis":"写作地青墩镇（今浙江桐乡市，由嘉兴市代管），陈与义南渡寓居青墩，从写作地匹配","type":"词","full":"忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。"},{"t":"临江仙·夜登小阁，忆洛中旧游","a":"陈与义","d":"宋","g":"初中九年级下","place":"洛阳旧游（回忆）","lt":"write","basis":"作于青墩（今桐乡乌镇，属嘉兴市）；词中回忆洛阳旧游（洛阳匹配已满9篇），按写作地匹配嘉兴市","type":"词","full":"忆昔午桥桥上饮，坐中多是豪英。长沟流月去无声。杏花疏影里，吹笛到天明。二十余年如一梦，此身虽在堪惊。闲登小阁看新晴。古今多少事，渔唱起三更。"}]},{"prov":"浙江","name":"湖州市","d":"M756.5 478.5 L755.5 475.3 L750.9 475.0 L747.5 470.6 L743.5 470.7 L742.1 477.2 L736.7 482.7 L739.3 486.0 L743.5 485.5 L744.2 482.3 L749.8 484.9 L749.9 483.6 L753.3 483.4 L756.5 478.5 Z","v":1,"fd":"2022.11","texts":[{"t":"与朱元思书","a":"吴均","d":"南朝梁","g":"初中八年级上","place":"富春江（浙江桐庐）","lt":"birth","basis":"吴均吴兴故鄣人（今浙江安吉，由湖州市代管），据作者故乡匹配浙江湖州市","type":"文言文","full":"风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。"},{"t":"渔歌子","a":"张志和","d":"唐","g":"小学五年级上","place":"西塞山渔隐","lt":"write","basis":"写作地湖州（今浙江湖州），张志和隐居湖州作渔歌，从写作地匹配","type":"词","full":"西塞山前白鹭飞，桃花流水鳜鱼肥。青箬笠，绿蓑衣，斜风细雨不须归。"}]},{"prov":"浙江","name":"绍兴市","d":"M748.4 499.5 L750.1 502.8 L753.3 503.1 L753.4 505.7 L756.3 503.0 L761.1 508.2 L768.3 505.6 L768.2 502.3 L764.5 499.5 L766.3 497.0 L764.9 495.3 L766.1 493.5 L762.5 488.0 L753.5 490.8 L754.6 493.6 L747.1 497.8 L748.4 499.5 Z","v":1,"fd":"待定","texts":[{"t":"墨梅","a":"王冕","d":"元","g":"小学四年级下","place":"书房墨梅","lt":"write","basis":"写作地会稽（今浙江绍兴），从写作地匹配","type":"古诗","full":"我家洗砚池头树，朵朵花开淡墨痕。不要人夸好颜色，只留清气满乾坤。"},{"t":"示儿","a":"陆游","d":"南宋","g":"小学五年级上","place":"家国中原故土","lt":"write","basis":"写作地山阴（今浙江绍兴），陆游故里，从写作地匹配","type":"古诗","full":"死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。"},{"t":"秋夜将晓出篱门迎凉有感","a":"陆游","d":"南宋","g":"小学五年级下","place":"中原河山","lt":"write","basis":"写作地山阴（今浙江绍兴），从写作地匹配","type":"古诗","full":"三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。"},{"t":"书愤","a":"陆游","d":"南宋","g":"高中选择性必修上","place":"中原抗金怀古","lt":"write","basis":"写作地山阴（今浙江绍兴），陆游故里，从写作地匹配","type":"古诗","full":"早岁那知世事艰，中原北望气如山。楼船夜雪瓜洲渡，铁马秋风大散关。塞上长城空自许，镜中衰鬓已先斑。出师一表真名世，千载谁堪伯仲间。"},{"t":"兰亭集序","a":"王羲之","d":"东晋","g":"高中选择性必修下","place":"会稽兰亭（绍兴兰渚山）","lt":"write","basis":"写作地会稽山阴（今浙江绍兴），兰亭在绍兴，从写作地匹配","type":"文言文","full":"永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹；又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。\n夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀；况修短随化，终期于尽。古人云：「死生亦大矣。」岂不痛哉！\n每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦由今之视昔，悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。"},{"t":"十一月四日风雨大作（其二）","a":"陆游","d":"南宋","g":"初中七年级上","place":"山阴风雨夜","lt":"write","basis":"写作地山阴（今浙江绍兴），陆游故里，从写作地匹配","type":"古诗","full":"僵卧孤村不自哀，尚思为国戍轮台。夜阑卧听风吹雨，铁马冰河入梦来。"},{"t":"游山西村","a":"陆游","d":"南宋","g":"初中七年级下","place":"山西村农家","lt":"write","basis":"写作地山阴（今浙江绍兴），陆游故里，从写作地匹配","type":"古诗","full":"莫笑农家腊酒浑，丰年留客足鸡豚。山重水复疑无路，柳暗花明又一村。箫鼓追随春社近，衣冠简朴古风存。从今若许闲乘月，拄杖无时夜叩门。"},{"t":"白洋潮","a":"张岱","d":"—","g":"课外/补充-明清古文","place":"今浙江省绍兴市（白洋）","lt":"famous","basis":"文中记绍兴白洋潮奇观","type":"小品文","full":"故事，三江看潮，实无潮看。午后喧传曰：“今年暗涨潮。”岁岁如之。\n庚辰八月，吊朱恒岳少师至白洋，陈章侯、祁世培同席。海塘上呼看潮，余遄往，章侯、世培踵至。\n立塘上，见潮头一线，从海宁而来，直奔塘上。稍近，则隐隐露白，如驱千百群小鹅擘翼惊飞。渐近，喷沫溅花，蹴起如百万雪狮，蔽江而下，怒雷鞭之，万首镞镞，无敢后先。再近，则飓风逼之，势欲拍岸而上。看者辟易，走避塘下。潮到塘，尽力一礴，水击射，溅起数丈，著面皆湿。旋卷而右，龟山一挡，轰怒非常，炮碎龙湫，半空雪舞。看之惊眩，坐半日，颜始定。\n前辈言：浙江潮头，自龛、赭两山漱激而起。白洋在两山外，潮头更大，何耶？"},{"t":"此地似曾游，想当年列坐流觞未尝无我；仙缘难逆料，问异日重来修禊能否逢君。","a":"徐生翁","d":"—","g":"课外/补充-楹联","place":"浙江绍兴兰亭","lt":"famous","basis":"近代绍兴文人徐生翁撰，悬于兰亭流觞亭廊柱","type":"楹联","full":"此地似曾游，想当年列坐流觞未尝无我；仙缘难逆料，问异日重来修禊能否逢君。"}]},{"prov":"浙江","name":"金华市","d":"M738.1 516.4 L740.4 517.1 L740.8 521.3 L744.1 521.6 L747.5 516.5 L751.9 516.8 L753.1 513.5 L755.0 515.9 L759.0 514.5 L761.0 506.7 L757.9 505.9 L756.3 503.0 L753.4 505.7 L753.3 503.1 L748.9 501.5 L749.4 499.7 L745.9 499.6 L742.7 505.5 L740.8 506.2 L739.9 504.4 L738.3 504.6 L736.6 508.8 L738.2 511.1 L738.1 516.4 Z","v":1,"fd":"待定","texts":[{"t":"咏鹅","a":"骆宾王","d":"唐","g":"小学一年级上","place":"鹅戏水池塘","lt":"birth","basis":"作者骆宾王故里婺州义乌（今浙江义乌，由金华市代管），写作地不可考，从作者故乡匹配","type":"古诗","full":"鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。"},{"t":"送东阳马生序（节选）","a":"宋濂","d":"明","g":"初中九年级下","place":"东阳（浙江金华）求学路途","lt":"birth","basis":"宋濂浦江人（今浙江浦江，由金华市代管），据作者故乡匹配浙江金华市","type":"文言文","full":"余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。\n既加冠，益慕圣贤之道，又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。\n当余之从师也，负箧曳屣，行深山巨谷中，穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。\n今虽耄老，未有所成，犹幸预君子之列，而承天子之宠光，缀公卿之后，日侍坐备顾问，四海亦谬称其氏名，况才之过于余者乎？\n今诸生学于太学，县官日有廪稍之供，父母岁有裘葛之遗，无冻馁之患矣；坐大厦之下而诵《诗》《书》，无奔走之劳矣；有司业、博士为之师，未有问而不告、求而不得者也；凡所宜有之书，皆集于此，不必若余之手录，假诸人而后见也。其业有不精，德有不成者，非天质之卑，则心不若余之专耳，岂他人之过哉！\n东阳马生君则，在太学已二年，流辈甚称其贤。余朝京师，生以乡人子谒余，撰长书以为贽，辞甚畅达。与之论辨，言和而色夷。自谓少时用心于学甚劳，是可谓善学者矣。其将归见其亲也，余故道为学之难以告之。\n谓余勉乡人以学者，余之志也；诋我夸际遇之盛而骄乡人者，岂知余者哉！"}]},{"prov":"浙江","name":"衢州市","d":"M738.1 516.4 L736.6 507.1 L736.0 508.6 L733.0 508.6 L731.4 506.1 L727.2 508.9 L726.7 506.3 L722.2 503.0 L718.2 507.0 L718.7 512.8 L721.4 514.1 L724.0 518.8 L724.5 527.2 L727.8 526.7 L729.0 521.8 L731.0 521.8 L734.0 517.7 L738.1 516.4 Z","v":1,"fd":"待定","texts":[{"t":"三衢道中","a":"曾几","d":"南宋","g":"小学三年级下","place":"三衢山（浙江常山）","lt":"write","basis":"写作地衢州（今浙江衢州），三衢山在常山县属衢州，从写作地匹配","type":"古诗","full":"梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。"}]},{"prov":"浙江","name":"舟山市","d":"M784.6 492.0 L779.5 490.0 L780.9 493.4 L785.6 494.4 L784.6 492.0 Z","v":1,"fd":"待定","texts":[{"t":"有感即通，千江有水千江月；无机不被，万里无云万里天。","a":"【不可考】","d":"—","g":"课外/补充-楹联","place":"浙江舟山普陀山","lt":"famous","basis":"悬于普陀山短姑道头佛国山门牌坊","type":"楹联","full":"有感即通，千江有水千江月；无 "t":"陋室铭","a":"刘禹锡","d":"唐","g":"初中七年级下","place":"和州陋室","lt":"write","basis":"写作地和州（今安徽和县，属马鞍山市），刘禹锡任和州刺史时作，从写作地匹配","type":"文言文","full":"山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"},{"t":"游褒禅山记","a":"王安石","d":"—","g":"课外/补充-古文观止","place":"褒禅山（今安徽马鞍山含山）","lt":"famous","basis":"至和元年王安石与弟衔、卞等游褒禅山华阳洞，在今含山","type":"游记","full":"褒禅山亦谓之华山，唐浮图慧褒始舍于其址，而卒葬之；以故其后名之曰褒禅。今所谓慧空禅院者，褒之庐冢也。距其院东五里，所谓华山洞者，以其乃华山之阳名之也。距洞百余步，有碑仆道，其文漫灭，独其为文犹可识曰花山。今言华如华实之华者，盖音谬也。\n其下平旷，有泉侧出，而记游者甚众，所谓前洞也。由山以上五六里，有穴窈然，入之甚寒，问其深，则其好游者不能穷也，谓之后洞。余与四人拥火以入，入之愈深，其进愈难，而其见愈奇。有怠而欲出者，曰：不出，火且尽。遂与之俱出。盖余所至，比好游者尚不能十一，然视其左右，来而记之者已少。盖其又深，则其至又加少矣。方是时，余之力尚足以入，火尚足以明也。既其出，则或咎其欲出者，而余亦悔其随之而不得极夫游之乐也。\n于是余有叹焉。古人之观于天地、山川、草木、虫鱼、鸟兽，往往有得，以其求思之深而无不在也。夫夷以近，则游者众；险以远，则至者少。而世之奇伟、瑰怪、非常之观，常在于险远，而人之所罕至焉，故非有志者不能至也。有志矣，不随以止也，然力不足者，亦不能至也。有志与力，而不随以怠，至于幽暗昏惑而无物以相之，亦不能至也。然力足以至焉，于人为可讥，而在己为有悔；尽吾志也而不能至者，可以无悔矣，其孰能讥之乎？此余之所得也！\n余于仆碑，又以悲夫古书之不存，后世之谬其传而莫能名者，何可胜道也哉！此所以学者不可以不深思而慎取之也。\n四人者：庐陵萧君圭君玉，长乐王回深父，余弟安国平父、安上纯父。至和元年七月某日，临川王某记。"}]},{"prov":"安徽","name":"淮北市","d":"M691.7 420.0 L694.1 426.1 L696.5 426.0 L698.2 427.0 L698.1 429.3 L700.0 429.3 L700.8 426.9 L699.0 423.1 L700.8 414.3 L698.4 414.2 L698.1 416.0 L695.0 415.4 L695.6 417.9 L691.7 420.0 Z","v":0,"fd":"","texts":[{"t":"'相逢好似初相识，到老终无怨恨心'","a":"明代佚名编","d":"—","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《增广贤文》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"蒙学格言","full":"'相逢好似初相识，到老终无怨恨心'"}]},{"prov":"安徽","name":"铜陵市","d":"M703.7 472.5 L702.9 478.4 L704.7 481.0 L719.7 475.7 L714.7 471.2 L711.7 475.0 L709.3 473.8 L707.1 474.8 L703.7 472.5 Z","v":0,"fd":"","texts":[{"t":"\"临事肯替人想，功夫才是真\"","a":"金缨","d":"清","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《格言联璧》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"临事肯替人想，功夫才是真"}]},{"prov":"安徽","name":"安庆市","d":"M699.7 486.3 L698.4 491.0 L694.9 492.1 L694.0 495.1 L689.6 497.4 L687.6 496.7 L686.4 489.2 L683.9 487.2 L684.6 485.0 L682.0 478.7 L686.5 474.7 L686.9 472.1 L694.0 470.4 L693.8 473.5 L696.7 473.0 L701.5 468.7 L703.7 472.5 L702.9 478.4 L705.1 479.9 L705.3 482.3 L704.3 484.2 L699.7 484.8 L699.7 486.3 Z","v":0,"fd":"","texts":[{"t":"孔雀东南飞（并序）","a":"汉乐府","d":"—","g":"高中选择性必修中","place":"庐江郡焦刘家","lt":"write","basis":"写作地庐江（汉庐江郡治所在今安徽潜山市，由安庆市代管），从写作地匹配","type":"古诗","full":"汉末建安中,庐江府小吏仲卿妻刘氏,为仲卿母所遣,自誓不嫁。其家逼之,乃投水而死。仲卿闻之,亦自缢于庭树。时人伤之,为诗云尔。\n孔雀东南飞,五里一徘徊。\n\"十三能织素,十四学裁衣,十五弹箜篌,十六诵诗书。十七为君妇,心中常苦悲。君既为府吏,守节情不移,贱妾留空房,相见常日稀。鸡鸣入机织,夜夜不得息。三日断五匹,大人故嫌迟。非为织作迟,君家妇难为!妾不堪驱使,徒留无所施,便可白公姥,及时相遣归。\"\n府吏得闻之,堂上启阿母:\"儿已薄禄相,幸复得此妇,结发同枕席,黄泉共为友。共事二三年,始尔未为久,女行无偏斜,何意致不厚?\"阿母谓府吏:\"何乃太区区!此妇无礼节,举动自专由。吾意久怀忿,汝岂得自由!东家有贤女,自名秦罗敷,可怜体无比,阿母为汝求。便可速遣之,遣去慎莫留!\"府吏长跪告,伏惟启阿母:\"今若遣此妇,终老不复取!\"阿母得闻之,槌床便大怒:\"小子无所畏,何敢助妇语!吾已失恩义,会不相从许!\"\n府吏默无声,再拜还入户,举言谓新妇,哽咽不能语:\"我自不驱卿,逼迫有阿母。卿但暂还家,吾今且报府。不久当还归,还必相迎取。以此下心意,慎勿违吾语。\"新妇谓府吏:\"勿复重纷纭!往昔初阳岁,谢家来贵门。奉事循公姥,进止敢自专?昼夜勤作息,伶俜萦苦辛。谓言无罪过,供养卒大恩;仍更被驱遣,何言复来还!妾有绣腰襦,葳蕤自生光;红罗复斗帐,四角垂香囊;箱帘六七十,绿碧青丝绳;物物各自异,种种在其中。人贱物亦鄙,不足迎后人,留待作遗施,于今无会因。时时为安慰,久久莫相忘!\"\n鸡鸣外欲曙,新妇起严妆。著我绣夹裙,事事四五通。足下蹑丝履,头上玳瑁光。腰若流纨素,耳著明月珰。指如削葱根,口如含朱丹。纤纤作细步,精妙世无双。上堂拜阿母,阿母怒不止。\"昔作女儿时,生小出野里,本自无教训,兼愧贵家子。受母钱帛多,不堪母驱使。今日还家去,念母劳家里。\"却与小姑别,泪落连珠子。\"新妇初来时,小姑始扶床;今日被驱遣,小姑如我长。勤心养公姥,好自相扶将。初七及下九,嬉戏莫相忘。\"出门登车去,涕落百余行。\n府吏马在前,新妇车在后,隐隐何甸甸,俱会大道口。下马入车中,低头共耳语:\"誓不相隔卿,且暂还家去;吾今且赴府,不久当还归,誓天不相负!\"新妇谓府吏:\"感君区区怀!君既若见录,不久望君来。君当作磐石,妾当作蒲苇,蒲苇纫如丝,磐石无转移。我有亲父兄,性行暴如雷,恐不任我意,逆以煎我怀。\"举手长劳劳,二情同依依。\n入门上家堂,进退无颜仪。阿母大拊掌:\"不图子自归!十三教汝织,十四能裁衣,十五弹箜篌,十六知礼仪,十七遣汝嫁,谓言无誓违。汝今何罪过,不迎而自归?\"兰芝惭阿母:\"儿实无罪过。\"阿母大悲摧。\n还家十余日,县令遣媒来。云有第三郎,窈窕世无双,年始十八九,便言多令才。阿母谓阿女:\"汝可去应之。\"阿女含泪答:\"兰芝初还时,府吏见丁宁,结誓不别离。今日违情义,恐此事非奇。自可断来信,徐徐更谓之。\"阿母白媒人:\"贫贱有此女,始适还家门。不堪吏人妇,岂合令郎君?幸可广问讯,不得便相许。\"\n媒人去数日,寻遣丞请还,说有兰家女,承籍有宦官。云有第五郎,娇逸未有婚。遣丞为媒人,主簿通语言。直说太守家,有此令郎君,既欲结大义,故遣来贵门。阿母谢媒人:\"女子先有誓,老姥岂敢言!\"阿兄得闻之,怅然心中烦,举言谓阿妹:\"作计何不量!先嫁得府吏,后嫁得郎君,否泰如天地,足以荣汝身。不嫁义郎体,其往欲何云?\"兰芝仰头答:\"理实如兄言。谢家事夫婿,中道还兄门,处分适兄意,那得自任专!虽与府吏要,渠会永无缘。登即相许和,便可作婚姻。\"媒人下床去,诺诺复尔尔。还部白府君:\"下官奉使命,言谈大有缘。\"府君得闻之,心中大欢喜。视历复开书,便利此月内,六合正相应。良吉三十日,今已二十七,卿可去成婚。交语速装束,络绎如浮云。青雀白鹄舫,四角龙子幡,婀娜随风转。金车玉作轮,踯躅青骢马,流苏金镂鞍。赍钱三百万,皆用青丝穿。杂彩三百匹,交广市鲑珍。从人四五百,郁郁登郡门。\n阿母谓阿女:\"适得府君书,明日来迎汝。何不作衣裳?莫令事不举!\"阿女默无声,手巾掩口啼,泪落便如泻。移我琉璃榻,出置前窗下。左手持刀尺,右手执绫罗。朝成绣夹裙,晚成单罗衫。晻晻日欲暝,愁思出门啼。\n府吏闻此变,因求假暂归。未至二三里,摧藏马悲哀。新妇识马声,蹑履相逢迎,怅然遥相望,知是故人来。举手拍马鞍,嗟叹使心伤:\"自君别我后,人事不可量。果不如先愿,又非君所详。我有亲父母,逼迫兼弟兄,以我应他人,君还何所望!\"府吏谓新妇:\"贺卿得高迁!磐石方且厚,可以卒千年;蒲苇一时纫,便作旦夕间。卿当日胜贵,吾独向黄泉!\"新妇谓府吏:\"何意出此言!同是被逼迫,君尔妾亦然。黄泉下相见,勿违今日言!\"执手分道去,各各还家门。生人作死别,恨恨那可论!念与世间辞,千万不复全!\n府吏还家去,上堂拜阿母:\"今日大风寒,寒风摧树木,严霜结庭兰。儿今日冥冥,令母在后单。故作不良计,勿复怨鬼神!命如南山石,四体康且直!\"阿母得闻之,零泪应声落:\"汝是大家子,仕宦于台阁,慎勿为妇死,贵贱情何薄!东家有贤女,窈窕艳城郭,阿母为汝求,便复在旦夕。\"府吏再拜还,长叹空房中,作计乃尔立。转头向户里,渐见愁煎迫。\n其日牛马嘶,新妇入青庐。奄奄黄昏后,寂寂人定初。\"我命绝今日,魂去尸长留!\"揽裙脱丝履,举身赴清池。府吏闻此事,心知长别离,徘徊庭树下,自挂东南枝。\n两家求合葬,合葬华山傍。东西植松柏,左右种梧桐。枝枝相覆盖,叶叶相交通。中有双飞鸟,自名为鸳鸯,仰头相向鸣,夜夜达五更。行人驻足听,寡妇起彷徨。多谢后世人,戒之慎勿忘!"},{"t":"左忠毅公逸事","a":"方苞","d":"—","g":"课外/补充-明清古文","place":"记左光斗、史可法史事","lt":"famous","basis":"作者桐城人，记同乡左光斗（忠毅公）狱中逸事","type":"传记散文","full":"先君子尝言,乡先辈左忠毅公视学京畿,一日,风雪严寒,从数骑出,微行入古寺。庑下一生伏案卧,文方成草。公阅毕,即解貂覆生,为掩户。叩之寺僧,则史公可法也。及试,吏呼名至史公,公瞿然注视,呈卷,即面署第一。召入,使拜夫人,曰:\"吾诸儿碌碌,他日继吾志事,惟此生耳。\"\n及左公下厂狱,史朝夕狱门外。逆阉防伺甚严,虽家仆不得近。久之,闻左公被炮烙,旦夕且死,持五十金,涕泣谋于禁卒,卒感焉。一日,使史更敝衣,草屦,背筐,手长镵,为除不洁者,引入。微指左公处,则席地倚墙而坐,面额焦烂不可辨,左膝以下筋骨尽脱矣。史前跪抱公膝而呜咽。公辨其声,而目不可开,乃奋臂以指拨眦,目光如炬,怒曰:\"庸奴!此何地也,而汝来前!国家之事糜烂至此,老夫已矣,汝复轻身而昧大义,天下事谁可支柱者?不速去,无俟奸人构陷,吾今即扑杀汝!\"因摸地上刑械作投击势。史噤不敢发声,趋而出。后常流涕述其事以语人,曰:\"吾师肺肝,皆铁石所铸造也。\"\n崇祯末,流贼张献忠出没蕲、黄、潜、桐间,史公以凤庐道奉檄守御。每有警,辄数月不就寝,使将士更休,而自坐幄幕外。择健卒十人,令二人蹲踞而背倚之,漏鼓移则番代。每寒夜起立,振衣裳,甲上冰霜迸落,铿然有声。或劝以少休,公曰:\"吾上恐负朝廷,下恐愧吾师也。\""},{"t":"息争","a":"刘大櫆","d":"—","g":"课外/补充-明清古文","place":"无具体地点（文论）","lt":"famous","basis":"作者桐城人，文论名篇","type":"议论文","full":"昔者孔子之弟子，有德行，有政事，有言语、文学，其鄙有樊迟，其狂有曾点。孔子之师，有老聃，有郯子，有苌弘、师襄，其故人有原壤，而相知有子桑伯子。仲弓问子桑伯子，而孔子许其为简，及仲弓疑其太简，然后以雍言为然。是故南郭惠子问于子贡曰：夫子之门，何其杂也？呜呼，此其所以为孔子欤！至于孟子乃为之言曰：今天下不之杨则之墨，杨墨之言不息，孔子之道不著，能言距杨墨者，圣人之徒。当时因以孟子为好辩。虽非其实，而好辩之端，由是启矣。唐之韩愈，攘斥佛老，学者称之。下逮有宋，有洛、蜀之党，有朱、陆之同异。为洛之徒者，以排击苏氏为事；为朱之学者，以訾谪陆子为能。\n吾以为天地之气化，万变不穷，则天下之理，亦不可以一端尽。昔者曾子之一以贯之，自力行而入；子贡之一以贯之，自多学而得。以后世观之，子贡是，则曾子非矣。然而孔子未尝区别于其间，其道固有以包容之也。\n夫所恶于杨墨者，为其无父无君也；斥佛老者，亦曰弃君臣，绝父子，不为昆弟夫妇，以求其清净寂灭。如其不至于是，而吾独何为訾謷之？大盗至，胠箧探囊，则荷戈戟以随之；服吾之服，而诵吾之言，吾将畏敬亲爱之不暇。今也操室中之戈，而为门内之斗，是亦不可以已乎？\n夫未尝深究其言之是非，见有稍异于己者，则众起而排之，此不足以论人也。人貌之不齐，稍有巨细长短之异，遂斥之以为非人，岂不过哉？北宫黝、孟施舍，其去圣人之勇盖远甚，而孟子以为似曾子、似子夏，然则诸子之迹虽不同，以为似曾子、似子夏可也。居高以临下，不至于争，为其不足与我角也。至于才力之均敌，而惟恐其不能相胜，于是纷纷之辩以生。\n是故知道者，视天下之歧趋异说，皆未尝出于吾道之外，故其心恢然有余；夫恢然有余，而于物无所不包，此孔子之所以大而无外也。"},{"t":"游媚笔泉记","a":"姚鼐","d":"—","g":"课外/补充-明清古文","place":"今安徽省桐城市（媚笔泉）","lt":"famous","basis":"作者辞官归里后游桐城媚笔泉作","type":"游记散文","full":"桐城之西北，连山殆数百里，及县治而迤平。其将平也，两崖忽合，屏矗墉回，崭横若不可径。龙溪曲流，出乎其间。\n以岁三月上旬，步循溪西入。积雨始霁，溪上大声漎然十余里，旁多奇石、蕙草、松、枞、槐、枫、栗、橡，时有鸣巂。溪有深潭，大石出潭中，若马浴起，振鬣宛首而顾其侣。援石而登，俯视溶云，鸟飞若坠。复西循崖可二里，连石若重楼，翼乎临于溪右。或曰宋李公麟之垂云沜也；或曰后人求李公麟地不可识，被而名之。石罅生大树，荫数十人。前出平土，可布席坐。南有泉，明何文端公摩崖书其上曰：媚笔之泉。泉漫石上为圆池，乃引坠溪内。\n左丈学冲于池侧方平地为室，未就，要客九人饮于是。日暮半阴，山风卒起，肃振岩壁，榛莽、群泉、矶石交鸣。游者悚焉，遂还。是日姜坞先生与往，鼐从，使鼐为之记。"},{"t":"复鲁絜非书","a":"姚鼐","d":"—","g":"课外/补充-明清古文","place":"无具体地点（书信论文）","lt":"birth","basis":"姚鼐桐城人（今安徽桐城，由安庆市代管），据作者故乡匹配安徽安庆市","type":"书信议论文","full":"桐城姚鼐顿首,絜非先生足下:相知恨少,晚遇先生。接其人,知为君子矣;读其文,非君子不能也。往与程鱼门、周书昌尝论古今才士,惟为古文者最少。苟为之,必杰士也,况为之专且善如先生乎!辱书引义谦而见推过当,非所敢任。鼐自幼迄衰,获侍贤人长者为师友,剽取见闻,加臆度为说,非真知文、能为文也,奚辱命之哉?盖虚怀乐取者,君子之心。而诵所得以正于君子,亦鄙陋之志也。鼐闻天地之道,阴阳刚柔而已。文者,天地之精英,而阴阳刚柔之发也。惟圣人之言,统二气之会而弗偏,然而《易》、《诗》、《书》、《论语》所载,亦间有可以刚柔分矣。值其时其人告语之,体各有宜也。自诸子而降,其为文无有弗偏者。其得于阳与刚之美者,则其文如霆,如电,如长风之出谷,如崇山峻崖,如决大川,如奔骐骥。其光也,如杲日,如火,如金镠铁;其于人也,如凭高视远,如君而朝万众,如鼓万勇士而战之。其得于阴与柔之美者,则其文如升初日,如清风,如云,如霞,如烟,如幽林曲涧,如沦,如漾,如珠玉之辉,如鸿鹄之鸣而入寥廓。其于人也,漻乎其如叹,邈乎其如有思,暖乎其如喜,愀乎其如悲。观其文,讽其音,则为文者之性情形状,举以殊焉。且夫阴阳刚柔,其本二端,造物者糅,而气有多寡进绌,则品次亿万,以至于不可穷,万物生焉。故曰:\"一阴一阳之为道。\"夫文之多变,亦若是也。糅而偏胜可也;偏胜之极,一有一绝无,与夫刚不足为刚,柔不足为柔者,皆不可以言文。今夫野人孺子闻乐,以为声歌弦管之会尔;苟善乐者闻之,则五音十二律,必有一当,接于耳而分矣。夫论文者,岂异于是乎?宋朝欧阳、曾公之文,其才皆偏于柔之美者也。欧公能取异己者之长而时济之,曾公能避所短而不犯。观先生之文,殆近于二公焉。抑人之学文,其功力所能至者,陈理义必明当;布置取舍,繁简廉肉不失法;吐辞雅驯,不芜而已。古今至此者,盖不数数得,然尚非文之至。文之至者,通乎神明,人力不及施也。先生以为然乎?惠寄之文,刻本固当见与,钞本谨封还。然钞本不能胜刻者。诸体中,书疏赠序为上,记事之文次之,辨论又次之。鼐亦窃识数语于其间,未必当也。《梅崖集》果有逾人处,恨不识其人。郎君令甥皆美才,未易量,听所好恣为之,勿拘其途可也。于所寄文辄妄评说,勿罪勿罪!秋暑惟体中安否?千万自爱。七月朔日。"}]},{"prov":"安徽","name":"黄山市","d":"M730.9 491.3 L725.8 494.3 L721.7 489.4 L720.5 484.2 L719.1 485.0 L719.0 483.4 L716.6 483.3 L714.8 489.5 L704.5 494.6 L705.3 496.5 L707.9 496.1 L709.9 501.2 L717.3 501.4 L720.3 504.9 L728.5 498.9 L731.3 494.4 L730.9 491.3 Z","v":0,"fd":"","texts":[{"t":"游黄山日记","a":"徐宏祖","d":"—","g":"课外/补充-明清古文","place":"今安徽省黄山市（黄山）","lt":"famous","basis":"作者崇祯间游黄山所记日记","type":"游记散文","full":"初二日，自白岳下山，十里，循麓而西，抵南溪桥。渡大溪，循别溪，依山北行。十里，两山峭逼如门，溪为之束。越而下，平畴颇广。二十里，为猪坑。由小路登虎岭，路甚峻。十里，至岭。五里，越其麓。北望黄山诸峰，片片可掇。又三里，为古楼坳。溪甚阔，水涨无梁，木片弥满布一溪，涉之甚难。二里，宿高桥。\n初三日，随樵者行，久之，越岭二重。下而复上，又越一重。两岭俱峻，曰双岭。共十五里，过江村。二十里，抵汤口，香溪、温泉诸水所由出者。折而入山，沿溪渐上，雪且没趾。五里，抵祥符寺。\n汤泉在隔溪，遂俱解衣赴汤池。池前临溪，后倚壁，三面石甃，上环石如桥。汤深三尺，时凝寒未解，而汤气郁然，水泡池底汩汩起，气本香冽。黄贞父谓其不及盘山，以汤口、焦村孔道，浴者太杂遝出。浴毕，返寺。僧挥印引登莲花庵，蹑雪循涧以上。涧水三转，下注而深泓者，曰白龙潭；再上而停涵石间者，曰丹井。井旁有石突起，曰药臼，曰药铫。宛转随溪，群峰环耸，木石掩映。如此一里，得一庵，僧印我他出，不能登其堂。堂中香炉及钟鼓架，俱天然古木根所为。遂返寺宿。\n初四日，十五里，至汤口。五里，至汤寺，浴于汤池。扶杖望朱砂庵而登。十里，上黄泥冈。向时云里诸峰，渐渐透出，亦渐渐落吾杖底。转入石门，越天都之胁而下，则天都、莲花二顶，俱秀出天半，路旁一岐东上，乃昔所未至者，遂前趋直上，几达天都侧。复北上，行石罅中。石峰片片夹起，路宛转石间，塞者凿之，陡者级之，断者架木通之，悬者植梯接之。下瞰峭壑阴森，枫松相间，五色纷披，灿若图绣。因念黄山当生平奇览，而有奇若此，前未一探，兹游快且愧矣！\n初五日，云气甚恶，余强卧至午起。挥印言慈光寺颇近，令其徒引。过汤地，仰见一崖，中悬鸟道，两旁泉泻如练。余即从此攀跻上，泉光云气，撩绕衣裾。已转而右，则茅庵上下，磬韵香烟，穿石而出，即慈光寺也。寺旧名朱砂庵。比丘为余言：山顶诸静室，径为雪封者两月。今早遣人送粮，山半雪没腰而返。余兴大阻，由大路二里下山，遂引被卧。\n初六日，天色甚朗。觅导者各携筇上山，过慈光寺。从左上，石峰环夹，其中石级为积雪所平，一望如玉。蔬木茸茸中，仰见群峰盘结，天都独巍然上挺。数里，级愈峻，雪愈深，其阴处冻雪成冰，坚滑不容着趾。余独前，持杖凿冰，得一孔置前趾，再凿一孔，以移后趾。从行者俱循此法得度。上至平冈，则莲花、云门诸峰，争奇竞秀，若为天都拥卫者。由此而入，绝岘危崖，尽皆怪松悬结。高者不盈丈，低仅数寸，平顶短髲，盘根虬干，愈短愈老，愈小愈奇，不意奇山中又有此奇品也！松石交映间，冉冉僧一群从天而下，俱合掌言：阻雪山中已三月，今以觅粮勉到此。公等何由得上也？且言：我等前海诸庵，俱已下山，后海山路尚未通，惟莲花洞可行耳。已而从天都峰侧攀而上，透峰罅而下，东转即莲花洞路也。\n余急于光明顶、石笋矼之胜，遂循莲花峰而北。上下数次，至天门。两壁夹立，中阔摩肩，高数十丈，仰面而度，阴森悚骨。其内积雪更深，凿冰上跻，过此得平顶，即所谓前海也。由此更上一峰，至平天矼。矼之兀突独耸者，为光明顶。由矼而下，即所谓后海也。盖平天矼阳为前海，阴为后海，乃极高处，四面皆峻坞，此独若平地。前海之前，天都、莲花二峰最峻，其阳属徽之歙，其阴属宁之太平。\n余至平天矼，欲望光明顶而上。路已三十里，腹甚枵，遂入矼后一庵。庵僧俱踞石向阳。主僧曰智空，见客色饥，先以粥饷。且曰：新日太皎，恐非老晴。因指一僧谓余曰：公有馀力，可先登光明顶而后中食，则今日犹可抵石笋矼，宿是师处矣。馀如言登顶，则天都、莲花并肩其前，翠微、三海门环绕于后，下瞰绝壁峭岫，罗列坞中，即丞相原也。顶前一石，伏而复起，势若中断，独悬坞中，上有怪松盘盖。馀侧身攀踞其上，而浔阳踞大顶相对，各夸胜绝。\n下入庵，黄粱已熟。饭后，北向过一岭，踯躅菁莽中，入一庵，曰狮子林，即智空所指宿处。主僧霞光，已待我庵前矣。遂指庵北二峰曰：公可先了此胜。从之。俯窥其阴，则乱峰列岫，争奇并起。循之西，崖忽中断，架木连之，上有松一株，可攀引而度，所谓接引崖也。度崖，空石罅而上，乱石危缀间，构木为石，其中亦可置足，然不如踞石下窥更雄胜耳。下崖，循而东里许，为石笋矼。矼脊斜亘，两夹悬坞中，乱峰森罗，其西一面即接引崖所窥者。矼侧一峰突起，多奇石怪松。登之，俯瞰壑中，正与接引崖对瞰，峰回岫转，顿改前观。下峰，则落照拥树，谓明晴可卜，踊跃归庵。霞光设茶，引登前楼。西望碧痕一缕，余疑山影。僧谓：山影夜望甚近，此当是云气。余默然，知为雨兆也。\n初七日，四山雾合。少顷，庵之东北已开，西南腻甚，若以庵为界者，即狮子峰亦在时出时没间。晨餐后，由接引崖践雪下。坞半一峰突起，上有一松裂石而出，巨干高不及二尺，而斜拖曲结，蟠翠三丈馀，其根穿石上下，几与峰等，所谓扰龙松是也。攀玩移时，望狮子峰已出，遂杖而西。是峰在庵西南，为案山。二里，蹑其巅，则三面拔立坞中，其下森峰列岫，自石笋、接引两坞迤逦至此，环结又成一胜。登眺间，沉雾渐爽舒朗，急由石笋矼北转而下，正昨日峰头所望森阴径也。群峰或上或下，或巨或纤，或直或欹，与身穿绕而过。俯窥辗顾，步步生奇，但壑深雪厚，一步一悚。\n行五里，左峰腋一窦透明，曰天窗。又前，峰旁一石突起，作面壁状，则僧坐石也。下五里，径稍夷，循涧而行。忽前涧乱石纵横，路为之塞。越石久之，一阙新崩，片片欲堕，始得路。仰视峰顶，黄痕一方，中间绿字宛然可辨，是谓天牌，亦谓仙人榜。又前，鲤鱼石；又前，白龙池。共十五里，一茅出涧边，为松谷庵旧基。再五里，循溪东西行，又过五水，则松谷庵矣。再循溪下，溪边香气袭人，则一梅亭亭正发，山寒稽雪，至是始芳。抵青龙潭，一泓深碧，更会两溪，比白龙潭势既雄壮，而大石磊落，奔流乱注，远近群峰环拱，亦佳境也。还餐松谷，往宿旧庵。余初至松谷，疑已平地，及是询之，须下岭二重，二十里方得平地，至太平县共三十五里云。"}]},{"prov":"安徽","name":"滁州市","d":"M716.3 456.4 L718.4 457.4 L725.2 450.8 L727.3 450.5 L728.1 445.5 L726.5 445.3 L726.3 443.0 L731.5 443.1 L734.1 445.7 L735.3 445.0 L736.6 442.8 L735.9 438.6 L733.3 436.1 L730.6 436.0 L728.6 440.6 L723.1 440.6 L721.1 438.1 L722.0 436.0 L719.9 431.0 L717.3 435.2 L713.5 434.3 L711.7 436.9 L709.7 435.6 L708.7 438.3 L705.3 439.0 L703.8 441.4 L704.6 445.4 L707.7 445.5 L707.0 447.1 L709.2 450.6 L714.7 450.3 L714.1 454.5 L716.3 456.4 Z","v":0,"fd":"","texts":[{"t":"滁州西涧","a":"韦应物","d":"唐","g":"小学三年级下","place":"滁州西涧","lt":"write","basis":"写作地滁州（今安徽滁州），西涧在滁州，从写作地匹配","type":"古诗","full":"独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横。"},{"t":"庄子与惠子游于濠梁之上","a":"庄子","d":"战国","g":"初中八年级下","place":"濠水桥上","lt":"write","basis":"写作地濠梁（今安徽凤阳县，属滁州市），从写作地匹配","type":"文言文","full":"庄子与惠子游于濠梁之上。庄子曰：\"鯈鱼出游从容，是鱼之乐也。\"惠子曰：\"子非鱼，安知鱼之乐？\"庄子曰：\"子非我，安知我不知鱼之乐？\"惠子曰：\"我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣！\"庄子曰：\"请循其本。子曰'汝安知鱼乐'云者，既已知吾知之而问我，我知之濠上也。\""},{"t":"醉翁亭记","a":"欧阳修","d":"北宋","g":"初中九年级上","place":"滁州琅琊山醉翁亭","lt":"write","basis":"写作地滁州（今安徽滁州），欧阳修知滁州作《醉翁亭记》，从写作地匹配","type":"文言文","full":"环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺，而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。\n若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。\n至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。\n已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。"},{"t":"翁去八百年，醉乡犹在；山行六七里，亭影不孤。","a":"薛时雨","d":"—","g":"课外/补充-楹联","place":"安徽滁州醉翁亭","lt":"famous","basis":"清光绪七年薛时雨重建醉翁亭时撰，刻于欧门","type":"楹联","full":"翁去八百年，醉乡犹在；山行六七里，亭影不孤。"}]},{"prov":"安徽","name":"阜阳市","d":"M677.6 445.5 L676.1 443.4 L672.6 442.9 L672.7 438.0 L667.7 435.5 L668.5 432.2 L670.5 433.6 L674.2 432.6 L675.0 425.5 L679.7 423.9 L683.8 427.4 L683.3 433.4 L689.9 437.9 L691.5 437.2 L692.5 441.0 L695.5 443.8 L692.9 446.1 L689.7 444.5 L688.2 446.3 L684.9 442.8 L680.1 446.6 L677.6 445.5 Z","v":0,"fd":"","texts":[{"t":"卖油翁","a":"欧阳修","d":"北宋","g":"初中七年级下","place":"陈尧咨家园圃","lt":"write","basis":"写作地颍州（今安徽阜阳），欧阳修知颍州时作，从写作地匹配","type":"文言文","full":"陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之，久而不去。见其发矢十中八九，但微颔之。康肃问曰：\"汝亦知射乎？吾射不亦精乎？\"翁曰：\"无他，但手熟尔。\"康肃忿然曰：\"尔安敢轻吾射！\"翁曰：\"以我酌油知之。\"乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰：\"我亦无他，惟手熟尔。\"康肃笑而遣之。"},{"t":"五代史伶官传序","a":"欧阳修","d":"北宋","g":"高中选择性必修中","place":"洛阳论后唐史事","lt":"famous","basis":"欧阳修（吉州庐陵人）晚年归老颍州（今阜阳）并卒于此，《新五代史·伶官传序》成于其晚年，按作者生平活动地次选锚点匹配安徽阜阳市","type":"文言文","full":"呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。\n世言晋王之将终也，以三矢赐庄宗而告之曰：“梁，吾仇也；燕王吾所立，契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！”庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。\n方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归，至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？《书》曰：“满招损，谦得益。”忧劳可以兴国，逸豫可以亡身，自然之理也。\n故方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！"},{"t":"采桑子（轻舟短棹西湖好）","a":"欧阳修","d":"北宋","g":"初中八年级上","place":"颍州西湖","lt":"write","basis":"写作地颍州西湖（今安徽阜阳），欧阳修知颍州作，从写作地匹配","type":"词","full":"轻舟短棹西湖好，绿水逶迤，芳草长堤，隐隐笙歌处处随。无风水面琉璃滑，不觉船移，微动涟漪，惊起沙禽掠岸飞。"}]},{"prov":"安徽","name":"宿州市","d":"M695.0 415.4 L698.1 416.0 L698.4 414.2 L700.8 414.3 L699.0 423.1 L700.9 429.8 L702.8 429.7 L702.2 427.6 L705.1 425.5 L712.9 429.9 L716.7 428.8 L718.8 426.0 L720.0 420.8 L713.2 421.4 L713.3 418.1 L711.2 415.3 L701.0 413.2 L700.8 408.3 L694.5 406.4 L692.2 403.3 L688.5 404.7 L688.0 407.0 L691.3 410.7 L694.6 410.5 L693.8 413.5 L695.0 415.4 Z","v":0,"fd":"","texts":[{"t":"陈涉世家","a":"司马迁《史记》","d":"西汉","g":"初中九年级下","place":"大泽乡（安徽宿州）","lt":"desc","basis":"《史记·陈涉世家》描写大泽乡起义，大泽乡在今安徽宿州境内，据描写地点匹配安徽宿州市","type":"文言文","full":"陈胜者，阳城人也，字涉。吴广者，阳夏人也，字叔。陈涉少时，尝与人佣耕，辍耕之垄上，怅恨久之，曰：“苟富贵，无相忘。”佣者笑而应曰：“若为佣耕，何富贵也？”陈涉太息曰：“嗟乎！燕雀安知鸿鹄之志哉！”\n二世元年七月，发闾左谪戍渔阳，九百人屯大泽乡。陈胜、吴广皆次当行，为屯长。会天大雨，道不通，度已失期。失期，法皆斩。陈胜、吴广乃谋曰：“今亡亦死，举大计亦死；等死，死国可乎？”陈胜曰：“天下苦秦久矣。吾闻二世少子也，不当立，当立者乃公子扶苏。扶苏以数谏故，上使外将兵。今或闻无罪，二世杀之。百姓多闻其贤，未知其死也。项燕为楚将，数有功，爱士卒，楚人怜之。或以为死，或以为亡。今诚以吾众诈自称公子扶苏、项燕，为天下唱，宜多应者。”吴广以为然。乃行卜。卜者知其指意，曰：“足下事皆成，有功。然足下卜之鬼乎！”陈胜、吴广喜，念鬼，曰：“此教我先威众耳。”乃丹书帛曰“陈胜王”，置人所罾鱼腹中。卒买鱼烹食，得鱼腹中书，固以怪之矣。又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰：“大楚兴，陈胜王。”卒皆夜惊恐。旦日，卒中往往语，皆指目陈胜。\n吴广素爱人，士卒多为用者。将尉醉，广故数言欲亡，忿恚尉，令辱之，以激怒其众。尉果笞广。尉剑挺，广起，夺而杀尉。陈胜佐之，并杀两尉。召令徒属曰：“公等遇雨，皆已失期，失期当斩。藉第令毋斩，而戍死者固十六七。且壮士不死即已，死即举大名耳，王侯将相宁有种乎！”徒属皆曰：“敬受命。”乃诈称公子扶苏、项燕，从民欲也。袒右，称大楚。为坛而盟，祭以尉首。陈胜自立为将军，吴广为都尉。攻大泽乡，收而攻蕲。蕲下，乃令符离人葛婴将兵徇蕲以东。攻铚、酂、苦、柘、谯皆下之。行收兵。比至陈，车六七百乘，骑千余，卒数万人。攻陈，陈守令皆不在，独守丞与战谯门中。弗胜，守丞死，乃入据陈。\n数日，号令召三老、豪杰与皆来会计事。三老、豪杰皆曰：“将军身被坚执锐，伐无道，诛暴秦，复立楚国之社稷，功宜为王。”陈涉乃立为王，号为张楚。\n当此时，诸郡县苦秦吏者，皆刑其长吏，杀之以应陈涉。乃以吴叔为假王，监诸将以西击荥阳。令陈人武臣、张耳、陈馀徇赵地，令汝阴人邓宗徇九江郡。当此时，楚兵数千人为聚者，不可胜数。\n葛婴至东城，立襄强为楚王。婴后闻陈王已立，因杀襄强，还报。至陈，陈王诛杀葛婴。陈王令魏人周市北徇魏地。吴广围荥阳。李由为三川守，守荥阳，吴叔弗能下。陈王征国之豪杰与计，以上蔡人房君蔡赐为上柱国。\n周文，陈之贤人也，尝为项燕军视日，事春申君，自言习兵，陈王与之将军印，西击秦。行收兵至关，车千乘，卒数十万，至戏，军焉。秦令少府章邯免郦山徒、人奴产子生，悉发以击楚大军，尽败之。周文败，走出关，止次曹阳二三月。章邯追败之，复走次渑池十余日。章邯击，大破之。周文自刭，军遂不战。\n武臣到邯郸，自立为赵王，陈馀为大将军，张耳、召騷为左右丞相。陈王怒，捕系武臣等家室，欲诛之。柱国曰：“秦未亡而诛赵王将相家属，此生一秦也。不如因而立之。”陈王乃遣使者贺赵，而徙系武臣等家属宫中，而封耳子张敖为成都君，趣赵兵，亟入关。赵王将相相与谋曰：“王王赵，非楚意也。楚已诛秦，必加兵于赵。计莫如毋西兵，使使北徇燕地以自广也。赵南据大河，北有燕、代，楚虽胜秦，不敢制赵。若楚不胜秦，必重赵。赵乘秦之弊，可以得志于天下。”赵王以为然，因不西兵，而遣故上谷卒史韩广将兵北徇燕地。\n燕故贵人豪杰谓韩广曰：“楚已立王，赵又已立王。燕虽小，亦万乘之国也，愿将军立为燕王。”韩广曰：“广母在赵，不可。”燕人曰：“赵方西忧秦，南忧楚，其力不能禁我。且以楚之彊，不敢害赵王将相之家，赵独安敢害将军之家！”韩广以为然，乃自立为燕王。居数月，赵奉燕王母及家属归之燕。\n当此之时，诸将之徇地者，不可胜数。周市北徇地至狄，狄人田儋杀狄令，自立为齐王，以齐反击周市。市军散，还至魏地，欲立魏后故宁陵君咎为魏王。时咎在陈王所，不得之魏。魏地已定，欲相与立周市为魏王，周市不肯。使者五反，陈王乃立宁陵君咎为魏王，遣之国。周市卒为相。\n将军田臧等相与谋曰：“周章军已破矣，秦兵旦暮至，我围荥阳城弗能下，秦军至，必大败。不如少遗兵，足以守荥阳，悉精兵迎秦军。今假王骄，不知兵权，不可与计，非诛之，事恐败。”因相与矫王令以诛吴叔，献其首于陈王。陈王使使赐田臧楚令尹印，使为上将。田臧乃使诸将李归等守荥阳城，自以精兵西迎秦军于敖仓。与战，田臧死，军破。章邯进兵击李归等荥阳下，破之，李归等死。\n阳城人邓说将兵居郯，章邯别将击破之，邓说军散走陈。铚人伍徐将兵居许，章邯击破之，伍徐军皆散走陈。陈王诛邓说。\n陈王初立时，陵人秦嘉、铚人董缫、符离人朱鸡石、取虑人郑布、徐人丁疾等皆特起，将兵围东海守庆于郯。陈王闻，乃使武平君畔为将军，监郯下军。秦嘉不受命，嘉自立为大司马，恶属武平君。告军吏曰：“武平君年少，不知兵事，勿听！”因矫以王命杀武平君畔。\n章邯已破伍徐，击陈，柱国房君死。章邯又进兵击陈西张贺军。陈王出监战，军破，张贺死。腊月，陈王之汝阴，还至下城父，其御庄贾杀以降秦。陈胜葬砀，谥曰隐王。\n陈王故涓人将军吕臣为仓头军，起新阳，攻陈下之，杀庄贾，复以陈为楚。\n初，陈王至陈，令铚人宋留将兵定南阳，入武关。留已徇南阳，闻陈王死，南阳复为秦。宋留不能入武关，乃东至新蔡，遇秦军，宋留以军降秦。秦传留至咸阳，车裂留以徇。\n秦嘉等闻陈王军破出走，乃立景驹为楚王，引兵之方与，欲击秦军定陶下。使公孙庆使齐王，欲与并力俱进。齐王曰：“闻陈王战败，不知其死生，楚安得不请而立王！”公孙庆曰：“齐不请楚而立王，楚何故请齐而立王！且楚首事，当令于天下。”田儋诛杀公孙庆。\n秦左右校复攻陈，下之。吕将军走，收兵复聚。鄱盗当阳君黥布之兵相收，复击秦左右校，破之青波，复以陈为楚。会项梁立怀王孙心为楚王。\n陈胜王凡六月。已为王，王陈。其故人尝与佣耕者闻之，之陈，扣宫门曰：“吾欲见涉。”宫门令欲缚之。自辩数，乃置，不肯为通。陈王出，遮道而呼涉。陈王闻之，乃召见，载与俱归。入宫，见殿屋帷帐，客曰：“夥颐！涉之为王沉沉者！”楚人谓多为夥，故天下传之，夥涉为王，由陈涉始。客出入愈益发舒，言陈王故情。或说陈王曰：“客愚无知，颛妄言，轻威。”陈王斩之。诸陈王故人皆自引去，由是无亲陈王者。\n陈王以朱房为中正，胡武为司过，主司群臣。诸将徇地，至，令之不是者，系而罪之，以苛察为忠。其所不善者，弗下吏，辄自治之。陈王信用之。诸将以其故不亲附，此其所以败也。\n陈胜虽已死，其所置遣侯王将相竟亡秦，由涉首事也。高祖时为陈涉置守冢三十家砀，至今血食。"}]},{"prov":"安徽","name":"六安市","d":"M697.6 456.3 L694.1 454.0 L693.1 446.0 L689.7 444.5 L688.2 446.3 L684.9 442.8 L683.0 444.8 L684.0 458.6 L677.4 460.9 L675.5 467.1 L678.8 471.1 L680.7 470.0 L685.7 473.7 L691.1 470.5 L694.2 470.4 L693.8 473.5 L697.9 472.6 L705.2 464.2 L698.0 463.4 L696.4 458.0 L697.6 456.3 Z","v":0,"fd":"","texts":[{"t":"客至","a":"杜甫","d":"唐","g":"高中选择性必修下","place":"草堂迎客","lt":"famous","basis":"原作写于成都市，作者与次选锚点俱不可确考，按覆盖补缺分配至安徽省六安市","type":"古诗","full":"舍南舍北皆春水，但见群鸥日日来。花径不曾缘客扫，蓬门今始为君开。\n盘飧市远无兼味，樽酒家贫只旧醅。肯与邻翁相对饮，隔篱呼取尽余杯。"}]},{"prov":"安徽","name":"亳州市","d":"M691.7 420.0 L687.9 421.5 L685.2 416.1 L681.9 414.4 L679.1 415.4 L678.2 418.0 L679.6 418.4 L678.5 420.3 L680.3 425.4 L683.8 427.4 L684.2 430.8 L682.9 430.1 L682.6 432.3 L689.9 437.9 L691.7 437.3 L691.5 435.1 L697.1 436.6 L698.3 434.9 L698.2 427.0 L694.1 426.1 L691.7 420.0 Z","v":0,"fd":"","texts":[{"t":"祭妹文","a":"袁枚","d":"—","g":"课外/补充-明清古文","place":"今江苏省南京市（江宁葬妹处）","lt":"famous","basis":"原作写于南京市，作者与次选锚点俱不可确考，按覆盖补缺分配至安徽省亳州市","type":"抒情祭文","full":"乾隆丁亥冬，葬三妹素文于上元之羊山，而奠以文曰：\n呜呼！汝生于浙，而葬于斯，离吾乡七百里矣；当时虽觭梦幻想，宁知此为归骨所耶？\n汝以一念之贞，遇人仳离，致孤危托落，虽命之所存，天实为之；然而累汝至此者，未尝非予之过也。予幼从先生授经，汝差肩而坐，爱听古人节义事；一旦长成，遽躬蹈之。呜呼！使汝不识《诗》、《书》，或未必艰贞若是。\n余捉蟋蟀，汝奋臂出其间；岁寒虫僵，同临其穴。今予殓汝葬汝，而当日之情形，憬然赴目。予九岁，憩书斋，汝梳双髻，披单缣来，温《缁衣》一章；适先生奓户入，闻两童子音琅琅然，不觉莞尔，连呼“则则”，此七月望日事也。汝在九原，当分明记之。予弱冠粤行，汝掎裳悲恸。逾三年，予披宫锦还家，汝从东厢扶案出，一家瞠视而笑，不记语从何起，大概说长安登科、函使报信迟早云尔。凡此琐琐，虽为陈迹，然我一日未死，则一日不能忘。旧事填膺，思之凄梗，如影历历，逼取便逝。悔当时不将嫛婗情状，罗缕记存；然而汝已不在人间，则虽年光倒流，儿时可再，而亦无与为证印者矣。\n汝之义绝高氏而归也，堂上阿奶，仗汝扶持；家中文墨，眣汝办治。尝谓女流中最少明经义、谙雅故者。汝嫂非不婉嫕，而于此微缺然。故自汝归后，虽为汝悲，实为予喜。予又长汝四岁，或人间长者先亡，可将身后托汝；而不谓汝之先予以去也！\n前年予病，汝终宵刺探，减一分则喜，增一分则忧。后虽小差，犹尚殗殜，无所娱遣；汝来床前，为说稗官野史可喜可愕之事，聊资一欢。呜呼！今而后，吾将再病，教从何处呼汝耶？\n汝之疾也，予信医言无害，远吊扬州；汝又虑戚吾心，阻人走报；及至绵惙已极，阿奶问：“望兄归否？”强应曰：“诺。”已予先一日梦汝来诀，心知不祥，飞舟渡江，果予以未时还家，而汝以辰时气绝；四支犹温，一目未瞑，盖犹忍死待予也。呜呼痛哉！早知诀汝，则予岂肯远游？即游，亦尚有几许心中言要汝知闻、共汝筹画也。而今已矣！除吾死外，当无见期。吾又不知何日死，可以见汝；而死后之有知无知，与得见不得见，又卒难明也。然则抱此无涯之憾，天乎人乎！而竟已乎！\n汝之诗，吾已付梓；汝之女，吾已代嫁；汝之生平，吾已作传；惟汝之窀穸，尚未谋耳。先茔在杭，江广河深，势难归葬，故请母命而宁汝于斯，便祭扫也。其傍，葬汝女阿印；其下两冢：一为阿爷侍者朱氏，一为阿兄侍者陶氏。羊山旷渺，南望原隰，西望栖霞，风雨晨昏，羁魂有伴，当不孤寂。所怜者，吾自戊寅年读汝哭侄诗后，至今无男；两女牙牙，生汝死后，才周睟耳。予虽亲在未敢言老，而齿危发秃，暗里自知；知在人间，尚复几日？阿品远官河南，亦无子女，九族无可继者。汝死我葬，我死谁埋？汝倘有灵，可能告我？\n呜呼！生前既不可想，身后又不可知；哭汝既不闻汝言，奠汝又不见汝食。纸灰飞扬，朔风野大，阿兄归矣，犹屡屡回头望汝也。呜呼哀哉！呜呼哀哉！"}]},{"prov":"安徽","name":"池州市","d":"M696.1 498.8 L699.5 494.8 L697.3 492.1 L700.1 487.9 L699.6 484.9 L704.6 484.0 L706.2 480.1 L716.8 476.9 L719.2 479.7 L714.8 489.5 L704.5 493.7 L702.4 496.5 L703.0 498.8 L698.7 501.6 L696.8 501.6 L696.1 498.8 Z","v":0,"fd":"","texts":[{"t":"山行","a":"杜牧","d":"唐","g":"小学三年级上","place":"寒山枫林","lt":"write","basis":"写作地池州（今安徽池州），从写作地匹配","type":"古诗","full":"远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。"},{"t":"江南春","a":"杜牧","d":"唐","g":"小学六年级上","place":"江南大地","lt":"write","basis":"写作地池州（今安徽池州），杜牧任池州刺史时作，从写作地匹配","type":"古诗","full":"千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。"},{"t":"清明","a":"杜牧","d":"唐","g":"小学三年级下","place":"清明雨中行路","lt":"write","basis":"写作地池州（今安徽池州），杜牧任池州刺史作《清明》，从写作地匹配","type":"古诗","full":"清明时节雨纷纷，路上行人欲断魂。借问酒家何处有，牧童遥指杏花村。"},{"t":"华崿峰前香云缥缈；化城寺里花雨缤纷。","a":"【不可考】","d":"—","g":"课外/补充-楹联","place":"安徽九华山化城寺","lt":"famous","basis":"刻于九华山化城寺 月日。盖东野之使者，不知问家人以月日；如耿兰之报，不知当言月日。东野与吾书，乃问使者，使者妄称以应之乎。其然乎？其不然乎？\n今吾使建中祭汝，吊汝之孤与汝之乳母。彼有食，可守以待终丧，则待终丧而取以来；如不能守以终丧，则遂取以来。其余奴婢，并令守汝丧。吾力能改葬，终葬汝于先人之兆，然后惟其所愿。\n呜呼！汝病吾不知时，汝殁吾不知日，生不能相养以共居，殁不得抚汝以尽哀，敛不凭其棺，窆不临其穴。吾行负神明，而使汝夭；不孝不慈，而不能与汝相养以生，相守以死。一在天之涯，一在地之角，生而影不与吾形相依，死而魂不与吾梦相接。吾实为之，其又何尤！彼苍者天，曷其有极！自今已往，吾其无意于人世矣！当求数顷之田于伊颍之上，以待余年，教吾子与汝子，幸其成；长吾女与汝女，待其嫁，如此而已。\n呜呼，言有穷而情不可终，汝其知也邪？其不知也邪？呜呼哀哉！尚飨！"}]},{"prov":"福建","name":"福州市","d":"M745.6 560.0 L742.8 560.5 L739.4 558.3 L736.6 560.5 L733.4 559.0 L730.2 562.4 L729.0 560.7 L729.7 564.0 L726.3 566.7 L725.3 572.8 L724.0 572.2 L723.2 574.2 L723.9 575.8 L725.4 577.2 L735.1 575.4 L737.5 582.0 L738.6 579.9 L740.8 583.0 L742.0 581.2 L743.2 583.3 L743.6 580.9 L745.2 582.3 L747.1 579.0 L745.5 577.1 L743.3 580.9 L740.4 577.1 L742.5 576.7 L744.3 571.3 L742.5 567.3 L748.2 563.4 L746.8 563.7 L745.6 560.0 Z","v":1,"fd":"待定","texts":[{"t":"乞巧","a":"林杰","d":"唐","g":"小学五年级上","place":"七夕民间","lt":"birth","basis":"作者林杰故里闽县（今福建福州），写作地不可考，从作者故乡匹配","type":"古诗","full":"七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。"},{"t":"寒菊","a":"郑思肖","d":"宋末元初","g":"小学五年级下","place":"寒菊自喻","lt":"birth","basis":"郑思肖连江人（今福建连江，由福州市管辖），据作者故乡匹配福建福州市","type":"古诗","full":"花开不并百花丛，独立疏篱趣未穷。宁可枝头抱香死，何曾吹落北风中。"},{"t":"游西溪记","a":"林纾","d":"—","g":"课外/补充-明清古文","place":"今浙江省杭州市（西溪）","lt":"birth","basis":"林纾闽县人（今福建福州），据作者故乡匹配福建福州市","type":"游记散文","full":"西溪之胜，水行沿秦亭山十余里，至留下，光景始异。溪上之山，多幽蒨，而秦亭特高峙，为西溪之镇山。溪行数转，犹见秦亭也。溪水漻然而清深，窄者不能容舟。野柳无次，被丽水上，或突起溪心，停篙攀条，船侧转乃过。石桥十数，柿叶蓊薆，秋气洒然。桥门印水，幻圆影如月，舟行入月中矣。\n交芦庵绝胜。近庵里许，回望溪路，为野竹所合，截然如断，隐隐见水阁飞檐，斜出梅林之表。其下砌石，可八九级。老柳垂条，拂扫水石，如缚帚焉。大石桥北趣入乌桕中，渐见红叶。登阁拜厉太鸿栗主，饭于僧房。易小艭绕出庵后，一色秋林，水净如拭。西风排竹，人家隐约可辨。溪身渐广，弥望一白，近涡水矣。\n涡水一名南漳湖，苇荡也。荡析水为九道，芦花间之。隔芦望邻船人，但见半身；带以下，芦花也。溪色愈明净，老桧成行可万株，秋山亭亭出其上。尽桧乃趣余杭道，遂棹船归。不半里，复见芦庵，来时遵他道纡，归以捷径耳。\n是行访高江村竹窗故址，舟人莫识。同游者为林迪臣先生，高啸桐、陈吉士父子、郭海容及余也。己亥九日。"},{"t":"清风明月本无价；近水远山皆有情。","a":"梁章钜集句","d":"上欧阳修诗、下苏舜钦诗","g":"课外/补充-楹联","place":"江苏苏州沧浪亭","lt":"birth","basis":"梁章钜长乐人（今福建长乐，由福州市管辖），据作者故乡匹配福建福州市","type":"楹联","full":"清风明月本无价；近水远山皆有情。"}]},{"prov":"福建","name":"厦门市","d":"M717.9 601.2 L719.5 598.0  L683.5 526.4 L686.6 526.3 L689.0 528.9 L692.8 527.0 L694.2 522.3 L692.5 518.4 L689.2 516.0 L691.8 511.5 L689.7 510.6 L689.2 512.7 L688.2 510.3 L684.3 510.8 L681.7 514.7 L677.1 512.5 Z","v":0,"fd":"","texts":[{"t":"七律·洪都","a":"毛泽东","d":"—","g":"课外/补充-毛泽东诗词","place":"洪都（南昌）、滕王阁","lt":"famous","basis":"1965年作，洪都为南昌古称，涉滕王阁典故","type":"七律","full":"到得洪都又一年，祖生击楫至今传。闻鸡久听南天雨，立马曾挥北地鞭。鬓雪飞来成废料，彩云长在有新天。年年后浪推前浪，江草江花处处鲜。"},{"t":"滕王阁序","a":"王勃","d":"—","g":"课外/补充-古文观止","place":"洪州滕王阁","lt":"famous","basis":"上元二年王勃赴交趾省父路过洪州，都督阎公宴滕王阁作序","type":"骈文序","full":"豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。\n时维九月，序属三秋。潦水尽而寒潭清，烟光凝而暮山紫。俨骖騑于上路，访风景于崇阿。临帝子之长洲，得天人之旧馆。层峦耸翠，上出重霄；飞阁流丹，下临无地。鹤汀凫渚，穷岛屿之萦回；桂殿兰宫，即冈峦之体势。\n披绣闼，俯雕甍，山原旷其盈视，川泽纡其骇瞩。闾阎扑地，钟鸣鼎食之家；舸舰迷津，青雀黄龙之舳。云销雨霁，彩彻区明。落霞与孤鹜齐飞，秋水共长天一色。渔舟唱晚，响穷彭蠡之滨；雁阵惊寒，声断衡阳之浦。\n遥襟甫畅，逸兴遄飞。爽籁发而清风生，纤歌凝而白云遏。睢园绿竹，气凌彭泽之樽；邺水朱华，光照临川之笔。四美具，二难并。穷睇眄于中天，极娱游于暇日。天高地迥，觉宇宙之无穷；兴尽悲来，识盈虚之有数。望长安于日下，目吴会于云间。地势极而南溟深，天柱高而北辰远。关山难越，谁悲失路之人；萍水相逢，尽是他乡之客。怀帝阍而不见，奉宣室以何年？\n嗟乎！时运不齐，命途多舛。冯唐易老，李广难封。屈贾谊于长沙，非无圣主；窜梁鸿于海曲，岂乏明时？所赖君子见机，达人知命。老当益壮，宁移白首之心？穷且益坚，不坠青云之志。酌贪泉而觉爽，处涸辙以犹欢。北海虽赊，扶摇可接；东隅已逝，桑榆非晚。孟尝高洁，空余报国之情；阮籍猖狂，岂效穷途之哭！\n勃，三尺微命，一介书生。无路请缨，等终军之弱冠；有怀投笔，慕宗悫之长风。舍簪笏于百龄，奉晨昏于万里。非谢家之宝树，接孟氏之芳邻。他日趋庭，叨陪鲤对；今兹捧袂，喜托龙门。杨意不逢，抚凌云而自惜；钟期既遇，奏流水以何惭？\n呜呼！胜地不常，盛筵难再；兰亭已矣，梓泽丘墟。临别赠言，幸承恩于伟饯；登高作赋，是所望于群公。敢竭鄙怀，恭疏短引；一言均赋，四韵俱成。滕王高阁临江渚，佩玉鸣鸾罢歌舞。画栋朝飞南浦云，珠帘暮卷西山雨。闲云潭影日悠悠，物换星移几度秋。阁中帝子今何在？槛外长江空自流。"},{"t":"我辈复登临，目极湖山千里而外；奇文共欣赏，人在水天一色之中。","a":"李宗昉","d":"号春园","g":"课外/补充-楹联","place":"江西南昌滕王阁","lt":"famous","basis":"悬于滕王阁正门厅两侧","type":"楹联","full":"我辈复登临，目极湖山千里而外；奇文共欣赏，人在水天一色之中。"}]},{"prov":"江西","name":"景德镇市","d":"M712.5 502.0 L709.9 501.2 L707.9 496.1 L703.4 495.1 L701.7 500.8 L702.5 510.6 L700.6 514.4 L702.0 516.3 L705.2 518.0 L707.5 515.9 L710.0 516.3 L708.5 513.1 L709.1 509.5 L707.2 508.9 L709.3 504.1 L712.5 502.0 Z","v":0,"fd":"","texts":[{"t":"景德镇陶录","a":"蓝浦","d":"清","g":"课外/补充-覆盖平衡新增","place":"陶瓷","lt":"famous","basis":"清·蓝浦《景德镇陶录》为景德镇陶瓷专著，据清嘉庆刻本","type":"古文","full":"序：自海盐朱桐川著《陶说》，于是陶器有专书，用补前贤所不逮。而说古自唐虞以来，说器详官、哥、定、汝，博考群书，足无挂漏。独说今景德镇陶，惜犹多所未备。盖其制器之委曲精详，诚有非采访纪录可得而尽也。\n余承乏浮梁，镇隶于籍。案籍镇广袤数十里，业陶数千户，其人五方错杂，贤不肖并处。编审固有司之责，又公事偶间，辄微行入陶肆，以察良莠，以稽勤怠，而其制器之委曲精详，亦遂熟于耳目。欲为镇陶成专书而未暇。郑生廷桂，余始至邑观风所得士也，招馆东轩，课馀次儿学。一日，以其师蓝滨南文学《陶录》遗稿来质于余，其所记载，则又多余耳目所未逮。盖生乎其地，自少而长，习知其事，随时而笔之于书，良非采访纪录、偶焉旁涉者可同日语也。虽其稿本文词草创，卷帙有未竟，然譬诸梓材，既勤朴斫，惟其涂丹矣。遂亟属郑生因仍而增损之，成书十卷，中亦博考群书，旁及诸陶，而以其专为镇陶而有事也，总题曰《景德镇陶录》。\n夫古圣人制器尚象，以利生民，其切于饮食日用者，固非必智巧具而功能备也。自我国家惠工给值，供役无扰，民安而物阜，工勤而器良，镇人日以盛，镇陶日以精，莫不奋兴鼓舞，用副时会之隆，有不知其所由然矣。是《录》之成，其不又补桐川所不逮，而为有心时务者所亟赏乎！为之序。时嘉庆二十年，小春月朔，知浮梁县事广德刘丙。\n卷一 图说：景德镇属浮梁之兴西乡，去城二十五里，在昌江之南，故称昌南镇。其自观音阁江南雄镇坊至小港嘴前后街，计十三里，故又有陶阳十三里之称。水土宜陶，陈以来土人多业此。至宋景德年始置镇，奉御董造，因改名景德镇。元置本路总管，监镇陶。明洪武二年，就镇之珠山设御窑厂，置官监督烧造解京。国朝因之沿旧名。\n厂跨珠山，周围约三里许，中为大堂，堂后为轩、为寝，寝北有小阜，即珠山所由名，旧建亭其上。堂两旁为东西序，又东迤南各有门，又东为官署，为东西大库房，为仪门，为鼓亭，为督工亭，为狱房，今废。为陶务作二十有三：曰大器作、曰小器作、曰仿古作、曰雕镶作、曰印作、曰画作、曰创新作、曰锥龙作、曰写字作、曰色彩作、曰漆作、曰匣作、曰染作、曰泥水作、曰大木作、曰小木作、曰船作、曰铁作、曰竹作、曰索作、曰桶作、曰东碓作、曰西碓作。为窑式六：曰青窑、曰龙缸窑、曰风火窑、曰色窑、曰爁煌窑、曰匣窑。又前后甃井二，柴房二，窑役歇房二。\n陶用泥土，皆须采石制练。土人设厂采取，藉溪流为水碓舂之，澄细淘净，制如砖式，曰白𣎴。以徽州祁门为上，出坪里、葛口二山，开窖采取，部有黑花如鹿角菜形者佳。此土色纯质细，可制细器。别有高岭、玉红、箭滩数种，皆以所产之地名，若黄𣎴、泑果，尤作粗瓷者所必需。\n造瓷首需练泥，必以精纯为上。其法以缸浸泥，用木钯搅翻，摽渣沈过，以马尾细箩再澄，夹层细绢袋过泥匣内，俾水渗浆稠。复以无底木匣，下铺砖，细布紧包，更以砖压之，水干成泥，用铁锹翻扑结实。若泑，水必炼灰配合，灰出邑南乡。\n瓷坯入窑，必装匣烧，方不粘裂，且能免风火冲突坯有黄黑之患。匣钵亦土作。土出景德镇马鞍山里村、官庄等处，有黑、红、白三色，更以宝石地所产砂土配合，则入火经烧。其造法用轮车，与拉坯同。土不必过细，匣成阴干，略镟平正，先入窑空烧一次，再装坯烧，名曰镀匣。\n圆器之造，每一器必有一模，大小款式，方能画一。其模子必须与原样相似，但尺寸不能计算，大抵一尺之坯，经烧后得七八寸，亦收缩之理然也。"}]},{"prov":"江西","name":"萍乡市","d":"M652.5 552.0 L656.2 546.6 L654.2 543.0 L656.5 542.7 L658.2 540.1 L656.0 536.5 L652.1 535.2 L653.8 532.8 L651.7 531.8 L647.0 540.7 L647.6 544.6 L651.8 543.9 L650.1 549.4 L652.5 552.0 Z","v":0,"fd":"","texts":[{"t":"\"品行 jack削，不宜独吹，藏些其拙，可以衔光\"","a":"洪应明/陈继儒","d":"明","g":"课外/补充-覆盖平衡新增（格言补缺）","place":"无具体地点（格言说理）","lt":"famous","basis":"该区无确证古典诗文锚点，以《菜根谭》/《小窗幽记》真实条目按覆盖补缺分配（此为文化渊源补缺）","type":"清言格言","full":"品行 jack削，不宜独吹，藏些其拙，可以衔光"}]},{"prov":"江西","name":"九江市","d":"M696.3 500.9 L695.8 499.1 L699.7 494.2 L696.0 491.7 L694.0 495.1 L689.6 497.4 L688.1 496.6 L684.5 498.6 L677.7 496.3 L675.3 500.1 L671.3 499.4 L672.0 502.7 L668.0 502.3 L667.9 504.9 L657.9 505.8 L657.7 508.0 L653.0 510.8 L653.2 513.7 L656.2 517.0 L657.1 515.9 L659.2 518.3 L662.7 517.0 L664.9 518.7 L667.9 517.0 L669.3 512.7 L673.0 510.7 L681.7 514.7 L685.5 510.4 L688.2 510.3 L689.2 512.7 L689.7 510.6 L691.8 511.5 L695.7 508.1 L693.4 501.2 L696.3 500.9 Z","v":0,"fd":"","texts":[{"t":"大林寺桃花","a":"白居易","d":"唐","g":"小学三年级下","place":"庐山大林寺","lt":"write","basis":"写作地江州（今江西九江），庐山大林寺，从写作地匹配","type":"古诗","full":"人间四月芳菲尽，山寺桃花始盛开。长恨春归无觅处，不知转入此中来。"},{"t":"暮江吟","a":"白居易","d":"唐","g":"小学四年级上","place":"长江江面","lt":"write","basis":"写作地江州（今江西九江），从写作地匹配","type":"古诗","full":"一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。"},{"t":"桃花源记","a":"陶渊明","d":"东晋","g":"初中八年级下","place":"武陵桃花源【虚构】","lt":"write","basis":"写作地浔阳柴桑（今江西九江），陶渊明故里，从写作地匹配","type":"文言文","full":"晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。\n林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。\n见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：『不足为外人道也。』\n既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。\n南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。"},{"t":"归园田居（其一）","a":"陶渊明","d":"东晋","g":"高中必修上","place":"田园村居","lt":"write","basis":"写作地浔阳柴桑（今江西九江），陶渊明故里，从写作地匹配","type":"古诗","full":"少无适俗韵，性本爱丘山。误落尘网中，一去三十年。羁鸟恋旧林，池鱼思故渊。开荒南野际，守拙归园田。方宅十余亩，草屋八九间。榆柳荫后檐，桃李罗堂前。暧暧远人村，依依墟里烟。狗吠深巷中，鸡鸣桑树颠。户庭无尘杂，虚室有余闲。久在樊笼里，复得返自然。"},{"t":"琵琶行（并序）","a":"白居易","d":"唐","g":"高中必修上","place":"浔阳江头","lt":"write","basis":"写作地江州（今江西九江），白居易贬江州作《琵琶行》，从写作地匹配","type":"古诗","full":"元和十年，予左迁九江郡司马。明年秋，送客湓浦口，闻舟中夜弹琵琶者，听其音，铮铮然有京都声。问其人，本长安倡女，尝学琵琶于穆、曹二善才，年长色衰，委身为贾人妇。遂命酒，使快弹数曲。曲罢悯然，自叙少小时欢乐事，今漂沦憔悴，转徙于江湖间。予出官二年，恬然自安，感斯人言，是夕始觉有迁谪意。因为长句，歌以赠之，凡六百一十六言，命曰《琵琶行》。\n浔阳江头夜送客，枫叶荻花秋瑟瑟。\n主人下马客在船，举酒欲饮无管弦。\n醉不成欢惨将别，别时茫茫江浸月。\n忽闻水上琵琶声，主人忘归客不发。\n寻声暗问弹者谁，琵琶声停欲语迟。\n移船相近邀相见，添酒回灯重开宴。\n千呼万唤始出来，犹抱琵琶半遮面。\n转轴拨弦三两声，未成曲调先有情。\n弦弦掩抑声声思，似诉平生不得志。\n低眉信手续续弹，说尽心中无限事。\n轻拢慢捻抹复挑，初为《霓裳》后《六幺》。\n大弦嘈嘈如急雨，小弦切切如私语。\n嘈嘈切切错杂弹，大珠小珠落玉盘。\n间关莺语花底滑，幽咽泉流冰下难。\n冰泉冷涩弦凝绝，凝绝不通声暂歇。\n别有幽愁暗恨生，此时无声胜有声。\n银瓶乍破水浆迸，铁骑突出刀枪鸣。\n曲终收拨当心画，四弦一声如裂帛。\n东船西舫悄无言，唯见江心秋月白。\n沉吟放拨插弦中，整顿衣裳起敛容。\n自言本是京城女，家在虾蟆陵下住。\n十三学得琵琶成，名属教坊第一部。\n曲罢曾教善才服，妆成每被秋娘妒。\n五陵年少争缠头，一曲红绡不知数。\n钿头银篦击节碎，血色罗裙翻酒污。\n今年欢笑复明年，秋月春风等闲度。\n弟走从军阿姨死，暮去朝来颜色故。\n门前冷落鞍马稀，老大嫁作商人妇。\n商人重利轻别离，前月浮梁买茶去。\n去来江口守空船，绕船月明江水寒。\n夜深忽梦少年事，梦啼妆泪红阑干。\n我闻琵琶已叹息，又闻此语重唧唧。\n同是天涯沦落人，相逢何必曾相识！\n我从去年辞帝京，谪居卧病浔阳城。\n浔阳地僻无音乐，终岁不闻丝竹声。\n住近湓江地低湿，黄芦苦竹绕宅生。\n其间旦暮闻何物？杜鹃啼血猿哀鸣。\n春江花朝秋月夜，往往取酒还独倾。\n岂无山歌与村笛，呕哑嘲哳难为听。\n今夜闻君琵琶语，如听仙乐耳暂明。\n莫辞更坐弹一曲，为君翻作《琵琶行》。\n感我此言良久立，却坐促弦弦转急。\n凄凄不似向前声，满座重闻皆掩泣。\n座中泣下谁最多？江州司马青衫湿。"},{"t":"归去来兮辞（并序）","a":"陶渊明","d":"东晋","g":"高中选择性必修下","place":"柴桑田园","lt":"write","basis":"写作地彭泽（今江西彭泽县，属九江市），陶渊明为彭泽令，从写作地匹配","type":"文言文","full":"余家贫,耕植不足以自给。幼稚盈室,瓶无储粟,生生所资,未见其术。亲故多劝余为长吏,脱然有怀,求之靡途。会有四方之事,诸侯以惠爱为德,家叔以余贫苦,遂见用于小邑。于时风波未静,心惮远役,彭泽去家百里,公田之利,足以为酒,故便求之。及少日,眷然有归欤之情。何则?质性自然,非矫厉所得。饥冻虽切,违己交病。尝从人事,皆口腹自役。于是怅然慷慨,深愧平生之志。犹望一稔,当敛裳宵逝。寻程氏妹丧于武昌,情在骏奔,自免去职。仲秋至冬,在官八十余日。因事顺心,命篇曰《归去来兮》。乙巳岁十一月也。\n归去来兮,田园将芜胡不归?既自以心为形役,奚惆怅而独悲?悟已往之不谏,知来者之可追。实迷途其未远,觉今是而昨非。舟遥遥以轻飏,风飘飘而吹衣。问征夫以前路,恨晨光之熹微。\n乃瞻衡宇,载欣载奔。僮仆欢迎,稚子候门。三径就荒,松菊犹存。携幼入室,有酒盈樽。引壶觞以自酌,眄庭柯以怡颜。倚南窗以寄傲,审容膝之易安。园日涉以成趣,门虽设而常关。策扶老以流憩,时矫首而遐观。云无心以出岫,鸟倦飞而知还。景翳翳以将入,抚孤松而盘桓。\n归去来兮,请息交以绝游。世与我而相违,复驾言兮焉求?悦亲戚之情话,乐琴书以消忧。农人告余以春及,将有事于西畴。或命巾车,或棹孤舟。既窈窕以寻壑,亦崎岖而经丘。木欣欣以向荣,泉涓涓而始流。善万物之得时,感吾生之行休。\n已矣乎!寓形宇内复几时?曷不委心任去留?胡为乎遑遑欲何之?富贵非吾愿,帝乡不可期。怀良辰以孤往,或植杖而耘耔。登东皋以舒啸,临清流而赋诗。聊乘化以归尽,乐夫天命复奚疑!"},{"t":"饮酒（其五）","a":"陶渊明","d":"东晋","g":"初中八年级上","place":"东篱采菊","lt":"write","basis":"写作地浔阳柴桑（今江西九江），陶渊明故里，从写作地匹配","type":"古诗","full":"结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。"},{"t":"五柳先生传","a":"陶渊明","d":"—","g":"课外/补充-古文观止","place":"柴桑（今江西九江）","lt":"famous","basis":"陶渊明自况于柴桑栗里故居，陶渊明墓与陶公祠在今九江","type":"传记","full":"先生，不知何许人也，亦不详其姓字。宅边有五柳树，因以为号焉。闲静少言，不慕荣利。好读书，不求甚解；每有会意，便欣然忘食，性嗜酒，家贫不能常得，亲旧知其如此，或置酒而招之，造饮辄尽，期在必醉。既醉而退，曾不吝情去留。环堵萧然，不蔽风日；短褐穿结，箪瓢屡空，晏如也。常著文章，自娱颇示已志。忘怀得失，以此自终。\n赞曰：黔娄之妻有言：「不戚戚于贫贱，不汲汲于富贵。」其言兹若人之俦乎！衔觞赋诗，以乐其志，无怀氏之民欤？葛天氏之民欤？"},{"t":"花开山寺；咏留诗人。","a":"【不可考】","d":"—","g":"课外/补充-楹联","place":"江西庐山花径","lt":"famous","basis":"刻于庐山花径石坊两侧","ty
